openapi: 3.0.0
info:
  title: TradePulse Public API
  version: 1.0.0
  x-default-server: https://api.tradepulse.dev
paths:
  /health:
    get:
      operationId: get_health
      summary: Health probe
      responses:
        "200":
          description: OK
  /signals:
    post:
      operationId: create_signal
      summary: Create signal
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/signal.json
      responses:
        "200":
          $ref: ../models/signal.json
      parameters:
        - in: query
          name: dry_run
          required: false
          schema:
            type: boolean
          description: Emit without persistence
