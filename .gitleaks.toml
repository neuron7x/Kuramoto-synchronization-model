[extend]
useDefault = true

[[allowlists]]
description = "Allow deterministic checksum fields in managed manifests."
paths = [
  '''^INVENTORY\.json$''',
  '''^artifacts/provenance/inference_provenance\.json$''',
]
regexes = [
  '''"sha256"\s*:\s*"[0-9a-f]{64}"''',
  '''"source_sha256"\s*:\s*"[0-9a-f]{64}"''',
  '''"git_rev"\s*:\s*"[0-9a-f]{40}"''',
]

[[allowlists]]
description = "Archived 2026-08-12 redacted gitleaks report, not live credentials"
paths = [
  '''^archive_snapshots/github_9e6e4792_unique/audit/artifacts/gitleaks\.json$''',
]
