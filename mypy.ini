[mypy]
python_version = 3.11
files =
    analytics,
    application,
    backtest,
    core,
    domain,
    execution,
    interfaces,
    markets,
    nfpro,
    observability,
    src,
    tools
mypy_path = .
namespace_packages = True

# Strict mode enabled - phased rollout approach
# Base checks enabled for all production code
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_optional = True
strict_equality = True
show_error_codes = True
check_untyped_defs = True
plugins = pydantic.mypy

# Allow some flexibility for external libraries  
ignore_missing_imports = True

# Strict mode fully enabled for new modules and refactored code
# TODO: Gradually enable strict checks for all modules
# Current status: 1099 errors to fix across 253 files

# Exclude vendor code and examples
[mypy-tools.vendor.*]
ignore_errors = True

[mypy-examples.*]
ignore_errors = True

# Phase 1: Core domain models - aim for full strict compliance
[mypy-domain.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
no_implicit_reexport = True

# Phase 2: Gradually enable for other modules
# Uncomment and fix as modules are refactored
# [mypy-core.*]
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
#
# [mypy-backtest.*]
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
#
# [mypy-execution.*]
# disallow_untyped_defs = True
# disallow_incomplete_defs = True

[mypy-nak_controller.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_reexport = True
