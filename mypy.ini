[mypy]
python_version = 3.11
files =
    analytics,
    application,
    backtest,
    core,
    domain,
    execution,
    interfaces,
    markets,
    nfpro,
    observability,
    scripts,
    src,
    tools,
    tests
mypy_path = .
namespace_packages = True

# Enable strict mode
strict = True
warn_unused_configs = True
show_error_codes = True
plugins = pydantic.mypy

# Allow some flexibility for external libraries
ignore_missing_imports = True

# Exclude vendor code and example scripts from strict checking
[mypy-tools.vendor.*]
ignore_errors = True

[mypy-examples.*]
ignore_errors = True

# Phase 1: Exclude tests and scripts from strictest checks while we fix core modules
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-scripts.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
