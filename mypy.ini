[mypy]
python_version = 3.11
files =
    analytics,
    application,
    backtest,
    core,
    domain,
    execution,
    interfaces,
    markets,
    nfpro,
    observability,
    src,
    tools
mypy_path = .
namespace_packages = True

# Enable full strict mode
strict = True
warn_unused_configs = True
show_error_codes = True
plugins = pydantic.mypy

# Allow some flexibility for external libraries  
ignore_missing_imports = True

# Exclude vendor code and examples
[mypy-tools.vendor.*]
ignore_errors = True

[mypy-examples.*]
ignore_errors = True
