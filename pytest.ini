[pytest]
addopts = -q -ra --maxfail=1 -W error::DeprecationWarning --import-mode=importlib
testpaths = tests
python_files = test_*.py
pythonpath = .
asyncio_default_fixture_loop_scope = function
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    arm: cross-architecture and portability checks for indicators
    heavy_math: compute-intensive suites that gate pull requests
    flaky: quarantined scenarios executed in dedicated CI jobs with reruns
    nightly: full-fidelity regression suites executed in nightly pipelines
    integration: replayable integration suites exercising end-to-end workflows
    smoke: lightweight deployment gates verifying core functionality
    l1: isolated unit-level checks without external side effects
    l2: contract and schema validations that define public interfaces
    l3: integration scenarios across core services and data planes
    l4: full end-to-end trading cycle regression coverage
    l5: stability, chaos, or degradation simulations validating rollout policy
    l6: execution environment and infrastructure readiness verifications
    l7: ui, telemetry, and accessibility quality gates
    unstable: quarantined scenarios tracked for flake triage
filterwarnings =
    ignore::UserWarning
