#   * has a non-empty description free of promotion language
#     ("partial success", "validated", "unblocked", "passed", ...);
#   * sha-anchors a 40-hex commit; and
#   * references an in-repo artifact that still EXISTS (preservation — the
#     negative record cannot silently evaporate).
#
# Seeded with four real, preserved negatives mirrored from the tombstone
# ledger, one per category.
