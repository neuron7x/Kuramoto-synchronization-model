# Post-vacuous-oracle Revalidation Ledger (DEBT_5).
#
# Doctrine: the `python-fast-shard` PR gate ran ZERO tests for the entire
# history of the repository (a double `-q` collect bug). PR #1153 restores a
# real fast oracle but is still OPEN. Every critical lane that merged before
# #1153 terminalizes therefore merged under a VACUOUS green — the fast suite
# reported success without executing a single test. Such a merge carries a
# WEAKENED evidence-class: the code may be correct, but the gate that was
# supposed to prove it was inert.
#
# A weakened-evidence lane is honest open debt. It must be either
#   * REPLAYED under a real oracle (and the proof recorded), or
#   * BOUNDED with an explicit residual,
# but it must NEVER be silently relabelled "revalidated" with no proof a real
# oracle existed. PENDING is the honest default — open debt is not laundered.
#
# scripts/ci/check_revalidation_ledger.py fails closed unless every entry is
# well-formed AND the INTERLOCK holds: a `replay_status: REPLAYED` claim is
# admissible ONLY when the entry also carries `oracle_terminal_sha` (the
# 40-hex commit at which a real oracle was proven live) AND `replay_evidence`
# (an in-repo artifact path that still EXISTS). Missing either => violation:
# you cannot declare a lane revalidated without a real-oracle sha and a
# preserved evidence artifact.
#
# This ledger is a SKELETON, not a closed census. It seeds the verified
# critical physics/governance lanes merged under the vacuous oracle; the full
# enumeration of the merged backlog is itself pending #1153 terminalization.
# The partiality is declared in `coverage_bound`, not silently capped.
