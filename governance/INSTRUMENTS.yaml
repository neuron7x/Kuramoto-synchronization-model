#
# Authoritative registry of the seven governance-locked methodology
# instruments. This file — not the git history, not a heuristic over
# `feat(methodology)` merges — is the single source of truth for WHICH
# modules are governance-locked descriptor instruments.
#
# Each entry binds, machine-readably, the full evidence chain for one
# instrument:
#
#   PR  ->  merge_commit  ->  module (+ source_sha256)  ->  test_file
#       ->  falsifier pytest node(s)  ->  claim_boundary  ->  acceptor
#       ->  provenance (evidence log + sha256)
#
# scripts/ci/check_instrument_evidence_chain.py fails closed if ANY link
# in ANY entry dangles: a module that moved, a source that drifted without
# an acceptor refresh, a merge commit that does not exist or did not touch
# the module, a test file that vanished, a falsifier node that pytest can
# no longer collect, a missing/incorrect claim boundary, an acceptor that
# does not bind the module, or provenance evidence that does not resolve.
#
# The seven instruments are descriptor-only research infrastructure. None
# emits a predictive, significance, or financial claim; every one declares
# claim_boundary="descriptor_only_not_predictor". temporal_ricci (PR #1057)
# is a hardening change to a pre-existing module and is NOT part of this
# governance-lock surface; it would have to be added here explicitly to be
# governed.
