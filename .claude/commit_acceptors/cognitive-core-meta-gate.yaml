# ci-heartbeat: cognitive-core-meta-gate
id: cognitive-core-meta-gate
status: ACTIVE
claim_type: fail_closed
promise: >-
  Top of the rigor stack: a numerical calibration certificate and a
  self-verifying meta-gate. The calibration certificate proves every exact law
  passes with strictly positive margin (orders of magnitude of headroom),
  emitted as a deterministic artifact. scripts/ci/verify_cognitive_core.py
  composes the whole invariant centre into ONE content-addressed GREEN/RED
  verdict (all blocking laws witnessed + mutation floors well-formed + cognitive
  core at a 1.0 code-mutation floor), exposed via the `make verify-cognitive-core`
  target. Two new blocking laws witness both. No canonical catalog mutation, no
  trading/execution/forecast/policy change.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/cognitive-core-meta-gate.yaml"
    - path: "scripts/ci/verify_cognitive_core.py"
    - path: "tests/physics/test_calibration_certificate.py"
    - path: "tests/physics/test_cognitive_core_meta_gate.py"
    - path: "Makefile"
    - path: "INVENTORY.json"
    - path: ".github/workflows/mutation-kill-gate.yml"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
required_python_symbols:
  - "verify"
expected_signal: >-
  tools/validate_physics_contracts.py reports 43 blocking laws fully witnessed
  (was 41). The calibration certificate shows every exact law calibrated with
  positive margin (worst ~1 decade); the at/past-threshold controls score 0 and
  negative. verify_cognitive_core.py emits a GREEN, deterministic
  content-addressed verdict and FAILs (RED) on a tampered catalog. No
  trading/execution/forecast/policy change.
measurement_command: >-
  PYTHONPATH=. python tools/validate_physics_contracts.py && PYTHONPATH=.
  python scripts/ci/verify_cognitive_core.py && PYTHONPATH=. python -m pytest
  tests/physics/test_calibration_certificate.py
  tests/physics/test_cognitive_core_meta_gate.py -q
signal_artifact: "tmp/cognitive_core_meta_gate.log"
falsifier:
  command: >-
    PYTHONPATH=. python -m pytest
    tests/physics/test_cognitive_core_meta_gate.py
    tests/physics/test_calibration_certificate.py -q
  description: >-
    Fails if the composed verdict is not GREEN/deterministic, the meta-gate
    rubber-stamps a tampered catalog, or an exact law loses its calibration margin.
rollback_command: >-
  git rm -f scripts/ci/verify_cognitive_core.py
  tests/physics/test_calibration_certificate.py
  tests/physics/test_cognitive_core_meta_gate.py
rollback_verification_command: >-
  PYTHONPATH=. python tools/validate_physics_contracts.py
memory_update_type: none
ledger_path: ".claude/commit_acceptors/cognitive-core-meta-gate.yaml"
report_path: ".claude/commit_acceptors/cognitive-core-meta-gate.yaml"
evidence:
  - path: "scripts/ci/verify_cognitive_core.py"
  - path: "tests/physics/test_calibration_certificate.py"
  - path: "tests/physics/test_cognitive_core_meta_gate.py"
