  - "scripts/serotonin_certify.py::main"
  - "tests/ci/test_serotonin_certify_bootstrap.py::test_optional_preloads_are_executed_in_order"
  - "tests/ci/test_serotonin_certify_bootstrap.py::test_missing_optional_imports_do_not_block_following_preloads"
  - "tests/ci/test_serotonin_certify_bootstrap.py::test_unexpected_import_failure_is_not_swallowed"
