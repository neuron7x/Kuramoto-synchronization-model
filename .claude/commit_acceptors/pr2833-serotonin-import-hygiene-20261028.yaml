signal_artifact: "tmp/pr2833_serotonin_bootstrap_20261028.log"
falsifier:
  command: >-
    bash -c 'python -m pytest -q --override-ini addopts=""
    tests/ci/test_serotonin_certify_bootstrap.py;
    rc=$?; case "$rc" in 0) exit 1;; 1) exit 0;; *) exit "$rc";; esac'
  description: >-
    Exit zero means import order, absent-dependency handling, or unexpected
    error propagation was falsified. Passing controls return one; pytest
    infrastructure errors propagate unchanged.
rollback_command: >-
  bash -c 'git restore --source=ab31b1346535f15cb0007af95a6032cc946540dd --worktree --
  scripts/serotonin_certify.py docs/ci/pr2833_exact_source_recovery.md &&
  rm -f -- tests/ci/test_serotonin_certify_bootstrap.py .claude/commit_acceptors/pr2833-serotonin-import-hygiene-20261028.yaml &&
  python scripts/ci/generate_manifest.py --allow-dirty'
rollback_verification_command: >-
  bash -c 'git diff --exit-code ab31b1346535f15cb0007af95a6032cc946540dd -- scripts/serotonin_certify.py docs/ci/pr2833_exact_source_recovery.md &&
  test ! -e tests/ci/test_serotonin_certify_bootstrap.py &&
