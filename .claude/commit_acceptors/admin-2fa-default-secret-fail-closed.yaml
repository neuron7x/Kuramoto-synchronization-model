# Diff-bound commit acceptor: close a CRITICAL admin-2FA bypass.
#
# `application/runtime/init_control_platform.py` (reached by the production
# entrypoint `application/runtime/server.py::run` -> initialize_control_platform)
# used to `os.environ.setdefault` the PUBLIC pyotp example TOTP seed
# `JBSWY3DPEHPK3PXP` (and `test-audit-secret`) UNCONDITIONALLY — no profile guard.
# `AdminApiSettings.two_factor_secret` is a required field, but `setdefault`
# satisfied it with the public value before validation, so an operator who
# deployed without exporting GEOSYNC_TWO_FACTOR_SECRET got a forgeable admin
# second factor: anyone can compute `pyotp.TOTP("JBSWY3DPEHPK3PXP").now()` and
# pass the X-Admin-OTP check on privileged routes (kill-switch, risk overrides),
# and the known audit secret makes audit signatures forgeable.
#
# Fix: gate the dev defaults to dev/test/ci/local profiles only; in any other
# profile inject nothing and fail closed (RuntimeError) when the secret is
# absent. Mirrors the existing fail-closed guard in geosync/__init__.py.
# Vault/path deployments are unaffected — `two_factor_secret` remains the
# required fallback and is supplied by the operator.
#
# Locally verified:
#   * python -m pytest tests/runtime/test_admin_secret_fail_closed.py -q -> 9 passed
#   * python -m pytest tests/runtime/test_control_platform_entrypoint.py -q -> passed (no regression)
#   * black --check + ruff check + mypy --strict clean on both changed .py files

id: admin-2fa-default-secret-fail-closed
status: ACTIVE
claim_type: security
promise: >-
  After this PR lands, initialize_control_platform never injects the public
  example TOTP seed `JBSWY3DPEHPK3PXP` (or `test-audit-secret`) on a non-dev
  profile: dev/test/ci/local profiles keep the benign defaults, every other
  profile fails closed with a RuntimeError when GEOSYNC_TWO_FACTOR_SECRET /
  GEOSYNC_AUDIT_SECRET (or their ADMIN_API_SETTINGS__ aliases) are absent. The
  production admin second factor can no longer silently default to a public
  secret.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/admin-2fa-default-secret-fail-closed.yaml"
    - path: "application/runtime/init_control_platform.py"
    - path: "tests/runtime/test_admin_secret_fail_closed.py"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
    - "core/physics/"
    - "core/kuramoto/"
required_python_symbols:
  - "application/runtime/init_control_platform.py::initialize_control_platform"
expected_signal: >-
  `python -m pytest tests/runtime/test_admin_secret_fail_closed.py -q` passes (9
  tests): production/staging profiles raise RuntimeError("...non-development
  profiles...") and the public seed is never set in os.environ, while
  dev/test/ci/local profiles still receive the benign defaults. The existing
  tests/runtime/test_control_platform_entrypoint.py smoke test still passes.
measurement_command: >-
  bash -c '
    python -m pytest tests/runtime/test_admin_secret_fail_closed.py -q && python -m pytest tests/runtime/test_control_platform_entrypoint.py -q
  '
signal_artifact: "tmp/admin_2fa_fail_closed.log"
falsifier:
  command: >-
    bash -c '
      python -m pytest -q
        tests/runtime/test_admin_secret_fail_closed.py::test_production_profile_fails_closed_without_secret
        >/dev/null 2>&1
      test "$?" -ne 0
    '
  description: >-
    Runs the production fail-closed assertion. The falsifier succeeds (exit 0)
    only if that test FAILS — i.e. only if the guard stops raising and the public
    seed leaks back into a production profile. With the fix in place the test
    passes (exit 0), so `test $? -ne 0` exits 1 and the falsifier fails,
    confirming the bypass is closed.
rollback_command: >-
  bash -c 'git checkout origin/main -- application/runtime/init_control_platform.py && rm -f
    tests/runtime/test_admin_secret_fail_closed.py
    .claude/commit_acceptors/admin-2fa-default-secret-fail-closed.yaml'
rollback_verification_command: >-
  bash -c '! test -f .claude/commit_acceptors/admin-2fa-default-secret-fail-closed.yaml && ! test -f tests/runtime/test_admin_secret_fail_closed.py'
memory_update_type: append
ledger_path: ".claude/commit_acceptors/admin-2fa-default-secret-fail-closed.yaml"
report_path: "tmp/admin_2fa_fail_closed.log"
evidence: []
