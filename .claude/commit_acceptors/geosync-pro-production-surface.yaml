# Diff-bound commit acceptor: resolve geosync_pro production-surface debt.
#
# geosync_pro ships in the wheel with real quant modules (CVaR, EMH/EKF, MPC) but
# was allowlisted as deferred_production with no coverage profile. PR-D Option A:
# measure and test — add geosync_pro to the release_90 coverage source, bind its
# public surface to defect-sensitive contracts, and drop it from the allowlist.

id: geosync-pro-production-surface
status: ACTIVE
claim_type: correctness
promise: >-
  After this PR, geosync_pro is in the release_90 coverage source (measured, not
  deferred), removed from the coverage-surface allowlist, and its public surface
  is bound by tests/unit/geosync_pro/test_public_contracts.py: CVaR is the mean
  of the left tail and 0.0 on empty input; CVARGate scales down only when the
  shortfall exceeds its limit; clamp respects [lo, hi]; threat_mode maps RED/
  AMBER/GREEN with correct strict boundaries; run_validation is seeded-
  deterministic; and the public modules import without network/secret side
  effects.

diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/geosync-pro-production-surface.yaml"
    - path: "tests/unit/geosync_pro/test_public_contracts.py"
    - path: "configs/quality/release_90.coveragerc"
    - path: "tests/fixtures/coverage_surface_allowlist.json"
    - path: "artifacts/coverage_surface/coverage_surface_report.json"
    - path: "data/testing/component_test_matrix.json"
  forbidden_paths:
    - "core/physics/"
    - "core/kuramoto/"
    - "execution/oms.py"

required_python_symbols:
  - "geosync_pro/risk/cvar.py::cvar"
  - "geosync_pro/risk/cvar.py::CVARGate"
  - "geosync_pro/models/emh.py::threat_mode"
  - "geosync_pro/validate/validate.py::run_validation"

expected_signal: >-
  `python -m pytest --import-mode=importlib
  tests/unit/geosync_pro/test_public_contracts.py -q` reports 14 passed, and the
  coverage-surface audit reports geosync_pro in `measured` with verdict PASS and
  no forbidden gaps.

measurement_command: >-
  bash -c '
    python -m pytest --import-mode=importlib -p no:cacheprovider
      tests/unit/geosync_pro/test_public_contracts.py
      tests/ci/test_coverage_source_matches_packaged_surface.py -q
  '

signal_artifact: "tmp/geosync_pro_production_surface.log"

falsifier:
  command: |-
    bash -c '
      python -c "
    from geosync_pro.models.emh import threat_mode, clamp
    assert threat_mode(0.7, False, 0.0) == \"AMBER\"   # dd==0.7 is NOT RED (strict boundary)
    assert clamp(5.0, 0.0, 1.0) == 1.0 and clamp(-3.0, 0.0, 1.0) == 0.0
    "
    '
  description: >-
    Asserts the strict threat_mode boundary and clamp bounds. Per the run_evidence
    green-state contract it exits 0 on the correct tree and non-zero if the
    boundary/clamp logic regresses.

rollback_command: >-
  bash -c '
    git rm -f .claude/commit_acceptors/geosync-pro-production-surface.yaml
  '

rollback_verification_command: >-
  bash -c '
    test ! -f .claude/commit_acceptors/geosync-pro-production-surface.yaml
  '

memory_update_type: append
ledger_path: ".claude/commit_acceptors/geosync-pro-production-surface.yaml"
report_path: "tmp/geosync_pro_production_surface.log"
evidence: []
