id: capsule-secret-boundary-charclass-diversity
status: DRAFT
claim_type: security
promise: "Adding the forward-slash to _TOKEN_RE (PR #1282) let slash-bearing base64 credentials be caught but also false-positived on single-case slash values such as git refs and kebab paths under a non-digest field. A character-class-diversity bar (>=3 of lowercase/uppercase/digit) now distinguishes a base64 random blob from a human-authored path/ref, closing the false positive while keeping slash-bearing credential detection. The real committed capsule still validates clean."  # pragma: allowlist secret
diff_scope:
  changed_files:
    - path: "tools/security/validate_capsule_secret_boundary.py"
    - path: "tests/security/test_capsule_secret_boundary.py"
    - path: ".claude/commit_acceptors/capsule-secret-boundary-charclass-diversity.yaml"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
required_python_symbols: []
expected_signal: "The capsule-boundary suite passes, including test_git_ref_under_non_digest_field_is_not_flagged and test_charclass_diversity_distinguishes_secret_from_path."
measurement_command: "python -m pytest -q tests/security/test_capsule_secret_boundary.py"
signal_artifact: "tmp/capsule_secret_boundary_tests.log"
falsifier:
  command: "python -c \"import importlib.util,sys; s=importlib.util.spec_from_file_location('v','tools/security/validate_capsule_secret_boundary.py'); v=importlib.util.module_from_spec(s); s.loader.exec_module(v); sys.exit(0 if v._is_token_like('refs/heads/fix/kuramoto-damped-velocity-verlet-bbk') else 1)\""
  description: "Asks whether a git ref is still treated as a credential token (the pre-fix false positive). On the fixed tree it is not, so the command exits non-zero — proving the promise is falsifiable."
rollback_command: "git revert --no-edit HEAD"
rollback_verification_command: "git diff --exit-code tools/security/validate_capsule_secret_boundary.py"
memory_update_type: none
ledger_path: ".claude/commit_acceptors/capsule-secret-boundary-charclass-diversity.yaml"
report_path: "docs/reports/diff_bound_commit_acceptor_layer.md"
evidence: []
