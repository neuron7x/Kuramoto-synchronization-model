  description: "Always-failing probe proving evaluator contract-test acceptor failures are surfaced by CI."
rollback_command: "git checkout -- .claude/commit_acceptors/web-agent-evaluator-contract-tests.yaml tests/agents/test_context_efficiency_evaluator.py tests/agents/test_live_evidence_evaluator.py tests/agents/test_live_tool_adapter_smoke.py tests/agents/test_prompt_injection_evaluator.py tests/agents/test_prompt_injection_fixtures.py tests/agents/test_runtime_trace_evaluator.py tests/agents/test_task_completion_evaluator.py"
rollback_verification_command: "git diff --exit-code tests/agents/test_context_efficiency_evaluator.py tests/agents/test_live_evidence_evaluator.py tests/agents/test_live_tool_adapter_smoke.py tests/agents/test_prompt_injection_evaluator.py tests/agents/test_prompt_injection_fixtures.py tests/agents/test_runtime_trace_evaluator.py tests/agents/test_task_completion_evaluator.py .claude/commit_acceptors/web-agent-evaluator-contract-tests.yaml"
memory_update_type: none
