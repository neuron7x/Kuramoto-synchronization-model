id: web-agent-evaluator-contract-tests
status: DRAFT
claim_type: correctness
promise: "Web-agent evaluator contract tests bind injection, runtime trace, task completion, context efficiency, live evidence, and live adapter smoke behavior to reproducible assertions."
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/web-agent-evaluator-contract-tests.yaml"
    - path: "tests/agents/test_context_efficiency_evaluator.py"
    - path: "tests/agents/test_live_evidence_evaluator.py"
    - path: "tests/agents/test_live_tool_adapter_smoke.py"
    - path: "tests/agents/test_prompt_injection_evaluator.py"
    - path: "tests/agents/test_prompt_injection_fixtures.py"
    - path: "tests/agents/test_runtime_trace_evaluator.py"
    - path: "tests/agents/test_task_completion_evaluator.py"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
required_python_symbols: []
expected_signal: "web-agent evaluator tests execute and preserve fail-closed live-evidence boundaries"
measurement_command: "python -m pytest tests/agents/test_prompt_injection_fixtures.py tests/agents/test_prompt_injection_evaluator.py tests/agents/test_runtime_trace_evaluator.py tests/agents/test_task_completion_evaluator.py tests/agents/test_context_efficiency_evaluator.py tests/agents/test_live_tool_adapter_smoke.py tests/agents/test_live_evidence_evaluator.py"
