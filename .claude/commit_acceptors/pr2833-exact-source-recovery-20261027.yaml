  - "tests/test_physics_boundary_report_schema.py::test_invalid_quality_score_is_rejected"
expected_signal: >-
  All four restored files match the listed upstream SHA256 digests. Frozen
  Kuramoto contract, gate-runner, and D002H Gate E tests pass. Governance
  examples satisfy the original schemas; missing fields, invalid scores,
  inconsistent totals, and extra fields are rejected. Historical S5_PROXY,
