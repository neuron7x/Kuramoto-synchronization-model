  remain intact. Eight original-history anchors do not acquire current-fork
  ancestry through this restoration; that separate gate remains blocked.
measurement_command: >-
  bash -c 'python -m pytest -q --override-ini addopts=""
  tests/research/robustness/test_kuramoto_contract.py
  tests/research/robustness/test_kuramoto_gate_runner.py
  tests/systemic_risk/test_d002h_gate_e_locked_files.py
  tests/test_cme_trajectory_trace_schema.py
  tests/test_physics_boundary_report_schema.py
  && python tools/research/record_cme_trajectory_trace.py
  data/cme_trajectory_trace_example.json
  && ruff check --no-force-exclude
  tests/test_cme_trajectory_trace_schema.py
  tests/test_physics_boundary_report_schema.py
  && python tools/commit_acceptor/validate_commit_acceptor.py
  --acceptor-id pr2833-exact-source-recovery-20261027
  --summary-out tmp/pr2833_exact_source_acceptor.json'
signal_artifact: "tmp/pr2833_targeted_replay.log"
falsifier:
  command: >-
    bash -c 'python -m pytest -q --override-ini addopts=""
    tests/test_cme_trajectory_trace_schema.py
    tests/test_physics_boundary_report_schema.py
    tests/research/robustness/test_kuramoto_contract.py::TestFrozenArtifactManifest::test_hash_mismatch_raises_fail_closed
    tests/systemic_risk/test_d002h_gate_e_locked_files.py::test_gate_e_all_pinned_shas_byte_exact;
    probe_status=$?;
    case "$probe_status" in
    0) ;;
    1) exit 0 ;;
    *) exit "$probe_status" ;;
    esac;
    python tools/commit_acceptor/validate_commit_acceptor.py
    --acceptor-id pr2833-exact-source-recovery-20261027
    --summary-out tmp/pr2833_exact_source_acceptor.json;
    probe_status=$?;
    case "$probe_status" in
    0) exit 1 ;;
    1) exit 0 ;;
    *) exit "$probe_status" ;;
    esac'
  description: >-
    Exit 0 falsifies the promise when a test assertion or acceptor validation
    detects byte drift, accepted malformed evidence, or promoted historical
    proxy status. Exit 1 means both probes passed and found no falsification.
    Infrastructure and collection errors retain their original exit codes
    above 1. Upstream ancestry is not a substitute for the existing
    current-fork ancestry checks.
