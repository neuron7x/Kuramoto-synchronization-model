id: readiness-note-map
status: ACTIVE
claim_type: governance
promise: >-
  Diff-bound acceptor for the readiness note map. The change adds an integration
  ladder to the readiness note and tests that every readiness register entry is
  referenced by the note.

diff_scope:
  changed_files:
    - path: "docs/readiness_note.md"
    - path: "tests/governance/test_readiness_register.py"
    - path: ".claude/commit_acceptors/readiness-note-map.yaml"
  forbidden_paths:
    - "application/"
    - "backtest/"
    - "core/"
    - "markets/"
    - "modules/"

required_python_symbols: []

expected_signal: >-
  The readiness note remains linked to the structured readiness register entries
  and the integration ladder remains visible in tests.

measurement_command: >-
  python tools/check_readiness_register.py && python -m pytest -q tests/governance/test_readiness_register.py --confcutdir=tests/governance

signal_artifact: "docs/readiness_note.md"

falsifier:
  command: >-
    python -m pytest -q tests/governance/test_readiness_register.py --confcutdir=tests/governance
  description: >-
    The test must fail if the readiness note drops a register entry or the ladder.

rollback_command: >-
  git checkout -- docs/readiness_note.md tests/governance/test_readiness_register.py .claude/commit_acceptors/readiness-note-map.yaml

rollback_verification_command: >-
  git diff --exit-code

memory_update_type: append
ledger_path: ".claude/commit_acceptors/readiness-note-map.yaml"
report_path: "docs/readiness_note.md"
evidence: []
