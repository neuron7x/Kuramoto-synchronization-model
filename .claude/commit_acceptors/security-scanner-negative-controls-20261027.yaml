# Operational scanner correctness; never accept a failed gitleaks binary as clean.
id: security-scanner-negative-controls-20261027
status: ACTIVE
claim_type: governance
promise: >-
  Credential scanning ignores function calls and explicitly inert test
  placeholders, but always rejects new real-looking credential strings.
  A failing scanner executable produces a fail-closed error, not PASS.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/security-scanner-negative-controls-20261027.yaml"
    - path: "scripts/ci/check_secret_boundary.py"
    - path: "tests/ci/test_secret_boundary.py"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "core/"
required_python_symbols: []
expected_signal: >-
  All negative planted-secret detections still fire, innocent token-cost
  computations are not leaked-secret assertions, and scanner failure is red.
measurement_command: >-
  bash -c 'python -m pytest tests/ci/test_secret_boundary.py -q &&
  python scripts/ci/check_secret_boundary.py --no-write'
signal_artifact: "tmp/security_scanner_negative_controls_20261027.log"
falsifier:
  command: >-
    python -m pytest
    tests/ci/test_secret_boundary.py::test_gitleaks_process_failure_cannot_appear_clean
    tests/ci/test_secret_boundary.py::test_regex_fallback_detects_planted_aws_and_pem -q
  description: >-
    The independent scanner-crash and credential fixtures must both remain detected.
rollback_command: >-
  git revert --no-edit HEAD
rollback_verification_command: >-
  git diff --exit-code HEAD~1 HEAD -- scripts/ci/check_secret_boundary.py
memory_update_type: append
ledger_path: ".claude/commit_acceptors/security-scanner-negative-controls-20261027.yaml"
report_path: "tests/ci/test_secret_boundary.py"
evidence: []
