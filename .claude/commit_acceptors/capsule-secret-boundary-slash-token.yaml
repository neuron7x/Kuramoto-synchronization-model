id: capsule-secret-boundary-slash-token
status: DRAFT
claim_type: security
promise: "The capsule secret-boundary validator no longer goes blind to standard-alphabet base64 tokens — the _TOKEN_RE charset now includes the forward-slash, so an AWS-style access credential under a non-digest JSON field is caught by the token walk, and the credential-assignment signature tolerates a closing quote between the field name and the separator in JSON form. The real committed capsule still validates clean."  # pragma: allowlist secret
diff_scope:
  changed_files:
    - path: "tools/security/validate_capsule_secret_boundary.py"
    - path: "tests/security/test_capsule_secret_boundary.py"
    - path: ".claude/commit_acceptors/capsule-secret-boundary-slash-token.yaml"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
required_python_symbols: []
expected_signal: "The capsule-boundary suite passes, including the two new regressions (test_slash_base64_secret_under_non_digest_field_fails, test_json_quoted_credential_assignment_fails) that fail against the pre-fix charset."
measurement_command: "python -m pytest -q tests/security/test_capsule_secret_boundary.py"
signal_artifact: "tmp/capsule_secret_boundary_tests.log"
falsifier:
  command: "python -c \"import importlib.util,sys; s=importlib.util.spec_from_file_location('v','tools/security/validate_capsule_secret_boundary.py'); v=importlib.util.module_from_spec(s); s.loader.exec_module(v); sys.exit(0 if v._is_token_like('wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY') is False else 1)\""
  description: "Asks whether a slash-bearing base64 secret is still invisible to _is_token_like (the pre-fix behaviour). On the fixed tree it is now token-like, so the command exits non-zero — proving the promise is falsifiable."
rollback_command: "git revert --no-edit HEAD"
rollback_verification_command: "git diff --exit-code tools/security/validate_capsule_secret_boundary.py"
memory_update_type: none
ledger_path: ".claude/commit_acceptors/capsule-secret-boundary-slash-token.yaml"
report_path: "docs/reports/diff_bound_commit_acceptor_layer.md"
evidence: []
