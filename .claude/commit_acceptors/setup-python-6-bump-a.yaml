# Diff-bound acceptor (part A) for actions/setup-python @v5-pinned
# (a309ff8b426b58ec0e2a45f0f869d46889d02405) -> @v6 (dependabot PR #1396, semver-major bump "5 to 6"). Split
# into a/b/c/d because the bump touches 57 workflow files (above governance
# cap=16; pr-gate.yml and commit-acceptor-gate.yml are exempt via
# dep_manifest_paths). This part binds 15 of 57 workflow files (alphabetical
# slice), plus this acceptor file. Siblings: setup-python-6-bump-b.yaml, setup-python-6-bump-c.yaml, setup-python-6-bump-d.yaml.

id: setup-python-6-bump-a
status: ACTIVE
claim_type: governance
promise: >-
  Bumps actions/setup-python from the v5-generation SHA-pin
  a309ff8b426b58ec0e2a45f0f869d46889d02405 to the v6 SHA-pin ece7cb06caefa5fff74198d8649806c4678c61a1
  (dependabot: "bump actions/setup-python from 5 to 6") in 15 of 57
  affected workflow files (alphabetical slice, part A).
  .github/workflows/service-manifest-audit.yml uses an unpinned
  @v5 -> @v6 tag (that workflow was never SHA-pinned) rather than the
  SHA-pin form used everywhere else in this slice. No functional change
  beyond the version/SHA bump.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/setup-python-6-bump-a.yaml"
    - path: ".github/workflows/architecture-debt-ratchet.yml"
    - path: ".github/workflows/bibliography-claim-gate.yml"
    - path: ".github/workflows/calib-grid-witness-map.yml"
    - path: ".github/workflows/check_epistemic_drift.yml"
    - path: ".github/workflows/claim-boundary-gate.yml"
    - path: ".github/workflows/claim-governance-foundation.yml"
    - path: ".github/workflows/claims-evidence-gate.yml"
    - path: ".github/workflows/cns-release-gate.yml"
    - path: ".github/workflows/code-hygiene-gate.yml"
    - path: ".github/workflows/cognitive-dynamics-lab.yml"
    - path: ".github/workflows/connectome-gate.yml"
    - path: ".github/workflows/coverage-calibration-isolated.yml"
    - path: ".github/workflows/coverage-calibration-loop.yml"
    - path: ".github/workflows/coverage-control-plane.yml"
    - path: ".github/workflows/coverage-intelligence.yml"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
required_python_symbols: []
expected_signal: >-
  Each of the 15 listed workflow files references actions/setup-python@v6
  (SHA-pin ece7cb06caefa5fff74198d8649806c4678c61a1 or, for
  service-manifest-audit.yml, the unpinned @v6 tag it already used
  pre-bump for @v5).
measurement_command: >-
  bash -c "for f in .github/workflows/architecture-debt-ratchet.yml .github/workflows/bibliography-claim-gate.yml .github/workflows/calib-grid-witness-map.yml .github/workflows/check_epistemic_drift.yml .github/workflows/claim-boundary-gate.yml .github/workflows/claim-governance-foundation.yml .github/workflows/claims-evidence-gate.yml .github/workflows/cns-release-gate.yml .github/workflows/code-hygiene-gate.yml .github/workflows/cognitive-dynamics-lab.yml .github/workflows/connectome-gate.yml .github/workflows/coverage-calibration-isolated.yml .github/workflows/coverage-calibration-loop.yml .github/workflows/coverage-control-plane.yml .github/workflows/coverage-intelligence.yml; do grep -E 'actions/setup-python@(ece7cb06caefa5fff74198d8649806c4678c61a1|v6)' \"\$f\" >/dev/null || { echo MISSING \$f; exit 1; }; done"
signal_artifact: "tmp/setup_python_6_bump_a.log"
falsifier:
  command: >-
    bash -c "for f in .github/workflows/architecture-debt-ratchet.yml .github/workflows/bibliography-claim-gate.yml .github/workflows/calib-grid-witness-map.yml .github/workflows/check_epistemic_drift.yml .github/workflows/claim-boundary-gate.yml .github/workflows/claim-governance-foundation.yml .github/workflows/claims-evidence-gate.yml .github/workflows/cns-release-gate.yml .github/workflows/code-hygiene-gate.yml .github/workflows/cognitive-dynamics-lab.yml .github/workflows/connectome-gate.yml .github/workflows/coverage-calibration-isolated.yml .github/workflows/coverage-calibration-loop.yml .github/workflows/coverage-control-plane.yml .github/workflows/coverage-intelligence.yml; do grep -qE 'actions/setup-python@(a309ff8b426b58ec0e2a45f0f869d46889d02405|v5)' \"\$f\" && { echo STALE \$f; exit 1; }; done; echo OK"
  description: >-
    Probe verifies none of the bound workflow files still reference the
    pre-bump v5-generation setup-python pin. A non-OK result means the
    dependabot bump was reverted or partially applied in this slice.
rollback_command: >-
  git checkout HEAD~1 -- .github/workflows/
  .claude/commit_acceptors/setup-python-6-bump-a.yaml
rollback_verification_command: >-
  git diff --exit-code .github/workflows/
memory_update_type: append
ledger_path: ".claude/commit_acceptors/setup-python-6-bump-a.yaml"
report_path: ".claude/commit_acceptors/setup-python-6-bump-a.yaml"
evidence: []
