falsifier:
  command: |-
    python - <<'PY'
    import sys
    from unittest.mock import patch
    import numpy as np
    from geosync.estimators.gamma_estimator import PSDGammaEstimator
    with patch.dict(sys.modules, {"statsmodels.tsa.stattools": None}):
        result = PSDGammaEstimator().compute(np.random.default_rng(0).standard_normal(512))
    print({"quality": result.quality, "stationary": result.is_stationary, "valid": result.is_valid})
    raise SystemExit(0 if result.is_stationary or result.is_valid else 1)
    PY
  description: >-
    Removes the optional ADF dependency while keeping a usable PSD fit.
    Exit 0 means missing stationarity evidence was accepted and falsifies
    the promise; the corrected gate returns nonzero because the estimate
    remains invalid.
