id: ecp-as-boundary-iteration-003
status: ACTIVE
claim_type: governance
promise: >-
  Iteration 003 explicitly separates externally grounded action labels from the internal
  ECP-AS typed state taxonomy and does not misreport transition conformance as external accuracy.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/ecp-as-boundary-iteration-003.yaml"
    - path: "docs/epistemic_control_plane/HISTORICAL_ADJUDICATION_PROTOCOL.md"
    - path: "docs/epistemic_control_plane/README.md"
    - path: "governance/ECP_AS_ITERATION_003.json"
    - path: "artifacts/epistemic_control_plane/iteration_003/ITERATION_003_REPORT.md"
    - path: "artifacts/epistemic_control_plane/iteration_003/source_verification.json"
    - path: "artifacts/epistemic_control_plane/iteration_003/verification_report.json"
    - path: "artifacts/epistemic_control_plane/iteration_003/artifact_index.json"
  forbidden_paths:
    - "execution/"
    - "trading/"
required_python_symbols: []
expected_signal: >-
  Documentation and governance state that DEGRADE/PRESERVE is externally grounded while
  exact STALE/INCONCLUSIVE/CONFLICTED/FALSIFIED mapping is an internal policy conformance target.
measurement_command: >-
  grep -q "internal policy conformance" docs/epistemic_control_plane/HISTORICAL_ADJUDICATION_PROTOCOL.md &&
  grep -q "not independent ground truth" governance/ECP_AS_ITERATION_003.json
signal_artifact: "governance/ECP_AS_ITERATION_003.json"
falsifier:
  command: >-
    python -c "import pathlib; s=pathlib.Path('docs/epistemic_control_plane/HISTORICAL_ADJUDICATION_PROTOCOL.md').read_text();
    raise SystemExit(0 if 'external accuracy' not in s else 1)"
  description: >-
    Negation probe for loss of the external-versus-internal label boundary.
rollback_command: >-
  rm -f docs/epistemic_control_plane/HISTORICAL_ADJUDICATION_PROTOCOL.md governance/ECP_AS_ITERATION_003.json
rollback_verification_command: >-
  test ! -e governance/ECP_AS_ITERATION_003.json
memory_update_type: none
ledger_path: ".claude/commit_acceptors/ecp-as-boundary-iteration-003.yaml"
report_path: "artifacts/epistemic_control_plane/iteration_003/ITERATION_003_REPORT.md"
evidence: []
