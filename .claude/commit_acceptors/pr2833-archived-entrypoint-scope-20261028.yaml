  - "tests/test_architecture_guards.py::test_single_entrypoint_guard_archive_scope_does_not_hide_live_entrypoints"
expected_signal: >-
  Full entrypoint guard and the synthetic historical/live-negative test pass;
  nested or similarly named live directories still produce violations, and
  all canonical paths remain mandatory. Root manifest cold-verifies.
measurement_command: >-
  python -m pytest -q --override-ini addopts=''
