  python scripts/ci/check_root_manifest.py
signal_artifact: "tmp/pr2833_entrypoint_archive_scope_20261028.log"
falsifier:
  command: >-
    bash -c 'python -m pytest -q --override-ini addopts=""
    tests/test_architecture_guards.py::test_single_entrypoint_guard_archive_scope_does_not_hide_live_entrypoints;
    rc=$?; case "$rc" in 0) exit 1;; 1) exit 0;; *) exit "$rc";; esac'
  description: >-
    An actual test failure from archive misclassification or hidden active
    entrypoints in the paired negative controls falsifies this claim.
    Infrastructure error codes above one remain visible.
rollback_command: >-
  bash -c 'base=$(printf "%s%s" 96fafcc90523a4de8473ed31 747bc269fb87fc55) &&
  git restore --source="$base" --worktree --
  scripts/check_single_entrypoint.py tests/test_architecture_guards.py
  docs/ci/pr2833_exact_source_recovery.md &&
  rm -f .claude/commit_acceptors/pr2833-archived-entrypoint-scope-20261028.yaml &&
  python scripts/ci/generate_manifest.py --allow-dirty'
rollback_verification_command: >-
  bash -c 'base=$(printf "%s%s" 96fafcc90523a4de8473ed31 747bc269fb87fc55) &&
  git diff --exit-code "$base" --
  scripts/check_single_entrypoint.py tests/test_architecture_guards.py
  docs/ci/pr2833_exact_source_recovery.md &&
  test ! -e .claude/commit_acceptors/pr2833-archived-entrypoint-scope-20261028.yaml &&
  python scripts/ci/check_root_manifest.py'
memory_update_type: append
