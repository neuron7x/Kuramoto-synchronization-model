  top-level historical archive while retaining fail-closed discovery of
  noncanonical live entrypoints in nested or similarly named paths.
diff_scope:
  changed_files:
    - path: "scripts/check_single_entrypoint.py"
    - path: "tests/test_architecture_guards.py"
    - path: "docs/ci/pr2833_exact_source_recovery.md"
    - path: ".claude/commit_acceptors/pr2833-archived-entrypoint-scope-20261028.yaml"
  forbidden_paths:
    - "archive_snapshots/"
    - "research/"
    - "results/"
    - "data/"
    - "scripts/ci/check_ten_axes.py"
    - ".claude/physics/"
required_python_symbols:
