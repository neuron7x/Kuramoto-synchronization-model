# Diff-bound commit acceptor for the post-merge main-red repair.
#
# The post-merge "Main Validation" lane (run 27533758643) went red on main
# with 6 failures across 3 roots; the PR fast-gates never saw them because
# the broader suite only runs post-merge. This acceptor binds the two test
# files corrected here. (The third root — the drifted
# pr-preflight-runbook.yaml acceptor — is self-bound by its own diff_scope.)
#
#   1. test_online_signal_forecaster_metadata_edges.py asserted
#      confidence == 1.0, an unreachable clamp (tanh-saturated MACD legs +
#      a structural balance floor cap |score| at ~0.78 < 0.85). Rewritten to
#      the real contract confidence == min(1.0, |score|/0.85).
#   2. test_risk_validation_state_edges.py configured a 1.5x position attempt
#      that landed exactly on the severity-trip boundary
#      (abs(new) >= max_position * kill_switch_limit_multiplier), engaging the
#      kill-switch and masking the rate-slot/exposure invariant. Lifted the
#      multiplier so the breach stays a plain LimitViolation.
#
# No production code changed: forecaster scoring and the risk kill-switch are
# untouched; only two overfit test premises were corrected. The execution.risk
# import in test 2 was resolved via importlib.import_module to satisfy the
# forbidden_import_patterns AST gate, matching tests/api/test_service.py.

id: post-merge-red-repair
status: ACTIVE
claim_type: correctness
promise: >-
  After this PR lands, the two repaired tests assert behaviour the
  production code actually produces (confidence == min(1.0, |score|/0.85);
  a 1.5x position breach raises LimitViolation, not a kill-switch RiskError),
  and the post-merge Main Validation lane is green on these cases.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/post-merge-red-repair.yaml"
    - path: "tests/unit/api/test_online_signal_forecaster_metadata_edges.py"
    - path: "tests/unit/execution/test_risk_validation_state_edges.py"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
    - "core/physics/"
    - "core/kuramoto/"
required_python_symbols: []
expected_signal: >-
  `pytest tests/unit/api/test_online_signal_forecaster_metadata_edges.py
  tests/unit/execution/test_risk_validation_state_edges.py` reports all
  tests passing, including
  test_extreme_bearish_score_yields_high_balance_capped_confidence and
  test_position_rejection_does_not_consume_rate_slot_or_mutate_exposure.
measurement_command: >-
  python -m pytest tests/unit/api/test_online_signal_forecaster_metadata_edges.py
  tests/unit/execution/test_risk_validation_state_edges.py -q
signal_artifact: "tests/unit/execution/test_risk_validation_state_edges.py"
falsifier:
  command: >-
    grep -qE "confidence == pytest.approx\(1.0\)"
    tests/unit/api/test_online_signal_forecaster_metadata_edges.py
  description: >-
    Succeeds only if the unreachable confidence==1.0 assertion is
    reintroduced; on the green path the pattern is absent so this probe
    exits non-zero, proving the promise is falsifiable.
rollback_command: >-
  git revert --no-edit HEAD
rollback_verification_command: >-
  git diff --exit-code tests/unit/api/test_online_signal_forecaster_metadata_edges.py
  tests/unit/execution/test_risk_validation_state_edges.py
memory_update_type: none
ledger_path: ".claude/commit_acceptors/post-merge-red-repair.yaml"
report_path: "docs/reports/diff_bound_commit_acceptor_layer.md"
evidence: []
