# Diff-bound commit acceptor for the mainline instrument
# evidence-reconciliation gate.
#
# Adds governance/INSTRUMENTS.yaml — the authoritative registry of the seven
# governance-locked methodology instruments — and
# scripts/ci/check_instrument_evidence_chain.py, a fail-closed gate that
# reconciles, machine-readably, the WHOLE evidence chain of each instrument:
# PR -> merge_commit -> module (+ source_sha256 drift lock) -> test_file ->
# falsifier pytest node(s) resolved by a live `pytest --collect-only` ->
# claim_boundary -> binding acceptor -> provenance evidence sha256.
#
# The gate fails closed (exit 1) on ANY dangling reference and returns exit 2
# if the registry itself is missing/malformed. It promotes NO claim tier,
# adds NO invariant, changes NO runtime behaviour, modifies NO instrument
# source (it only reads and hashes them). Descriptor-only research
# governance infrastructure.
#
# Locally verified on fork base:
#   * python scripts/ci/check_instrument_evidence_chain.py: all 7 PASS, exit 0
#   * pytest tests/scripts/test_check_instrument_evidence_chain.py: 14 passed
#   * ruff check / ruff format --check / black --check: clean
#   * mypy --strict scripts/ci/check_instrument_evidence_chain.py
#     tests/scripts/test_check_instrument_evidence_chain.py: no issues
#   * python scripts/ci/check_claim_boundary.py: PASS
#   * python scripts/ci/check_inventory_sync.py: PASS (49 files)
id: instrument-evidence-reconciliation
status: ACTIVE
claim_type: governance
promise: >-
  governance/INSTRUMENTS.yaml is the authoritative registry of exactly the
  seven governance-locked methodology instruments (state_quantization,
  threshold_calibration, null_baseline, null_comparison, descriptor_metadata,
  replay_descriptor_capsule, market_state_contract) and
  scripts/ci/check_instrument_evidence_chain.py fails closed unless every
  link of every instrument's evidence chain resolves against the working
  tree and git history: the module exists, sha256(module) equals the
  registered source_sha256 (source-drift lock), the merge_commit is a real
  40-hex commit that touched the module, the test_file exists, the acceptor
  exists and binds the module in diff_scope.changed_files, the claim_boundary
  equals "descriptor_only_not_predictor" and appears in the module source,
  every falsifier node is collectable by a live pytest --collect-only, and
  the acceptor carries a sha256 provenance evidence entry. A dangling,
  drifted, or uncollectable reference returns exit 1; a missing/malformed
  registry returns exit 2. No claim tier is promoted; no runtime behaviour
  changes; no instrument source is modified.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/instrument-evidence-reconciliation.yaml"
    - path: "governance/INSTRUMENTS.yaml"
    - path: "scripts/ci/check_instrument_evidence_chain.py"
    - path: "tests/scripts/test_check_instrument_evidence_chain.py"
    - path: ".github/workflows/research-integrity-gate.yml"
    - path: "INVENTORY.json"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
required_python_symbols:
  - "scripts/ci/check_instrument_evidence_chain.py::main"
expected_signal: >-
  `python scripts/ci/check_instrument_evidence_chain.py` prints one [PASS]
  line per instrument (7 total) and `OK: all 7 instruments have a fully
  resolved evidence chain`, exiting 0; the behavioural suite reports
  14 passed including the live-collection positive and the
  uncollectable-falsifier-node negative.
measurement_command: >-
  bash -c 'mkdir -p tmp && python scripts/ci/check_instrument_evidence_chain.py
  > tmp/instrument_evidence_chain.log 2>&1 && test "$(grep -c "\[PASS\]" tmp/instrument_evidence_chain.log)" = "7"'
signal_artifact: "tmp/instrument_evidence_chain.log"
falsifier:
  command: |-
    bash -c 'python - <<'\''PY'\''
    import sys, tempfile, pathlib, importlib.util, yaml
    root = pathlib.Path(".").resolve()
    spec = importlib.util.spec_from_file_location(
        "cg", root / "scripts/ci/check_instrument_evidence_chain.py")
    cg = importlib.util.module_from_spec(spec)
    sys.modules["cg"] = cg
    spec.loader.exec_module(cg)
    reg = yaml.safe_load((root / "governance/INSTRUMENTS.yaml").read_text())
    inst = dict(reg["instruments"][0])
    inst["source_sha256"] = "0"*64
    with tempfile.TemporaryDirectory() as d:
        p = pathlib.Path(d) / "r.yaml"
        p.write_text(yaml.safe_dump({"schema_version":1,
            "claim_boundary_required":"descriptor_only_not_predictor",
            "instruments":[inst]}))
        rc = cg.main(["--registry", str(p), "--skip-collect"])
    sys.exit(0 if rc != 1 else 1)
    PY'
  description: >-
    Inverse probe of the source-drift lock. It exits 0 (fires) iff a
    deliberately corrupted source_sha256 is NOT rejected — i.e. the gate has
    stopped failing closed on source drift. While the lock holds, a drifted
    hash returns exit 1 and the probe exits 1. An exit 0 means the
    reconciliation gate has lost its teeth and must be repaired, not patched.
rollback_command: >-
  bash -c 'git rm -f governance/INSTRUMENTS.yaml
  scripts/ci/check_instrument_evidence_chain.py
  tests/scripts/test_check_instrument_evidence_chain.py
  .claude/commit_acceptors/instrument-evidence-reconciliation.yaml && git checkout .github/workflows/research-integrity-gate.yml INVENTORY.json'
rollback_verification_command: >-
  bash -c 'test ! -f scripts/ci/check_instrument_evidence_chain.py && test ! -f governance/INSTRUMENTS.yaml'
memory_update_type: none
ledger_path: ".claude/commit_acceptors/instrument-evidence-reconciliation.yaml"
report_path: "tmp/instrument_evidence_chain.log"
evidence:
  - path: "tmp/instrument_evidence_chain.log"
    sha256: "bc789646e53c29ea3df1c247df0d5d238c281ce1337527e7d74b041d7336e559"  # pragma: allowlist secret
