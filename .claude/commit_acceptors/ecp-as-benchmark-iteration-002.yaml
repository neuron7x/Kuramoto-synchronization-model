id: ecp-as-benchmark-iteration-002
status: ACTIVE
claim_type: correctness
promise: >-
  Iteration 002 exposes a deterministic adversarial promotion benchmark with explicit labels,
  behavior-class baselines, mechanism ablations, repository-grounded negative probes, and
  a decision matrix suitable for independent audit.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/ecp-as-benchmark-iteration-002.yaml"
    - path: "geosync/epistemic/benchmark.py"
    - path: "geosync/epistemic/__init__.py"
    - path: "benchmarks/epistemic_control_plane/iteration_002/run_benchmark.py"
    - path: "tests/epistemic_kernel/test_benchmark.py"
    - path: "tests/epistemic_kernel/test_replication_truth_table.py"
    - path: "artifacts/epistemic_control_plane/iteration_002/benchmark_results.json"
    - path: "artifacts/epistemic_control_plane/iteration_002/decision_matrix.json.gz"
    - path: "artifacts/epistemic_control_plane/iteration_002/failure_class_breakdown.json.gz"
    - path: "artifacts/epistemic_control_plane/iteration_002/scenario_manifest.json.gz"
    - path: "artifacts/epistemic_control_plane/iteration_002/primary_summary.json"
  forbidden_paths:
    - "execution/"
    - "trading/"
    - "forecast/"
required_python_symbols: []
expected_signal: >-
  Full ECP-AS produces zero unsafe promotions and zero false blocks on the canonical suite;
  the 128-state replication truth table matches the explicit reference rule.
measurement_command: >-
  python -m unittest discover -s tests/epistemic_kernel -p 'test_*.py' -q &&
  PYTHONPATH=. python benchmarks/epistemic_control_plane/iteration_002/run_benchmark.py --repo-root .
signal_artifact: "artifacts/epistemic_control_plane/iteration_002/benchmark_results.json"
falsifier:
  command: >-
    python -c "import json; d=json.load(open('artifacts/epistemic_control_plane/iteration_002/benchmark_results.json'));
    m=next(x for x in d['metrics'] if x['policy']=='ecp_as'); raise SystemExit(0 if m['unsafe_promotions'] else 1)"
  description: >-
    Deliberately exits zero only if the canonical ECP-AS result contains an unsafe promotion;
    this is the negation probe for the primary benchmark invariant.
rollback_command: >-
  rm -rf benchmarks/epistemic_control_plane/iteration_002 artifacts/epistemic_control_plane/iteration_002 &&
  rm -f geosync/epistemic/benchmark.py tests/epistemic_kernel/test_benchmark.py tests/epistemic_kernel/test_replication_truth_table.py
rollback_verification_command: >-
  test ! -e geosync/epistemic/benchmark.py && test ! -e benchmarks/epistemic_control_plane/iteration_002
memory_update_type: none
ledger_path: ".claude/commit_acceptors/ecp-as-benchmark-iteration-002.yaml"
report_path: "artifacts/epistemic_control_plane/iteration_002/ITERATION_002_REPORT.md"
evidence: []
