    - path: artifacts/d002l/prereg/d002l_source_plan_v1.json
    - path: artifacts/governance/verdicts/d002l_p0_verdict_v1.json
    - path: artifacts/governance/verdicts/d002_lineage_dag_v2.json
    - path: docs/research/D002_LINEAGE_MAP_V2.md
    - path: tools/governance/lineage_v2.py
    - path: tests/governance/test_lineage_v2_d002l.py
    - path: tests/systemic_risk/test_d002l_preregistration.py
    - path: tests/systemic_risk/test_d002l_reserve_anchor_transition.py
    - path: .claude/commit_acceptors/x10r-d002l-p0-prereg-repeated-settlement-pressure.yaml
  forbidden_paths:
