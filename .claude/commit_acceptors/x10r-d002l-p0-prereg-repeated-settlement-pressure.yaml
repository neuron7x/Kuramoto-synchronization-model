# D-002L-P0 — pure preregistration acceptor
id: x10r-d002l-p0-prereg-repeated-settlement-pressure
status: ACTIVE
claim_type: governance
promise: >-
  Open a fresh D-002L lineage after D-002K-P4 TERMINAL_REFUSED. Lock a
  repeated ex-ante Treasury coupon settlement observation design, one primary
  beta_coupon estimand, a temporal calibration/confirmatory firewall, official
  point-in-time source plan, an explicit historical IOER-through-2021-07-28 /
  IORB-from-2021-07-29 reserve-remuneration splice,
  power-before-confirmatory-outcomes gate, and exploratory-only GeoSync-native
  features. Preserve the historical D002J verdict DAG v1 unchanged while
  adding generic D002 lineage v2 governance that composes J/K/L, retains both
  J-P7 and K-P4 terminal refusals, and exposes only D002L-P1 as the next legal
  node. D-002J and D-002K remain frozen truthful terminal negatives. Zero
  confirmatory outcome scoring in P0.
