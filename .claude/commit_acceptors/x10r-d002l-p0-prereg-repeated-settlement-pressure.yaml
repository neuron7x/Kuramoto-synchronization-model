    - artifacts/d002j/
    - artifacts/d002k/
    - artifacts/governance/verdicts/d002j_verdict_dag_v1.json
    - docs/research/D002J_LINEAGE_MAP.md
    - tools/governance/verdict_dag.py
    - tools/governance/render_lineage.py
