measurement_command: >-
  bash -c 'set -e;
  PYTHONPATH=. python -m pytest tests/systemic_risk/test_d002l_preregistration.py -q;
  PYTHONPATH=. python -m pytest tests/systemic_risk/test_d002l_reserve_anchor_transition.py -q;
  PYTHONPATH=. python -m pytest tests/governance/test_lineage_v2_d002l.py -q;
