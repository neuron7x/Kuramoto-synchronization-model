measurement_command: >-
  python -m pytest tests/unit/physics/test_T7_diffusion_predictor.py
  tests/core/test_physics_modules.py -q
signal_artifact: "tmp/diffusion_rank_propagation_pytest.log"
falsifier:
  command: >-
    python -c "import numpy as np, sys;
    from core.physics.diffusion_predictor import DiffusionVolatilityPredictor;
    n=41; adj=np.zeros((n,n));
    [adj.__setitem__((i,i+1),1.0) or adj.__setitem__((i+1,i),1.0) for i in range(n-1)];
    pos=np.arange(n,dtype=float); rho0=np.zeros(n); rho0[n//2]=1.0;
    p=DiffusionVolatilityPredictor(D_0=1.0); L=p._build_laplacian(adj,None);
    hor=[64.,128.,256.,512.,1024.];
    msd=[float(np.sum((d:=p._propagate(rho0,L,t))*(pos-np.sum(d*pos))**2)) for t in hor];
    slope=float(np.polyfit(np.log(hor),np.log(msd),1)[0]);
    print('msd_exponent', round(slope,4));
    sys.exit(1 if slope>=0.3 else 0)"
  description: >-
    Measures the saturation-regime mean-square-displacement scaling exponent of
    the PRODUCTION propagator on a known 41-node line graph (centre point
    source, horizons 64..1024). Free Fickian diffusion would give exponent ≈1.
    The probe exits 0 only because the finite-graph relaxation SATURATES
    (measured exponent ≈0.1 < 0.3); it exits non-zero iff the operator starts
    behaving like unbounded Fickian diffusion (exponent ≥0.3). This proves the
    object is non-Fickian rank propagation and would fire if a future change
    re-asserted the "diffusion" label by removing the saturating relaxation —
    distinguishing the honest relabel from a real diffusion model.
