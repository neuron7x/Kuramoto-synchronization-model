id: cns-release-gate-slice
status: ACTIVE
claim_type: governance
promise: >-
  Add a bounded CNS release-readiness gate with protocol validation,
  manifest build, manifest verification, report-contract validation,
  weighted quality scoring, regression tests, and GitHub Actions execution.
diff_scope:
  changed_files:
    - path: ".github/workflows/cns-release-gate.yml"
    - path: ".claude/commit_acceptors/cns-release-gate-slice.yaml"
    - path: "conf/cns_program/default.yaml"
    - path: "conf/cns_program/invariants.yaml"
    - path: "docs/governance/CNS_RELEASE_GATE.md"
    - path: "reports/CNS_RELEASE_GATE_CONTRACT.md"
    - path: "tests/cns_program/test_release_gate.py"
    - path: "tools/cns_program/__init__.py"
    - path: "tools/cns_program/build_release_manifest.py"
    - path: "tools/cns_program/cns_contract.py"
    - path: "tools/cns_program/deploy_release_gate.py"
    - path: "tools/cns_program/quality_gate.py"
    - path: "tools/cns_program/simple_yaml.py"
    - path: "tools/cns_program/verify_release_manifest.py"
    - path: "tools/cns_program/verify_reports_contract.py"
  forbidden_paths:
    - "core/"
    - "trading/"
    - "execution/"
    - "forecast/"
    - "runtime/"
required_python_symbols:
  - "tools.cns_program.deploy_release_gate.validate_protocol"
  - "tools.cns_program.build_release_manifest.sha256_file"
  - "tools.cns_program.verify_release_manifest.verify"
expected_signal: >-
  CNS release gate workflow is green on Python 3.11 and 3.12, and the
  commit acceptor validates this bounded governance-only slice.
measurement_command: >-
  python tools/cns_program/deploy_release_gate.py && python tools/cns_program/build_release_manifest.py && python tools/cns_program/verify_release_manifest.py && python tools/cns_program/verify_reports_contract.py && python tools/cns_program/quality_gate.py && python -m pytest -q tests/cns_program
signal_artifact: "reports/CNS_RELEASE_GATE_CONTRACT.md"
falsifier:
  command: >-
    python tools/cns_program/verify_release_manifest.py --manifest /tmp/nonexistent-cns-manifest.json
  description: >-
    Manifest verification must fail closed when the manifest is absent or hashes do not match current workspace artifacts.
rollback_command: >-
  python -c "from pathlib import Path; [Path(p).unlink(missing_ok=True) for p in ['.github/workflows/cns-release-gate.yml', '.claude/commit_acceptors/cns-release-gate-slice.yaml', 'conf/cns_program/default.yaml', 'conf/cns_program/invariants.yaml', 'docs/governance/CNS_RELEASE_GATE.md', 'reports/CNS_RELEASE_GATE_CONTRACT.md', 'tests/cns_program/test_release_gate.py', 'tools/cns_program/__init__.py', 'tools/cns_program/build_release_manifest.py', 'tools/cns_program/cns_contract.py', 'tools/cns_program/deploy_release_gate.py', 'tools/cns_program/quality_gate.py', 'tools/cns_program/simple_yaml.py', 'tools/cns_program/verify_release_manifest.py', 'tools/cns_program/verify_reports_contract.py']]"
rollback_verification_command: >-
  python -c "from pathlib import Path; raise SystemExit(0 if not Path('tools/cns_program/deploy_release_gate.py').exists() else 1)"
memory_update_type: append
ledger_path: ".claude/commit_acceptors/cns-release-gate-slice.yaml"
report_path: "reports/CNS_RELEASE_GATE_CONTRACT.md"
evidence:
  - path: "reports/CNS_RELEASE_GATE_CONTRACT.md"
