id: ci-claim-boundary-path-filter
status: ACTIVE
claim_type: governance
promise: "Close the claim-boundary gate trigger gap: an edit to a core/indicators/** module ALONE now fires the claim-boundary-gate workflow on both pull_request and push, completing Instrument B's CI coverage (PR #1009). YAML-only change; gate logic and exit semantics unchanged."
diff_scope:
  changed_files:
    - path: ".github/workflows/claim-boundary-gate.yml"
    - path: ".claude/commit_acceptors/ci-claim-boundary-path-filter.yaml"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
