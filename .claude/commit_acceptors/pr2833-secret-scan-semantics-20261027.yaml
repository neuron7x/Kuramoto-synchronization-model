# Bounded scanner repair; no claim of whole-CI or release readiness.
id: pr2833-secret-scan-semantics-20261027
status: ACTIVE
claim_type: security
promise: >-
  Distinguish public symbolic labels and parsed Python references from literal
  credentials while preserving detection of credential near misses, and bind
  noncredential baseline entries to source-verified public digests. Accept
  scanner metadata only under the exact declared workflow file-exclusion policy.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/pr2833-secret-scan-semantics-20261027.yaml"
    - path: "scripts/ci/check_secret_boundary.py"
    - path: "tests/ci/test_secret_boundary.py"
    - path: ".github/detect-secrets.baseline"
    - path: ".github/act/tests.secrets.example"
    - path: "scripts/ci/ebsvap_wp3_run.py"
    - path: ".github/workflows/pr-gate.yml"
    - path: "tests/ci/test_detect_secrets_metadata_contract.py"
  forbidden_paths:
    - "core/"
    - "execution/"
    - "trading/"
    - "results/"
    - "artifacts/"
    - "MANIFEST.sha256"
required_python_symbols:
  - "scripts/ci/check_secret_boundary.py::_is_symbolic_label"
  - "scripts/ci/check_secret_boundary.py::_python_reference_spans"
expected_signal: >-
  The clean-tree boundary and planted-credential controls pass; literal,
  adjacent, malformed-Python and non-Python credential cases remain detected.
  The local token and in-memory WP3 issuer are explicit public fixtures.
  Reviewed baseline changes are one archival Git commit, the current root
  manifest digest replacing its obsolete historical digest, and four restored
  source-file digests bound to exact staged evidence files. Six independently
  verified public hash records for artifact paths already excluded by CI are
  retired. Metadata normalization accepts only the exact declared file regex;
  fingerprints, scanner version, plugins and non-file filters remain immutable
  during scanning. No scanner exclusion is added. This does not certify Git history.
measurement_command: >-
  bash -o pipefail -c 'mkdir -p tmp &&
  python -m pytest -q -o addopts= tests/ci/test_secret_boundary.py
  tests/ci/test_detect_secrets_metadata_contract.py
  2>&1 | tee tmp/pr2833_secret_scan_semantics_20261027.log'
signal_artifact: "tmp/pr2833_secret_scan_semantics_20261027.log"
falsifier:
  command: >-
    bash -c 'python -m pytest -q -o addopts=
    tests/ci/test_secret_boundary.py::test_symbolic_label_rule_keeps_credential_near_misses_red
    tests/ci/test_secret_boundary.py::test_python_reference_rule_keeps_literals_and_non_python_secrets_red
    tests/ci/test_secret_boundary.py::test_regex_fallback_detects_planted_aws_and_pem
    tests/ci/test_detect_secrets_metadata_contract.py;
    rc=$?; case "$rc" in 0) exit 1;; 1) exit 0;; *) exit "$rc";; esac'
  description: >-
    Exit zero falsifies the promise if a nearby symbolic label hides another credential, a Python
    reference exemption leaks into raw configuration, or planted credentials
    stop being detected. Passing controls exit one; pytest infrastructure
    exit codes propagate. Unreviewed fingerprint/policy drift must remain rejected
    by the actual workflow validator. No threshold or source-root allowlist is widened.
rollback_command: >-
  bash -c 'git restore --source=77f4771ddb515f41de5e580a219cf5f2eec7f851 --worktree --
  scripts/ci/check_secret_boundary.py tests/ci/test_secret_boundary.py
  .github/detect-secrets.baseline .github/act/tests.secrets.example
  scripts/ci/ebsvap_wp3_run.py .github/workflows/pr-gate.yml &&
  rm -- tests/ci/test_detect_secrets_metadata_contract.py
  .claude/commit_acceptors/pr2833-secret-scan-semantics-20261027.yaml'
rollback_verification_command: >-
  bash -c 'git diff --exit-code 77f4771ddb515f41de5e580a219cf5f2eec7f851 -- scripts/ci/check_secret_boundary.py
  tests/ci/test_secret_boundary.py .github/detect-secrets.baseline
  .github/act/tests.secrets.example scripts/ci/ebsvap_wp3_run.py
  .github/workflows/pr-gate.yml &&
  test ! -e tests/ci/test_detect_secrets_metadata_contract.py &&
  test ! -e .claude/commit_acceptors/pr2833-secret-scan-semantics-20261027.yaml'
memory_update_type: append
ledger_path: ".claude/commit_acceptors/pr2833-secret-scan-semantics-20261027.yaml"
report_path: "docs/SECRET_BOUNDARY_POLICY.md"
evidence: []
