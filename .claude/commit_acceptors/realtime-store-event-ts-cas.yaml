id: realtime-store-event-ts-cas
status: ACTIVE
claim_type: correctness
promise: >-
  After this PR, the RealTimeFeatureStore cache is event_ts-ordered: _TTLCache.set
  skips a record whose event_ts is older than the cached one, and _write_to_redis
  applies a Lua compare-and-set (companion :ets key, lexicographic UTC-ISO order)
  so an out-of-order or retried publish cannot overwrite a newer cached feature.
  The append-only stream (xadd) is unaffected.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/realtime-store-event-ts-cas.yaml"
    - path: "core/features/realtime_store.py"
    - path: "tests/unit/core/test_realtime_store_event_ts_cas.py"
  forbidden_paths:
    - "core/physics/"
    - "core/kuramoto/"
    - "execution/oms.py"
required_python_symbols:
  - "core/features/realtime_store.py::RealTimeFeatureStore"
expected_signal: >-
  `python -m pytest --import-mode=importlib
  tests/unit/core/test_realtime_store_event_ts_cas.py -q` reports 4 passed: the
  microcache and Redis cache both reject an older event_ts and accept a newer one.
measurement_command: >-
  bash -c '
    python -m pytest --import-mode=importlib -p no:cacheprovider
      tests/unit/core/test_realtime_store_event_ts_cas.py
      tests/unit/core/test_realtime_store.py -q
  '
signal_artifact: "tmp/realtime_store_event_ts_cas.log"
falsifier:
  command: |-
    bash -c '
      python -c "
    import asyncio, importlib
    from datetime import datetime, timezone
    m = importlib.import_module(\"core.features.realtime_store\")
    d = m.FeatureDescriptor(name=\"f\", version=\"1.0\", entity=\"user\")
    def rec(ts, s): return m.FeatureRecord(descriptor=d, entity_id=\"u\", value={\"s\": s}, event_ts=ts)
    T1 = datetime(2024,1,1,0,0,0,tzinfo=timezone.utc); T2 = datetime(2024,1,1,0,0,1,tzinfo=timezone.utc)
    async def go():
        c = m._TTLCache()
        await c.set(\"k\", rec(T2, 9), 5000)
        await c.set(\"k\", rec(T1, 1), 5000)
        got = await c.get(\"k\")
        assert got.event_ts == T2 and got.value[\"s\"] == 9
    asyncio.run(go())
    "
    '
  description: >-
    Sets a newer then an older record and asserts the newer survives. Exits 0 on
    the correct tree (run_evidence green-state contract), non-zero if the CAS
    guard is removed and last-writer-wins returns.
rollback_command: >-
  bash -c 'git rm -f .claude/commit_acceptors/realtime-store-event-ts-cas.yaml'
rollback_verification_command: >-
  bash -c 'test ! -f .claude/commit_acceptors/realtime-store-event-ts-cas.yaml'
memory_update_type: append
ledger_path: ".claude/commit_acceptors/realtime-store-event-ts-cas.yaml"
report_path: "tmp/realtime_store_event_ts_cas.log"
evidence: []
