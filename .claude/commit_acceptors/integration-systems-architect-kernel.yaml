# Diff-bound commit acceptor for Integration Systems Architect Kernel v1.0.
#
# Purpose:
#   Bind the integration kernel governance artifact to explicit files, JSON
#   parseability, contract tests, claim boundary, rollback, and same-SHA CI proof.

id: integration-systems-architect-kernel
status: ACTIVE
claim_type: governance
promise: >-
  After this PR lands, GeoSync contains a human-readable and machine-readable
  governance kernel for integration architecture. It defines interfaces,
  contracts, dependency graphing, compatibility gates, adapter synthesis,
  failure isolation, validation stack, observability gate, rollback protocol,
  and a final PASS rule requiring install, config, contract-test,
  integration-test, smoke, observability, and rollback evidence. The PR also
  adds a schema and contract tests for the kernel artifact. It does not claim
  runtime integration, production readiness, scientific validation, physics
  validity, trading readiness, or market prediction.

diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/integration-systems-architect-kernel.yaml"
    - path: "docs/prompts/integration_systems_architect_kernel_v1_0.md"
    - path: "data/governance/integration_systems_architect_kernel_v1_0.json"
    - path: "schemas/governance/integration_systems_architect_kernel.schema.json"
    - path: "tests/governance/test_integration_systems_architect_kernel.py"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
    - "core/"
    - "runtime/"
    - "application/"
    - "analytics/"
    - "research/"

required_python_symbols:
  - "tests/governance/test_integration_systems_architect_kernel.py::test_kernel_artifacts_exist_and_parse"
  - "tests/governance/test_integration_systems_architect_kernel.py::test_kernel_has_all_required_functions"
  - "tests/governance/test_integration_systems_architect_kernel.py::test_output_contract_contains_required_integration_fields"
  - "tests/governance/test_integration_systems_architect_kernel.py::test_final_gate_blocks_pass_without_required_evidence"
  - "tests/governance/test_integration_systems_architect_kernel.py::test_claim_boundary_blocks_runtime_and_market_claims"
  - "tests/governance/test_integration_systems_architect_kernel.py::test_schema_required_keys_match_data_keys"

expected_signal: >-
  The integration systems architect kernel is present as governance-only prompt
  documentation, machine-readable JSON, a schema, and contract tests. The JSON
  parses, contains the output contract, requires final PASS evidence, and blocks
  runtime, production, scientific, physics, trading, and market-prediction
  claims.

measurement_command: >-
  bash -c '
    test -s docs/prompts/integration_systems_architect_kernel_v1_0.md && python -m compileall -q data docs schemas tests && python -m pytest -q tests/governance/test_integration_systems_architect_kernel.py
  '

signal_artifact: "tmp/integration_systems_architect_kernel.log"

falsifier:
  command: >-
    bash -c '
      python - <<"PY"
      import json
      data = json.load(open("data/governance/integration_systems_architect_kernel_v1_0.json", encoding="utf-8"))
      required = {"install evidence", "config evidence", "contract test evidence", "integration test evidence", "smoke path evidence", "observability evidence", "rollback evidence"}
      present = set(data["final_gate"]["pass_requires"])
      raise SystemExit(0 if required <= present else 1)
      PY
    '
  description: >-
    Probes that the final PASS gate requires install, config, contract-test,
    integration-test, smoke, observability, and rollback evidence.

rollback_command: >-
  bash -c '
    git rm -f
      .claude/commit_acceptors/integration-systems-architect-kernel.yaml
      docs/prompts/integration_systems_architect_kernel_v1_0.md
      data/governance/integration_systems_architect_kernel_v1_0.json
      schemas/governance/integration_systems_architect_kernel.schema.json
      tests/governance/test_integration_systems_architect_kernel.py
  '

rollback_verification_command: >-
  bash -c '
    test ! -e .claude/commit_acceptors/integration-systems-architect-kernel.yaml && test ! -e docs/prompts/integration_systems_architect_kernel_v1_0.md && test ! -e data/governance/integration_systems_architect_kernel_v1_0.json && test ! -e schemas/governance/integration_systems_architect_kernel.schema.json && test ! -e tests/governance/test_integration_systems_architect_kernel.py
  '

memory_update_type: append
ledger_path: ".claude/commit_acceptors/integration-systems-architect-kernel.yaml"
report_path: "tmp/integration_systems_architect_kernel.log"
evidence: []
