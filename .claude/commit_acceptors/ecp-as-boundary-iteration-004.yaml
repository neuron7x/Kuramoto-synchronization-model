id: ecp-as-boundary-iteration-004
status: ACTIVE
claim_type: governance
promise: >-
  Iteration 004 never reports synthetic evaluator noise as observed LLM performance, never
  treats the 39-row public preview as representative of the full benchmark, and preserves
  hidden common cause as an explicit residual failure mode.
diff_scope:
  changed_files:
    - path: "docs/epistemic_control_plane/SOUNDNESS_CONTROL_STRESS_PROTOCOL.md"
    - path: "docs/epistemic_control_plane/README.md"
    - path: "governance/ECP_AS_ITERATION_004.json"
    - path: "artifacts/epistemic_control_plane/iteration_004/ITERATION_004_REPORT.md"
expected_signal: >-
  All user-facing and machine-readable artifacts distinguish external labels from synthetic
  judge-error profiles and state that real evaluator covariance remains unmeasured.
measurement_command: >-
  grep -q "synthetic stress" docs/epistemic_control_plane/SOUNDNESS_CONTROL_STRESS_PROTOCOL.md &&
  grep -q "not IID" governance/ECP_AS_ITERATION_004.json
signal_artifact: "governance/ECP_AS_ITERATION_004.json"
falsifier:
  command: >-
    python -c "import pathlib; s=pathlib.Path('docs/epistemic_control_plane/SOUNDNESS_CONTROL_STRESS_PROTOCOL.md').read_text(); raise SystemExit(0 if 'does not reproduce actual llm evaluations' not in s.lower() else 1)"
  description: >-
    Negation probe for an overclaim that the synthetic judge model is real evaluator performance.
rollback_command: >-
  rm -f docs/epistemic_control_plane/SOUNDNESS_CONTROL_STRESS_PROTOCOL.md governance/ECP_AS_ITERATION_004.json
rollback_verification_command: >-
  test ! -e governance/ECP_AS_ITERATION_004.json
memory_update_type: none
ledger_path: ".claude/commit_acceptors/ecp-as-boundary-iteration-004.yaml"
report_path: "artifacts/epistemic_control_plane/iteration_004/ITERATION_004_REPORT.md"
evidence: []
