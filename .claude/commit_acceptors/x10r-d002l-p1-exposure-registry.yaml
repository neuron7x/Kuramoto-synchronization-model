id: x10r-d002l-p1-exposure-registry
status: ACTIVE
claim_type: governance
promise: >-
  D-002L-P1 implements an outcome-blind, content-addressed compiler for the
  P0-locked TreasuryDirect Calculated New Cash/Pay Down Amounts exposure source.
  Implementation tests may pass without advancing the scientific lineage.
  D002L-P1 becomes TERMINAL_PASS only when an official, source-complete raw
  snapshot is retained and compiled. Source-access failure is NOT_EXECUTED /
  BLOCKED_SOURCE_ACCESS, never PASS. TGCR/IOER/IORB and confirmatory scoring are
  forbidden until D002L-P2 TERMINAL_PASS. The secondary Treasury announcement
  oracle is refusal-only: a mismatch or incomplete required corroboration set may
  refuse corroboration/promotion, while an exact oracle match can never authorize
  P1 PASS or advance lineage.
