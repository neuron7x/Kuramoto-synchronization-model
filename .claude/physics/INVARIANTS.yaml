# ═══════════════════════════════════════════════════
# FREE ENERGY / ECS
# ═══════════════════════════════════════════════════

free_energy:
  lyapunov_monotonicity:
    id: INV-FE1
    type: monotonic
    statement: "Free energy F(t) is non-increasing under active inference update"
    test_type: trajectory_test
    falsification: "F(t+1) > F(t) + ε where ε accounts for numerical precision"
    priority: P0

  components_non_negative:
    id: INV-FE2
    type: universal
    statement: "Each free-energy component is non-negative: U ≥ 0, T ≥ 0, S ≥ 0 (Tsallis q>1). F = U − T·S itself can be either sign."
    test_type: property_test
    parameters:
      rationale: "The original statement 'F ≥ 0' is physically incorrect — Helmholtz free energy is unbounded below (high-entropy systems at high temperature routinely have F < 0). What must hold is the non-negativity of the individual building blocks: the risk-exposure U = Σ|pos|·|ret|, the order-book temperature T_LOB, and the Tsallis entropy S_q for q > 1. A negative value in any of these indicates a bug in the corresponding subroutine, not a physics fluctuation."
    falsification: "core.physics.free_energy_trading_gate.FreeEnergyTradingGate.check returns U_before or U_after < 0, or T_LOB < 0, or S_q_before or S_q_after < 0 on any valid input"
    priority: P0

  ecs_conditional_descent:
    id: INV-FE3
    type: conditional
    statement: "ECSLyapunovRegulator.step enforces CONDITIONAL Lyapunov descent: whenever V_before > V_floor (=1e-12) the corrected RK4 update satisfies V_after ≤ V_before (dV/dt ≤ 0). At the floor V ≤ V_floor the guarantee is suspended by physics — V = 0.5·FE² + λ·CF² + μ·SI² ≥ 0 cannot descend below zero, so a stress injection from the origin necessarily raises V."
    test_type: trajectory_test
    falsification: "For any step taken from a state with V_before > 1e-12, V_after > V_before — i.e. the post-hoc binary-search correction (core/neuro/ecs_lyapunov.py) failed to enforce descent or the α=0 no-move fallback."
    scope_note: "Sharper, honest sibling of INV-FE1: it states the explicit non-negativity-floor exclusion that makes the descent guarantee truthful (a universal 'dV/dt ≤ 0' claim is falsified at the origin where the only admissible move is up). The correction guarantees at worst α=0 (no move, dV=0) whenever V_before > 1e-12. Numerically verified: 9000 corrected steps, worst dV_dt = 0.0."
    priority: P0

# ═══════════════════════════════════════════════════
# THERMODYNAMIC CONSTRAINTS
# ═══════════════════════════════════════════════════

thermodynamics:
  energy_conservation:
    id: INV-TH1
    type: conservation
    statement: "Total system energy change = work done + heat dissipated"
    test_type: balance_test
    priority: P1

  second_law:
    id: INV-TH2
    type: universal
    statement: "Entropy production ≥ 0 in irreversible processes"
    test_type: property_test
    priority: P1

  landauer_erasure_floor:
    id: INV-TH3
    type: algebraic
    statement: "Per-bit information erasure costs exactly the Landauer floor E_bit = k_B·T·ln 2, and the N-bit minimum E_min(N) = N·E_bit is a hard lower bound (N-bit cost ≥ N·k_B·T·ln 2, equality at the quasi-static limit)."
    test_type: property_test
    falsification: "core.physics.landauer.LandauerInferenceProfiler.landauer_per_bit ≠ k_B·T·ln 2 to float precision, or minimum_energy(N) < N·k_B·T·ln 2 for some integer N ≥ 0."
    scope_note: "Quasi-static erasure against a thermalised reservoir at temperature proxy T (Landauer 1961). This is the per-bit identity plus the additive N-bit floor; it is distinct from INV-TAU2, which reuses the same k_B·T·ln 2 constant as a predictability-horizon energy budget E_min = k_B·T·ln(Δ/δ₀) rather than as a bit-erasure cost."
    priority: P0

# ═══════════════════════════════════════════════════
# STOCHASTIC THERMODYNAMICS (Law T8 — exact fluctuation theorems)
# Overdamped Langevin in a harmonic well V = ½ k x²; Euler-Maruyama,
# Sekimoto work convention dW = ½ x² dk. Pure statistical mechanics —
# NOT a market model, no financial claim. The free energy is the
# Gaussian partition-function result F(k) = −(1/2β)·ln(2π/(βk)), so a
# stiffness ramp k_i→k_f has ΔF = −(1/2β)·ln(k_i/k_f).
# ═══════════════════════════════════════════════════

stochastic_thermodynamics:
  equipartition_boltzmann:
    id: INV-ST1
    type: statistical
    statement: "Stationary samples of the overdamped Langevin in V = ½ k x² satisfy equipartition: Var(x) = kT/k (Boltzmann / detailed-balance steady state)."
    test_type: statistical_test
    parameters:
      tolerance: "0.10 (relative; measured ≈0.017 at ensemble=40000, relax_steps=2000)"
      relation: "Var(x) = kT/k = (1/βk); zero-mean Gaussian p(x) ∝ exp(−βV)"
      ensemble: "40000 trajectories, dt=0.005, gamma=1.0, seeds {1,7,42}"
    falsification: "|Var(x) − kT/k| / (kT/k) > 0.10 for any tested stiffness after relaxation to the stationary distribution."
    priority: P0
    provenance: ANCHORED
    source: core/physics/stochastic_thermodynamics.py
    tests: tests/unit/physics/test_T8_stochastic_thermodynamics.py
    references:
      - "Sekimoto, K. (1998). Langevin equation and thermodynamics. Prog. Theor. Phys. Suppl. 130, 17."
    related: [INV-ST2, INV-ST3]

  jarzynski_equality:
    id: INV-ST2
    type: statistical
    statement: "Jarzynski equality holds exactly in expectation over the non-equilibrium work distribution: ⟨e^(−βW)⟩ = e^(−βΔF), with e^(−βΔF) = sqrt(k_i/k_f) for the harmonic stiffness ramp."
    test_type: ensemble_test
    parameters:
      tolerance: "0.05 (relative to target e^(−βΔF); measured ≤0.004 at ensemble=40000)"
      target: "e^(−βΔF) = sqrt(k_i/k_f) = 0.5000 for k_i=1, k_f=4, kT=1"
      mean_estimator: "np.mean(np.exp(−βW)) over ensemble work array; ΔF = −(1/2β)·ln(k_i/k_f)"
      ensemble: "40000 trajectories, tau=1.0, dt=0.005, gamma=1.0, seeds {1,7,42,123}"
    falsification: "|⟨e^(−βW)⟩ − e^(−βΔF)| / e^(−βΔF) > 0.05 for the reference ramp on any tested seed."
    priority: P0
    provenance: ANCHORED
    source: core/physics/stochastic_thermodynamics.py
    tests: tests/unit/physics/test_T8_stochastic_thermodynamics.py
    references:
      - "Jarzynski, C. (1997). Nonequilibrium equality for free energy differences. Phys. Rev. Lett. 78, 2690."
      - "Crooks, G. E. (1999). Entropy production fluctuation theorem and the nonequilibrium work relation for free energy differences. Phys. Rev. E 60, 2721."
    related: [INV-ST1, INV-ST3]

  second_law_dissipation:
    id: INV-ST3
    type: statistical
    statement: "Second law (Jensen on Jarzynski): mean work ⟨W⟩ ≥ ΔF, and dissipated work is monotonic in protocol speed — ⟨W⟩ at tau=2.0 < ⟨W⟩ at tau=0.5 (slower ramp dissipates less)."
    test_type: statistical_test
    parameters:
      relation: "⟨W⟩ ≥ ΔF (= 0.693 for the reference ramp); ⟨W⟩_slow < ⟨W⟩_fast"
      measured: "⟨W⟩ ≈ 0.93 at tau=1.0; ⟨W⟩(tau=2.0) ≈ 0.84 < ⟨W⟩(tau=0.5) ≈ 1.08"
      ensemble: "40000 trajectories, dt=0.005, gamma=1.0, seed=42"
    falsification: "⟨W⟩ < ΔF on the reference ramp, OR ⟨W⟩(tau=2.0) ≥ ⟨W⟩(tau=0.5) (dissipation not monotonic in protocol speed)."
    priority: P1
    provenance: ANCHORED
    source: core/physics/stochastic_thermodynamics.py
    tests: tests/unit/physics/test_T8_stochastic_thermodynamics.py
    references:
      - "Jarzynski, C. (1997). Phys. Rev. Lett. 78, 2690 (⟨W⟩ ≥ ΔF by Jensen)."
    related: [INV-ST1, INV-ST2]

# ═══════════════════════════════════════════════════
# GABOR TIME-FREQUENCY UNCERTAINTY LIMIT
# Scope: core/physics/uncertainty.py, core/indicators/physics.py
# ═══════════════════════════════════════════════════
# Replaces the prior fabricated "Heisenberg ΔxΔp ≥ ℏ/2" framing (2026-06-17).
# That code dressed the classical product std(price)·std(diff(price)) as the
# quantum uncertainty relation using a fabricated ℏ=1.0 (constants.PLANCK_REDUCED),
# so the "bound" ℏ/2 was just the number 0.5 — a category error: price and its
# first difference are JOINTLY OBSERVABLE, with no commutator [x̂,p̂]=iℏ and no
# Fourier-conjugate pairing. The Gabor limit is the correct, anchored uncertainty
# theorem for a sampled time series: time and frequency ARE a Fourier-conjugate
# pair, and 1/(4π) is an exact mathematical constant requiring no Planck constant.

gabor_uncertainty:
  time_frequency_limit:
    id: INV-GABOR1
    type: algebraic
    statement: "Δt · Δf ≥ 1/(4π) for a WELL-RESOLVED finite-energy sampled signal (time-localized inside the window, band-limited away from Nyquist), with equality (saturation) for a Gaussian envelope. Δt = √(second moment of normalized time-domain power |x|² about its centroid, in sample units); Δf = √(second moment of normalized power spectrum |FFT(x)|² about its centroid, in cycles/sample, on the np.fft.fftfreq axis). 1/(4π) ≈ 0.0795774715 is an EXACT mathematical constant — no Planck constant, no fabricated ℏ/2. SCOPE NOTE: 1/(4π) is the CONTINUOUS Gabor bound; the naive discrete second-moment estimator can dip below it for under-resolved / near-Nyquist short signals because the fftfreq axis wraps at ±0.5 and underestimates true spectral spread. The implementation therefore FAIL-CLOSES on such windows (raises rather than returning a sub-bound product), so the invariant is asserted in — and the function only ever returns within — the well-resolved regime where the discrete estimator faithfully realizes the continuous theorem; it is NOT defined over arbitrary short noise."
    test_type: property_test
    parameters:
      bound: "1/(4π) = 0.07957747154594767 (exact, defined as core.physics.uncertainty.GABOR_LIMIT)"
      saturation: "Gaussian window x(n)=exp(-(n-c)²/(2σ²)), analyzed AS GIVEN (no mean removal — demeaning squares the negative lobes into side energy and breaks saturation), hits Δt·Δf → 1/(4π); scale-invariant in σ (Δt∝σ, Δf∝1/σ). Measured ≈0.0796 within atol 2e-3 at n=4096, σ∈{120,200,250,400}."
      well_resolved_sweep: "200 Gaussian-windowed band-limited signals (seed 42, n∈[256,1024]) + 50 noisy sinusoids inside a Gaussian window (seed 7) + lowpass-smoothed noise all satisfy Δt·Δf ≥ 1/(4π)·(1−1e-9). Measured min ≈0.18."
      fail_closed: "empty / <2 samples / non-1-D / non-finite / constant (zero variance) input → ValueError; AND any under-resolved / near-Nyquist window whose discrete product would land below 1/(4π)·(1−1e-2) → ValueError (no sub-bound product is ever returned). No silent numeric repair."
    falsification: "time_frequency_spread returns Δt·Δf < 1/(4π) for any WELL-RESOLVED signal, OR a Gaussian envelope fails to saturate to 1/(4π) within tolerance, OR a degenerate / under-resolved / constant input fails to raise ValueError."
    priority: P0
    provenance: ANCHORED
    source: core/physics/uncertainty.py
    tests: tests/unit/physics/test_uncertainty.py
    references:
      - "Gabor, D. (1946). Theory of communication. J. Inst. Electr. Eng. 93(3), 429–457 (Δt·Δf ≥ 1/(4π), Gaussian minimizer)."
      - "Folland, G. B. & Sitaram, A. (1997). The uncertainty principle: a mathematical survey. J. Fourier Anal. Appl. 3(3), 207–238."

# ═══════════════════════════════════════════════════
# RICCI CURVATURE
# ═══════════════════════════════════════════════════

ricci:
  curvature_bounds:
    id: INV-RC1
    type: universal
    statement: "Ollivier-Ricci curvature κ(i,j) ≤ 1 for every edge of every connected graph"
    test_type: property_test
    parameters:
      rationale: "κ = 1 − W₁(m_x, m_y)/d(x,y) and W₁ ≥ 0 always, so κ ≤ 1 is a definitional upper bound independent of graph topology or walk laziness"
      lower_bound_note: "The lower bound κ ≥ −1 holds only for lazy random walks (α ≥ 1/2) on a combinatorial metric. The implementation in core/indicators/ricci.py uses 1-D positional embedding (offset/scale from graph attrs) and α = 1/(deg+1), so κ can descend below −1 for non-price-graph topologies with large positional spread (e.g. cycle_12 gives κ=−2 on adjacent nodes separated by 9 in the integer embedding). Price graphs built via build_price_graph() produce adjacent integer node IDs and do satisfy κ ∈ [−1, 1]; that tighter bound is tracked as INV-RC3."
    falsification: "ricci_curvature_edge returns κ > 1 for any edge of any connected graph"
    priority: P0

  positive_curvature_clustering:
    id: INV-RC2
    type: qualitative
    statement: "κ > 0 indicates clustering / community structure"
    test_type: correlation_test
    priority: P2

  price_graph_bounds:
    id: INV-RC3
    type: universal
    statement: "κ(i,j) ∈ [−1, 1] for every edge of a build_price_graph output IN THE COMMENSURATE-METRIC REGIME (path-like graphs whose consecutive price levels differ by unit steps). The bound is CONDITIONAL, not universal: build_price_graph measures W₁ in the positional (price-level) metric but the geodesic d in the |Δp|+1 weighted-graph metric, so when those metrics diverge (large inter-step level jumps from volatile series or large δ) κ = 1 − W₁/d descends below −1."
    test_type: property_test
    parameters:
      scope: "build_price_graph output in the path-like regime — short/low-jump series at default δ where the 1D positional embedding stays commensurate with the |Δp|+1 weighted geodesic"
      conditional_not_universal: "Corrected 2026-06-15: the prior version asserted that consecutive integer node IDs and unit positional spacing are constructor-guaranteed; that is FALSE — price levels jump by >1 on volatile series, so the positional metric (W₁) and the weighted geodesic (d) are incommensurate and κ can reach ≈ −6 at δ=0.05. The [−1, 1] envelope holds only while W₁/d ≤ 2 (the algebraic equivalent of κ ≥ −1)."
      tighter_than_RC1: "Where it holds, this is the tightened Ollivier bound; INV-RC1's κ ≤ 1 remains universal because W₁ ≥ 0."
    evidence: "tests/physics_contracts/test_ricci_ollivier_identity_boundary.py — proves κ = 1 − W₁/d to 0.0 error and that W₁/d > 2 (κ < −1) occurs on real build_price_graph edges; tests/physics_contracts/test_ricci_geometry_witnesses.py asserts the bound only in the path-like regime with a vacuity guard."
    falsification: "κ outside [−1, 1] on an edge of a build_price_graph() output WITHIN the declared path-like / commensurate-metric regime. Out-of-regime κ < −1 (jumpy/volatile series, large δ) is the EXPECTED, witnessed behavior, not a falsification."
    priority: P1

# ═══════════════════════════════════════════════════
# KURAMOTO-RICCI SEMANTICS SPLIT (FP-2 — "No silent physics loss")
# Issue #1096 Lane B. The Ollivier-Ricci κ-matrix is SIGNED (κ_ij < 0 = an
# anti-synchronising / repulsive edge). Two NAMED paths keep the loss or
# preservation of that sign explicit and auditable; a signed matrix may never
# be passed to the Restrepo-Ott-Hunt onset boundary (Φ defined for κ ≥ 0 only).
# Two-layer contract: this file is the assistant-facing layer; the runtime
# layer is physics_contracts/catalog.yaml (kuramoto_ricci.semantics_split).
# Both updated atomically in this commit.
# Source: core/kuramoto/kuramoto_ricci_engine.py
#         (ricci_to_positive_adjacency / ricci_to_signed_coupling /
#          assert_roh_compatible).
# Tests:  tests/unit/physics/test_KR4_ricci_semantics_split.py
# ═══════════════════════════════════════════════════

kuramoto_ricci_semantics:
  positive_signed_split:
    id: INV-KR4
    type: universal
    statement: "Ollivier-Ricci negative curvature is discarded ONLY on the named threshold path ricci_to_positive_adjacency, and ONLY with RicciAdjacencyAudit metadata (clipped_for_threshold=True, roh_compatible=True, signed_dynamics_compatible=False) recording negative_edges_count and negative_mass; ricci_to_signed_coupling preserves every negative value (clipped_for_threshold=False, roh_compatible=False, signed_dynamics_compatible=True); and a signed matrix passed to the Restrepo-Ott-Hunt onset boundary (assert_roh_compatible / phase_transition_boundary) is rejected fail-closed. No transform silently destroys signed curvature while claiming full physical dynamics."
    test_type: property_test
    parameters:
      negative_edge: "κ_ij < 0 — an anti-correlated random walk (Ollivier 2009), i.e. an anti-synchronising / repulsive coupling edge"
      roh_boundary: "Φ = K · λ_max(A_κ) − 2γ (Restrepo-Ott-Hunt 2005); derived for non-negative weights, so signed κ is a category error there"
      audit_mass: "negative_mass = Σ |min(κ_sym, 0)| over off-diagonal entries — exactly the signed information the positive path discards"
      mutual_exclusion: "with any negative curvature present, roh_compatible and signed_dynamics_compatible are mutually exclusive — a single matrix can never claim both"
    falsification: "ricci_to_signed_coupling drops a negative κ; ricci_to_positive_adjacency clips without clipped_for_threshold=True or with negative_mass=0 while negatives were present; an all-positive κ trips clipped_for_threshold=True; a signed matrix passes assert_roh_compatible or yields a finite Φ from phase_transition_boundary; or any audit claims both roh_compatible and signed_dynamics_compatible."
    priority: P0

# ═══════════════════════════════════════════════════
# KELLY SIZING
# Physics: log-optimal betting in the small-edge continuous limit.
# Source: Kelly 1956; Thorp 2006; core/neuro/kuramoto_kelly.py
# ═══════════════════════════════════════════════════

kelly:
  optimal_fraction_formula:
    id: INV-KELLY1
    type: algebraic
    statement: "f* = μ / σ² for log-optimal betting in the small-edge continuous limit"
    test_type: property_test
    parameters:
      mu: "expected excess return"
      sigma: "return volatility (std)"
      small_edge_regime: "|μ/σ²| well inside (0, 1) so finite-sample MC argmax is stable"
    falsification: "computed f* deviates from μ/σ² by more than one grid step on analytic inputs"
    common_mistake: "Picking μ/σ² ≈ 1 puts f* at the grid boundary where the negative return tail biases the MC estimator low. Stay interior (e.g. μ=0.01, σ≈0.17 → f*≈0.33)."
    scope_note: "INV-KELLY1 describes the THEORETICAL optimum f* = μ/σ². The production KuramotoKellyAdapter does NOT compute raw Kelly — it computes kelly_base * scale(R) where scale is a coherence-adjusted multiplier ∈ [floor, ceil]. The theoretical formula is witnessed on synthetic distributions (test_T8, test_T20). The adapter's output is bounded by INV-KELLY2 (fraction cap). These are two layers: theory (INV-KELLY1) + implementation (INV-KELLY2)."
    priority: P0

  fraction_cap:
    id: INV-KELLY2
    type: universal
    statement: "The applied Kelly fraction is never larger than the configured drawdown cap"
    test_type: property_test
    parameters:
      f_max: "configured cap from risk policy (half-Kelly typical, 0.25–0.5)"
    falsification: "engine returns f_applied > f_max for any input"
    priority: P0

  log_growth_optimality:
    id: INV-KELLY3
    type: statistical
    statement: "E[log(1 + f*·X)] ≥ E[log(1 + f'·X)] for any f' ≠ f* on bounded returns"
    test_type: ensemble_test
    parameters:
      n_trials: "≥ 1e5 samples from a bounded distribution (Uniform, truncated Normal)"
      grid_step: "1/200 over f ∈ [0, 1]"
      boundedness: "|X| < 1/f_max so log1p(f·X) stays real for every tested f"
    falsification: "argmax of empirical E[log(1+fX)] differs from μ/σ² by more than grid_step + one MC sigma"
    common_mistake: "Using unbounded returns (Gaussian with large σ) yields log(negative) and corrupts the argmax — always truncate or use bounded distributions."
    priority: P1

# ═══════════════════════════════════════════════════
# ORDER MANAGEMENT SYSTEM (OMS)
# Physics: accounting conservation, idempotency, causal ordering.
# Source: execution/oms.py; core/physics/portfolio_conservation.py
# ═══════════════════════════════════════════════════

oms:
  portfolio_energy_conservation:
    id: INV-OMS1
    type: universal
    statement: "Portfolio kinetic energy E_kinetic = ½·Σ|pos|·ret² ≥ 0 for every portfolio state"
    test_type: property_test
    parameters:
      module: "core.physics.portfolio_conservation.PortfolioEnergyConservation"
      scope: "Energy-level conservation check; per-fill accounting (Σ Δpos·price + Δcash = 0) still awaits a full OMS + book fixture and is tracked as future work."
      rationale: "The universal conservation primitive the platform actually exposes today is the kinetic-energy non-negativity in PortfolioEnergyConservation. E_kinetic is a sum of non-negative products, so any negative return from compute_kinetic is a bug in the absolute-value path."
    falsification: "PortfolioEnergyConservation.compute_kinetic returns a negative value on any (positions, returns) pair"
    priority: P0

  idempotency:
    id: INV-OMS2
    type: universal
    statement: "apply(order) ≡ apply(order, order, ..., order) — same client_order_id produces at most one state change"
    test_type: property_test
    parameters:
      n_replays: "≥ 5 submissions of the identical order"
    falsification: "second submission of the same client_order_id changes book state"
    priority: P0

  causal_order:
    id: INV-OMS3
    type: universal
    statement: "Lifecycle event timestamps are monotonically non-decreasing per order_id"
    test_type: property_test
    falsification: "t_{k+1} < t_k observed in lifecycle.history(order_id) sequence"
    scope_note: "Monotonicity relies on the clock callable passed to OrderLifecycle (default: time.time() which is monotonic on Linux). The OMS itself does not validate timestamp ordering — it is a consequence of single-threaded synchronous event recording under RLock."
    priority: P0

# ═══════════════════════════════════════════════════
# SIGNAL BUS
# Physics: DAG structure per tick, deterministic replay under fixed seed.
# Source: core/neuro/signal_bus.py
# ═══════════════════════════════════════════════════

signalbus:
  acyclic_fanout:
    id: INV-SB1
    type: universal
    statement: "The NeuroSignalBus supports DAG fanout: a linear chain of subscriber callbacks fires each node exactly once per root publish"
    test_type: property_test
    falsification: "any subscriber in a DAG-wired chain fires zero or more than once on a single root publish"
    scope_note: "The bus is a flat pub/sub (signal_bus.py) with no built-in cycle detector or topological sort. Cyclic subscriptions (A→B→A) cause Python RecursionError, not a clean rejection. The invariant asserts correct DAG traversal when the subscription graph IS acyclic — it does not claim the bus prevents cycles."
    priority: P0

  deterministic_replay:
    id: INV-SB2
    type: universal
    statement: "Publishing an identical sequence of values into fresh NeuroSignalBus instances produces bit-identical snapshots"
    test_type: property_test
    parameters:
      n_runs: "≥ 3 fresh-bus replays of the same publish sequence"
    falsification: "two fresh bus instances receiving the same publish sequence yield different snapshot values"
    scope_note: "The bus is deterministic by construction — it is a pure latch with no RNG, no hash-dependent ordering, and no concurrency (all publishes happen under RLock). No explicit replay() method or seed parameter is needed; determinism is a structural property of the latch design."
    priority: P0

# ═══════════════════════════════════════════════════
# HPC KERNELS
# Physics: numerical reproducibility and stability.
# Source: geosync_hpc/*.py
# ═══════════════════════════════════════════════════

hpc:
  seeded_reproducibility:
    id: INV-HPC1
    type: universal
    statement: "kernel(seed, x, dtype) == kernel(seed, x, dtype) bit-for-bit on fixed hardware"
    test_type: property_test
    parameters:
      n_runs: "≥ 3"
      tolerance_cross_isa: "1 ULP across different CPU/GPU ISAs; 0 ULP on identical hardware"
    falsification: "two identical invocations on the same hardware differ by any ULP"
    priority: P0

  numerical_stability:
    id: INV-HPC2
    type: universal
    statement: "Finite inputs within documented range produce finite outputs (no NaN/Inf propagation)"
    test_type: property_test
    parameters:
      kappa_max: "condition-number ceiling configured per kernel"
    falsification: "any finite input within spec yields NaN/Inf or cond(A) > kappa_max"
    priority: P0

  ledger_conservation:
    id: INV-HPC3
    type: conservation
    statement: "For the fixed-point execution ledger, the conservation identity (cash + position·mark = invariant, modulo trade cost) holds to the cent on every (fill, qty, fee, mark) tuple within the int64 envelope. The identity is checked end-to-end via geosync_hpc.ledger.conservation_holds() after each apply_fill."
    test_type: property_test
    falsification: "Any (fill, qty, fee, mark) sequence within the int64 envelope where conservation_holds() returns False, OR where sequential apply_fill is non-commutative under permutation of independent fills."
    priority: P0
    provenance: ANCHORED
    source: geosync_hpc/ledger.py
    tests: tests/geosync_hpc/test_ledger.py
    integration_test: tests/geosync_hpc/test_ledger.py
    runtime_evaluable: yes
    references:
      - "Knuth, D. E. (1997). The Art of Computer Programming, Vol. 2 §4.2: Floating-Point Arithmetic. Addison-Wesley, 3rd ed."
      - "Goldberg, D. (1991). What every computer scientist should know about floating-point arithmetic. ACM Comput. Surv. 23(1), 5–48."
      - "Demmel, J. & Nguyen, H. D. (2013). Fast reproducible floating-point summation. 2013 IEEE 21st Symposium on Computer Arithmetic, 163–172."
    related: [INV-HPC1, INV-HPC2]

  state_envelope_integrity:
    id: INV-HPC4
    type: universal
    statement: "Snapshot/restore envelopes carry an explicit envelope_version, schema_version, and SHA-256 checksum over the serialised payload. On load: tampered payload, mismatched schema_version, unknown envelope_version, or non-finite payload value all raise EnvelopeIntegrityError; bit-identical round-trip is guaranteed for canonical payloads. Key-order permutations of the same dict do NOT change the checksum (canonical serialisation)."
    test_type: property_test
    falsification: "A tampered payload that loads without raising; a non-canonical serialisation where two semantically identical payloads produce different checksums; a load that returns silently after schema_version mismatch; a non-finite payload value (NaN/Inf) accepted into the envelope."
    priority: P0
    provenance: ANCHORED
    source: geosync_hpc/runtime_state.py
    tests: tests/geosync_hpc/test_runtime_state.py
    integration_test: tests/geosync_hpc/test_runtime_state.py
    runtime_evaluable: yes
    references:
      - "Merkle, R. C. (1979). Secrecy, Authentication and Public Key Systems. Stanford PhD thesis (origin of hash-tree integrity proofs)."
      - "Lamport, L. (1981). Password authentication with insecure communication. Comm. ACM 24(11), 770–772."
      - "NIST (2015). FIPS 180-4: Secure Hash Standard (SHA-256). National Institute of Standards and Technology."
    related: [INV-HPC1]

  ierd_phase0_response_coverage:
    id: INV-IERD-PHASE0
    type: universal
    statement: "The IERD-PAI-FPS-UX-001 Phase-0 audit response carries a documented contract surface: docs/yana-response.md declares one ``## Q{N}.`` heading and one ``**Tier: <T>**`` marker per question N ∈ 1..7; ADR 0020 (docs/adr/0020-ierd-adoption.md) contains a non-trivial ``## Decision`` section that ratifies adoption; scripts/ci/lint_forbidden_terms.py is runnable and exits 0 in warn mode (Phase-0 contract; strict mode lands at Phase-5)."
    test_type: property_test
    falsification: "yana-response.md missing or any of Q1..Q7 sections absent; OR any Q-section without a Tier marker; OR ADR 0020 missing or below substantive length without a Decision section; OR lint_forbidden_terms.py missing OR exiting non-zero in warn mode."
    priority: P1
    provenance: ANCHORED
    source: scripts/ci/lint_forbidden_terms.py
    tests: tests/governance/test_ierd_phase0_yana_response_coverage.py
    integration_test: tests/governance/test_ierd_phase0_yana_response_coverage.py
    runtime_evaluable: yes
    references:
      - "IERD-PAI-FPS-UX-001 (this repository, 2026-05-03). Institutional Engineering Remediation Directive — binding standard for documentation, CI, API, frontend, validation."
      - "Popper, K. R. (1959). The Logic of Scientific Discovery. Hutchinson (claim → falsifying-test pairing as the demarcation criterion that backs ADR 0021)."
      - "Lakatos, I. (1970). Falsification and the methodology of scientific research programmes. In Criticism and the Growth of Knowledge (progressive vs degenerative shift; the tier ladder ANCHORED/EXTRAPOLATED/SPECULATIVE/UNKNOWN derives from this)."
    related: []

  psr_hac_newey_west:
    id: INV-PSR-HAC
    type: monotonic
    statement: "The HAC-adjusted Probabilistic Sharpe Ratio uses a Newey–West Bartlett-kernel HAC variance estimator with the NW(1994) automatic-bandwidth rule. The effective sample size n_eff shrinks under positive autocorrelation, equals n under zero autocorrelation, and grows under negative autocorrelation: n_eff(ρ > 0) < n; n_eff(ρ = 0) = n; n_eff(ρ < 0) > n. The auto-bandwidth output is a non-negative integer."
    test_type: property_test
    falsification: "Any AR(1) fixture with ρ > 0 yielding n_eff ≥ n; OR ρ = 0 yielding n_eff ≠ n; OR ρ < 0 yielding n_eff ≤ n; OR an auto-bandwidth output that is negative or non-integer."
    priority: P1
    provenance: ANCHORED
    source: research/robustness/cpcv.py
    tests: tests/research/robustness/test_hac_psr.py
    integration_test: tests/research/robustness/test_hac_psr.py
    runtime_evaluable: yes
    references:
      - "Newey, W. K. & West, K. D. (1987). A simple, positive semi-definite, heteroskedasticity and autocorrelation consistent covariance matrix. Econometrica 55(3), 703–708."
      - "Newey, W. K. & West, K. D. (1994). Automatic lag selection in covariance matrix estimation. Rev. Economic Studies 61(4), 631–653."
      - "Bailey, D. H. & López de Prado, M. (2014). The deflated Sharpe ratio: correcting for selection bias, backtest overfitting, and non-normality. J. Portfolio Management 40(5), 94–107."
    related: []

  session_fsm_totality:
    id: INV-HPC5
    type: universal
    statement: "BacktesterCAL session lifecycle is an explicit finite-state machine with a frozen states-set, a frozen actions-set, a transition table that is total over (state, action) pairs, terminal-state absorption (terminal states have no outgoing transitions), and a serialisable envelope round-trip. Invalid (state, action) pairs raise InvalidTransitionError before any side effect."
    test_type: property_test
    falsification: "An (state, action) pair that produces a successor state not in the declared states-set; a terminal state with at least one outgoing transition; an InvalidTransitionError that fires AFTER a side effect; a serialise/deserialise round-trip that loses or mutates the FSM state."
    priority: P1
    provenance: ANCHORED
    source: geosync_hpc/session_fsm.py
    tests: tests/geosync_hpc/test_session_fsm.py
