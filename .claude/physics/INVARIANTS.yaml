# GeoSync Physics Invariants Registry
# ====================================
# This file defines HARD physics constraints that code MUST satisfy.
# Claude Code: read this before writing or modifying ANY test.
# Format: each invariant has type, condition, falsification criteria.

# ═══════════════════════════════════════════════════
# YAROSLAV'S GRADIENT ONTOLOGY — ROOT AXIOM (Layer 0)
# ═══════════════════════════════════════════════════
# CLAUDE.md §0: a system is a sustained potential difference; a static
# gradient is a capacitor, a living gradient is a process. Intelligence
# requires the second. Maintenance hierarchy Layers 0–3 = 40 percent;
# Layer 4 (processing) computes noise if any of 0–3 fails. Registered
# here so that `related:` cross-references from INV-CRITICALITY and
# INV-BEKENSTEIN-COGNITIVE resolve under validator check 8.

gradient_ontology:
  living_gradient:
    id: INV-YV1
    type: universal
    statement: "ΔV > 0 ∧ dΔV/dt ≠ 0 — gradient must be positive AND dynamic. A static gradient is a capacitor; a living gradient is a process. Intelligence requires the second."
    test_type: property_test
    falsification: "Any operating window in which ΔV ≤ 0 OR dΔV/dt ≡ 0 over a non-empty interval while the system claims live cognitive computation."
    priority: P0
    provenance: ANCHORED
    source: core/neuro/gradient_vital_signs.py
    tests: tests/integration/test_neurostack_integration.py
    references:
      - "Hodgkin, A. L. & Huxley, A. F. (1952). A quantitative description of membrane current and its application to conduction and excitation in nerve. J. Physiol. 117, 500."
      - "Schrödinger, E. (1944). What Is Life? — negentropy as the substrate of organized matter."
      - "Prigogine, I. (1977). Self-Organization in Nonequilibrium Systems. Wiley."
    related: [INV-CRITICALITY, INV-BEKENSTEIN-COGNITIVE]

# ═══════════════════════════════════════════════════
# KURAMOTO SYNCHRONIZATION
# ═══════════════════════════════════════════════════

kuramoto:
  order_parameter_bounds:
    id: INV-K1
    type: universal  # holds always, no exceptions
    statement: "0 ≤ R(t) ≤ 1 for all t"
    test_type: property_test  # hypothesis/fuzzing
    falsification: "R outside [0,1] for ANY input"
    priority: P0  # block release

  subcritical_decay:
    id: INV-K2
    type: asymptotic  # holds in limit t→∞
    statement: "K < K_c ⟹ R(t→∞) → 0"
    test_type: convergence_test
    parameters:
      K_c_formula: "2 / (π · g(0))"
      finite_size_correction: "R_incoherent ~ O(1/√N)"
      epsilon: "C / √N where C ∈ [2, 3]"
    falsification: "R stays above 3/√N after 10⁴ steps with K = 0.1·K_c and N > 100"
    common_mistake: "Testing R < 0.01 for N=10. Fluctuations are O(0.32). Use ε = 3/√N."
    priority: P0

  supercritical_order:
    id: INV-K3
    type: asymptotic
    statement: "K > K_c ⟹ R(t→∞) = R_∞ > 0"
    test_type: convergence_test
    parameters:
      near_transition: "R_∞ ∝ √(K - K_c)"
    falsification: "R → 0 with K = 2·K_c after sufficient time"
    priority: P0

  monotonicity_in_K:
    id: INV-K4
    type: conditional  # holds for standard model ONLY
    statement: "R_∞(K₁) ≤ R_∞(K₂) if K₁ < K₂"
    condition: "Standard Kuramoto (no frequency-degree correlation)"
    does_NOT_hold: "Higher-order Kuramoto, explosive sync"
    test_type: sweep_test
    priority: P1

  finite_size_scaling:
    id: INV-K5
    type: statistical  # holds in expectation over ensemble
    statement: "⟨R⟩ ≈ O(1/√N) in incoherent regime"
    test_type: ensemble_test
    parameters:
      n_realizations: "≥ 50 for statistical power"
      confidence: "95%"
    priority: P1

  phase_uniformity:
    id: INV-K6
    type: distributional
    statement: "K < K_c ⟹ phases uniform on [-π, π]"
    test_type: statistical_test
    parameters:
      test_method: "Rayleigh test for circular uniformity"
    priority: P2

  lyapunov_energy:
    id: INV-K7
    type: monotonic  # Lyapunov function
    statement: "V = -(K·N/2)·R² is non-increasing (zero-frequency case)"
    test_type: trajectory_test
    condition: "All ω_i = 0 (identical frequencies)"
    priority: P1

  swing_energy_balance:
    id: INV-K8
    type: conservation  # second-order (swing-equation) energy
    statement: "Second-order (swing-equation) total energy E = ½·Σ mᵢ·θ̇ᵢ² + V(θ), with V(θ) = -½·Σ_ij A_ij·cos(θⱼ − θᵢ), obeys dE/dt = Σ ωᵢ·θ̇ᵢ − Σ dᵢ·θ̇ᵢ². With ωᵢ ≡ 0: E is conserved when dᵢ ≡ 0 and non-increasing when dᵢ ≥ 0. For the all-to-all coupling A_ij = K/N, V = -(K·N/2)·R² + const — the INV-K7 potential, so E is observable black-box from velocities and R alone."
    test_type: conservation  # before/after + trajectory
    condition: "ω_i ≡ 0. Undamped (conservation) clause requires d_i ≡ 0; damped (dissipation) clause requires d_i > 0. A transient must be forced via an unlocked θ0 and non-zero velocity0 — the conservation law is sharpest exactly at this degenerate slice (ω=0, d=0) that the suite never instantiated for energy."
    falsification: "Replacing Störmer–Verlet with non-symplectic Euler injects secular energy growth (observed bounded-drift range/E_scale ≈ 0.39 vs Verlet ≈ 3e-5, a 4-order gap); flipping the damping sign (−d·θ̇ → +d·θ̇) converts dissipation into energy injection (E diverges by ~10⁶ over the same horizon). Both regressions survive every prior second-order assertion (R∈[0,1], finiteness, shapes) — the docstring claim 'symplectic, energy-conserving' had zero falsifiable backing before INV-K8. Same blind-manifold class as the Ott–Antonsen z̄ ω₀=0 conjugate defect (PR #745)."
    priority: P1
    source: core/kuramoto/second_order.py
    tests: tests/unit/physics/test_T18_kuramoto_p1.py

  swing_energy_convergence_order:
    id: INV-K9
    type: conservation  # backward-error / shadow-Hamiltonian convergence order
    statement: "The Störmer–Verlet integrator of the second-order swing equation conserves a modified (shadow) Hamiltonian H̃ = H + O(dt²), so the true-energy error is BOUNDED (no secular trend) and scales as max|ΔE| ∝ dt^p with convergence order p = 2. The falsifiable signature is the least-squares log-log slope of max|ΔE| vs dt over a geometric ladder: symplectic ⟹ slope ≈ 2; any non-symplectic or order-degraded step ⟹ slope ≤ 1 and/or secular growth."
    test_type: conservation  # dt-ladder sweep + bounded-drift comparison
    condition: "ω_i ≡ 0, d_i ≡ 0 (autonomous conservative regime); unlocked θ0 + non-zero velocity0; dt swept over a geometric ×2 ladder at fixed physical horizon; order recovered as the log-log slope of bounded energy drift."
    falsification: "Replacing Störmer–Verlet with explicit Euler collapses the recovered order from ≈2.01 to ≈0.81 and turns bounded drift into secular growth (|ΔE| larger by ~4 orders at equal dt). A fixed-dt amplitude test (INV-K8) can miss a subtle order degradation that still has small drift at the tested dt; INV-K9 measures the order directly and is strictly stronger. Theory: Hairer–Lubich–Wanner, Geometric Numerical Integration; Benettin–Giorgilli long-time energy bounds."
    priority: P1
    source: core/kuramoto/second_order.py
    tests: tests/unit/physics/test_T18_kuramoto_p1.py

  swing_integrator_symplecticity:
    id: INV-K10
    type: conservation  # symplectic 2-form preservation (root of K7/K8/K9)
    statement: "The velocity-Verlet integrator of the undamped (ω=0, d=0) second-order swing equation is symplectic: the Jacobian M of one step preserves the standard symplectic form, MᵀJM = J with J = [[0, I], [−I, 0]], to machine precision; equivalently det(M) = 1 (Liouville phase-space-volume preservation). This is the ROOT property — energy conservation (INV-K8) and bounded O(dt²) error without secular drift (INV-K9) follow as theorems (Hairer–Lubich–Wanner). With damping d > 0 the map contracts phase-space volume at the dissipation rate, det(M) = exp(−(Σ dᵢ/mᵢ)·dt) + O(dt²)."
    test_type: conservation  # complex-step Jacobian + symplectic-form residual
    condition: "ω_i ≡ 0, d_i ≡ 0; Jacobian built by complex-step differentiation of one production integration step (machine-precision, no truncation), after binding the complex-safe replica to SecondOrderKuramotoEngine bit-exactly."
    falsification: "A non-symplectic step (explicit Euler) gives an O(dt²) ≈ 1e-4 symplectic-form residual |MᵀJM − J| and det(M) ≠ 1, versus the velocity-Verlet machine-ε ≈ 2e-16 — a 12-order separation. Verified residual 2.22e-16, det(M) = 1.000000000000000; undamped OA-analogue linear-stability and damped Liouville contraction (det = exp(−(Σd/m)dt) to O(dt²)) cross-checked. Symplecticity is strictly more fundamental than the energy-drift signatures it implies."
    priority: P1
    source: core/kuramoto/second_order.py
    tests: tests/unit/physics/test_T18_kuramoto_p1.py

  sakaguchi_frustration_sign:
    id: INV-SAK1
    type: qualitative
    statement: "The Sakaguchi phase-lag enters the coupling as sin(θ_j(t−τ_ij) − θ_i(t) − α_ij) (minus α). For N identical all-to-all oscillators (ω_i ≡ ω₀, K_ij = κ for i≠j, τ = 0, σ = 0) the phase-locked state rotates at the collective frequency Ω = ω₀ − (N−1)·κ·sin(α)."
    test_type: sweep_test
    condition: "Identical oscillators, uniform frustration α, zero delay and noise; Ω measured from the least-squares slope of the unwrapped mean phase. α = 0 is the blind manifold (both sign conventions agree) — falsification requires α ≠ 0."
    falsification: "Observed collective frequency matches the sign-flipped law ω₀ + (N−1)·κ·sin(α) instead of the canonical minus-α form, i.e. |Ω − (ω₀ − (N−1)·κ·sin(α))| above integrator tolerance for any α ≠ 0. Registered because the absence of any frustration-sign invariant is precisely why no test mandated α ≠ 0 coverage — the blind manifold that hid the analogous Ott–Antonsen conjugate defect (PR #745)."
    priority: P0
    source: core/kuramoto/synthetic.py
    tests: tests/unit/physics/test_sakaguchi_frustration_alpha.py

# ═══════════════════════════════════════════════════
# EXPLOSIVE SYNCHRONIZATION
