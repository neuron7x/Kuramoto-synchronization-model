law_t6_determinism_kit:
  identical_inputs_identical_hash:
    id: INV-DET1
    type: universal
    statement: "Identical canonical inputs ⇒ identical hash. All NaN bit-patterns collapse to one canonical NaN; +0 and −0 unify; subnormals flush to +0. Canonicalisation removes the float64 representations that are numerically equal but bitwise distinct before hashing (FIPS 180-4)."
    test_type: property_test
    falsification: "Two numerically-identical canonical inputs (differing only in NaN payload, signed zero, or subnormal representation) produce different hashes."
    priority: P0
    provenance: ANCHORED
    source: core/physics/determinism_kit.py
    tests: tests/unit/physics/test_T6_determinism_kit.py
    references:
      - "IEEE 754-2019 — IEEE Standard for Floating-Point Arithmetic."
      - "FIPS 180-4 (2015). Secure Hash Standard (SHS). NIST."
    related: [INV-DET2, INV-DET3, INV-HPC1]

  ulp_perturbation_distinct_hash:
    id: INV-DET2
    type: universal
    statement: "A 1-ULP perturbation ⇒ a different hash. dtype, shape, and trajectory-order aliasing are blocked, so two genuinely different states can never collide under the canonical hash. The kit is sensitive at the floating-point resolution limit."
    test_type: property_test
    falsification: "A 1-ULP perturbation, a dtype/shape change, or a trajectory reordering produces the same hash as the unperturbed input."
    priority: P0
    provenance: ANCHORED
    source: core/physics/determinism_kit.py
    tests: tests/unit/physics/test_T6_determinism_kit.py
    references:
      - "IEEE 754-2019 — IEEE Standard for Floating-Point Arithmetic."
    related: [INV-DET1]

  fail_closed_contract:
    id: INV-DET3
    type: universal
    statement: "Every contract violation (unsupported dtype, ragged/object array, non-array input) raises ValueError. Fail-closed; the kit never hashes an input it cannot canonicalise deterministically."
    test_type: property_test
    falsification: "Any unsupported or non-canonicalisable input is hashed instead of raising ValueError."
    priority: P0
    provenance: ANCHORED
    source: core/physics/determinism_kit.py
    tests: tests/unit/physics/test_T6_determinism_kit.py
    references:
      - "IEEE 754-2019 — IEEE Standard for Floating-Point Arithmetic."
    related: [INV-DET1, INV-DET2]

law_t7_pinning_control:
  pinning_set_stabilises_or_insufficient:
    id: INV-PIN1
    type: universal
    statement: "The returned pinning set P satisfies λ_2(L + Γ_P) > ε_pin (the pinned Laplacian gains a strictly positive algebraic connectivity margin) OR the call returns status INSUFFICIENT. Fail-closed: it never claims control it did not achieve."
    test_type: property_test
    parameters:
      pinned_laplacian: "L + Γ_P — graph Laplacian plus diagonal pinning gain on the selected nodes; λ_2 > ε_pin is the controllability margin (Wang-Chen 2002)"
    falsification: "A returned set P reports success while λ_2(L + Γ_P) ≤ ε_pin, or an uncontrollable configuration returns success instead of INSUFFICIENT."
    priority: P0
    provenance: ANCHORED
    source: runtime/pinning_control.py
    tests: tests/unit/physics/test_T7_pinning_control.py
    references:
      - "Wang, X. F. & Chen, G. (2002). Pinning control of scale-free dynamical networks. Physica A 310, 521–531."
      - "Sorrentino, F. et al. (2007). Controllability of complex networks via pinning. Phys. Rev. E 75, 046103."
    related: [INV-PIN2, INV-PIN3, INV-PIN4, INV-SG1]

  contractive_in_linearised_regime:
    id: INV-PIN2
    type: conditional
    statement: "pinning_step is contractive in the linearised regime when target = 0, λ_2(L + Γ_P) > 0, and dt < 2/λ_max(L + Γ_P). The explicit-Euler stability window ties the admissible step to the largest pinned-Laplacian eigenvalue."
    test_type: property_test
    parameters:
      step_bound: "dt < 2/λ_max(L + Γ_P) — explicit-Euler stability ceiling for the linearised pinned flow"
    falsification: "A step taken with dt < 2/λ_max(L + Γ_P) under the stated conditions fails to contract the error toward the pinned target."
    priority: P0
    provenance: ANCHORED
    source: runtime/pinning_control.py
    tests: tests/unit/physics/test_T7_pinning_control.py
    references:
      - "Sorrentino, F. et al. (2007). Controllability of complex networks via pinning. Phys. Rev. E 75, 046103."
      - "Olfati-Saber, R. & Murray, R. M. (2004). Consensus problems in networks of agents. IEEE Trans. Autom. Control 49, 1520–1533."
    related: [INV-PIN1]

  topology_preservation:
    id: INV-PIN3
    type: universal
    statement: "The adjacency matrix A is never mutated by pinning selection or stepping — topology is preserved. Pinning acts through the additive gain Γ_P on the diagonal, never by rewiring the underlying graph."
    test_type: property_test
    falsification: "Any pinning call mutates the input adjacency A (an edge is added, removed, or reweighted)."
    priority: P0
    provenance: ANCHORED
    source: runtime/pinning_control.py
    tests: tests/unit/physics/test_T7_pinning_control.py
    references:
      - "Wang, X. F. & Chen, G. (2002). Pinning control of scale-free dynamical networks. Physica A 310, 521–531."
    related: [INV-PIN1]

  fail_closed_contract:
    id: INV-PIN4
    type: universal
    statement: "Every contract violation (non-square/asymmetric A, negative pinning gain, ε_pin ≤ 0, dt ≤ 0, empty graph) raises ValueError. Fail-closed; an ill-posed control request is never silently accepted."
    test_type: property_test
    falsification: "Any enumerated contract violation returns a pinning result instead of raising ValueError."
    priority: P0
    provenance: ANCHORED
    source: runtime/pinning_control.py
    tests: tests/unit/physics/test_T7_pinning_control.py
    references:
      - "Wang, X. F. & Chen, G. (2002). Pinning control of scale-free dynamical networks. Physica A 310, 521–531."
    related: [INV-PIN1, INV-PIN2, INV-PIN3]
