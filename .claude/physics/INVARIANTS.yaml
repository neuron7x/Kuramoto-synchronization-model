    source: core/physics/cosmological_compute_bound.py
    tests: tests/unit/physics/test_cosmological_compute_bound.py
    falsifier_test: tests/unit/physics/test_cosmological_compute_bound.py::test_compute_claim_above_budget_violation
    references:
      - "Bekenstein, J. D. (1973). Black holes and entropy. Phys. Rev. D 7, 2333."
      - "'t Hooft, G. (1993). Dimensional reduction in quantum gravity. arXiv:gr-qc/9310026."
      - "Susskind, L. (1995). The world as a hologram. J. Math. Phys. 36, 6377."
      - "Susskind, L. (2014). Computational complexity and black hole horizons. Fortschr. Phys. 64, 24. arXiv:1402.5674."
    related: [INV-BEKENSTEIN-COGNITIVE, INV-LANDAUER-PROXY, INV-SIMULATION-FALSIFICATION]

  # INV-OBSERVER-CPT was demoted on 2026-04-26 (chore/honest-provenance-cleanup):
  # the contract was tautological under any observer-asymmetric kernel and no
  # peer-reviewed model of such a kernel for our universe was cited. The schema
  # is preserved as a research demo at examples/observer_cpt_schema_demo.py and
  # carries no registry weight.

  jacobson_observer:
    id: INV-JACOBSON-OBSERVER
    type: conditional
    statement: "Jacobson 1995 derived Einstein equations from local Clausius δQ = T·dS on causal horizons. An observer-coherence correction c, residual = δQ − T·dS − c, must satisfy: (i) c → 0 in the decoupled limit (pure Jacobson recovery), (ii) any non-zero c at observable scale is a falsifiable extension of GR."
    test_type: property_test
    falsification: "A measured local context where δQ = T·dS holds (Einstein gravity confirmed) but the proposed c is non-zero above tolerance, OR δQ ≠ T·dS at a scale where Einstein gravity is independently confirmed."
    priority: P1
    provenance: EXTRAPOLATED
    source: core/physics/jacobson_observer_coherence.py
    tests: tests/unit/physics/test_jacobson_observer_coherence.py
    falsifier_test: tests/unit/physics/test_jacobson_observer_coherence.py::test_witness_extended_inconsistent_when_correction_breaks_balance
    references:
      - "Jacobson, T. (1995). Thermodynamics of spacetime: the Einstein equation of state. Phys. Rev. Lett. 75, 1260. arXiv:gr-qc/9504004."
      - "Padmanabhan, T. (2010). Thermodynamical aspects of gravity: new insights. Rep. Prog. Phys. 73, 046901. arXiv:0911.5004."
      - "Verlinde, E. (2011). On the origin of gravity and the laws of Newton. JHEP 04, 029."
    related: [INV-BEKENSTEIN-COGNITIVE, INV-COSMOLOGICAL-COMPUTE, INV-ARROW-OF-TIME]

  anchored_substrate_gate:
    id: INV-ANCHORED-SUBSTRATE-GATE
    type: conditional
    statement: "A substrate is *thermodynamically admissible* iff both ANCHORED-tier physical bounds hold simultaneously: I_observed ≤ 2π·E·R/(ℏ·c·ln 2) (INV-BEKENSTEIN-COGNITIVE) AND Σ_net = ΔS_system + ΔI_observer ≥ 0 (INV-ARROW-OF-TIME). The gate names the failing axis (or both). NOTE: passing the gate is necessary but NOT sufficient for any cognitive claim — non-cognitive systems satisfy both bounds trivially."
    test_type: property_test
    falsification: "A substrate where both ingredient invariants pass independently but the composite gate reports inadmissible, OR where one ingredient fails but the composite reports admissible. Composition must be the AND of the two ANCHORED axes."
    priority: P0
    provenance: ANCHORED
    source: core/physics/anchored_substrate_gate.py
    tests: tests/unit/physics/test_anchored_substrate_gate.py
    integration_test: tests/integration/test_substrate_gate_chain.py
    runtime_evaluable: yes
    references:
      - "Bekenstein, J. D. (1981). Universal upper bound on the entropy-to-energy ratio for bounded systems. Phys. Rev. D 23, 287."
      - "Landauer, R. (1961). Irreversibility and Heat Generation in the Computing Process. IBM J. Res. Dev. 5, 183."
      - "Bennett, C. H. (1982). The thermodynamics of computation — a review. Int. J. Theor. Phys. 21, 905."
    related: [INV-BEKENSTEIN-COGNITIVE, INV-ARROW-OF-TIME]

# ═══════════════════════════════════════════════════
# API CONTRACT — schemathesis-enforced OpenAPI 3.1 surface (Phase-3 EXIT)
# ═══════════════════════════════════════════════════
# IERD-PAI-FPS-UX-001 §5 + ADR 0020 (Phase-3 EXIT, 2026-05-07): every
# response emitted by `application.api.service.create_app()` must conform
# to the OpenAPI 3.1 contract published in `schemas/openapi/`. Schemathesis
# property-based fuzz fires on every PR touching application/api/** with
# fail-closed semantics (no continue-on-error; the gate blocks merge).

api_contract:
  openapi_conformance:
    id: INV-API-CONTRACT
    type: universal
    statement: "For every (path, method) declared in schemas/openapi/geosync-online-inference-v1.json, runtime responses from `application.api.service.create_app()` satisfy: (a) HTTP status code ∈ declared response codes for that operation; (b) response body validates against the declared JSON Schema for that status; (c) Content-Type matches the declared media type; (d) declared headers are present; (e) schema-violating requests are rejected with one of the declared 4xx codes (no silent acceptance)."
    test_type: property_test
    falsification: "Any response from `create_app()` whose status code, body, Content-Type, or headers diverge from the declared OpenAPI 3.1 contract; OR any schema-violating request silently accepted. Schemathesis emits a structured FailureGroup naming one of: UndefinedStatusCode, JsonSchemaError, MalformedMediaType, MissingHeaders, AcceptedNegativeData, ServerError."
    priority: P1
    provenance: ANCHORED
    source: application/api/service.py
    tests: tests/api/test_schemathesis_contract.py
    integration_test: tests/api/test_schemathesis_contract.py
    runtime_evaluable: yes
    references:
      - "OpenAPI Initiative (2024). OpenAPI Specification 3.1.0. https://spec.openapis.org/oas/v3.1.0"
      - "Hatfield-Dodds, Z. et al. Schemathesis: property-based API testing. https://schemathesis.readthedocs.io"
      - "IERD-PAI-FPS-UX-001 §5 (this repository): Phase-3 EXIT contract for the HTTP API."
    related: []

# ═══════════════════════════════════════════════════
# COHERENCE-BRIDGE RELAY CONTRACT (physics core → risk layer)
# ═══════════════════════════════════════════════════
# Closes the ledger OPEN GAP for `coherence-bridge-geosync-adapter`: the
# advisory relay must hand the risk layer a fail-closed verdict, distinguishing
# the Ollivier κ (INV-RC1, κ ≤ 1) from the augmented-Forman blend (legitimately
# unbounded above; never κ-bound evidence). NON-CLAIM: contract gate, not a
# trading signal — VALID means "physics contract preserved", not "trade".

coherence_bridge:
  relay_contract:
    id: INV-CBR1
    type: universal
    statement: "The CoherenceBridge → risk handoff is VALID iff order_parameter_R ∈ [0,1] (INV-K1) ∧ (ollivier_kappa ≤ 1 when present, INV-RC1) ∧ gamma finite ∧ gamma ≥ 0 (accepted spectral domain). On any violation the verdict is status=INVALID_PHYSICS_CONTRACT, decision=NO_GO, safe_risk_scalar=0.0. The augmented_forman_ricci field is checked for FINITENESS ONLY — it may exceed 1 and is never compared against the κ ≤ 1 bound nor accepted as κ-bound evidence."
    test_type: property_test
    falsification: "validate_physics_contract returns VALID for a signal with R∉[0,1], a negative/non-finite gamma, or an Ollivier κ>1+ε; OR it returns INVALID for an augmented-Forman value >1 whose R, gamma and Ollivier κ are all in-band; OR an INVALID verdict carries a non-zero safe_risk_scalar."
    priority: P0
    provenance: ANCHORED
    source: coherence_bridge/physics_contract.py::validate_physics_contract
    tests: tests/integration/test_coherence_bridge_invariants.py
    scope_note: "Forman vs Ollivier are DISTINCT operators. INV-RC1 (κ ≤ 1) governs the Ollivier operator only (core/indicators/ricci.py). Forman/augmented-Forman curvature is unbounded above by construction; treating a Forman value > 1 as an INV-RC1 violation is a category error, and passing it as κ-bound evidence downstream is forbidden."
    related: [INV-K1, INV-RC1]

# ═══════════════════════════════════════════════════
# NEURO-HOMEOSTATIC STABILIZER (engineering control contract)
# ═══════════════════════════════════════════════════
# Engineering invariant (NOT a neurophysiology claim): the decentralized reset
# wave is a Lyapunov-energy descent under the COMMON-MODE regime it is witnessed
# in. The scalar-mean correction provably descends energy only for coherent
# (common-mode) phase error; that scope restriction is the non-claim.

neuro_homeostatic:
  reset_wave_energy_descent:
    id: INV-HOM1
    type: conditional
    statement: "For a common-mode phase error (all node phase-diffs equal) the NeuroHomeostaticStabilizer reset wave is Lyapunov-energy non-increasing: post_reset_energy ≤ pre_reset_energy (energy E = gain·mean(1−cos Δφ), corrected by the scalar reset_energy = gain·mean(sin Δφ)). Every input-contract violation (unequal/empty phase lists, gain ≤ 0, max_phase_error ≤ 0) raises ValueError; |Δφ| > max_phase_error fail-closes to safety_lock=True with no state advance."
    test_type: property_test
    falsification: "re_adaptation_to_baseline returns post_reset_energy > pre_reset_energy + ε for a common-mode error within max_phase_error; OR a contract violation does not raise; OR an over-threshold error does not safety_lock."
    priority: P1
    provenance: ANCHORED
    source: geosync/neuroeconomics/homeostatic_stabilizer.py::NeuroHomeostaticStabilizer
    tests: tests/unit/neuro/test_homeostatic_stabilizer_setpoint.py
    scope_note: "ENGINEERING analogue, not neuroscience. Energy descent is proven ONLY for the common-mode (coherent) regime — for heterogeneous phase error the scalar-mean correction is not a guaranteed descent direction. E/I ratio, 'serotonin', 'GABA tone' are arithmetic proxies, not modelled neurotransmitter dynamics."
    related: [INV-K1]

# ═══════════════════════════════════════════════════
# ADAPTIVE CRITICALITY (membrane isolation) — registry binding
# ═══════════════════════════════════════════════════
# INV-AC1-rev previously lived only in CLAUDE.md prose. Registered here so it is
# an authoritative registry entry: the evidence-integrity gate now treats ONLY
# this file as the invariant authority, never CLAUDE.md prose tokens. The
# adversarial-audit derivation stays in CLAUDE.md as the doc mirror.

adaptive_criticality:
  membrane_isolation:
    id: INV-AC1-rev
    type: universal
    statement: "κ(node) ≥ κ_critical OR the node is ISOLATED, where κ_critical = -ln(ΔH_max/ε)/(λ_local+δ) (λ_local = DFA Hurst per node, ε SNR tolerance, δ singularity floor 1e-4). The executed gate fail-closes: a non-finite κ_node/λ_local or singular denominator isolates the node; an all-isolated ensemble raises; invalid shared ε/ΔH_max raise (no silent fallback)."
    test_type: property_test
    falsification: "should_isolate_node returns False for κ_node < κ_critical, OR isolates a node with κ_node ≥ κ_critical; OR a non-finite/singular input is silently admitted instead of isolated; OR aggregate_excluding_isolated returns a value when every node is isolated."
    priority: P0
    provenance: ANCHORED
    source: geosync/estimators/dfa_gamma_estimator.py::AdaptiveCriticalityGate
    tests: tests/unit/physics/test_adaptive_criticality_kappa.py
    scope_note: "Criticality OBSERVER, not predictor; synthetic-only. Source-available, fail-closed, unit-tested gate — NOT yet wired into a production ensemble consumer (no live caller). Original INV-AC1 (κ_critical = -dH/dt·τ) is REJECTED (Pesin-identity failure in non-ergodic systems); this revised form supersedes it."
    related: [INV-CRITICALITY, INV-DRO1]

# ═══════════════════════════════════════════════════
# SEVEN-LAW CONSTITUTIONAL PHYSICS ACT (Laws T1–T7) — registry reconciliation
# ═══════════════════════════════════════════════════
# These invariants were authored as the constitutional GeoSync Physics Law Act
# (CLAUDE.md §Laws T1–T7) and bound to diff-scoped commit acceptors
# (.claude/commit_acceptors/law-T*.yaml) with executable witnesses, but they
# were never mirrored into THIS authoritative registry. The validator
# (.claude/physics/validate_tests.py) and the evidence-integrity gate treat
# ONLY this file as the invariant authority, so the T-series witnesses raised
# L2 "INV-* not found in INVARIANTS.yaml" and could not be honestly grounded
# (issue #823 follow-up note: "registry/header drift … separate
# registry-reconciliation task"). Each statement/type/falsification below is
# copied verbatim-in-substance from CLAUDE.md and cross-checked against the
# law doc (docs/laws/T*.md), the source module, and the law-T* acceptor. No
# new physics is introduced; this is a pure registry-authority reconciliation.

law_t1_kuramoto_ricci_sync_onset:
  phi_sign_regime:
    id: INV-KR1
    type: algebraic
    statement: "sign(Φ) determines the asymptotic order-parameter regime, where Φ = K·λ_max(A_κ) − 2γ on the non-negative sync-adjacency built from Ollivier-Ricci curvatures (Restrepo-Ott-Hunt 2005). Subcritical (Φ < 0): ⟨R⟩ ≤ 1.5·3/√N. Supercritical (Φ > 0): ⟨R⟩ > 0.5."
    test_type: property_test
    parameters:
      phi: "Φ = K·λ_max(A_κ) − 2γ — the Restrepo-Ott-Hunt synchronisation-onset functional on the curvature graph"
      finite_size_band: "⟨R⟩ ≤ 1.5·3/√N is the finite-N incoherent fluctuation band; complete-graph limit reproduces K_c = 2γ/(N−1) (Strogatz 2000)"
    falsification: "A subcritical ensemble (Φ < 0) settles to ⟨R⟩ > 1.5·3/√N, or a supercritical ensemble (Φ > 0) fails to reach ⟨R⟩ > 0.5, at the documented N and γ."
    priority: P0
    provenance: ANCHORED
    source: core/kuramoto/kuramoto_ricci_engine.py
    tests: tests/unit/physics/test_T1_kuramoto_ricci_boundary.py
    references:
      - "Restrepo, J. G., Ott, E. & Hunt, B. R. (2005). Onset of synchronization in large networks of coupled oscillators. Phys. Rev. E 71, 036151."
      - "Ollivier, Y. (2009). Ricci curvature of Markov chains on metric spaces. J. Funct. Anal. 256, 810–864."
      - "Strogatz, S. H. (2000). From Kuramoto to Crawford. Physica D 143, 1–20."
    related: [INV-KR4, INV-RC1, INV-K1]

  mle_zero_crossing:
    id: INV-KR2
    type: qualitative
    statement: "The variational maximal Lyapunov exponent crosses zero through the onset boundary Φ = 0 — the synchronised manifold becomes attracting exactly where the algebraic regime functional changes sign. Verified via the Law T2 lyapunov_spectrum estimator."
    test_type: sweep_test
    falsification: "The sign of the variational MLE does not change across Φ = 0 over a coupling sweep bracketing the onset, contradicting the INV-KR1 regime split."
    priority: P0
    provenance: ANCHORED
    source: core/kuramoto/kuramoto_ricci_engine.py
    tests: tests/unit/physics/test_T1_kuramoto_ricci_boundary.py
    references:
      - "Restrepo, J. G., Ott, E. & Hunt, B. R. (2005). Onset of synchronization in large networks of coupled oscillators. Phys. Rev. E 71, 036151."
    related: [INV-KR1, INV-LY1]

  identical_frequency_potential_descent:
    id: INV-KR3
    type: conservation
    statement: "With ω_i = 0 the Kuramoto coupling potential V is non-increasing along midpoint (RK2) trajectories: max dV/dt ≤ 1e-9. The phase-locked state is a Lyapunov-stable energy minimum when frequency heterogeneity is removed."
    test_type: conservation
    parameters:
      potential: "V = −Σ_{i<j} A_ij cos(θ_i − θ_j) — the gradient potential whose −∇V is the identical-frequency Kuramoto flow"
      tolerance: "max dV/dt ≤ 1e-9 — midpoint-integrator discretisation floor, not a tunable knob"
    falsification: "A run with ω_i = 0 shows dV/dt > 1e-9 at any midpoint step, i.e. the coupling potential increases along the gradient flow."
    priority: P0
    provenance: ANCHORED
    source: core/kuramoto/kuramoto_ricci_engine.py
    tests: tests/unit/physics/test_T1_kuramoto_ricci_boundary.py
    references:
      - "Strogatz, S. H. (2000). From Kuramoto to Crawford. Physica D 143, 1–20."
    related: [INV-KR1]

law_t2_lyapunov_full_spectrum:
  linear_flow_recovers_eigenvalues:
    id: INV-LY1
    type: algebraic
    statement: "For a linear flow ẋ = A x the Benettin QR spectrum recovers the real parts of the eigenvalues: sort_desc(spectrum) == sort_desc(Re(eigvals(A))) to 1e-3 at T = 50. The variational estimator reduces to spectral theory on its exactly-solvable limit."
    test_type: property_test
    falsification: "sort_desc(spectrum) deviates from sort_desc(Re(eigvals(A))) by more than 1e-3 for a linear flow integrated to T = 50."
    priority: P0
    provenance: ANCHORED
    source: core/physics/lyapunov_spectrum.py
    tests: tests/unit/physics/test_T2_lyapunov_full_spectrum.py
    references:
      - "Benettin, G., Galgani, L., Giorgilli, A. & Strelcyn, J.-M. (1980). Lyapunov characteristic exponents for smooth dynamical systems; a method for computing all of them. Meccanica 15, 9–30."
    related: [INV-LY2, INV-LY3, INV-LY4, INV-KR2]

  hamiltonian_sum_zero_when_resolved:
    id: INV-LY2
    type: conditional
    statement: "RESOLVED Hamiltonian flow ⇒ Σ λ_k = 0 to 1e-3 (harmonic oscillator, ≈16 periods, ω·dt ≲ 0.05). NOT universal: the tangent integrator is non-symplectic, so the Σλ error grows as O((ω·dt)⁴) (measured slope 3.998); the conservation bound holds ONLY when the fastest mode is time-resolved. Corrected from false-universal 2026-06 (cf. INV-RC3 #1023)."
    test_type: property_test
    parameters:
      resolution_condition: "ω·dt ≲ 0.05 — fastest-mode time-resolution precondition; outside it the non-symplectic tangent flow breaks the sum rule as O((ω·dt)⁴)"
    falsification: "A time-resolved Hamiltonian flow yields |Σ λ_k| > 1e-3, OR the breakdown of the sum away from resolution does not scale as the fourth power of ω·dt."
    priority: P0
    provenance: ANCHORED
    source: core/physics/lyapunov_spectrum.py
    tests: tests/unit/physics/test_T2_lyapunov_full_spectrum.py
    references:
      - "Benettin, G., Galgani, L., Giorgilli, A. & Strelcyn, J.-M. (1980). Lyapunov characteristic exponents for smooth dynamical systems. Meccanica 15, 9–30."
      - "Sandri, M. (1996). Numerical calculation of Lyapunov exponents. Mathematica J. 6, 78–84."
    related: [INV-LY1, INV-RC3]

  fail_closed_contract:
    id: INV-LY3
    type: universal
    statement: "Every contract violation (dt ≤ 0, n_steps ≤ 0, qr_every ∤ n_steps, n_exp ∉ [1, n], non-1-D x0) raises ValueError. Fail-closed; no silent repair of an ill-posed spectrum request."
    test_type: property_test
    falsification: "Any of the enumerated contract violations returns a spectrum (or a repaired result) instead of raising ValueError."
    priority: P0
    provenance: ANCHORED
    source: core/physics/lyapunov_spectrum.py
    tests: tests/unit/physics/test_T2_lyapunov_full_spectrum.py
    references:
      - "Benettin, G., Galgani, L., Giorgilli, A. & Strelcyn, J.-M. (1980). Lyapunov characteristic exponents for smooth dynamical systems. Meccanica 15, 9–30."
    related: [INV-LY4]

  qr_conditioning_fail_closed:
    id: INV-LY4
    type: universal
    statement: "QR conditioning is fail-closed. If at ANY reorthonormalisation step the tangent frame loses orthonormality (max|QᵀQ − I| > _ORTHO_TOL ≈ 1e6·eps_f64) or a direction collapses below float64 relative resolution (min|R_kk| / max|R_kk| ≤ eps_f64), or either metric is non-finite, the run raises FloatingPointError(INV-LY4) instead of flooring |R_kk| with 1e-30 and returning a ≈ −69-bit garbage exponent. Both thresholds are tied to float64, not tunable. Orthonormal Q is the Benettin (1980) precondition; well-conditioned systems are byte-unchanged."
    test_type: property_test
    parameters:
      ortho_tol: "_ORTHO_TOL ≈ 1e6·numpy.finfo(float64).eps — orthonormality residual ceiling on max|QᵀQ − I|"
      rdiag_floor: "_RDIAG_REL_FLOOR = numpy.finfo(float64).eps — minimum admissible min|R_kk|/max|R_kk| before rank collapse"
    falsification: "A rank-collapsing or blow-up-dt run returns a floored finite spectrum instead of raising FloatingPointError tagged INV-LY4, OR a well-conditioned run's accumulated log is altered by the guard."
    priority: P0
    provenance: ANCHORED
    source: core/physics/lyapunov_spectrum.py
    tests: tests/unit/physics/test_T2_lyapunov_full_spectrum.py
    references:
      - "Benettin, G., Galgani, L., Giorgilli, A. & Strelcyn, J.-M. (1980). Lyapunov characteristic exponents for smooth dynamical systems. Meccanica 15, 9–30."
      - "IEEE 754-2019 — IEEE Standard for Floating-Point Arithmetic."
    related: [INV-LY1, INV-LY3]

law_t3_coupling_calibration:
  feasible_target_residual:
    id: INV-CAL1
    type: algebraic
    statement: "A feasible target λ_1 ⇒ residual ≤ tolerance (default 5e-2). On the round-trip (synthesise λ from K_truth via Law T2, calibrate K back via SciPy bounded Brent) the calibrator recovers λ to ≤ 1e-12 — limited only by SciPy xatol and the T2 estimator finite-T noise."
    test_type: property_test
    parameters:
      objective: "minimise |λ_1(K·A; ω) − target|² on a bounded interval (K_min, K_max) with Brent's derivative-free method"
      tolerance: "default residual tolerance 5e-2; round-trip recovery ≤ 1e-12"
    falsification: "A feasible target reports CONVERGED with residual > tolerance, OR the K_truth→λ→K* round-trip recovers λ to worse than 1e-12 on the documented synthetic input."
    priority: P0
    provenance: ANCHORED
    source: core/kuramoto/lyapunov_calibration.py
    tests: tests/unit/physics/test_T3_lyapunov_calibration.py
    references:
      - "Brent, R. P. (1973). Algorithms for Minimization Without Derivatives. Prentice-Hall."
      - "Pyragas, K. (1992). Continuous control of chaos by self-controlling feedback. Phys. Lett. A 170, 421–428."
    related: [INV-CAL2, INV-CAL3, INV-LY1]

  infeasible_target_status:
    id: INV-CAL2
    type: conditional
    statement: "An infeasible target ⇒ status INFEASIBLE, never a silent best-effort. Tested: target λ = 5.0 (physically out of reach for N = 6 supercritical Kuramoto) correctly reports INFEASIBLE rather than returning a spurious K*."
    test_type: property_test
    falsification: "A target known to be out of reach returns status CONVERGED with a fabricated K* instead of INFEASIBLE."
    priority: P0
    provenance: ANCHORED
    source: core/kuramoto/lyapunov_calibration.py
    tests: tests/unit/physics/test_T3_lyapunov_calibration.py
    references:
      - "Brent, R. P. (1973). Algorithms for Minimization Without Derivatives. Prentice-Hall."
    related: [INV-CAL1]

  positivity_hard_bound:
    id: INV-CAL3
    type: universal
    statement: "K* > 0 always — positivity is a hard search bound (K_min > 0 enforced), never a soft penalty. Every contract violation (NaN/inf target, K_min ≤ 0, K_max ≤ K_min, tolerance ≤ 0, max_iter ≤ 0, signed adjacency, shape mismatch) raises ValueError; fail-closed."
    test_type: property_test
    falsification: "The calibrator returns K* ≤ 0, OR admits any enumerated contract violation instead of raising ValueError."
    priority: P0
    provenance: ANCHORED
    source: core/kuramoto/lyapunov_calibration.py
    tests: tests/unit/physics/test_T3_lyapunov_calibration.py
    references:
      - "Brent, R. P. (1973). Algorithms for Minimization Without Derivatives. Prentice-Hall."
    related: [INV-CAL1, INV-CAL2]

law_t5_predictability_landauer:
  lorenz_horizon_formula:
    id: INV-TAU1
    type: algebraic
    statement: "Predictability horizon τ(λ_1) = (1/λ_1)·ln(δ_tol/δ_0) (Lorenz 1969). τ → +∞ when λ_1 ≤ 0 (no exponential divergence), and τ halves under a doubled λ_1 (a twice-as-chaotic system is predictable half as long)."
    test_type: property_test
    parameters:
      formula: "τ = (1/λ_1)·ln(δ_tol/δ_0) — error-doubling horizon for an exponentially separating flow"
    falsification: "τ deviates from (1/λ_1)·ln(δ_tol/δ_0) on analytic inputs, fails to return +∞ for λ_1 ≤ 0, or does not halve when λ_1 is doubled."
    priority: P0
    provenance: ANCHORED
    source: core/physics/predictability_horizon.py
    tests: tests/unit/physics/test_T5_predictability_landauer.py
    references:
      - "Lorenz, E. N. (1969). The predictability of a flow which possesses many scales of motion. Tellus 21, 289–307."
    related: [INV-TAU2, INV-TAU3]

  landauer_energy_floor:
    id: INV-TAU2
    type: conservation
    statement: "Landauer floor E_min = k_B·T·ln(Δ/δ_0) sets the physical energy cost of initialising the state to precision δ_0 over dynamic range Δ (Landauer 1961). An over-budget δ_0 request raises a 'physically unaffordable' ValueError — no silent repair to an affordable precision."
    test_type: conservation
    parameters:
      floor: "E_min = k_B·T·ln(Δ/δ_0) — the per-initialisation Landauer energy budget; this reuses k_B·T·ln 2 as a predictability-horizon budget, distinct from INV-LANDAUER bit-erasure"
    falsification: "A precision request whose E_min exceeds the supplied energy budget is silently honoured instead of raising ValueError, OR the computed floor deviates from k_B·T·ln(Δ/δ_0)."
    priority: P0
    provenance: ANCHORED
