service:
  name: TradePulse Cortex Service
  version: 1.0.0
  description: Cognitive signal orchestration for TradePulse portfolios
  metrics_path: /metrics
  log_level: INFO


database:
  url: postgresql+psycopg://cortex:cortex@cortex-db:5432/cortex
  pool_size: 10
  pool_timeout: 30
  echo: false

signals:
  rescale_min: -1.0
  rescale_max: 1.0
  smoothing_factor: 0.25
  volatility_floor: 1e-6

risk:
  max_absolute_exposure: 2.0
  var_confidence: 0.95
  stress_scenarios:
    - 0.85
    - 0.5

regime:
  decay: 0.2
  min_valence: -1.0
  max_valence: 1.0
  confidence_floor: 0.1
