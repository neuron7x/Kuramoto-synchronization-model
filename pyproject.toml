[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepulse-fhmc"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "torch>=2.1",
    "pandas>=2.0",
    "networkx>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
