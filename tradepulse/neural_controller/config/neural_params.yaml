schema_version: 1

model:
  alpha: 0.1
  beta: 0.05
  gamma: 0.05
  delta: 0.1
  theta: 0.0
  lambd: 0.2
  mu: 0.05
  phi: 0.6
  omega: 0.4
  kappa: 0.1
  psi: 1.0
  eps: 0.7
  eta: 0.2
  M0: 0.8
  prediction_gain: 0.08
