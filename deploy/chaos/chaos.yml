apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: tradepulse-chaos-suite
  namespace: chaos-testing
  labels:
    app.kubernetes.io/name: tradepulse
    app.kubernetes.io/part-of: chaos-validation
  annotations:
    description: "Comprehensive chaos engineering test suite for TradePulse"
spec:
  entry: orchestrate-chaos
  templates:
    - name: orchestrate-chaos
      templateType: Serial
      children:
        - inject-latency
        - disrupt-matching-nodes
        - verify-observability
        - network-partition
        - pod-failure
        - cpu-stress
        - final-verification

    # Network latency injection
    - name: inject-latency
      templateType: Task
      deadline: 5m
      task:
        container:
          name: latency
          image: ghcr.io/chaos-mesh/chaosctl:latest
          command:
            - chaosctl
            - network
            - delay
          args:
            - '--namespace=execution'
            - '--selector=app=execution-gateway'
            - '--latency=250ms'
            - '--jitter=50ms'
            - '--duration=5m'

    # Pod disruption to test resilience
    - name: disrupt-matching-nodes
      templateType: Task
      deadline: 10m
      task:
        container:
          name: disruption
          image: ghcr.io/chaos-mesh/chaosctl:latest
          command:
            - chaosctl
            - pod
            - kill
          args:
            - '--namespace=backtest'
            - '--selector=component=matching-engine'
            - '--percent=30'
            - '--grace-period=10s'
            - '--duration=10m'

    # Network partition simulation
    - name: network-partition
      templateType: Task
      deadline: 3m
      task:
        container:
          name: partition
          image: ghcr.io/chaos-mesh/chaosctl:latest
          command:
            - chaosctl
            - network
            - partition
          args:
            - '--namespace=tradepulse-staging'
            - '--selector=app.kubernetes.io/name=tradepulse-api'
            - '--target-selector=app=timescaledb'
            - '--duration=2m'

    # Random pod failure
    - name: pod-failure
      templateType: Task
      deadline: 5m
      task:
        container:
          name: pod-kill
          image: ghcr.io/chaos-mesh/chaosctl:latest
          command:
            - chaosctl
            - pod
            - failure
          args:
            - '--namespace=tradepulse-staging'
            - '--selector=app.kubernetes.io/name=tradepulse-api'
            - '--mode=one'
            - '--duration=3m'

    # CPU stress test
    - name: cpu-stress
      templateType: Task
      deadline: 4m
      task:
        container:
          name: cpu-stress
          image: ghcr.io/chaos-mesh/chaosctl:latest
          command:
            - chaosctl
            - stress
            - cpu
          args:
            - '--namespace=tradepulse-staging'
            - '--selector=app.kubernetes.io/name=tradepulse-api'
            - '--workers=2'
            - '--load=80'
            - '--duration=3m'

    # Verify observability metrics
    - name: verify-observability
      templateType: Task
      deadline: 15m
      task:
        container:
          name: observability
          image: ghcr.io/chaos-mesh/chaosctl:latest
          command:
            - chaosctl
            - metrics
            - assert
          args:
            - '--namespace=observability'
            - '--selector=component=otel-collector'
            - '--metric=drawdown_pct'
            - '--lte=0.02'
            - '--window=15m'
            - '--labels=experiment=tradepulse-chaos'

    # Final verification after all chaos
    - name: final-verification
      templateType: Task
      deadline: 5m
      task:
        container:
          name: final-check
          image: ghcr.io/chaos-mesh/chaosctl:latest
          command:
            - chaosctl
            - verify
            - health
          args:
            - '--namespace=tradepulse-staging'
            - '--selector=app.kubernetes.io/name=tradepulse-api'
            - '--min-healthy-pods=2'
            - '--timeout=5m'

  historyLimit: 5
  # Conditionally continue on failure for specific scenarios
  conditionalBranches:
    - target: verify-observability
      expression: "tasks.inject-latency.status == 'succeeded'"
