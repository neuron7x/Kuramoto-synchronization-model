apiVersion: v1
kind: Pod
metadata:
  name: "{{ include \"tradepulse.fullname\" . }}-test"
  labels:
    {{- include "tradepulse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.7.1
      args:
        - -f
        - http://{{ include "tradepulse.fullname" . }}:{{ .Values.service.port }}/health
