{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ if .Values.configMap.name }}{{ .Values.configMap.name }}{{ else }}{{ include "tradepulse.fullname" . }}-config{{ end }}
  labels:
    {{- include "tradepulse.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
