{{- if .Values.cacheWarmup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tradepulse.fullname" . }}-cache-warmup
  labels:
    {{- include "tradepulse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ .Values.cacheWarmup.hook | default "post-install,post-upgrade" }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.cacheWarmup.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.cacheWarmup.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "tradepulse.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tradepulse.serviceAccountName" . }}
      restartPolicy: OnFailure
      containers:
        - name: cache-warmup
          image: {{ include "tradepulse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.cacheWarmup.command | nindent 12 }}
          {{- if .Values.cacheWarmup.args }}
          args:
            {{- toYaml .Values.cacheWarmup.args | nindent 12 }}
          {{- end }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
