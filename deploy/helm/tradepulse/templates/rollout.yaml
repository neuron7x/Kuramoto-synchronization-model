{{- if and (eq .Values.controller.kind "rollout") .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "tradepulse.fullname" . }}
  labels:
    {{- include "tradepulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.strategy.revisionHistoryLimit }}
  strategy:
    {{- if .Values.rollout.blueGreen.activeService }}
    blueGreen:
      activeService: {{ .Values.rollout.blueGreen.activeService }}
      previewService: {{ .Values.rollout.blueGreen.previewService | default (printf "%s-preview" (include "tradepulse.fullname" .)) }}
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      autoPromotionSeconds: {{ .Values.rollout.blueGreen.autoPromotionSeconds }}
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
    {{- else }}
    canary:
      canaryService: {{ if .Values.canary.enabled }}{{ include "tradepulse.fullname" . }}-{{ .Values.canary.nameSuffix }}{{ else }}{{ include "tradepulse.fullname" . }}-canary{{ end }}
      stableService: {{ .Values.rollout.trafficRouting.smi.rootService | default (include "tradepulse.fullname" .) }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
      {{- if .Values.rollout.canary.analysis.metrics }}
      analysis:
        interval: {{ .Values.rollout.canary.analysis.interval }}
        maxWeight: {{ .Values.rollout.canary.analysis.maxWeight }}
        metrics:
          {{- toYaml .Values.rollout.canary.analysis.metrics | nindent 10 }}
      {{- end }}
      autoPromotionEnabled: {{ .Values.rollout.canary.autoPromotionEnabled }}
      autoPromotionSeconds: {{ .Values.rollout.canary.autoPromotionSeconds }}
      autoPause: {{ .Values.rollout.canary.autoPause }}
      {{- if .Values.rollout.trafficRouting.smi.enabled }}
      trafficRouting:
        smi:
          rootService: {{ .Values.rollout.trafficRouting.smi.rootService | default (include "tradepulse.fullname" .) }}
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "tradepulse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tradepulse.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tradepulse.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken | default false }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- toYaml .Values.initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: tradepulse
          image: {{ include "tradepulse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- else }}
          command:
            - python
            - -m
            - nfpro
            - --mode
            - paper
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if and .Values.metricsService.enabled (ne .Values.metricsService.port .Values.service.port) }}
            - name: metrics
              containerPort: {{ .Values.metricsService.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- if or .Values.secretRefs .Values.extraEnvFrom }}
          envFrom:
            {{- range .Values.secretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.extraEnvFrom }}
            - {{ toYaml . | nindent 12 | trim }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.extraVolumes }}
      volumes:
        {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
{{- end }}
