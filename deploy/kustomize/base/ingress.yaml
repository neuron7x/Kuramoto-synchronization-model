apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradepulse-api
  labels:
    app.kubernetes.io/name: tradepulse-api
    app.kubernetes.io/part-of: tradepulse
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # CORS (adjust as needed)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    # SECURITY: Restrict to your domains in production
    # nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.tradepulse.example.com"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    
    # Client certificate authentication (mTLS)
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"
    nginx.ingress.kubernetes.io/auth-tls-secret: "tradepulse-staging/tradepulse-mtls-client"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    
    # Request body size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Certificate Manager (cert-manager.io)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.tradepulse.example.com
      secretName: tradepulse-api-tls
  rules:
    - host: api.tradepulse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tradepulse-api
                port:
                  name: http
