apiVersion: v1
kind: ResourceQuota
metadata:
  name: tradepulse-compute-resources
  labels:
    app.kubernetes.io/part-of: tradepulse
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "48"
    limits.memory: 96Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tradepulse-object-counts
  labels:
    app.kubernetes.io/part-of: tradepulse
spec:
  hard:
    pods: "50"
    services: "20"
    configmaps: "30"
    secrets: "30"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tradepulse-limit-range
  labels:
    app.kubernetes.io/part-of: tradepulse
spec:
  limits:
    # Container defaults
    - type: Container
      default:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 750m
        memory: 1Gi
      max:
        cpu: "8"
        memory: 8Gi
      min:
        cpu: 100m
        memory: 128Mi
    # Pod limits
    - type: Pod
      max:
        cpu: "16"
        memory: 32Gi
      min:
        cpu: 100m
        memory: 128Mi
    # PVC limits
    - type: PersistentVolumeClaim
      max:
        storage: 1Ti
      min:
        storage: 1Gi
