apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradepulse-api
  annotations:
    # Production rate limits (strict)
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    
    # Production WAF
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    
    # Stricter TLS
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
spec:
  tls:
    - hosts:
        - api.tradepulse.example.com
      secretName: tradepulse-api-production-tls
  rules:
    - host: api.tradepulse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tradepulse-api
                port:
                  name: http
