igs:
  window: 600
  n_states: 7
  min_counts: 50
  eps: 1e-12
  normalize_flux: true
  detrend: false
  quantize_mode: "zscore"
  perm_emb_dim: 5
  perm_tau: 1
  adapt_method: "off"
  k_min: 5
  k_max: 15
  adapt_threshold: 0.10
  adapt_persist: 3
  adapt_cooldown: 50
  adapt_step: 1
  instrument_label: null
  prometheus_enabled: false
  prometheus_async: true
  max_update_ms: 0.0
  pi_method: "empirical"
  regime_weights: [1.0, 1.0, 1.0]
  signal_epr_q: 0.7
  signal_flux_min: 0.0

signal:
  epr_q: 0.7
  flux_q: 0.0
  regime_threshold: 0.45
