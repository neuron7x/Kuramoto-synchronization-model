version: 1
disable_existing_loggers: false

formatters:
  default:
    format: '%(asctime)s %(levelname)s %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  tradepulse_qlw:
    level: DEBUG
    handlers: [console]
    propagate: false
