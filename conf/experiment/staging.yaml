# SPDX-License-Identifier: MIT
# Staging deployment Hydra profile.

defaults:
  - base

name: staging
db_uri: "postgresql://staging:${STAGING_DB_PASSWORD:-secure}@host/staging?sslmode=verify-full"
db_tls:
  ca_file: ${STAGING_DB_CA_FILE:-/etc/tradepulse/db/root-ca.pem}
  cert_file: ${STAGING_DB_CERT_FILE:-/etc/tradepulse/db/client.crt}
  key_file: ${STAGING_DB_KEY_FILE:-/etc/tradepulse/db/client.key}
log_level: INFO
random_seed: 2024

data:
  price_csv: /mnt/staging_data/prices.csv

tracking:
  base_dir: /mnt/staging_runs
