version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradepulse} -d ${POSTGRES_DB:-tradepulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
  tradepulse:
    build: .
    ports:
      - "${TRADEPULSE_HTTP_PORT:-8000}:${TRADEPULSE_HTTP_PORT:-8000}"
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse}
      TRADEPULSE_ENV: ${TRADEPULSE_ENV:-development}
      TRADEPULSE_HTTP_PORT: ${TRADEPULSE_HTTP_PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; port = os.environ.get('TRADEPULSE_HTTP_PORT', '8000'); urllib.request.urlopen(f'http://localhost:{port}/health', timeout=5.0)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    labels:
      - "co.elastic.logs/enabled=true"
      - "co.elastic.logs/module=tradepulse"
    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started
      logstash:
        condition: service_started
  prometheus:
    image: prom/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    environment:
      - xpack.monitoring.enabled=false
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    user: root
    command: ["filebeat", "-e", "-strict.perms=false", "-c", "/usr/share/filebeat/filebeat.yml"]
    volumes:
      - ./observability/logging/filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

volumes:
  elasticsearch-data:
  postgres-data:
