version: '3.9'
services:
  tradepulse:
    build: .
    env_file:
      - .env
    environment:
      TRADEPULSE_AUDIT_SECRET: ${TRADEPULSE_AUDIT_SECRET?tradepulse audit secret must be set}
      TRADEPULSE_RBAC_AUDIT_SECRET: ${TRADEPULSE_RBAC_AUDIT_SECRET?tradepulse RBAC audit secret must be set}
      TRADEPULSE_API_SERVER_TLS__CERT_FILE: /app/tls/tradepulse-server.pem
      TRADEPULSE_API_SERVER_TLS__KEY_FILE: /app/tls/tradepulse-server.key.pem
      TRADEPULSE_API_SERVER_TLS__CLIENT_CA_FILE: /app/tls/root-ca.pem
      TRADEPULSE_API_SERVER_TLS__REQUIRE_CLIENT_CERTIFICATE: "false"
      TRADEPULSE_MTLS_TRUSTED_CA_PATH: /app/tls/root-ca.pem
    ports:
      - "${TRADEPULSE_HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - ./configs/tls/dev:/app/tls:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl, urllib.request; ctx = ssl.create_default_context(cafile='/app/tls/root-ca.pem'); urllib.request.urlopen('https://localhost:8000/health', timeout=5.0, context=ctx)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "co.elastic.logs/enabled=true"
      - "co.elastic.logs/module=tradepulse"
    depends_on:
      - prometheus
      - logstash
  prometheus:
    image: prom/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${TRADEPULSE_PROMETHEUS_PORT:-9090}:9090"
  cortex:
    build:
      context: .
      dockerfile: cortex_service/Dockerfile
    environment:
      CORTEX__DATABASE__URL: postgresql+psycopg://cortex@cortex-db:5432/cortex?sslmode=verify-full
      CORTEX__SERVICE__LOG_LEVEL: INFO
      CORTEX__SERVICE__TLS__CERT_FILE: /service/tls/cortex-server.pem
      CORTEX__SERVICE__TLS__KEY_FILE: /service/tls/cortex-server.key.pem
      CORTEX__SERVICE__TLS__CLIENT_CA_FILE: /service/tls/root-ca.pem
      CORTEX__SERVICE__TLS__REQUIRE_CLIENT_CERTIFICATE: "false"
      CORTEX__DATABASE__TLS__CA_FILE: /service/tls/root-ca.pem
      CORTEX__DATABASE__TLS__CERT_FILE: /service/tls/cortex-db-client.pem
      CORTEX__DATABASE__TLS__KEY_FILE: /service/tls/cortex-db-client.key.pem
    volumes:
      - ./cortex_service/config/service.yaml:/service/cortex_service/config/service.yaml:ro
      - ./configs/tls/dev:/service/tls:ro
    ports:
      - "${TRADEPULSE_CORTEX_PORT:-8001}:8001"
    depends_on:
      cortex-db:
        condition: service_healthy
  cortex-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
    ports:
      - "${TRADEPULSE_CORTEX_DB_PORT:-5433}:5432"
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cortex-db-data:/var/lib/postgresql/data
      - ./configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./configs/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/tls/dev:/etc/postgresql/tls:ro
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${TRADEPULSE_ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    environment:
      - xpack.monitoring.enabled=false
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "${TRADEPULSE_LOGSTASH_PORT:-5044}:5044"
    depends_on:
      - elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${TRADEPULSE_KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    user: root
    command: ["filebeat", "-e", "-strict.perms=false", "-c", "/usr/share/filebeat/filebeat.yml"]
    volumes:
      - ./observability/logging/filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

  # UI Service - Next.js Frontend
  tradepulse-ui:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://tradepulse:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://tradepulse:8000/ws}
      NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-info}
    ports:
      - "${TRADEPULSE_UI_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "co.elastic.logs/enabled=true"
      - "co.elastic.logs/module=tradepulse-ui"
    depends_on:
      tradepulse:
        condition: service_healthy
    networks:
      - default

volumes:
  elasticsearch-data:
  cortex-db-data:
