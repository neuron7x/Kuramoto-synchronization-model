  - id: manifold.causal_cutoff
    module: manifold
    statement: "Information never propagates faster than the data substrate allows: the causal cutoff is at least the latency floor, and no source event used to build a snapshot lies in its future."
    formula: "causal_cutoff_seconds ≥ latency_floor_seconds ≥ 0 ∧ ∀ t_event: t_event ≤ timestamp_end"
    variables:
      latency_floor_seconds: "lower bound on information arrival imposed by the data substrate"
      causal_cutoff_seconds: "enforced information-causality horizon for the snapshot"
      t_event: "timestamp of a source event consumed by the builder"
    tolerance: "strict — negative latency, cutoff below floor, or look-ahead event raises ValueError"
