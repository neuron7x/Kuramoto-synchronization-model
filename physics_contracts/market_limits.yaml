# GeoSync Market Approximation Limits — the boundary contract for using
# physical / geometric descriptors (Kuramoto, Ricci, topology, thermo) on
# real markets.
#
# This file is the honest counterpart of `catalog.yaml`. Where `catalog.yaml`
# states laws that the *code* must obey (provable in-silico), this file states
# the limits under which those descriptors may be *interpreted* as statements
# about markets at all. Markets are not closed physical systems; a descriptor
# that is mathematically valid on a graph is not thereby a predictive claim
# about price.
#
# These limits do not assert anything new about markets. They constrain what
# the rest of the repository is permitted to assert. Each limit is fail-closed:
# when an `invalid_when` condition holds, any inference built on the descriptor
# stays at most `Instrumented` (see FORBIDDEN_CLAIMS.md vocabulary) and may not
# advance a claim tier.
#
# Schema per entry:
#   limit_id             dotted stable identifier
#   mathematical_object  the geometric/dynamical object being interpreted
#   market_interpretation what the object is *allowed* to describe
#   valid_when           preconditions under which the descriptor is meaningful
#   invalid_when         conditions that void the descriptor's interpretation
#   witness_required     the test/check that must exist to use the descriptor
#   falsifier_required   the named falsifier that can reject the interpretation
#   promotion_relevant   true when an invalid_when on this limit could otherwise
#                        let a real-data claim advance a claim tier. Such a limit
#                        MUST carry an EXECUTABLE falsifier (see below): a named
#                        falsifier is not a falsifier unless it can be run.
#   falsifier_command    a runnable command / pytest node id that EXECUTES the
#                        required falsifier. Locatability/executability is the
#                        contract — the path must resolve and run; it is NOT a
#                        claim that the falsifier already passed on real data.
#   falsifier_artifact_path  alternatively, a path to a frozen result artifact
#                        produced by that falsifier. Either falsifier_command OR
#                        falsifier_artifact_path is required for a
#                        promotion_relevant limit; both is allowed.
#   forbidden_claims     phrasings this limit forbids (research-boundary terms)
#   max_claim_tier_violated  tier ceiling when any invalid_when holds
#
# Fail-closed rule (enforced in tools/research/market_limits.py): loading the
# contract RAISES if any promotion_relevant limit lacks both falsifier_command
# and falsifier_artifact_path. Non-promotion limits keep prior behavior.
---
version: 1
# Allowed claim-tier vocabulary, mirrored from FORBIDDEN_CLAIMS.md so witnesses
# can assert against a single source of truth without re-reading the markdown.
claim_tiers:
  - Not Measured
  - Instrumented
  - Measured-Single
  - Measured-Multi
  - Blocked
  - Not Deployable

limits:
  - limit_id: market.non_conservative
    mathematical_object: "any energy/Lyapunov-style descriptor V(state)"
    market_interpretation: "structural stress proxy only; no conserved quantity exists"
    valid_when:
      - "descriptor is reported as a relative, within-session score"
      - "no claim of energy conservation or closed-form dissipation is attached"
    invalid_when:
      - "descriptor is treated as a conserved or globally comparable quantity"
      - "cross-session levels are compared without re-normalization"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_no_conservation_claim"
    falsifier_required: "multi_session_replay"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_microstructure_replay_capsule.py::test_replay_is_deterministic_and_blocked -q"
    forbidden_claims:
      - "conserved market energy"
      - "closed-form dissipation of market stress"
    max_claim_tier_violated: Instrumented

  - limit_id: market.non_stationary
    mathematical_object: "any estimator fit on a window [t0, t1]"
    market_interpretation: "a descriptor of that window; not a stationary parameter"
    valid_when:
      - "estimate carries its observation window and is re-fit out-of-window"
      - "out-of-sample evaluation uses a later, disjoint window"
    invalid_when:
      - "in-window fit quality is reported as out-of-sample skill"
      - "a single window is generalized to a regime it did not observe"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_window_is_declared"
    falsifier_required: "lag_sweep_no_future_data"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_lookahead_leak_falsifier.py::test_injected_lookahead_leak_is_flagged -q"
    forbidden_claims:
      - "stationary market parameter"
      - "time-invariant predictor"
    max_claim_tier_violated: Instrumented

  - limit_id: market.agent_driven
    mathematical_object: "mean-field / order-parameter aggregate over participants"
    market_interpretation: "ensemble summary; participants adapt and can invert it"
    valid_when:
      - "aggregate is used descriptively, with no assumption of fixed couplings"
      - "reflexivity (signal changes the system it measures) is acknowledged"
    invalid_when:
      - "couplings are assumed constant across a strategy-crowding shift"
      - "the aggregate is back-tested as if participants did not react to it"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_no_fixed_coupling_claim"
    falsifier_required: "permutation_null"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_microstructure_synthetic_falsifier.py::test_permutation_null_fires_on_synthetic_noise -q"
    forbidden_claims:
      - "fixed market coupling constant"
      - "participant-invariant dynamics"
    max_claim_tier_violated: Instrumented

  - limit_id: market.liquidity_discontinuous
    mathematical_object: "depth-level order-book graph and its edge weights"
    market_interpretation: "structural snapshot; depth can vanish between snapshots"
    valid_when:
      - "empty / single-level books are handled explicitly and fail closed"
      - "edge weights derive from observed depth, not interpolated continuity"
    invalid_when:
      - "smoothness of the book is assumed across a liquidity gap"
      - "curvature is computed over a degenerate (empty/one-level) book"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_degenerate_book_fails_closed"
    falsifier_required: "multi_session_replay"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_microstructure_replay_capsule.py::test_replay_is_deterministic_and_blocked -q"
    forbidden_claims:
      - "continuous liquidity surface"
      - "smooth order-book manifold"
    max_claim_tier_violated: Blocked

  - limit_id: market.regime_shock
    mathematical_object: "smooth geometric flow (e.g. Ricci flow) over the graph"
    market_interpretation: "valid only inside a regime; shocks break the smooth assumption"
    valid_when:
      - "flow is restricted to a declared, shock-free observation window"
      - "shock sessions are evaluated as a distinct, separately-reported stratum"
    invalid_when:
      - "a flow result from a calm session is generalized across a shock"
      - "shock and calm sessions are pooled without stratification"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_shock_calm_stratified"
    falsifier_required: "multi_session_replay"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_microstructure_replay_capsule.py::test_replay_is_deterministic_and_blocked -q"
    forbidden_claims:
      - "regime-invariant geometric flow"
      - "shock-robust curvature trajectory"
    # Fail-closed: an invalid shock-regime interpretation (pooled, or a calm
    # result generalized across a shock) must NOT retain a real-data measured
    # tier; it caps at Instrumented like every other invalid interpretation here.
    max_claim_tier_violated: Instrumented

  - limit_id: market.order_flow_open_system
    mathematical_object: "order-flow imbalance / micro-price descriptors"
    market_interpretation: "open-system observable; exogenous flow enters unmodeled"
    valid_when:
      - "exogenous order flow is acknowledged as an unmodeled input"
      - "no closed-system conservation is asserted over the flow"
    invalid_when:
      - "the order-flow process is treated as a closed, self-contained system"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_open_system_acknowledged"
    falsifier_required: "lag_sweep_no_future_data"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_lookahead_leak_falsifier.py::test_injected_lookahead_leak_is_flagged -q"
    forbidden_claims:
      - "closed order-flow system"
      - "conserved order-flow"
    max_claim_tier_violated: Instrumented

  - limit_id: market.correlation_not_causal
    mathematical_object: "correlation / coherence graph over assets or nodes"
    market_interpretation: "association structure; not a causal graph"
    valid_when:
      - "edges are labeled as association, not causal influence"
      - "any causal language is gated behind an explicit identification test"
    invalid_when:
      - "graph edges are read as causal links without an identification strategy"
      - "intervention conclusions are drawn from a correlation graph"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_no_causal_from_correlation"
    falsifier_required: "permutation_null"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_microstructure_synthetic_falsifier.py::test_permutation_null_fires_on_synthetic_noise -q"
    forbidden_claims:
      - "causal market graph from correlation"
      - "proven causal link"
    max_claim_tier_violated: Instrumented

  - limit_id: market.descriptor_not_predictor
    mathematical_object: "Ricci / Kuramoto / topology output as a feature"
    market_interpretation: "structural descriptor; predictive power is a separate, falsifiable claim"
    valid_when:
      - "predictive use is gated behind an out-of-sample null-beating falsifier"
      - "descriptor and predictor claims are reported as distinct tiers"
    invalid_when:
      - "structural output is presented as a predictive guarantee"
      - "a descriptor is promoted past Instrumented without a passed falsifier"
    witness_required: "tests/physics_contracts/test_market_limits.py::test_descriptor_needs_falsifier"
    falsifier_required: "multi_session_replay"
    promotion_relevant: true
    falsifier_command: "python -m pytest tests/research_lines/test_ricci_microstructure_replay_capsule.py::test_replay_is_deterministic_and_blocked -q"
    forbidden_claims:
      - "structural descriptor guarantees price direction"
      - "geometry-implies-prediction"
    max_claim_tier_violated: Instrumented
