name: CI/CD Pipeline Hardening

permissions:
  contents: read
  security-events: write
  id-token: write
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM UTC

concurrency:
  group: ci-hardening-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security-audit:
    name: Workflow Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install actionlint
        run: |
          # Install actionlint for workflow validation
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/

      - name: Lint GitHub Actions workflows
        id: actionlint
        run: |
          echo "Linting GitHub Actions workflows..."

          actionlint -color -verbose .github/workflows/*.yml > actionlint-report.txt 2>&1 || {
            EXITCODE=$?
            cat actionlint-report.txt
            echo "lint_errors=$EXITCODE" >> $GITHUB_OUTPUT
            if [ "$EXITCODE" -ne 0 ]; then
              echo "❌ Workflow linting found issues"
            fi
          }

          if [ ! -f actionlint-report.txt ] || [ ! -s actionlint-report.txt ]; then
            echo "✅ All workflows passed linting"
            echo "lint_errors=0" >> $GITHUB_OUTPUT
          fi

      - name: Check for dangerous workflow patterns
        id: dangerous_patterns
        run: |
          echo "Checking for dangerous workflow patterns..."

          ISSUES_FOUND=0

          # Pattern 1: pull_request_target with code execution
          echo "Checking for unsafe pull_request_target..."
          UNSAFE_TARGET=$(grep -r "pull_request_target:" .github/workflows/ | grep -l "checkout@" | wc -l)
          if [ "$UNSAFE_TARGET" -gt 0 ]; then
            echo "⚠️  Found $UNSAFE_TARGET workflow(s) with potentially unsafe pull_request_target"
            ISSUES_FOUND=$((ISSUES_FOUND + 1))
          fi

          # Pattern 2: Write permissions on pull requests
          echo "Checking for excessive permissions on PRs..."
          EXCESSIVE_PERMS=$(grep -A 5 "pull_request:" .github/workflows/*.yml | grep -E "permissions:.*write" | wc -l)
          if [ "$EXCESSIVE_PERMS" -gt 5 ]; then
            echo "⚠️  Multiple workflows have write permissions on PRs"
            ISSUES_FOUND=$((ISSUES_FOUND + 1))
          fi

          # Pattern 3: Script injection via github context
          echo "Checking for potential script injection..."
          SCRIPT_INJECTION=$(grep -r '\${{ github\.event\.' .github/workflows/ | grep -v "github.event.pull_request.number" | wc -l)
          if [ "$SCRIPT_INJECTION" -gt 0 ]; then
            echo "⚠️  Found $SCRIPT_INJECTION potential script injection points"
            ISSUES_FOUND=$((ISSUES_FOUND + 1))
          fi

          # Pattern 4: Secrets in workflow files
          echo "Checking for hardcoded secrets..."
          HARDCODED_SECRETS=$(grep -rE '(password|token|key).*:.*[a-zA-Z0-9]{20,}' .github/workflows/ | wc -l)
          if [ "$HARDCODED_SECRETS" -gt 0 ]; then
            echo "❌ Found potential hardcoded secrets"
            ISSUES_FOUND=$((ISSUES_FOUND + 10))  # Critical
          fi

          echo "dangerous_patterns=$ISSUES_FOUND" >> $GITHUB_OUTPUT

          if [ "$ISSUES_FOUND" -gt 0 ]; then
            echo "⚠️  Found $ISSUES_FOUND security concerns in workflows"
          else
            echo "✅ No dangerous patterns detected"
          fi

      - name: Verify action pinning
        id: action_pinning
        run: |
          echo "Verifying GitHub Actions are pinned to SHA..."

          UNPINNED_ACTIONS=0

          for workflow in .github/workflows/*.yml; do
            # Check for unpinned actions (using tags instead of SHA)
            UNPINNED=$(grep -E "uses:.*@v[0-9]" "$workflow" | wc -l)
            UNPINNED_ACTIONS=$((UNPINNED_ACTIONS + UNPINNED))
          done

          echo "unpinned_actions=$UNPINNED_ACTIONS" >> $GITHUB_OUTPUT

          if [ "$UNPINNED_ACTIONS" -gt 0 ]; then
            echo "⚠️  Found $UNPINNED_ACTIONS unpinned actions"
            echo "Recommendation: Pin actions to full SHA for security"
            echo "Example: uses: actions/checkout@v5 -> uses: actions/checkout@<sha256>"
          else
            echo "✅ All actions properly pinned"
          fi

      - name: Check workflow permissions
        id: permissions_check
        run: |
          echo "Auditing workflow permissions..."

          MISSING_PERMS=0
          OVERLY_PERMISSIVE=0

          for workflow in .github/workflows/*.yml; do
            # Check if permissions are defined
            if ! grep -q "^permissions:" "$workflow"; then
              echo "⚠️  $workflow: Missing explicit permissions (will default to all)"
              MISSING_PERMS=$((MISSING_PERMS + 1))
            fi

            # Check for overly permissive workflows
            if grep -q "permissions:.*write-all" "$workflow" || grep -q "permissions: write-all" "$workflow"; then
              echo "❌ $workflow: Using write-all permissions"
              OVERLY_PERMISSIVE=$((OVERLY_PERMISSIVE + 1))
            fi
          done

          echo "missing_perms=$MISSING_PERMS" >> $GITHUB_OUTPUT
          echo "overly_permissive=$OVERLY_PERMISSIVE" >> $GITHUB_OUTPUT

          if [ "$MISSING_PERMS" -gt 0 ] || [ "$OVERLY_PERMISSIVE" -gt 0 ]; then
            echo "⚠️  Permission issues found"
          else
            echo "✅ All workflows have appropriate permissions"
          fi

      - name: Validate OIDC token usage
        id: oidc_check
        run: |
          echo "Checking for OIDC token usage (AWS, Azure, GCP)..."

          OIDC_ENABLED=false

          # Check for OIDC token permission
          if grep -r "id-token: write" .github/workflows/ > /dev/null; then
            OIDC_ENABLED=true
            echo "✅ OIDC tokens are enabled"
          else
            echo "ℹ️  OIDC tokens not currently used"
          fi

          # Check for long-lived credentials (security risk)
          if grep -rE "AWS_ACCESS_KEY_ID|AZURE_CREDENTIALS" .github/workflows/ > /dev/null; then
            echo "⚠️  Found long-lived credentials - consider using OIDC instead"
            echo "has_long_lived_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_long_lived_creds=false" >> $GITHUB_OUTPUT
          fi

          echo "oidc_enabled=$OIDC_ENABLED" >> $GITHUB_OUTPUT

      - name: Generate hardening report
        run: |
          cat > ci-hardening-report.md <<EOF
          # CI/CD Pipeline Security Hardening Report

          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Repository: ${{ github.repository }}

          ## Summary

          | Category | Status | Count |
          |----------|--------|-------|
          | Lint Errors | ${{ steps.actionlint.outputs.lint_errors == '0' && '✅' || '❌' }} | ${{ steps.actionlint.outputs.lint_errors || '0' }} |
          | Dangerous Patterns | ${{ steps.dangerous_patterns.outputs.dangerous_patterns == '0' && '✅' || '⚠️' }} | ${{ steps.dangerous_patterns.outputs.dangerous_patterns || '0' }} |
          | Unpinned Actions | ${{ steps.action_pinning.outputs.unpinned_actions == '0' && '✅' || '⚠️' }} | ${{ steps.action_pinning.outputs.unpinned_actions || '0' }} |
          | Missing Permissions | ${{ steps.permissions_check.outputs.missing_perms == '0' && '✅' || '⚠️' }} | ${{ steps.permissions_check.outputs.missing_perms || '0' }} |
          | Overly Permissive | ${{ steps.permissions_check.outputs.overly_permissive == '0' && '✅' || '❌' }} | ${{ steps.permissions_check.outputs.overly_permissive || '0' }} |

          ## Recommendations

          ### High Priority
          - Pin all GitHub Actions to full commit SHA (not tags)
          - Use minimal permissions for each workflow
          - Avoid \`pull_request_target\` with code execution
          - Use OIDC tokens instead of long-lived credentials

          ### Best Practices
          - Use \`permissions: read-all\` or more restrictive by default
          - Grant write permissions only when necessary
          - Use environment protection rules for production deployments
          - Implement branch protection with required status checks
          - Enable security alerts and dependency scanning

          ## OIDC Status
          - **OIDC Enabled:** ${{ steps.oidc_check.outputs.oidc_enabled }}
          - **Long-lived Credentials:** ${{ steps.oidc_check.outputs.has_long_lived_creds }}

          ## Next Steps
          1. Review and address any failing checks
          2. Update unpinned actions to use commit SHAs
          3. Add explicit permissions to all workflows
          4. Consider enabling OIDC for cloud provider authentication
          5. Regular security audits of workflows (weekly recommended)
          EOF

          cat ci-hardening-report.md

      - name: Upload hardening report
        uses: actions/upload-artifact@v6
        with:
          name: ci-hardening-report
          path: |
            ci-hardening-report.md
            actionlint-report.txt
          if-no-files-found: warn

      - name: Post hardening summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const lintErrors = parseInt('${{ steps.actionlint.outputs.lint_errors }}' || '0');
            const dangerousPatterns = parseInt('${{ steps.dangerous_patterns.outputs.dangerous_patterns }}' || '0');
            const unpinnedActions = parseInt('${{ steps.action_pinning.outputs.unpinned_actions }}' || '0');
            const missingPerms = parseInt('${{ steps.permissions_check.outputs.missing_perms }}' || '0');
            const overlyPermissive = parseInt('${{ steps.permissions_check.outputs.overly_permissive }}' || '0');

            const totalIssues = lintErrors + dangerousPatterns + overlyPermissive;
            const emoji = totalIssues === 0 ? '✅' : totalIssues < 5 ? '⚠️' : '❌';

            let report = '';
            try {
              report = fs.readFileSync('ci-hardening-report.md', 'utf8');
            } catch (error) {
              console.log('Could not read hardening report');
            }

            const body = [
              `## ${emoji} CI/CD Pipeline Security Hardening`,
              '',
              '### Security Audit Results',
              '',
              '| Check | Status | Issues |',
              '|-------|--------|--------|',
              `| Workflow Linting | ${lintErrors === 0 ? '✅' : '❌'} | ${lintErrors} |`,
              `| Dangerous Patterns | ${dangerousPatterns === 0 ? '✅' : '⚠️'} | ${dangerousPatterns} |`,
              `| Unpinned Actions | ${unpinnedActions === 0 ? '✅' : '⚠️'} | ${unpinnedActions} |`,
              `| Missing Permissions | ${missingPerms === 0 ? '✅' : '⚠️'} | ${missingPerms} |`,
              `| Overly Permissive | ${overlyPermissive === 0 ? '✅' : '❌'} | ${overlyPermissive} |`,
              '',
              totalIssues === 0
                ? '✅ **All workflow security checks passed**'
                : `⚠️  **Found ${totalIssues} security issues in workflows**`,
              '',
              '<details>',
              '<summary>📋 Full Hardening Report</summary>',
              '',
              '```markdown',
              report,
              '```',
              '',
              '</details>',
              '',
              '---',
              `*Last updated: ${new Date().toISOString()}*`
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('CI/CD Pipeline Security Hardening')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }

      - name: Fail on critical issues
        if: steps.permissions_check.outputs.overly_permissive != '0' || steps.dangerous_patterns.outputs.dangerous_patterns != '0'
        run: |
          echo "❌ Critical security issues found in workflows"
          echo "Please address overly permissive workflows and dangerous patterns"
          exit 1
