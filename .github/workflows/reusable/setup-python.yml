name: Setup Python Environment (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      install-dev-deps:
        description: 'Install dev dependencies'
        required: false
        type: boolean
        default: false
      use-constraints:
        description: 'Use security constraints'
        required: false
        type: boolean
        default: true
      cache-key-suffix:
        description: 'Additional cache key suffix for uniqueness'
        required: false
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'constraints/security.txt') }}-${{ inputs.cache-key-suffix }}
          restore-keys: |
            pip-${{ runner.os }}-${{ inputs.python-version }}-
            pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          if [ "${{ inputs.use-constraints }}" == "true" ]; then
            CONSTRAINT_FLAG="-c constraints/security.txt"
          else
            CONSTRAINT_FLAG=""
          fi
          
          if [ -f requirements.txt ]; then
            pip install $CONSTRAINT_FLAG -r requirements.txt
          fi
          
          if [ "${{ inputs.install-dev-deps }}" == "true" ] && [ -f requirements-dev.txt ]; then
            pip install $CONSTRAINT_FLAG -r requirements-dev.txt
          fi

      - name: Display installed packages
        run: pip list
