name: nak-controller-ci

on:
  push:
    paths:
      - 'nak_controller/**'
      - 'pyproject.toml'
      - 'mypy.ini'
      - '.github/workflows/nak-controller-ci.yml'
    branches: [ main, develop, 'feat/**', 'fix/**' ]
  pull_request:
    paths:
      - 'nak_controller/**'
      - 'pyproject.toml'
      - 'mypy.ini'
      - '.github/workflows/nak-controller-ci.yml'
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest mypy
      - name: Lint & types
        run: |
          mypy nak_controller
      - name: Tests
        run: |
          pytest -q nak_controller/tests/test_nak.py
