name: nak-ci

on:
  push:
    branches: [ main, develop, "feat/**", "fix/**" ]
    paths:
      - 'nak_controller/**'
      - '.github/workflows/nak-controller-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'nak_controller/**'
      - '.github/workflows/nak-controller-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest mypy ruff pytest-cov
      - name: Ruff lint
        run: ruff check .
      - name: Mypy (baseline)
        run: mypy nak_controller
      - name: Mypy (strict)
        run: mypy --strict nak_controller
      - name: Unit tests (focused)
        run: pytest nak_controller/tests/test_nak.py --maxfail=1 --disable-warnings -q
      - name: Tests + Coverage
        run: pytest -q --cov=nak_controller --cov-report=xml nak_controller/tests
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
