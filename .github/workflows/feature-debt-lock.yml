name: Feature-Debt Lock

# Fail-closed on new features that ignore the coverage deficit (TD-023). A PR that
# adds new production feature code to a tracked surface must also add tests for a
# deficit surface (backtest/, analytics/) or declare an audited 'Debt-Exempt:'
# trailer. This is the process-level realisation of the system's Fail-Closed
# philosophy. Promote to an ABSOLUTE block by adding this check to the branch
# protection required-checks once the in-flight backlog has cleared.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

jobs:
  feature-debt-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: New features must pay down the coverage deficit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          PYTHONPATH=. python scripts/ci/check_feature_debt_lock.py \
            --base-ref "origin/$BASE_REF"
      - name: Reproduce offline execution-forensics contract (standard library)
        run: |
          set -euo pipefail
          python -m tools.execution_forensics \
            --fills examples/execution_forensics/fills_sample.csv \
            --out "$RUNNER_TEMP/geosync-forensics-smoke.json"
          python -m tools.execution_forensics \
            --fills examples/execution_forensics/fills_sample.csv \
            --verify "$RUNNER_TEMP/geosync-forensics-smoke.json"
          python - <<'PY'
          from pathlib import Path
          from tools.execution_forensics import analyze
          report = analyze(Path("examples/execution_forensics/fills_sample.csv"))
          row = report["groups"][0]
          assert row["fee_quote_total"] == "0.9"
          assert row["arrival_slippage_quote"] == "5"
          assert row["execution_shortfall_plus_fees_quote"] == "5.9"
          assert report["portfolio_pnl_quote"] is None
          assert report["funding_quote"] is None
          print("Forensics sample financial invariants: PASS")
          PY
      - name: Run isolated forensics adversarial tests (no GeoSync runtime deps)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.0.3'
          python -m pytest --noconftest -c /dev/null -p no:cacheprovider -q \
            tests/unit/test_execution_forensics.py \
            tests/tools/test_execution_forensics_gate.py
      - name: Check isolated forensics style and strict types
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'ruff==0.17.2' 'black==26.3.1' 'mypy==1.20.0'
          python -m ruff check \
            tools/execution_forensics.py \
            tests/unit/test_execution_forensics.py \
            tests/tools/test_execution_forensics_gate.py
          python -m black --check \
            tools/execution_forensics.py \
            tests/unit/test_execution_forensics.py \
            tests/tools/test_execution_forensics_gate.py
          python -m mypy --strict --config-file=/dev/null \
            tools/execution_forensics.py
