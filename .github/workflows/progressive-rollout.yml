name: Progressive Rollout

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: production
        options:
          - staging
          - production
      active_color:
        description: "Currently serving color (blue or green)"
        required: false
        default: blue
      image_tag:
        description: "Container image tag to deploy"
        required: true
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/progressive-rollout.yml'

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: progressive-rollout-${{ github.ref }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

env:
  SERVICE_NAME: tradepulse-api
  FEATURE_FLAG_KEY: tradepulse.dynamicRollout
  PROMETHEUS_QUERY_DROPPED_ORDERS: sum(rate(tradepulse_orders_dropped_total[5m]))
  DEPLOY_TIMEOUT_SECONDS: 30
  ROLLBACK_WINDOW_SECONDS: 60

jobs:
  preflight:
    name: Deployment Preflight
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
      missing_secrets: ${{ steps.check.outputs.missing_secrets }}
    steps:
      - id: check
        env:
          AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          PRODUCTION_HEALTH_HOST: ${{ secrets.PRODUCTION_HEALTH_HOST }}
          LAUNCHDARKLY_TOKEN: ${{ secrets.LAUNCHDARKLY_TOKEN }}
          LAUNCHDARKLY_PROJECT: ${{ secrets.LAUNCHDARKLY_PROJECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for name in AWS_GITHUB_ROLE_ARN AWS_REGION EKS_CLUSTER_NAME \
            CONTAINER_REGISTRY PRODUCTION_HEALTH_HOST LAUNCHDARKLY_TOKEN \
            LAUNCHDARKLY_PROJECT DATABASE_URL PAGERDUTY_TOKEN PAGERDUTY_ROUTING_KEY
          do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -z "$missing" ]; then
            echo "can_deploy=true" >>"$GITHUB_OUTPUT"
            echo "missing_secrets=" >>"$GITHUB_OUTPUT"
            echo "All required secrets are available." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "can_deploy=false" >>"$GITHUB_OUTPUT"
            trimmed="${missing# }"
            echo "missing_secrets=$trimmed" >>"$GITHUB_OUTPUT"
            {
              echo "### Progressive rollout skipped"
              echo "Missing required secrets: $trimmed"
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  quality-gates:
    needs: preflight
    name: Quality & Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r requirements-dev.txt
      - name: Static analysis & unit tests
        run: |
          set -euxo pipefail
          make scripts-lint
          pytest --maxfail=1 --disable-warnings -q
      - name: Build container image
        run: |
          set -euxo pipefail
          docker build -t ${{ toLower(github.repository) }}:${{ github.event.inputs.image_tag || github.sha }} .

  check-environment-configuration:
    name: Check Environment Configuration
    needs:
      - quality-gates
      - preflight
    if: needs.preflight.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      environment_exists: ${{ steps.check.outputs.environment_exists }}
    steps:
      - name: Check if environment is configured
        id: check
        run: |
          # Always allow deployment if secrets are available (checked by preflight)
          # Environment protection will be handled by the environment block
          echo "environment_exists=true" >> $GITHUB_OUTPUT
          echo "✅ Environment configuration validated by preflight checks"

  blue-green:
    name: Blue/Green Stage
    needs:
      - check-environment-configuration
      - preflight
    if: needs.check-environment-configuration.outputs.environment_exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.activate.outputs.public_endpoint }}
    env:
      NAMESPACE: tradepulse-${{ github.event.inputs.environment || 'production' }}
    outputs:
      target_color: ${{ steps.colors.outputs.target_color }}
      baseline_color: ${{ steps.colors.outputs.baseline_color }}
      target_deployment: ${{ steps.colors.outputs.target_deployment }}
      baseline_deployment: ${{ steps.colors.outputs.baseline_deployment }}
      deployment_id: ${{ steps.metadata.outputs.deployment_id }}
      migration_revision: ${{ steps.migrations.outputs.applied_revision }}
      deployment_started_at: ${{ steps.metadata.outputs.started_at }}
      namespace: ${{ steps.colors.outputs.namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            constraints/security.txt
      - name: Install runtime dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r requirements.txt
      - name: Configure cloud credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Authenticate to Kubernetes
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
      - name: Determine blue/green target
        id: colors
        run: |
          set -euxo pipefail
          current="${{ github.event.inputs.active_color || vars.ACTIVE_COLOR || secrets.ACTIVE_COLOR || 'blue' }}"
          if [ "$current" = "blue" ]; then
            target=green
          else
            target=blue
          fi
          echo "baseline_color=$current" >> "$GITHUB_OUTPUT"
          echo "target_color=$target" >> "$GITHUB_OUTPUT"
          echo "baseline_deployment=${SERVICE_NAME}-${current}" >> "$GITHUB_OUTPUT"
          echo "target_deployment=${SERVICE_NAME}-${target}" >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
      - name: Record deployment metadata
        id: metadata
        run: |
          set -euxo pipefail
          echo "deployment_id=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Export feature flag guardrail
        env:
          LAUNCHDARKLY_TOKEN: ${{ secrets.LAUNCHDARKLY_TOKEN }}
          LAUNCHDARKLY_PROJECT: ${{ secrets.LAUNCHDARKLY_PROJECT }}
          TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["LAUNCHDARKLY_TOKEN"]
          project = os.environ["LAUNCHDARKLY_PROJECT"]
          flag = os.environ["FEATURE_FLAG_KEY"]
          env = os.environ["TARGET_ENV"]

          payload = {"active": False, "environments": {env: {"rollout": 0}}}

          req = urllib.request.Request(
              f"https://app.launchdarkly.com/api/v2/flags/{project}/{flag}/segments/rollout",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(req, timeout=10) as resp:
              resp.read()
          PY
      - name: Database migration dry-run plan
        id: migrations
        run: |
          set -euxo pipefail
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          alembic upgrade head --sql > /tmp/migration.sql
          sha=$(sha256sum /tmp/migration.sql | awk '{print $1}')
          echo "applied_revision=$sha" >> "$GITHUB_OUTPUT"
          echo "Stored migration plan hash $sha"
      - name: Deploy target color manifest
        id: deploy
        run: |
          set -euxo pipefail
          kubectl apply -k deploy/kustomize/overlays/${{ github.event.inputs.environment || 'production' }} \
            --server-side --force-conflicts
          kubectl set image deployment/${SERVICE_NAME}-${{ steps.colors.outputs.target_color }} \
            $SERVICE_NAME=${{ secrets.CONTAINER_REGISTRY }}/${{ github.repository }}:${{ github.event.inputs.image_tag || github.sha }} \
            -n "$NAMESPACE"
      - name: Warm up target color
        run: |
          set -euxo pipefail
          kubectl rollout status deployment/${SERVICE_NAME}-${{ steps.colors.outputs.target_color }} \
            -n "$NAMESPACE" --timeout=${DEPLOY_TIMEOUT_SECONDS}s
          kubectl get pods -l app=$SERVICE_NAME -l rollout=${{ steps.colors.outputs.target_color }} -n "$NAMESPACE"
      - name: Smoke tests on target color
        run: |
          set -euxo pipefail
          python scripts/deploy/docker_compose_smoke.py \
            --health-url "https://${{ secrets.PRODUCTION_HEALTH_HOST }}/health" \
            --metrics-url "https://${{ secrets.PRODUCTION_HEALTH_HOST }}/metrics"
      - name: Publish target endpoint (preview)
        id: activate
        run: |
          set -euxo pipefail
          url="https://${{ steps.colors.outputs.target_color }}.${{ secrets.PRODUCTION_HEALTH_HOST }}"
          echo "public_endpoint=$url" >> "$GITHUB_OUTPUT"

  traffic-shadow:
    name: Traffic Shadowing
    needs:
      - blue-green
      - preflight
    if: needs.preflight.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAMESPACE: ${{ needs.blue-green.outputs.namespace }}
    steps:
      - name: Mirror 5% of production traffic
        run: |
          set -euxo pipefail
          kubectl -n "$NAMESPACE" \
            annotate service $SERVICE_NAME \
            traffic.shadow.tradepulse.io/enabled="true" \
            traffic.shadow.tradepulse.io/target="${{ needs.blue-green.outputs.target_color }}" \
            traffic.shadow.tradepulse.io/weight="5" \
            --overwrite
      - name: Synthetic order replay
        env:
          TARGET_COLOR: ${{ needs.blue-green.outputs.target_color }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.request

          color = os.environ["TARGET_COLOR"]
          payload = {
              "target_color": color,
              "orders": [
                  {"id": idx, "type": random.choice(["market", "limit"]), "shadow": True}
                  for idx in range(1, 51)
              ],
          }
          req = urllib.request.Request(
              url=os.environ.get("SHADOW_REPLAY_ENDPOINT", "https://shadow.tradepulse.internal/replay"),
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print(resp.read().decode())
          except Exception as exc:
              raise SystemExit(f"Shadow replay failed: {exc}")
          time.sleep(5)
          PY

  canary:
    name: Canary Ramp-Up
    needs:
      - traffic-shadow
      - preflight
    if: needs.preflight.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAMESPACE: ${{ needs.blue-green.outputs.namespace }}
      PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
    steps:
      - name: Progressive traffic shifts
        env:
          TARGET_COLOR: ${{ needs.blue-green.outputs.target_color }}
        run: |
          set -euxo pipefail
          percentages=(1 10 50 100)
          for pct in "${percentages[@]}"; do
            echo "Routing ${pct}% of traffic to $TARGET_COLOR"
            kubectl -n "$NAMESPACE" patch service $SERVICE_NAME \
              --type merge \
              -p '{"metadata":{"annotations":{"rollout.canary.tradepulse.io/'"$TARGET_COLOR"'":'"$pct"'}}}'
            sleep 15
            python - <<'PY'
            import json
            import os
            import sys
            import urllib.request

            query = os.environ["PROMETHEUS_QUERY_DROPPED_ORDERS"]
            prom = os.environ.get("PROMETHEUS_URL")
            if not prom:
                sys.exit("PROMETHEUS_URL secret not configured")
            url = f"{prom}/api/v1/query?query={query}"
            with urllib.request.urlopen(url, timeout=10) as resp:
                data = json.load(resp)
            value = float(data["data"]["result"][0]["value"][1]) if data["data"]["result"] else 0.0
            print(f"Dropped order rate: {value}")
            if value > 0:
                raise SystemExit(f"Non-zero dropped order rate detected: {value}")
            PY
          done
      - name: Validate deployment latency budgets
        env:
          STARTED_AT: ${{ needs.blue-green.outputs.deployment_started_at }}
        run: |
          set -euxo pipefail
          started="$(date -d "$STARTED_AT" +%s)"
          now="$(date +%s)"
          elapsed=$(( now - started ))
          echo "Deployment elapsed time: $elapsed seconds"
          if [ "$elapsed" -gt "$DEPLOY_TIMEOUT_SECONDS" ]; then
            echo "::warning::Deployment exceeded $DEPLOY_TIMEOUT_SECONDS seconds"
          fi
      - name: Gradually open feature flag
        env:
          LAUNCHDARKLY_TOKEN: ${{ secrets.LAUNCHDARKLY_TOKEN }}
          LAUNCHDARKLY_PROJECT: ${{ secrets.LAUNCHDARKLY_PROJECT }}
          TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ["LAUNCHDARKLY_TOKEN"]
          project = os.environ["LAUNCHDARKLY_PROJECT"]
          flag = os.environ["FEATURE_FLAG_KEY"]
          env = os.environ["TARGET_ENV"]

          for pct in (10, 50, 100):
              payload = {
                  "environments": {
                      env: {
                          "fallthrough": {
                              "rollout": {
                                  "variations": [
                                      {"variation": 1, "weight": pct * 1000},
                                      {"variation": 0, "weight": 100000 - pct * 1000},
                                  ]
                              }
                          }
                      }
                  }
              }
              req = urllib.request.Request(
                  f"https://app.launchdarkly.com/api/v2/flags/{project}/{flag}",
                  data=json.dumps(payload).encode(),
                  method="PATCH",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as resp:
                  resp.read()
              time.sleep(10)
          PY

  finalize:
    name: Finalize Rollout
    needs:
      - canary
      - preflight
    if: needs.preflight.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAMESPACE: ${{ needs.blue-green.outputs.namespace }}
    steps:
      - name: Set new color as primary
        run: |
          set -euxo pipefail
          kubectl -n "$NAMESPACE" patch service $SERVICE_NAME \
            --type merge \
            -p '{"metadata":{"annotations":{"rollout.canary.tradepulse.io/'"${{ needs.blue-green.outputs.target_color }}"'":100}}}'
      - name: Disable traffic shadowing
        run: |
          set -euxo pipefail
          kubectl -n "$NAMESPACE" \
            annotate service $SERVICE_NAME traffic.shadow.tradepulse.io/enabled="false" --overwrite
      - name: Scale down previous color
        run: |
          set -euxo pipefail
          kubectl scale deployment/${{ needs.blue-green.outputs.baseline_deployment }} --replicas=0 -n "$NAMESPACE"
      - name: Persist active color metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COLOR: ${{ needs.blue-green.outputs.target_color }}
          TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          set -euxo pipefail
          gh variable set ACTIVE_COLOR --body "$TARGET_COLOR" --env "$TARGET_ENV"

  rollback:
    name: Automated Rollback
    if: needs.preflight.outputs.can_deploy == 'true' && failure()
    needs:
      - preflight
      - blue-green
      - traffic-shadow
      - canary
      - finalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAMESPACE: ${{ needs.blue-green.outputs.namespace }}
    steps:
      - name: Revert service traffic to baseline
        if: needs.blue-green.outputs.baseline_color != ''
        run: |
          set -euxo pipefail
          kubectl -n "$NAMESPACE" patch service $SERVICE_NAME \
            --type merge \
            -p '{"metadata":{"annotations":{"rollout.canary.tradepulse.io/'"${{ needs.blue-green.outputs.baseline_color }}"'":100}}}'
      - name: Rollback workload revision
        run: |
          set -euxo pipefail
          kubectl rollout undo deployment/${{ needs.blue-green.outputs.target_deployment }} -n "$NAMESPACE"
      - name: Revert database migration
        run: |
          set -euxo pipefail
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          alembic downgrade -1
      - name: Reset feature flag
        env:
          LAUNCHDARKLY_TOKEN: ${{ secrets.LAUNCHDARKLY_TOKEN }}
          LAUNCHDARKLY_PROJECT: ${{ secrets.LAUNCHDARKLY_PROJECT }}
          TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["LAUNCHDARKLY_TOKEN"]
          project = os.environ["LAUNCHDARKLY_PROJECT"]
          flag = os.environ["FEATURE_FLAG_KEY"]
          env = os.environ["TARGET_ENV"]

          payload = {"environments": {env: {"on": False}}}

          req = urllib.request.Request(
              f"https://app.launchdarkly.com/api/v2/flags/{project}/{flag}",
              data=json.dumps(payload).encode(),
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              resp.read()
          PY
      - name: Post-rollback alert
        run: |
          set -euxo pipefail
          curl -fsSL -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${{ secrets.PAGERDUTY_TOKEN }}" \
            -d '{"routing_key":"'"${{ secrets.PAGERDUTY_ROUTING_KEY }}"'","event_action":"trigger","payload":{"summary":"TradePulse rollback executed","source":"github-actions","severity":"critical"}}' \
            https://events.pagerduty.com/v2/enqueue
