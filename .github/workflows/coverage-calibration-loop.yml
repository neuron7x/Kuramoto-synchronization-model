name: Coverage Calibration Loop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "tools/coverage/coverage_calibration_loop.py"
      - "tests/tools/test_coverage_calibration_loop*.py"
      - "configs/quality/coverage_targets.toml"
      - ".github/workflows/coverage-calibration-loop.yml"
  push:
    branches: [main]
    paths:
      - "tools/coverage/coverage_calibration_loop.py"
      - "tests/tools/test_coverage_calibration_loop*.py"
      - "configs/quality/coverage_targets.toml"
      - ".github/workflows/coverage-calibration-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      - name: Run calibration loop contract and scenario tests
        run: |
          python -m pytest tests/tools/test_coverage_calibration_loop*.py -q -p no:cacheprovider
