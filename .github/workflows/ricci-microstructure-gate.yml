name: Ricci Microstructure Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "geosync_research/**"
      - "tools/research/ricci_microstructure_cli.py"
      - "tests/research_lines/test_ricci_microstructure_v1.py"
      - "schemas/research/ricci_microstructure_artifact.schema.json"
      - "configs/research/ricci_microstructure_v1.json"
      - "data/l2_manifest.json"
      - "data/raw/binance_btcusdt_depth10.csv"
      - ".github/workflows/ricci-microstructure-gate.yml"
  push:
    branches: [main]
    paths:
      - "geosync_research/**"
      - "tools/research/ricci_microstructure_cli.py"
      - ".github/workflows/ricci-microstructure-gate.yml"

permissions:
  contents: read

jobs:
  lane-gate:
    name: ricci-microstructure-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock || pip install -r requirements.txt
          pip install -r requirements-dev.lock || pip install -r requirements-dev.txt
          # POT (optimal transport) backs the Ollivier-Ricci kernel. It lives in
          # the pyproject `neuro_advanced` optional group, which is deliberately
          # excluded from the pip-compiled base/dev locks, so neither lock file
          # installs `ot`. Install it explicitly (matching pyproject's floor) so
          # the lane runs the REAL kernel — never importorskip, which would
          # vacuously skip the core falsification lane.
          pip install "POT>=0.9.5"
          # typer is a pyproject base dependency but is currently absent from the
          # pip-compiled requirements*.lock (pre-existing lock gap). The research
          # CLI (ingest / run / verify) imports it, so install it explicitly to
          # match pyproject; otherwise the ingest step dies "Typer is required".
          pip install "typer>=0.20.0,<1.0.0"
      - name: Quality (ruff + mypy --strict)
        run: |
          python -m ruff check geosync_research tools/research/ricci_microstructure_cli.py
          python -m mypy --strict geosync_research/lines/ricci_microstructure_v1
      - name: Lane tests
        run: PYTHONPATH=. python -m pytest -q tests/research_lines/test_ricci_microstructure_v1.py
      - name: Ingest committed frozen data (fast, no network)
        run: |
          PYTHONPATH=. python -m tools.research.ricci_microstructure_cli ingest \
            --data data/l2_manifest.json --out data/processed/ricci_microstructure_v1
      - name: Verify committed canonical artifact + SHA integrity (fast; the full 1000-surrogate run is the offline reproducibility capsule)
        # The 1000-surrogate battery takes ~25 min on a single core, which would
        # blow the 20-min gate cap, so it is NOT run live here. Instead the lane
        # commits a clean-tree canonical artifact under the package tree and this
        # step verifies it (schema + allowed-status + honesty + SHA chain). The
        # offline capsule (REPRODUCIBILITY_CAPSULE.sh) regenerates it bit-for-bit.
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib, json
          from pathlib import Path
          art_path = Path("geosync_research/lines/ricci_microstructure_v1/canonical/artifact.json")
          art = json.loads(art_path.read_text())
          forbidden = {"ALPHA_FOUND", "MARKET_SIGNAL_PROVEN", "PRODUCTION_READY", "PHYSICS_CONFIRMED"}
          assert art["falsification_status"] in {"SUPPORTED", "HYPOTHESIS_NOT_SUPPORTED", "INVALID"}, art["falsification_status"]
          assert art["falsification_status"] not in forbidden
          assert art["forbidden_claims_absent"] is True, "forbidden_claims_absent must be true"
          assert art["dirty_git"] is False, "artifact must be generated on a clean tree"
          assert art["claim_tier"].startswith("T3"), art["claim_tier"]
          allowed_sources = {"LOBSTER_LICENSED_L2", "BINANCE_FUTURES_DEPTH"}
          assert art["source"] in allowed_sources, f"relabelled/unknown source: {art['source']}"
          raw = Path("data/raw/binance_btcusdt_depth10.csv")
          actual = hashlib.sha256(raw.read_bytes()).hexdigest()
          ingested = json.loads(Path("data/processed/ricci_microstructure_v1/data_manifest.json").read_text())
          # honest source: a Binance file must never be relabelled LOBSTER
          assert ingested["source"] == art["source"], "manifest/artifact source mismatch"
          assert not (art["source"].startswith("LOBSTER") and "binance" in raw.name.lower()), "Binance data relabelled as LOBSTER"
          assert actual == ingested["data_sha256"] == art["data_sha256"], "committed artifact does not match committed data"
          print("verified:", art["run_id"], art["falsification_status"], "source", ingested["source"])
          PY
          PYTHONPATH=. python -m tools.research.ricci_microstructure_cli verify \
            geosync_research/lines/ricci_microstructure_v1/canonical/artifact.json
      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ricci-microstructure-evidence
          path: geosync_research/lines/ricci_microstructure_v1/canonical/**
          if-no-files-found: warn

  supply-chain:
    name: ricci-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lane-gate
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: geosync_research/lines/ricci_microstructure_v1
          format: cyclonedx-json
          output-file: sbom/ricci-cdx.json
      - name: CVE scan (Grype, fail on High/Critical)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v6.0.0
        with:
          sbom: sbom/ricci-cdx.json
          severity-cutoff: high
          fail-build: true
      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: sbom/ricci-cdx.json
