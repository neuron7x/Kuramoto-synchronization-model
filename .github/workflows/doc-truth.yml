name: Documentation Truth Guard

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: ['**']

jobs:
  audit-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            constraints/security.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r requirements-dev.lock

      - name: Run audit scripts
        run: |
          python tools/audit/serotonin_test_stats.py
          python tools/audit/thermo_test_stats.py
          python tools/audit/render_stats_md.py

      - name: Guard against hardcoded serotonin test claims
        run: |
          set -e
          if grep -R "62/62" docs; then
            echo "Hardcoded serotonin test counts detected; rely on generated stats."
            exit 1
          fi
          if grep -R "100% (62/62)" docs; then
            echo "Hardcoded 100% serotonin test claims detected; rely on generated stats."
            exit 1
          fi

      - name: Ensure generated docs are up to date
        run: |
          git status --porcelain
          git diff --exit-code
