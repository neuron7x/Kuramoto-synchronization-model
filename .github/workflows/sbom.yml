# CycloneDX SBOM Generation and Signing
#
# This workflow generates Software Bill of Materials (SBOM) in CycloneDX format,
# signs them with Sigstore cosign (keyless), and verifies the signatures.
#
# Required Secrets:
#   COSIGN_CERTIFICATE_IDENTITY - The certificate identity for keyless verification
#     Example: "https://github.com/OWNER/REPO/.github/workflows/sbom.yml@refs/heads/main"
#
#   COSIGN_CERTIFICATE_OIDC_ISSUER - The OIDC issuer for keyless verification
#     Example for GitHub Actions: "https://token.actions.githubusercontent.com"
#
#   Note: For GitHub Actions keyless signing, the certificate identity should match
#         the workflow file path (use your actual repository owner/name).
#
name: CycloneDX SBOM

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  id-token: write

on:
  push:
    branches:
      - main
      - develop
  # PRs disabled - SBOM only needed for releases, not during development

jobs:
  generate:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install CycloneDX tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install cyclonedx-bom

      - name: Combine dependency manifests
        run: |
          python - <<'PY'
          from pathlib import Path

          sources = [
              Path('requirements.txt'),
              Path('requirements-dev.txt'),
          ]
          combined = Path('sbom/combined-requirements.txt')
          combined.parent.mkdir(parents=True, exist_ok=True)

          def write_requirements(source: Path, fh, seen: set[Path]) -> None:
              source = source.resolve()
              if source in seen or not source.is_file():
                  return
              seen.add(source)

              for line in source.read_text(encoding='utf-8').splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith('#'):
                      fh.write(line + '\n')
                      continue

                  if stripped.startswith('-r') or stripped.startswith('--requirement'):
                      try:
                          _, include_path = stripped.split(None, 1)
                      except ValueError:
                          continue
                      include = (source.parent / include_path).resolve()
                      write_requirements(include, fh, seen)
                      continue

                  fh.write(line + '\n')

          with combined.open('w', encoding='utf-8') as fh:
              seen: set[Path] = set()
              for source in sources:
                  write_requirements(source, fh, seen)
          PY

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          python -m cyclonedx_py requirements sbom/combined-requirements.txt --output-format JSON --output-file sbom/cyclonedx-sbom.json

      - name: Generate CycloneDX SBOM (XML)
        run: |
          python -m cyclonedx_py requirements sbom/combined-requirements.txt --output-format XML --output-file sbom/cyclonedx-sbom.xml

      - name: Validate CycloneDX artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from cyclonedx.validation import make_schemabased_validator, OutputFormat
          from cyclonedx.schema import SchemaVersion

          sbom_dir = Path('sbom')
          artifacts = [
              (sbom_dir / 'cyclonedx-sbom.json', OutputFormat.JSON),
              (sbom_dir / 'cyclonedx-sbom.xml', OutputFormat.XML),
          ]

          for path, output_format in artifacts:
              if not path.is_file():
                  raise SystemExit(f'Missing SBOM artifact: {path}')
              validator = make_schemabased_validator(output_format=output_format, schema_version=SchemaVersion.V1_6)
              validator.validate_str(path.read_text(encoding='utf-8'))
          print('CycloneDX validation succeeded for all artifacts.')
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign SBOM with cosign
        if: github.event_name != 'pull_request'
        run: |
          # Sign SBOM artifacts with keyless signing
          cosign sign-blob --yes \
            --bundle sbom/cyclonedx-sbom.json.bundle \
            sbom/cyclonedx-sbom.json

          cosign sign-blob --yes \
            --bundle sbom/cyclonedx-sbom.xml.bundle \
            sbom/cyclonedx-sbom.xml

          echo "✓ SBOM artifacts signed successfully"

      - name: Verify the secrets are set and run cosign verification
        env:
          COSIGN_CERT_IDENTITY: ${{ secrets.COSIGN_CERTIFICATE_IDENTITY }}
          COSIGN_CERT_OIDC_ISSUER: ${{ secrets.COSIGN_CERTIFICATE_OIDC_ISSUER }}
        if: ${{ github.event_name != 'pull_request' && env.COSIGN_CERT_IDENTITY != '' && env.COSIGN_CERT_OIDC_ISSUER != '' }}
        run: |
          echo "✅ COSIGN secrets present — running cosign verification"
          # Verify the secrets are set
          if [ -z "${COSIGN_CERT_IDENTITY}" ] || [ -z "${COSIGN_CERT_OIDC_ISSUER}" ]; then
            echo "❌ ERROR: Required repository secrets are not set."
            exit 1
          fi

          # Verify the signatures with certificate identity and OIDC issuer
          cosign verify-blob \
            --certificate-identity "${COSIGN_CERT_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_CERT_OIDC_ISSUER}" \
            --bundle sbom/cyclonedx-sbom.json.bundle \
            sbom/cyclonedx-sbom.json

          cosign verify-blob \
            --certificate-identity "${COSIGN_CERT_IDENTITY}" \
            --certificate-oidc-issuer "${COSIGN_CERT_OIDC_ISSUER}" \
            --bundle sbom/cyclonedx-sbom.xml.bundle \
            sbom/cyclonedx-sbom.xml

          echo "✓ SBOM signatures verified successfully"

      - name: Skip cosign verification (secrets missing)
        env:
          COSIGN_CERT_IDENTITY: ${{ secrets.COSIGN_CERTIFICATE_IDENTITY }}
          COSIGN_CERT_OIDC_ISSUER: ${{ secrets.COSIGN_CERTIFICATE_OIDC_ISSUER }}
        if: ${{ github.event_name != 'pull_request' && (env.COSIGN_CERT_IDENTITY == '' || env.COSIGN_CERT_OIDC_ISSUER == '') }}
        run: |
          echo "⚠️ COSIGN verification skipped: required repository secrets are not set."
          echo "To enable verification, set the following repository secrets in Settings → Secrets and variables → Actions:"
          echo "  COSIGN_CERTIFICATE_IDENTITY: https://github.com/neuron7x/TradePulse/.github/workflows/sbom.yml@9abd130449096b0510d111396b9b65516fd8dd49"
          echo "  COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com"
          echo "See: https://docs.sigstore.dev/cosign/verify/"

      - name: Check SBOM age
        run: |
          # Verify SBOM is less than 24 hours old
          SBOM_FILE="sbom/cyclonedx-sbom.json"
          if [ -f "$SBOM_FILE" ]; then
            SBOM_AGE=$(( $(date +%s) - $(stat -c %Y "$SBOM_FILE") ))
            SBOM_AGE_HOURS=$(( SBOM_AGE / 3600 ))

            echo "SBOM age: ${SBOM_AGE_HOURS} hours"

            if [ $SBOM_AGE_HOURS -ge 24 ]; then
              echo "❌ ERROR: SBOM is older than 24 hours"
              exit 1
            fi

            echo "✓ SBOM is fresh (less than 24 hours old)"
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            sbom/cyclonedx-sbom.json
            sbom/cyclonedx-sbom.xml
            sbom/cyclonedx-sbom.json.bundle
            sbom/cyclonedx-sbom.xml.bundle
