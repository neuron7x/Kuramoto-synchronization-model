name: Smart Test Selection

# 2025 Best Practice: Run only tests relevant to changed files
# Dramatically reduces CI time while maintaining quality

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'core/**/*.py'
      - 'backtest/**/*.py'
      - 'execution/**/*.py'
      - 'tests/**/*.py'

concurrency:
  group: smart-tests-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core_changed: ${{ steps.filter.outputs.core }}
      backtest_changed: ${{ steps.filter.outputs.backtest }}
      execution_changed: ${{ steps.filter.outputs.execution }}
      test_changes: ${{ steps.filter.outputs.tests }}
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**/*.py'
            backtest:
              - 'backtest/**/*.py'
            execution:
              - 'execution/**/*.py'
            tests:
              - 'tests/**/*.py'

  smart-test-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Smart Tests - Core Module
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c constraints/security.txt -r requirements.txt
          pip install -c constraints/security.txt -r requirements-dev.txt
      
      - name: Run core module tests only
        run: |
          pytest tests/unit/core tests/integration/core \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml:coverage-core.xml \
            -v \
            --tb=short
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-core.xml
          flags: core,smart-test

  smart-test-backtest:
    needs: detect-changes
    if: needs.detect-changes.outputs.backtest_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Smart Tests - Backtest Module
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c constraints/security.txt -r requirements.txt
          pip install -c constraints/security.txt -r requirements-dev.txt
      
      - name: Run backtest module tests only
        run: |
          pytest tests/unit/backtest tests/integration/backtest \
            --cov=backtest \
            --cov-report=term-missing \
            --cov-report=xml:coverage-backtest.xml \
            -v \
            --tb=short
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-backtest.xml
          flags: backtest,smart-test

  smart-test-execution:
    needs: detect-changes
    if: needs.detect-changes.outputs.execution_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Smart Tests - Execution Module
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c constraints/security.txt -r requirements.txt
          pip install -c constraints/security.txt -r requirements-dev.txt
      
      - name: Run execution module tests only
        run: |
          pytest tests/unit/execution tests/integration/execution \
            --cov=execution \
            --cov-report=term-missing \
            --cov-report=xml:coverage-execution.xml \
            -v \
            --tb=short
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-execution.xml
          flags: execution,smart-test

  comment-results:
    needs: [detect-changes, smart-test-core, smart-test-backtest, smart-test-execution]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const coreChanged = '${{ needs.detect-changes.outputs.core_changed }}' === 'true';
            const backtestChanged = '${{ needs.detect-changes.outputs.backtest_changed }}' === 'true';
            const executionChanged = '${{ needs.detect-changes.outputs.execution_changed }}' === 'true';
            
            let message = '### 🧪 Smart Test Selection Results\n\n';
            message += '| Module | Changed | Tests Run | Status |\n';
            message += '|--------|---------|-----------|--------|\n';
            
            const modules = [
              { name: 'Core', changed: coreChanged, job: 'smart-test-core' },
              { name: 'Backtest', changed: backtestChanged, job: 'smart-test-backtest' },
              { name: 'Execution', changed: executionChanged, job: 'smart-test-execution' }
            ];
            
            for (const mod of modules) {
              const status = mod.changed ? '✅' : '⏭️ Skipped';
              message += `| ${mod.name} | ${mod.changed ? '✓' : '✗'} | ${mod.changed ? '✓' : '✗'} | ${status} |\n`;
            }
            
            message += '\n*Smart test selection ran only tests for changed modules, saving CI time.*\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
