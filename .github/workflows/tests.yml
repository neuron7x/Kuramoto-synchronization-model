          retention-days: 7

  flaky-tests:
    name: Quarantined flaky tests
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -c constraints/security.txt -r requirements.txt
          .venv/bin/pip install -c constraints/security.txt -r requirements-dev.txt
      - name: Prepare test report directories
        run: |
          mkdir -p reports
      # Localization sync is already done in the main tests job, no need to duplicate
      - name: Run quarantined flaky tests
        run: |
          set -o pipefail
          set +e
          .venv/bin/python -m pytest tests/ -m flaky \
            --reruns=2 --reruns-delay=2 \
            --junitxml=reports/flaky-tests.xml \
            --html=reports/flaky-tests-report.html --self-contained-html \
            --flaky-report=reports/flaky-tests.json
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No tests collected for 'flaky' marker; treating as success."
            exit 0
          fi
          exit "$status"
      - name: Upload flaky test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-artifacts
          path: |
            reports/flaky-tests.xml
            reports/flaky-tests-report.html
            reports/flaky-tests.json
          if-no-files-found: warn
