  benchmarks:
    runs-on: ubuntu-latest
    # Only run on main push, schedule, or manual trigger
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fast-unit-tests
    timeout-minutes: 30
    name: Performance Benchmarks (Python 3.11)
    env:
      TP_BENCHMARK_ARTIFACT_DIR: reports/benchmarks
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            constraints/security.txt
            
      - name: Cache Python virtual environment
        uses: actions/cache@v4
        id: venv-cache-bench
        with:
          path: .venv
          key: venv-bench-${{ runner.os }}-py3.11-${{ hashFiles('requirements.lock', 'requirements-dev.lock', 'constraints/security.txt') }}
          restore-keys: |
            venv-bench-${{ runner.os }}-py3.11-
            
      - name: Create virtual environment
        if: steps.venv-cache-bench.outputs.cache-hit != 'true'
        run: python -m venv .venv
        
      - name: Install dependencies
        if: steps.venv-cache-bench.outputs.cache-hit != 'true'
        run: |
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -c constraints/security.txt -r requirements.lock
          .venv/bin/pip install -c constraints/security.txt -r requirements-dev.lock
      - name: Run performance benchmarks
        id: run_benchmarks
        continue-on-error: true
        run: |
          mkdir -p "$TP_BENCHMARK_ARTIFACT_DIR"
          set +e
          .venv/bin/python -m pytest tests/performance \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-save=ci-latest \
            --benchmark-columns=mean,stddev,median,rounds \
            --benchmark-name=short
          benchmark_exit_code=$?
          set -e
          if [ $benchmark_exit_code -ne 0 ]; then
            echo "⚠️ Benchmark tests failed with exit code $benchmark_exit_code"
          fi
          exit $benchmark_exit_code
      - name: Summarize benchmark results
        if: always()
        id: benchmark_summary
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ.get("TP_BENCHMARK_ARTIFACT_DIR", "reports/benchmarks"))
          summary_lines: list[str] = ["### Performance Benchmark Summary", ""]
          comment_lines: list[str] = summary_lines.copy()
          regression_count = 0

          if not artifact_dir.exists():
              message = "Benchmark artifact directory was not created."
              summary_lines.append(message)
              comment_lines.append(message)
          else:
              candidates = sorted(artifact_dir.glob("benchmark-summary-*.json"), key=lambda p: p.stat().st_mtime)
              if not candidates:
                  message = "No benchmark summary files were generated."
                  summary_lines.append(message)
                  comment_lines.append(message)
              else:
                  latest = candidates[-1]
                  data = json.loads(latest.read_text())
                  records = data.get("records", [])
                  summary_lines.append(f"Latest results captured in `{latest.as_posix()}`.")
                  summary_lines.append("")
                  comment_lines.append(f"Latest results captured in `{latest.as_posix()}`.")
                  comment_lines.append("")
                  if not records:
                      message = "Benchmark summary file did not contain any records."
                      summary_lines.append(message)
                      comment_lines.append(message)
                  else:
                      header = "| Benchmark | Observed (s) | Baseline (s) | Δ% | Threshold | Status |"
                      divider = "| --- | --- | --- | --- | --- | --- |"
                      summary_lines.extend([header, divider])
                      comment_lines.extend([header, divider])
                      for record in records:
                          name = record.get("name", "<unknown>")
                          observed = float(record.get("measurement", 0.0))
                          baseline = float(record.get("baseline", 0.0))
                          threshold = float(record.get("threshold", 0.0))
                          ratio = float(record.get("regression_ratio", float("nan")))
                          if baseline > 0.0 and math.isfinite(ratio):
                              delta_pct = (ratio - 1.0) * 100.0
                              delta_str = f"{delta_pct:+.2f}%"
                          else:
                              delta_str = "n/a"
                          exceeds = bool(record.get("exceeds_budget", False))
                          status = "⚠️ Regression" if exceeds else "✅ Within budget"
                          if exceeds:
                              regression_count += 1
                          row = f"| {name} | {observed:.6f} | {baseline:.6f} | {delta_str} | {threshold:.0%} | {status} |"
                          summary_lines.append(row)
                          comment_lines.append(row)

                      summary_lines.append("")
                      comment_lines.append("")
                      if regression_count:
                          summary_lines.append(f"⚠️ {regression_count} benchmark(s) exceeded the configured thresholds.")
                          comment_lines.append(f"⚠️ {regression_count} benchmark(s) exceeded the configured thresholds.")
                      else:
                          summary_lines.append("✅ All benchmarks remained within the configured thresholds.")
                          comment_lines.append("✅ All benchmarks remained within the configured thresholds.")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(summary_lines) + "\n")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as handle:
                  handle.write(f"regression_count={regression_count}\n")
                  body = "\n".join(comment_lines)
                  handle.write("comment_body<<'EOF'\n")
                  handle.write(body)
                  handle.write("\nEOF\n")
          PY
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            reports/benchmarks
            .benchmarks
          if-no-files-found: warn
          retention-days: 7
      - name: Find existing benchmark comment
        if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        id: find_benchmark_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '### Performance Benchmark Summary'
      - name: Post benchmark summary comment
        if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.benchmark_summary.outputs.comment_body != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_benchmark_comment.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.benchmark_summary.outputs.comment_body }}

  pytest-xdist:
    runs-on: ubuntu-latest
    # Only run on schedule or manual trigger for profiling analysis
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fast-unit-tests
    timeout-minutes: 30
    name: Pytest Parallel Profiling (xdist)
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            constraints/security.txt
            
      - name: Cache Python virtual environment
        uses: actions/cache@v4
        id: venv-cache-xdist
        with:
          path: .venv
          key: venv-xdist-${{ runner.os }}-py3.11-${{ hashFiles('requirements.lock', 'requirements-dev.lock', 'constraints/security.txt') }}
          restore-keys: |
            venv-xdist-${{ runner.os }}-py3.11-
            
      - name: Create virtual environment
        if: steps.venv-cache-xdist.outputs.cache-hit != 'true'
        run: python -m venv .venv
        
      - name: Install dependencies
        if: steps.venv-cache-xdist.outputs.cache-hit != 'true'
        run: |
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -c constraints/security.txt -r requirements.lock
          .venv/bin/pip install -c constraints/security.txt -r requirements-dev.lock
      - name: Run pytest in parallel with profiling
        run: |
          .venv/bin/python -m pytest tests/ -n auto --durations=20 --profile
      - name: Collect profiling artifacts
        if: always()
        run: |
          mkdir -p reports/profiling
          if [ -d prof ]; then cp -r prof/. reports/profiling/; fi
      - name: Upload profiling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-profiling
          path: reports/profiling
          if-no-files-found: warn
          retention-days: 7

  ui-smoke:
    runs-on: ubuntu-latest
    # Only run on main push, schedule, or manual trigger
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fast-unit-tests
    timeout-minutes: 20
    name: Playwright UI Smoke Tests
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build Next.js application
        working-directory: apps/web
        run: npm run build
      - name: Run Playwright smoke suite
        working-directory: apps/web
        env:
          CI: 'true'
        run: npx playwright test --config=playwright.config.ts --reporter=list --project="Desktop Chrome"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 7

  flaky-tests:
    runs-on: ubuntu-latest
    # Only run on schedule or manual trigger to monitor flaky tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fast-unit-tests
    timeout-minutes: 20
    continue-on-error: true
    name: Quarantined Flaky Tests (Monitoring)
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            constraints/security.txt
            
      - name: Cache Python virtual environment
        uses: actions/cache@v4
        id: venv-cache-flaky
        with:
          path: .venv
          key: venv-flaky-${{ runner.os }}-py3.11-${{ hashFiles('requirements.lock', 'requirements-dev.lock', 'constraints/security.txt') }}
          restore-keys: |
            venv-flaky-${{ runner.os }}-py3.11-
            
      - name: Create virtual environment
        if: steps.venv-cache-flaky.outputs.cache-hit != 'true'
        run: python -m venv .venv
        
      - name: Install dependencies
        if: steps.venv-cache-flaky.outputs.cache-hit != 'true'
        run: |
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -c constraints/security.txt -r requirements.lock
          .venv/bin/pip install -c constraints/security.txt -r requirements-dev.lock
      - name: Prepare test report directories
        run: |
          mkdir -p reports
      # Localization sync is already done in the main tests job, no need to duplicate
      - name: Run quarantined flaky tests
        run: |
          set -o pipefail
          set +e
          .venv/bin/python -m pytest tests/ -m flaky \
            --reruns=2 --reruns-delay=2 \
            --junitxml=reports/flaky-tests.xml \
            --html=reports/flaky-tests-report.html --self-contained-html \
            --flaky-report=reports/flaky-tests.json
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No tests collected for 'flaky' marker; treating as success."
            exit 0
          fi
          exit "$status"
      - name: Upload flaky test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-artifacts
          path: |
            reports/flaky-tests.xml
            reports/flaky-tests-report.html
            reports/flaky-tests.json
          if-no-files-found: warn
