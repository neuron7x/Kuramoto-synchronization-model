name: Tests

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
  pull_request:
    branches:
      # Ensure linting, typing, and tests run for every PR.
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect_ui_changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
            web:
              - 'apps/web/**'

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    name: Lint & Type Check (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: lint-pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            lint-pre-commit-${{ runner.os }}-
      - name: Cache shellcheck
        uses: actions/cache@v4
        with:
          path: /usr/bin/shellcheck
          key: shellcheck-${{ runner.os }}
          restore-keys: |
            shellcheck-${{ runner.os }}
      - name: Cache Python virtual environment
        uses: actions/cache@v4
        id: venv-cache-lint
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'constraints/security.txt') }}
          restore-keys: |
            venv-lint-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Create virtual environment
        if: steps.venv-cache-lint.outputs.cache-hit != 'true'
        run: python -m venv .venv
      - name: Install Python dependencies
        if: steps.venv-cache-lint.outputs.cache-hit != 'true'
        run: |
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -c constraints/security.txt -r requirements.txt
          .venv/bin/pip install -c constraints/security.txt -r requirements-dev.txt
          .venv/bin/pip install pre-commit detect-secrets
      - name: Validate localization bundles
        run: .venv/bin/python scripts/localization/sync_translations.py --check
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Run ruff
        run: .venv/bin/ruff check .
      - name: Run black
        run: .venv/bin/black --check .
      - name: Run mypy
        run: .venv/bin/mypy
      - name: Run slotscheck
        run: .venv/bin/python -m slotscheck --module core --module backtest --module execution
      - name: Run shfmt
        run: .venv/bin/pre-commit run --hook-stage manual --all-files shfmt --show-diff-on-failure
      - name: Run shellcheck
        run: .venv/bin/pre-commit run --hook-stage manual --all-files shellcheck --show-diff-on-failure
      - name: Run detect-secrets scan
        run: |
          set -euo pipefail
          scan_output="$(mktemp)"
          .venv/bin/detect-secrets scan core backtest execution src application >"$scan_output"
          python - <<'PY' "$scan_output"
          import json
          import sys

          path = sys.argv[1]
          data = json.loads(open(path, encoding="utf-8").read())
          results = data.get("results", {})
          violations = sum(len(entries) for entries in results.values())
          if violations:
              message = [
                  "Potential secrets detected in privileged modules:",
                  json.dumps(results, indent=2, sort_keys=True),
              ]
              raise SystemExit("\n".join(message))
          PY

  web-lint:
    runs-on: ubuntu-latest
    needs: detect_ui_changes
    name: Web Frontend Lint & Type Check
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run Prettier format check
        working-directory: apps/web
        run: npm run format:check
      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint
      - name: Run TypeScript type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Run Jest unit tests
        working-directory: apps/web
        run: npm run test

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    name: Tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'infra/terraform/tests/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Run Go service unit tests
        continue-on-error: true
        run: |
          mkdir -p reports/go
          set +e
          go test ./... -covermode=atomic -coverprofile=reports/go/services.coverage.out
          go_exit_code=$?
          set -e
          if [ $go_exit_code -ne 0 ]; then
            echo "⚠️ Go tests failed with exit code $go_exit_code"
          fi
          exit $go_exit_code
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-services-coverage
          path: reports/go/services.coverage.out
          if-no-files-found: warn
          retention-days: 7
      - name: Run Terraform validation tests
        continue-on-error: true
        working-directory: infra/terraform/tests
        run: |
          set +e
          go test ./... -v
          tf_exit_code=$?
          set -e
          if [ $tf_exit_code -ne 0 ]; then
            echo "⚠️ Terraform tests failed with exit code $tf_exit_code"
          fi
          exit $tf_exit_code
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt
      - name: Cache Python virtual environment
        uses: actions/cache@v4
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'constraints/security.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Create virtual environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: python -m venv .venv
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -c constraints/security.txt -r requirements.txt
          .venv/bin/pip install -c constraints/security.txt -r requirements-dev.txt
      - name: Prepare test report directories
        run: |
          mkdir -p reports
      - name: Sync localization resources
        run: |
          .venv/bin/python scripts/localization/sync_translations.py

      - name: Summarize localization coverage
        id: localization_summary
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_path = pathlib.Path('reports/localization/coverage.json')
          if not report_path.exists():
              print('⚠️ Localization coverage report not generated', file=sys.stderr)
              summary = "### Localization coverage\n\n_Report not generated_\n"
              step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  with open(step_summary, 'a', encoding='utf-8') as handle:
                      handle.write(summary)
              github_output = os.environ.get('GITHUB_OUTPUT')
              if github_output:
                  with open(github_output, 'a', encoding='utf-8') as handle:
                      handle.write("coverage_summary<<'EOF'\n")
                      handle.write(summary)
                      handle.write('EOF\n')
              sys.exit(0)

          try:
              data = json.loads(report_path.read_text(encoding='utf-8'))
          except Exception as e:
              print(f'⚠️ Error parsing localization coverage: {e}', file=sys.stderr)
              sys.exit(0)

          lines = [
              "### Localization coverage",
              "",
              "| Locale | Coverage | Missing keys | Extra keys |",
              "| --- | --- | --- | --- |",
          ]
          for locale in sorted(data.get('locales', {})):
              payload = data['locales'][locale]
              missing = '<br>'.join(payload.get('missing', [])) or '—'
              extra = '<br>'.join(payload.get('extra', [])) or '—'
              coverage = float(payload.get('coverageRatio', 0.0)) * 100.0
              lines.append(f"| {locale} | {coverage:.2f}% | {missing} | {extra} |")
          lines.append("")
          summary = "\n".join(lines) + "\n"

          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a', encoding='utf-8') as handle:
                  handle.write(summary)

          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output:
              with open(github_output, 'a', encoding='utf-8') as handle:
                  handle.write("coverage_summary<<'EOF'\n")
                  handle.write(summary)
                  handle.write('EOF\n')
          PY
      - name: Upload localization coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-coverage
          path: reports/localization/coverage.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run test quality validation
        id: test_quality
        continue-on-error: true
        run: |
          .venv/bin/python -m tools.testing.quality_validator \
            --test-dir=tests \
            --report=reports/test-quality.json \
            --threshold=70.0
      - name: Run unit and integration tests with coverage
        id: run_tests
        continue-on-error: true
        run: |
          set +e
          .venv/bin/python -m pytest \
            -m "not flaky" \
            tests/ \
            --cov=core --cov=backtest --cov=execution \
            --cov-branch \
            --cov-report=xml --cov-report=term-missing --cov-report=html:coverage_html \
            --cov-fail-under=98 \
            --junitxml=reports/unit-integration-tests.xml \
            --html=reports/unit-integration-report.html --self-contained-html \
            --flaky-report=reports/flaky-tests-skipped.json \
            --json-report --json-report-file=reports/test-results.json
          test_exit_code=$?
          set -e
          echo "test_exit_code=$test_exit_code" >> $GITHUB_OUTPUT
          if [ $test_exit_code -ne 0 ]; then
            echo "⚠️ Tests failed with exit code $test_exit_code"
          fi
          exit $test_exit_code
      - name: Track test performance
        if: always()
        continue-on-error: true
        run: |
          if [ -f reports/test-results.json ]; then
            .venv/bin/python -m tools.testing.performance_tracker \
              --results=reports/test-results.json \
              --report=reports/test-performance.json \
              --save-baseline=reports/test-performance-baseline.json
          else
            echo "⚠️ Test results file not found, skipping performance tracking"
          fi
      - name: Run end-to-end smoke tests
        continue-on-error: true
        run: |
          set +e
          .venv/bin/python -m pytest tests/e2e/ \
            -m "not slow and not flaky" \
            --junitxml=reports/e2e-tests.xml \
            --html=reports/e2e-report.html --self-contained-html
          e2e_exit_code=$?
          set -e
          if [ $e2e_exit_code -ne 0 ]; then
            echo "⚠️ E2E tests failed with exit code $e2e_exit_code"
          fi
          exit $e2e_exit_code
      - name: Publish coverage summary
        if: ${{ always() }}
        id: coverage_summary
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          report_path = pathlib.Path("coverage.xml")
          if not report_path.exists():
              print("⚠️ coverage.xml not found; coverage step may have failed", file=sys.stderr)
              # Set default values for output
              github_output = os.environ.get("GITHUB_OUTPUT")
              if github_output:
                  with open(github_output, "a", encoding="utf-8") as handle:
                      handle.write("line_rate=0.00\n")
                      handle.write("branch_rate=0.00\n")
                      handle.write("coverage_threshold=98.00\n")
                      handle.write("coverage_margin=-98.00\n")
                      handle.write("risk_level=Unknown\n")
                      handle.write("risk_reason<<'EOF'\n")
                      handle.write("Coverage report not generated")
                      handle.write("\nEOF\n")
              sys.exit(0)

          try:
              root = ET.parse(report_path).getroot()
              line_rate = float(root.get("line-rate", 0.0)) * 100
              branch_rate = float(root.get("branch-rate", 0.0)) * 100
          except Exception as e:
              print(f"⚠️ Error parsing coverage.xml: {e}", file=sys.stderr)
              line_rate = 0.0
              branch_rate = 0.0

          threshold = 98.0
          margin = line_rate - threshold
          margin_display = f"{margin:+.2f}"

          if line_rate + 1e-9 >= threshold + 1.5:
              risk_level = "Low"
              risk_reason = f"Coverage exceeds the guardrail by {margin:.2f}% providing a healthy buffer."
          elif line_rate + 1e-9 >= threshold:
              risk_level = "Moderate"
              risk_reason = f"Coverage clears the guardrail by {margin:.2f}% — consider adding tests to widen the buffer."
          else:
              risk_level = "High"
              risk_reason = f"Coverage is below the {threshold:.0f}% guardrail by {abs(margin):.2f}%. Additional tests are required."

          summary_lines = [
              "### Coverage summary\n",
              "",
              "| Metric | Percentage |",
              "| --- | --- |",
              f"| Line coverage | {line_rate:.2f}% |",
              f"| Branch coverage | {branch_rate:.2f}% |",
              f"| Guardrail | {threshold:.2f}% |",
              f"| Margin vs guardrail | {margin:+.2f}% |",
              "",
              f"**Risk level:** {risk_level} — {risk_reason}",
              "",
          ]

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(summary_lines))

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as handle:
                  handle.write(f"line_rate={line_rate:.2f}\n")
                  handle.write(f"branch_rate={branch_rate:.2f}\n")
                  handle.write(f"coverage_threshold={threshold:.2f}\n")
                  handle.write(f"coverage_margin={margin_display}\n")
                  handle.write(f"risk_level={risk_level}\n")
                  handle.write("risk_reason<<'EOF'\n")
                  handle.write(risk_reason)
                  handle.write("\nEOF\n")

          if branch_rate < 90.0:
              print(f"⚠️ Branch coverage {branch_rate:.2f}% is below the required 90% threshold", file=sys.stderr)
              # Don't fail the step, just warn
          PY
      - name: Update missing-coverage label
        if: ${{ github.event_name == 'pull_request' && matrix.python-version == '3.11' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const pull_number = context.payload.pull_request.number;
              const label = 'missing-coverage';
              const lineThreshold = 98;
              const branchThreshold = 90;
              const lineRate = Number("${{ steps.coverage_summary.outputs.line_rate || '0' }}");
              const branchRate = Number("${{ steps.coverage_summary.outputs.branch_rate || '0' }}");
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number: pull_number });
              const hasLabel = labels.some(item => item.name === label);
              if (lineRate >= lineThreshold && branchRate >= branchThreshold) {
                if (hasLabel) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: label }).catch(() => {});
                }
              } else if (!hasLabel) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [label] });
              }
            } catch (error) {
              console.log(`⚠️ Failed to update coverage label: ${error.message}`);
            }
      - name: Run property-based tests with statistics
        continue-on-error: true
        run: |
          set +e
          .venv/bin/python -m pytest tests/property/ --hypothesis-show-statistics \
            --junitxml=reports/property-tests.xml \
            --html=reports/property-tests-report.html --self-contained-html
          property_exit_code=$?
          set -e
          if [ $property_exit_code -ne 0 ]; then
            echo "⚠️ Property tests failed with exit code $property_exit_code"
          fi
          exit $property_exit_code
      - name: Summarize pytest results
        if: always()
        id: test_summary
        uses: test-summary/action@v2
        with:
          paths: |
            reports/unit-integration-tests.xml
            reports/property-tests.xml
            reports/e2e-tests.xml
          show: "fail, skip, pass"
      - name: Find existing test summary comment
        if: ${{ always() && github.event_name == 'pull_request' && matrix.python-version == '3.11' && !github.event.pull_request.head.repo.fork }}
        id: find_test_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '### Test & Coverage Summary'
      - name: Post test summary comment
        if: ${{ always() && github.event_name == 'pull_request' && matrix.python-version == '3.11' && !github.event.pull_request.head.repo.fork }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_test_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### Test & Coverage Summary (Python ${{ matrix.python-version }})

            **Status:** ${{ job.status == 'success' && '✅ Tests completed' || job.status == 'cancelled' && '⚪ Tests cancelled' || '❌ Tests failed' }}
            **Coverage:** ${{ steps.coverage_summary.outputs.line_rate || 'n/a' }}% lines (guardrail ≥ ${{ steps.coverage_summary.outputs.coverage_threshold || 'n/a' }}%)
            **Risk:** ${{ steps.coverage_summary.outputs.risk_level || 'n/a' }} — ${{ steps.coverage_summary.outputs.risk_reason || 'n/a' }}

            **Key Links**
            - [Workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Coverage HTML: download the `coverage-reports-${{ matrix.python-version }}` artifact from the run above.
            - Test reports: download the `pytest-html-reports-${{ matrix.python-version }}` artifact for full context.

            | Metric | Value |
            | --- | --- |
            | Total tests | ${{ steps.test_summary.outputs.total }} |
            | Passed | ${{ steps.test_summary.outputs.passed }} |
            | Failed | ${{ steps.test_summary.outputs.failed }} |
            | Skipped | ${{ steps.test_summary.outputs.skipped }} |
            | Line coverage | ${{ steps.coverage_summary.outputs.line_rate || 'n/a' }}% |
            | Branch coverage | ${{ steps.coverage_summary.outputs.branch_rate || 'n/a' }}% |
            | Margin vs guardrail | ${{ steps.coverage_summary.outputs.coverage_margin || 'n/a' }}% |

            _Updated automatically for the latest workflow run._
      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results-${{ matrix.python-version }}
          path: |
            reports/unit-integration-tests.xml
            reports/property-tests.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-reports-${{ matrix.python-version }}
          path: |
            reports/unit-integration-report.html
            reports/property-tests-report.html
            reports/e2e-report.html
          if-no-files-found: warn
          retention-days: 7
      - name: Upload flaky manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-skipped-${{ matrix.python-version }}
          path: reports/flaky-tests-skipped.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload test quality and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-quality-performance-${{ matrix.python-version }}
          path: |
            reports/test-quality.json
            reports/test-performance.json
            reports/test-performance-baseline.json
            reports/test-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage_html
          if-no-files-found: warn
          retention-days: 7
      - name: Upload coverage to Codecov (with token)
        if: ${{ !github.event.pull_request.head.repo.fork && secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml

  security-tests:
    runs-on: ubuntu-latest
    needs:
      - lint
    strategy:
      matrix:
        python-version: ['3.11']
    name: Security Tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt
      - name: Cache Python virtual environment
        uses: actions/cache@v4
        id: venv-cache-security
        with:
          path: .venv
          key: venv-security-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'constraints/security.txt') }}
          restore-keys: |
            venv-security-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Create virtual environment
        if: steps.venv-cache-security.outputs.cache-hit != 'true'
        run: python -m venv .venv
      - name: Install dependencies
        if: steps.venv-cache-security.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -c constraints/security.txt -r requirements.txt
          .venv/bin/pip install -c constraints/security.txt -r requirements-dev.txt
      - name: Activate virtual environment
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Run static security analysis (Bandit)
        run: |
          python -m tools.security.sast \
            --fail-on-severity MEDIUM \
            --output reports/security/bandit.json \
            --summary reports/security/sast_summary.json
      - name: Run dynamic security probes
        run: python -m tools.security.dast_probe --report reports/security/dast_report.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/security/bandit.json
            reports/security/sast_summary.json
            reports/security/dast_report.json
