name: Security Policy Enforcement (OPA)

permissions:
  contents: read
  pull-requests: write
  security-events: write
  issues: write

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: security-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-enforcement:
    name: OPA Security Policy Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Install OPA (Open Policy Agent)
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Create security policies
        run: |
          mkdir -p .opa/policies

          # Policy 1: Secrets detection
          cat > .opa/policies/secrets.rego <<'EOF'
          package tradepulse.security.secrets

          import future.keywords.contains
          import future.keywords.if

          default allow = false

          # Deny hardcoded secrets
          deny[msg] {
            input.changes[_].content contains "password"
            input.changes[_].content contains "="
            msg := "Potential hardcoded password detected"
          }

          deny[msg] {
            input.changes[_].content contains "api_key"
            input.changes[_].content contains "="
            msg := "Potential hardcoded API key detected"
          }

          deny[msg] {
            input.changes[_].content contains "secret"
            input.changes[_].content contains "="
            not contains(input.changes[_].content, "SECRET_")
            msg := "Potential hardcoded secret detected"
          }

          # Allow if no secrets found
          allow if {
            count(deny) == 0
          }
          EOF

          # Policy 2: Secure coding practices
          cat > .opa/policies/secure_coding.rego <<'EOF'
          package tradepulse.security.coding

          import future.keywords.contains
          import future.keywords.if

          default allow = true

          # Deny SQL injection vulnerable patterns
          deny[msg] {
            input.changes[_].content contains "execute("
            input.changes[_].content contains "%s"
            msg := "Potential SQL injection vulnerability: string formatting in SQL query"
          }

          # Deny eval usage
          deny[msg] {
            input.changes[_].content contains "eval("
            msg := "Use of eval() is prohibited - security risk"
          }

          # Deny pickle usage without validation
          deny[msg] {
            input.changes[_].content contains "pickle.loads("
            not contains(input.changes[_].content, "validate_")
            msg := "Unsafe pickle.loads() usage - must validate input"
          }

          # Deny shell=True in subprocess
          deny[msg] {
            input.changes[_].content contains "subprocess"
            input.changes[_].content contains "shell=True"
            msg := "subprocess with shell=True is prohibited - command injection risk"
          }

          # Deny insecure random for security purposes
          deny[msg] {
            input.changes[_].content contains "random.randint"
            input.changes[_].content contains "token"
            msg := "Use secrets module instead of random for security tokens"
          }
          EOF

          # Policy 3: Dependency security
          cat > .opa/policies/dependencies.rego <<'EOF'
          package tradepulse.security.dependencies

          import future.keywords.contains
          import future.keywords.if

          default allow = true

          # Deny unpinned dependencies
          deny[msg] {
            input.file_path == "requirements.txt"
            line := input.changes[_].content
            contains(line, ">=")
            msg := sprintf("Unpinned dependency in requirements.txt: %s", [line])
          }

          # Deny known vulnerable packages
          vulnerable_packages := {
            "django": "< 4.2.0",
            "flask": "< 2.3.0",
            "requests": "< 2.31.0"
          }

          deny[msg] {
            pkg_name := input.changes[_].package
            vulnerable_packages[pkg_name]
            msg := sprintf("Vulnerable package version: %s %s", [pkg_name, vulnerable_packages[pkg_name]])
          }
          EOF

          # Policy 4: Container security
          cat > .opa/policies/containers.rego <<'EOF'
          package tradepulse.security.containers

          import future.keywords.contains
          import future.keywords.if

          default allow = true

          # Deny running as root in Dockerfile
          deny[msg] {
            input.file_path == "Dockerfile"
            not contains(input.content, "USER")
            msg := "Dockerfile must specify non-root USER"
          }

          # Deny latest tags
          deny[msg] {
            input.file_path == "Dockerfile"
            contains(input.content, ":latest")
            msg := "Do not use :latest tag in Dockerfile - pin specific versions"
          }

          # Require security scanning
          deny[msg] {
            input.file_path == "Dockerfile"
            not contains(input.content, "HEALTHCHECK")
            msg := "Dockerfile should include HEALTHCHECK instruction"
          }
          EOF

          echo "✓ Security policies created"

      - name: Generate policy test input
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          HEAD_REF="${{ github.event.pull_request.head.sha || github.sha }}"

          # Get changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_REF"..."$HEAD_REF" || git log -1 --name-only --pretty=format: || echo "")

          echo '{' > policy-input.json
          echo '  "changes": [' >> policy-input.json

          FIRST=true
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              if [ "$FIRST" = false ]; then
                echo ',' >> policy-input.json
              fi
              FIRST=false

              echo '    {' >> policy-input.json
              echo "      \"file\": \"$file\"," >> policy-input.json
              echo "      \"content\": $(jq -Rs . < "$file")" >> policy-input.json
              echo '    }' >> policy-input.json
            fi
          done

          echo '  ],' >> policy-input.json
          echo '  "file_path": "' >> policy-input.json
          echo '  "repository": "${{ github.repository }}",' >> policy-input.json
          echo '  "pr_number": "${{ github.event.pull_request.number || 0 }}"' >> policy-input.json
          echo '}' >> policy-input.json

          echo "✓ Policy input generated"

      - name: Evaluate security policies
        id: evaluate
        run: |
          echo "Evaluating security policies..."

          VIOLATIONS=0

          # Evaluate each policy
          for policy in .opa/policies/*.rego; do
            POLICY_NAME=$(basename "$policy" .rego)
            echo "Checking policy: $POLICY_NAME"

            # Run OPA evaluation
            opa eval -d "$policy" -i policy-input.json 'data.tradepulse.security' > "result-$POLICY_NAME.json" 2>&1 || {
              echo "⚠️  Policy $POLICY_NAME evaluation encountered issues"
              continue
            }

            # Check for denials
            DENIALS=$(jq -r '.result[].expressions[].value | select(. != null) | select(.deny != null) | .deny[]? // empty' "result-$POLICY_NAME.json" 2>/dev/null || echo "")

            if [ -n "$DENIALS" ]; then
              echo "❌ Policy violations in $POLICY_NAME:"
              echo "$DENIALS"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "✓ No violations in $POLICY_NAME"
            fi
          done

          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Total policy violations: $VIOLATIONS"
            exit 1
          else
            echo "✅ All security policies passed"
          fi

      - name: Check GitHub Actions workflow security
        id: workflow_security
        run: |
          echo "Checking GitHub Actions workflow security..."

          WORKFLOW_ISSUES=0

          # Check for workflow security best practices
          for workflow in .github/workflows/*.yml; do
            echo "Checking: $workflow"

            # Check for minimal permissions
            if ! grep -q "permissions:" "$workflow"; then
              echo "⚠️  $workflow: Missing explicit permissions"
              WORKFLOW_ISSUES=$((WORKFLOW_ISSUES + 1))
            fi

            # Check for pinned actions
            UNPINNED=$(grep -E 'uses:.*@[a-z]' "$workflow" || echo "")
            if [ -n "$UNPINNED" ]; then
              echo "⚠️  $workflow: Contains unpinned actions (should use SHA)"
              WORKFLOW_ISSUES=$((WORKFLOW_ISSUES + 1))
            fi

            # Check for pull_request_target with dangerous patterns
            if grep -q "pull_request_target:" "$workflow"; then
              if grep -q "github.event.pull_request.head.ref" "$workflow"; then
                echo "❌ $workflow: Unsafe pull_request_target usage"
                WORKFLOW_ISSUES=$((WORKFLOW_ISSUES + 1))
              fi
            fi
          done

          echo "workflow_issues=$WORKFLOW_ISSUES" >> $GITHUB_OUTPUT

          if [ "$WORKFLOW_ISSUES" -gt 0 ]; then
            echo "⚠️  Found $WORKFLOW_ISSUES workflow security issues"
          else
            echo "✅ All workflows follow security best practices"
          fi

      - name: Upload policy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-enforcement-results
          path: |
            policy-input.json
            result-*.json
            .opa/policies/*.rego
          if-no-files-found: warn

      - name: Post policy enforcement summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const violations = parseInt('${{ steps.evaluate.outputs.violations }}' || '0');
            const workflowIssues = parseInt('${{ steps.workflow_security.outputs.workflow_issues }}' || '0');

            const emoji = violations === 0 && workflowIssues === 0 ? '✅' : '❌';

            const body = [
              `## ${emoji} Security Policy Enforcement (OPA)`,
              '',
              '### Policy Evaluation Results',
              '',
              '| Policy Category | Status |',
              '|----------------|--------|',
              `| Secrets Detection | ${violations === 0 ? '✅ Passed' : '❌ Violations'} |`,
              `| Secure Coding | ${violations === 0 ? '✅ Passed' : '❌ Violations'} |`,
              `| Dependency Security | ${violations === 0 ? '✅ Passed' : '❌ Violations'} |`,
              `| Container Security | ${violations === 0 ? '✅ Passed' : '❌ Violations'} |`,
              `| Workflow Security | ${workflowIssues === 0 ? '✅ Passed' : '⚠️  Issues Found'} |`,
              '',
              '### Summary',
              `- **Policy Violations:** ${violations}`,
              `- **Workflow Issues:** ${workflowIssues}`,
              '',
              violations === 0 && workflowIssues === 0
                ? '✅ **All security policies passed**'
                : '❌ **Security policy violations detected** - Review the workflow logs',
              '',
              '### Security Policies Enforced',
              '- 🔒 No hardcoded secrets or credentials',
              '- 🔒 Safe coding practices (no eval, no shell=True)',
              '- 🔒 Pinned dependencies (no >= operators)',
              '- 🔒 Container security (non-root user, pinned images)',
              '- 🔒 Workflow security (minimal permissions, pinned actions)',
              '',
              '---',
              `*Last updated: ${new Date().toISOString()}*`
            ].join('\n');

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Security Policy Enforcement (OPA)')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }
