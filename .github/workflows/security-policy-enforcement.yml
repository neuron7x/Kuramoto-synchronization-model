name: Security Policy Enforcement (OPA)

permissions:
  contents: read
  pull-requests: write
  security-events: write
  issues: write

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: security-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-enforcement:
    name: OPA Security Policy Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install OPA (Open Policy Agent)
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Create security policies
        run: |
          mkdir -p .opa/policies
          
          # Policy 1: Secrets detection
          cat > .opa/policies/secrets.rego <<'EOF'
          package tradepulse.security.secrets
          
          import future.keywords.contains
          import future.keywords.if
          
          default allow = false
          
          # Deny hardcoded secrets
          deny[msg] {
            input.changes[_].content contains "password"
            input.changes[_].content contains "="
            msg := "Potential hardcoded password detected"
          }
          
          deny[msg] {
            input.changes[_].content contains "api_key"
            input.changes[_].content contains "="
            msg := "Potential hardcoded API key detected"
          }
          
          deny[msg] {
            input.changes[_].content contains "secret"
            input.changes[_].content contains "="
            not contains(input.changes[_].content, "SECRET_")
            msg := "Potential hardcoded secret detected"
          }
          
          # Allow if no secrets found
          allow if {
            count(deny) == 0
          }
          EOF
          
          # Policy 2: Secure coding practices
          cat > .opa/policies/secure_coding.rego <<'EOF'
          package tradepulse.security.coding
          
          import future.keywords.contains
          import future.keywords.if
          
          default allow = true
          
          # Deny SQL injection vulnerable patterns
          deny[msg] {
            input.changes[_].content contains "execute("
            input.changes[_].content contains "%s"
            msg := "Potential SQL injection vulnerability: string formatting in SQL query"
          }
          
          # Deny eval usage
          deny[msg] {
            input.changes[_].content contains "eval("
            msg := "Use of eval() is prohibited - security risk"
          }
          
          # Deny pickle usage without validation
          deny[msg] {
            input.changes[_].content contains "pickle.loads("
            not contains(input.changes[_].content, "validate_")
            msg := "Unsafe pickle.loads() usage - must validate input"
          }
          
          # Deny shell=True in subprocess
          deny[msg] {
            input.changes[_].content contains "subprocess"
            input.changes[_].content contains "shell=True"
            msg := "subprocess with shell=True is prohibited - command injection risk"
          }
          
          # Deny insecure random for security purposes
          deny[msg] {
            input.changes[_].content contains "random.randint"
            input.changes[_].content contains "token"
            msg := "Use secrets module instead of random for security tokens"
          }
          EOF
          
          # Policy 3: Dependency security
          cat > .opa/policies/dependencies.rego <<'EOF'
          package tradepulse.security.dependencies
          
          import future.keywords.contains
          import future.keywords.if
          
          default allow = true
          
          # Deny unpinned dependencies
          deny[msg] {
            input.file_path == "requirements.txt"
            line := input.changes[_].content
            contains(line, ">=")
            msg := sprintf("Unpinned dependency in requirements.txt: %s", [line])
          }
          
          # Deny known vulnerable packages
          vulnerable_packages := {
            "django": "< 4.2.0",
            "flask": "< 2.3.0",
            "requests": "< 2.31.0"
          }
          
          deny[msg] {
            pkg_name := input.changes[_].package
            vulnerable_packages[pkg_name]
            msg := sprintf("Vulnerable package version: %s %s", [pkg_name, vulnerable_packages[pkg_name]])
          }
          EOF
          
          # Policy 4: Container security
          cat > .opa/policies/containers.rego <<'EOF'
          package tradepulse.security.containers
          
          import future.keywords.contains
          import future.keywords.if
          
          default allow = true
          
          # Deny running as root in Dockerfile
          deny[msg] {
            input.file_path == "Dockerfile"
            not contains(input.content, "USER")
            msg := "Dockerfile must specify non-root USER"
          }
          
          # Deny latest tags
          deny[msg] {
            input.file_path == "Dockerfile"
            contains(input.content, ":latest")
            msg := "Do not use :latest tag in Dockerfile - pin specific versions"
          }
          
          # Require security scanning
          deny[msg] {
            input.file_path == "Dockerfile"
            not contains(input.content, "HEALTHCHECK")
            msg := "Dockerfile should include HEALTHCHECK instruction"
          }
          EOF
          
          echo "✓ Security policies created"

      - name: Generate policy test input
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          HEAD_REF="${{ github.event.pull_request.head.sha || github.sha }}"
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_REF"..."$HEAD_REF" || git log -1 --name-only --pretty=format: || echo "")
          
          echo '{' > policy-input.json
          echo '  "changes": [' >> policy-input.json
          
          FIRST=true
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              if [ "$FIRST" = false ]; then
                echo ',' >> policy-input.json
              fi
              FIRST=false
              
              echo '    {' >> policy-input.json
              echo "      \"file\": \"$file\"," >> policy-input.json
              echo "      \"content\": $(jq -Rs . < "$file")" >> policy-input.json
              echo '    }' >> policy-input.json
            fi
          done
          
          echo '  ],' >> policy-input.json
          echo '  "file_path": "' >> policy-input.json
          echo '  "repository": "${{ github.repository }}",' >> policy-input.json
          echo '  "pr_number": "${{ github.event.pull_request.number || 0 }}"' >> policy-input.json
          echo '}' >> policy-input.json
          
          echo "✓ Policy input generated"

      - name: Evaluate security policies
        id: evaluate
        continue-on-error: true
        run: |
          echo "Evaluating security policies..."
          
          VIOLATIONS=0
          
          # Evaluate each policy
          for policy in .opa/policies/*.rego; do
            POLICY_NAME=$(basename "$policy" .rego)
            echo "Checking policy: $POLICY_NAME"
            
            # Run OPA evaluation
            opa eval -d "$policy" -i policy-input.json 'data.tradepulse.security' > "result-$POLICY_NAME.json" 2>&1 || {
              echo "⚠️  Policy $POLICY_NAME evaluation encountered issues"
              continue
            }
            
            # Check for denials
            DENIALS=$(jq -r '.result[].expressions[].value | select(. != null) | select(.deny != null) | .deny[]? // empty' "result-$POLICY_NAME.json" 2>/dev/null || echo "")
            
            if [ -n "$DENIALS" ]; then
              echo "❌ Policy violations in $POLICY_NAME:"
              echo "$DENIALS"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "✓ No violations in $POLICY_NAME"
            fi
          done
          
          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Total policy violations: $VIOLATIONS"
          else
            echo "✅ All security policies passed"
          fi

      - name: Check GitHub Actions workflow security
        id: workflow_security
        run: |
          echo "Checking GitHub Actions workflow security..."
          echo "Using two-level policy: DENY (HIGH/CRITICAL) and WARN (MEDIUM/LOW)"
          echo ""
          
          HIGH_ISSUES=0
          MEDIUM_ISSUES=0
          HIGH_DETAILS=""
          MEDIUM_DETAILS=""
          
          # Check for workflow security best practices
          for workflow in .github/workflows/*.yml; do
            WORKFLOW_NAME=$(basename "$workflow")
            echo "Checking: $WORKFLOW_NAME"
            
            # HIGH/CRITICAL: Check for write-all permissions
            # Only match actual YAML permissions block, not comments or strings
            if grep -E "^[[:space:]]*permissions:[[:space:]]*write-all" "$workflow" >/dev/null 2>&1; then
              echo "❌ HIGH: $WORKFLOW_NAME has write-all permissions"
              HIGH_ISSUES=$((HIGH_ISSUES + 1))
              HIGH_DETAILS="${HIGH_DETAILS}${WORKFLOW_NAME}: write-all permissions detected\n"
            fi
            
            # HIGH/CRITICAL: Check for unsafe pull_request_target usage
            # Only match actual YAML trigger, not comments or strings
            if grep -E "^[[:space:]]*pull_request_target:" "$workflow" >/dev/null 2>&1; then
              # Check if it checks out PR head (dangerous)
              if grep -A 5 -E "^[[:space:]]*pull_request_target:" "$workflow" | grep -q "github.event.pull_request.head"; then
                echo "❌ HIGH: $WORKFLOW_NAME has unsafe pull_request_target with PR code execution"
                HIGH_ISSUES=$((HIGH_ISSUES + 1))
                HIGH_DETAILS="${HIGH_DETAILS}${WORKFLOW_NAME}: Unsafe pull_request_target usage\n"
              fi
            fi
            
            # HIGH/CRITICAL: Check for unpinned actions in security-sensitive workflows
            # Only flag as HIGH if workflow handles secrets or has write permissions
            if grep -q "secrets\." "$workflow" || grep -q "permissions:.*write" "$workflow"; then
              UNPINNED=$(grep -E 'uses:.*@[a-z]+(-[a-z]+)*$' "$workflow" | grep -v '@v[0-9]' || echo "")
              if [ -n "$UNPINNED" ]; then
                echo "❌ HIGH: $WORKFLOW_NAME contains unpinned actions in security-sensitive workflow"
                HIGH_ISSUES=$((HIGH_ISSUES + 1))
                HIGH_DETAILS="${HIGH_DETAILS}${WORKFLOW_NAME}: Unpinned actions with secrets/write access\n"
              fi
            fi
            
            # MEDIUM: Check for missing explicit permissions
            if ! grep -q "^permissions:" "$workflow"; then
              echo "⚠️  MEDIUM: $WORKFLOW_NAME missing explicit permissions block"
              MEDIUM_ISSUES=$((MEDIUM_ISSUES + 1))
              MEDIUM_DETAILS="${MEDIUM_DETAILS}${WORKFLOW_NAME}: Missing explicit permissions\n"
            fi
            
            # LOW: Check for missing timeout
            if ! grep -q "timeout-minutes:" "$workflow"; then
              echo "ℹ️  LOW: $WORKFLOW_NAME missing timeout-minutes"
              # Count as medium for reporting purposes
              MEDIUM_ISSUES=$((MEDIUM_ISSUES + 1))
              MEDIUM_DETAILS="${MEDIUM_DETAILS}${WORKFLOW_NAME}: Missing timeout-minutes\n"
            fi
            
            # LOW: Check for missing concurrency control
            if ! grep -q "concurrency:" "$workflow"; then
              echo "ℹ️  LOW: $WORKFLOW_NAME missing concurrency control"
              MEDIUM_ISSUES=$((MEDIUM_ISSUES + 1))
              MEDIUM_DETAILS="${MEDIUM_DETAILS}${WORKFLOW_NAME}: Missing concurrency control\n"
            fi
          done
          
          echo ""
          echo "=== Security Scan Summary ==="
          echo "HIGH/CRITICAL Issues: $HIGH_ISSUES"
          echo "MEDIUM/LOW Issues: $MEDIUM_ISSUES"
          
          # Export results
          echo "high_issues=$HIGH_ISSUES" >> $GITHUB_OUTPUT
          echo "medium_issues=$MEDIUM_ISSUES" >> $GITHUB_OUTPUT
          echo "high_details<<EOF" >> $GITHUB_OUTPUT
          echo -e "$HIGH_DETAILS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "medium_details<<EOF" >> $GITHUB_OUTPUT
          echo -e "$MEDIUM_DETAILS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ "$HIGH_ISSUES" -gt 0 ]; then
            echo ""
            echo "❌ CRITICAL: Found $HIGH_ISSUES HIGH/CRITICAL security issues"
            echo "These must be fixed before merging."
          else
            echo ""
            echo "✅ No HIGH/CRITICAL security issues found"
          fi
          
          if [ "$MEDIUM_ISSUES" -gt 0 ]; then
            echo ""
            echo "⚠️  Found $MEDIUM_ISSUES MEDIUM/LOW issues (warnings only)"
            echo "These should be addressed but won't block the PR."
          fi

      - name: Upload policy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-enforcement-results
          path: |
            policy-input.json
            result-*.json
            .opa/policies/*.rego
          if-no-files-found: warn

      - name: Post policy enforcement summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const violations = parseInt('${{ steps.evaluate.outputs.violations }}' || '0');
            const highIssues = parseInt('${{ steps.workflow_security.outputs.high_issues }}' || '0');
            const mediumIssues = parseInt('${{ steps.workflow_security.outputs.medium_issues }}' || '0');
            const highDetails = `${{ steps.workflow_security.outputs.high_details }}`;
            const mediumDetails = `${{ steps.workflow_security.outputs.medium_details }}`;
            
            const hasBlockingIssues = violations > 0 || highIssues > 0;
            const emoji = hasBlockingIssues ? '❌' : (mediumIssues > 0 ? '⚠️' : '✅');
            
            let highIssuesSection = '';
            if (highIssues > 0) {
              highIssuesSection = [
                '',
                '### ❌ HIGH/CRITICAL Issues (Blocking)',
                '',
                '```',
                highDetails,
                '```',
                '',
                '**Action Required:** These issues must be fixed before merging.',
                'See [Workflow Security Policy](../../docs/compliance/workflow-security.md) for guidance.'
              ].join('\n');
            }
            
            let mediumIssuesSection = '';
            if (mediumIssues > 0) {
              mediumIssuesSection = [
                '',
                '### ⚠️ MEDIUM/LOW Issues (Warnings)',
                '',
                '<details>',
                '<summary>Click to expand</summary>',
                '',
                '```',
                mediumDetails,
                '```',
                '',
                '</details>',
                '',
                '**Note:** These are warnings only and will not block the PR.',
                'Please address them in a follow-up PR if possible.'
              ].join('\n');
            }
            
            const body = [
              `## ${emoji} Security Policy Enforcement (OPA)`,
              '',
              '### Summary',
              '',
              '| Category | Status | Count |',
              '|----------|--------|-------|',
              `| Code Policy Violations | ${violations === 0 ? '✅ Pass' : '❌ Fail'} | ${violations} |`,
              `| HIGH/CRITICAL Workflow Issues | ${highIssues === 0 ? '✅ Pass' : '❌ Fail'} | ${highIssues} |`,
              `| MEDIUM/LOW Workflow Issues | ⚠️ Warn | ${mediumIssues} |`,
              '',
              highIssues === 0 && violations === 0
                ? '✅ **All blocking security checks passed**'
                : '❌ **Security issues detected** - Review details below',
              highIssuesSection,
              mediumIssuesSection,
              '',
              '### Policies Enforced',
              '',
              '**Code Security:**',
              '- 🔒 No hardcoded secrets or credentials',
              '- 🔒 Safe coding practices (no eval, no shell=True)',
              '- 🔒 Secure dependencies',
              '',
              '**Workflow Security:**',
              '- 🔒 Minimal permissions (deny write-all)',
              '- 🔒 Safe pull_request_target usage',
              '- 🔒 Pinned actions in security-sensitive workflows',
              '- ⚠️ Explicit permissions declaration (recommended)',
              '- ⚠️ Timeout and concurrency controls (recommended)',
              '',
              '📖 **Policy Reference:** [Workflow Security Policy](../../docs/compliance/workflow-security.md)',
              '',
              '---',
              `*Last updated: ${new Date().toISOString()}*`
            ].join('\n');
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Security Policy Enforcement (OPA)')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }

      - name: Fail on HIGH/CRITICAL issues
        if: steps.evaluate.outputs.violations != '0' || steps.workflow_security.outputs.high_issues != '0'
        run: |
          echo "❌ SECURITY POLICY ENFORCEMENT FAILED"
          echo ""
          echo "=== Blocking Issues Found ==="
          
          VIOLATIONS='${{ steps.evaluate.outputs.violations }}'
          HIGH_ISSUES='${{ steps.workflow_security.outputs.high_issues }}'
          
          if [ "$VIOLATIONS" != "0" ]; then
            echo "Code Policy Violations: $VIOLATIONS"
            echo "Review the policy evaluation logs above for details."
          fi
          
          if [ "$HIGH_ISSUES" != "0" ]; then
            echo "HIGH/CRITICAL Workflow Security Issues: $HIGH_ISSUES"
            echo "Review the workflow security check logs above for details."
            echo ""
            echo "Common fixes:"
            echo "  - Replace 'permissions: write-all' with minimal permissions"
            echo "  - Use 'pull_request' instead of 'pull_request_target'"
            echo "  - Pin actions to specific versions in security-sensitive workflows"
          fi
          
          echo ""
          echo "See docs/compliance/workflow-security.md for guidance."
          exit 1
      
      - name: Log MEDIUM/LOW warnings
        if: steps.workflow_security.outputs.medium_issues != '0'
        run: |
          echo "⚠️  WARNINGS: Found ${{ steps.workflow_security.outputs.medium_issues }} MEDIUM/LOW issues"
          echo ""
          echo "These are warnings only and will not block the PR."
          echo "Please consider addressing them in a follow-up PR:"
          echo "  - Add explicit 'permissions:' blocks to all workflows"
          echo "  - Add 'timeout-minutes:' to prevent runaway jobs"
          echo "  - Add 'concurrency:' with 'cancel-in-progress' to save resources"
          echo ""
          echo "These recommendations improve security and resource efficiency."
