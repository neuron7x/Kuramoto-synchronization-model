# SPDX-License-Identifier: MIT
#
# Verification-first release gate — the single machine entrypoint for
# release readiness. Reduces the A–R release contract to probes that
# return machine results; the verdict is GREEN only if every gating probe
# is GREEN (no RED, no unresolved MANUAL). This is intentionally NOT a
# per-PR required check — it is a release-readiness signal run on demand
# (workflow_dispatch), weekly (schedule), and on main (push) so the
# current verdict is always reproducible and visible.
name: Release Gate

on:
  workflow_dispatch:
    inputs:
      deep:
        description: "Run heavy clean-room wheel probes (--deep)"
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    branches: [main]
    paths:
      - "scripts/ci/release_gate.py"
      - "tests/scripts/test_release_gate.py"
      - ".github/workflows/release-gate.yml"

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run release gate
        id: gate
        run: |
          DEEP=""
          if [ "${{ github.event_name }}" != "push" ]; then DEEP="--deep"; fi
          python scripts/ci/release_gate.py $DEEP --json release_status.json | tee release_gate.log

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-status
          path: |
            release_status.json
            release_gate.log
          if-no-files-found: warn
