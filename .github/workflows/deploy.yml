name: Deployment & Infrastructure Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy-validation:
    name: Validate deployment assets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHON_VERSION: "3.11"
      TRADEPULSE_HTTP_PORT: "8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install dependencies for Terratest
        run: |
          go mod download

      - name: Run Terratest validation
        env:
          TF_IN_AUTOMATION: "true"
        run: |
          go test ./infra/terraform/tests/...

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.1"

      - name: Install kubeval
        run: |
          set -euo pipefail
          curl -sSL https://github.com/instrumenta/kubeval/releases/download/v0.16.1/kubeval-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeval
          sudo chmod +x /usr/local/bin/kubeval

      - name: Validate Kubernetes manifests
        env:
          KUBERNETES_VERSION: "1.25.0"
        run: |
          set -euo pipefail
          mkdir -p build/manifests
          kustomize build deploy/kustomize/overlays/staging > build/manifests/staging.yaml
          kustomize build deploy/kustomize/overlays/production > build/manifests/production.yaml
          kubeval --kubernetes-version "$KUBERNETES_VERSION" --ignore-missing-schemas --strict build/manifests/staging.yaml
          kubeval --kubernetes-version "$KUBERNETES_VERSION" --ignore-missing-schemas --strict build/manifests/production.yaml
          kubeval --kubernetes-version "$KUBERNETES_VERSION" --ignore-missing-schemas --strict deploy/tradepulse-deployment.yaml
          kubeval --kubernetes-version "$KUBERNETES_VERSION" --ignore-missing-schemas --strict deploy/tradepulse-service.yaml

      - name: Prepare env for docker-compose smoke
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          : "${TRADEPULSE_HTTP_PORT:=8000}"
          echo "TRADEPULSE_HTTP_PORT=${TRADEPULSE_HTTP_PORT}" >> .env

      - name: Start compose stack (CI-prep)
        run: |
          # ensure images are built/pulled and dependent services start before smoke
          docker compose --env-file .env -f docker-compose.yml up -d --build
          # wait for postgres and elasticsearch to report healthy (timeout after 10m)
          deadline=$((SECONDS + 600))
          services_ok=false
          while [ $SECONDS -lt $deadline ]; do
            pg_id=$(docker compose -f docker-compose.yml ps -q db || true)
            es_id=$(docker compose -f docker-compose.yml ps -q elasticsearch || true)
            ok=true
            if [ -n "$pg_id" ]; then
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$pg_id" 2>/dev/null || echo "")
              if [ "$status" != "healthy" ] && [ "$status" != "running" ]; then ok=false; fi
            fi
            if [ -n "$es_id" ]; then
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$es_id" 2>/dev/null || echo "")
              if [ "$status" != "healthy" ] && [ "$status" != "running" ]; then ok=false; fi
            fi
            if $ok; then services_ok=true; break; fi
            sleep 5
          done
          if ! $services_ok; then
            echo "Dependent services did not become healthy within timeout" >&2
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs --tail=200
            exit 1
          fi

      - name: Run docker-compose smoke
        env:
          TRADEPULSE_HTTP_PORT: ${{ env.TRADEPULSE_HTTP_PORT }}
        run: |
          # run smoke test with longer timeout and reasonable http timeout
          python scripts/deploy/docker_compose_smoke.py --compose-file docker-compose.yml --artifact-dir artifacts/deploy-smoke --timeout 900 --http-timeout 15

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-artifacts
          path: artifacts/deploy-smoke

