name: Build & Verify Python Wheels

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: build-wheels-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            pyproject.toml
            constraints/security.txt

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-wheels-${{ matrix.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'pyproject.toml', 'constraints/security.txt') }}
          restore-keys: |
            pip-wheels-${{ matrix.os }}-py${{ matrix.python-version }}-

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel>=2.16"

      - name: Build wheels
        env:
          CIBW_BUILD: "cp${{ replace(matrix.python-version, '.', '') }}-*"
          CIBW_SKIP: "pp*"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MUSLLINUX_X86_64_IMAGE: "musllinux_1_2"
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: List built wheels
        run: |
          python - <<'PY'
          import pathlib

          wheel_dir = pathlib.Path("wheelhouse")
          if not wheel_dir.exists():
              raise SystemExit("wheelhouse directory not found")

          wheels = sorted(wheel_dir.glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheels were produced")

          print("Built wheels:\n")
          for path in wheels:
              size = path.stat().st_size
              print(f"  {path.name} ({size / 1024 / 1024:.2f} MiB)")
          PY

      - name: Verify Linux wheels with auditwheel
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install auditwheel
          for whl in wheelhouse/*.whl; do
            if [[ "$whl" == *manylinux* || "$whl" == *musllinux* ]]; then
              auditwheel show "$whl"
            fi
          done

      - name: Verify macOS wheels with delocate
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip install delocate
          for whl in wheelhouse/*.whl; do
            delocate-listdeps "$whl"
            delocate-wheel --check-archs universal2 "$whl"
          done

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
