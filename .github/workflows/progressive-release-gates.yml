name: Progressive Release Gates

on:
  push:
    branches:
      - main
  # PRs disabled - progressive release gates only needed for actual releases
  # Single developer workflow doesn't need progressive rollout validation on PRs
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run release gates evaluation
        run: python -m tacl.release_gates --config ci/release_gates.yml

      - name: Upload release gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-report
          path: |
            .ci_artifacts/release_gates.json
            .ci_artifacts/release_gates.md
