name: neural-controller-ci

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'tradepulse/neural_controller/**'
      - '.github/workflows/neural-controller-ci.yml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements*.txt'
  workflow_dispatch:

concurrency:
  group: neural-controller-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install numpy pyyaml pytest coverage; fi
      - name: Run pytest
        env:
          TRADEPULSE_LIGHT_IMPORT: '1'
        run: |
          pytest tradepulse/neural_controller/tests --maxfail=1 --durations=10 --cov=tradepulse/neural_controller --cov-report=xml
      - name: Coverage gate
        run: coverage report --fail-under=85

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/ci

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: github/codeql-action/init@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v3
      - uses: github/codeql-action/analyze@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v3
