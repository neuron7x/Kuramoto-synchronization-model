name: neural-controller-ci

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/tradepulse/neural_controller/**'
      - '.github/workflows/neural-controller-ci.yml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements*.txt'
  workflow_dispatch:

concurrency:
  group: neural-controller-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      TRADEPULSE_LIGHT_IMPORT: '1'
      COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc.neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install numpy pyyaml pytest coverage pytest-cov; fi
      - name: Preflight paths
        run: |
          pwd
          ls -la
          ls -la src/tradepulse/neural_controller/tests || true
          if [ ! -d src/tradepulse/neural_controller/tests ]; then
            git ls-files | rg "neural_controller|tests" -n || true
            exit 1
          fi
      - name: Run pytest
        run: |
          python -m pytest src/tradepulse/neural_controller/tests --maxfail=1 --durations=10 --cov=tradepulse.neural_controller --cov-report=xml
      - name: Coverage gate
        run: coverage report --fail-under=0

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
