name: Documentation Freshness Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'DOCUMENTATION_SUMMARY.md'
      - '**/*.md'
  schedule:
    - cron: '0 6 1 */3 *'  # Quarterly on the first day of the quarter

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Determine changed markdown files
        id: changed_markdown
        if: github.event_name == 'pull_request'
        run: |
          set -eo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          git fetch origin "$base_sha" "$head_sha" --depth=200 || true

          range="${base_sha}...${head_sha}"
          echo "Checking git diff range: $range"

          mapfile -t files < <(git -c core.quotePath=false diff --name-only "$range" -- '*.md' '*.markdown' '*.mdx' | grep -v '^$' || true)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "✅ No markdown files changed - skipping freshness check"
            echo "has_md_changes=false" >> "$GITHUB_OUTPUT"
            echo "md_files_csv=" >> "$GITHUB_OUTPUT"
            echo "## 📅 Documentation Freshness: Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No markdown files were modified in this change." >> "$GITHUB_STEP_SUMMARY"
          else
            md_files_csv=$(IFS=,; echo "${files[*]}")
            echo "has_md_changes=true" >> "$GITHUB_OUTPUT"
            echo "md_files_csv=${md_files_csv}" >> "$GITHUB_OUTPUT"

            echo "## 📅 Documentation Freshness: Active" >> "$GITHUB_STEP_SUMMARY"
            echo "Checking ${#files[@]} file(s):" >> "$GITHUB_STEP_SUMMARY"
            for file in "${files[@]}"; do
              echo "- $file" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Run freshness check (PR)
        if: github.event_name == 'pull_request' && steps.changed_markdown.outputs.has_md_changes == 'true'
        run: |
          python scripts/docs/check_freshness.py \
            --paths ${steps.changed_markdown.outputs.md_files_csv//,/ } \
            --format markdown \
            --output freshness_report.md \
            --fail-on-stale \
            --fail-on-metadata

      - name: Run freshness snapshot (quarterly)
        if: github.event_name == 'schedule'
        run: |
          quarter=$(( (10#$(date +%m)-1)/3 + 1 ))
          report_path="reports/docs/quarterly/$(date +%Y)-Q${quarter}.md"
          python scripts/docs/check_freshness.py --format markdown --output "$report_path"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"

      - name: Upload freshness report
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-freshness-report
          path: reports/docs/quarterly/*.md

      - name: Publish report summary
        if: github.event_name == 'schedule'
        run: |
          echo "## 📅 Documentation Freshness Snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n +1 reports/docs/quarterly/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PR report summary
        if: github.event_name == 'pull_request' && steps.changed_markdown.outputs.has_md_changes == 'true'
        run: |
          echo "## 📅 Documentation Freshness Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n +1 freshness_report.md >> "$GITHUB_STEP_SUMMARY"
