name: PromptOps Validator

on:
  pull_request:
    paths:
      - "examples/promptops/**"
      - "schemas/promptops/**"
      - "tools/promptops_validate.py"
      - "tools/promptops_shadow_runner.py"
      - "tests/promptops/**"
      - ".github/workflows/promptops-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promptops-validator:
    name: PromptOps contract gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Validate schema JSON
        run: |
          python -m json.tool schemas/promptops/system_prompt_contract.schema.json >/tmp/promptops_schema.json

      - name: Validate example prompt artifacts
        run: |
          python tools/promptops_validate.py examples/promptops --report artifacts/promptops/validation_report.json

      - name: Run deterministic shadow cases
        run: |
          python tools/promptops_shadow_runner.py examples/promptops --report artifacts/promptops/shadow_report.json

      - name: Run isolated PromptOps tests
        run: |
          python -m pytest tests/promptops/test_promptops_validate.py tests/promptops/test_promptops_shadow_runner.py -q --confcutdir=tests/promptops

      - name: Upload PromptOps reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: promptops-reports
          path: artifacts/promptops/*.json
          if-no-files-found: ignore
