name: PR Size Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-size-labeler-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-pr-size:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            // Define size labels
            const sizeLabels = [
              { name: 'size/XS', color: '00ff00', description: 'Extra small PR (0-9 lines)', min: 0, max: 9 },
              { name: 'size/S', color: '77ff00', description: 'Small PR (10-49 lines)', min: 10, max: 49 },
              { name: 'size/M', color: 'ffff00', description: 'Medium PR (50-249 lines)', min: 50, max: 249 },
              { name: 'size/L', color: 'ff9900', description: 'Large PR (250-999 lines)', min: 250, max: 999 },
              { name: 'size/XL', color: 'ff0000', description: 'Extra large PR (1000+ lines)', min: 1000, max: Infinity },
            ];

            // Ensure all size labels exist
            for (const label of sizeLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                }
              }
            }

            // Get PR changes
            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const additions = pr.data.additions || 0;
            const deletions = pr.data.deletions || 0;
            const totalChanges = additions + deletions;

            // Determine appropriate size label
            let sizeLabel = null;
            for (const label of sizeLabels) {
              if (totalChanges >= label.min && totalChanges <= label.max) {
                sizeLabel = label.name;
                break;
              }
            }

            // Get current labels
            const currentLabels = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: pull_number
            });

            const currentLabelNames = currentLabels.data.map(l => l.name);

            // Remove old size labels
            for (const label of sizeLabels) {
              if (currentLabelNames.includes(label.name) && label.name !== sizeLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pull_number,
                    name: label.name
                  });
                } catch (error) {
                  // Ignore if label doesn't exist
                }
              }
            }

            // Add new size label
            if (sizeLabel && !currentLabelNames.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [sizeLabel]
              });
            }

            // Add comment for very large PRs
            if (totalChanges >= 1000) {
              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: pull_number
              });

              const botComment = comments.data.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('⚠️ This PR is quite large')
              );

              if (!botComment) {
                const largeprMessage = [
                  `⚠️ This PR is quite large (${totalChanges} lines changed).`,
                  'Consider splitting it into smaller, more focused PRs for easier review and testing.',
                  '',
                  '**Benefits of smaller PRs:**',
                  '- Faster code review',
                  '- Easier to test',
                  '- Simpler to revert if needed',
                  '- Better git history'
                ].join('\n');

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: largeprMessage
                });
              }
            }

            console.log(`PR #${pull_number}: ${totalChanges} lines changed → ${sizeLabel}`);
