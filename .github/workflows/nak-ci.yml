name: nak-ci

on:
  push:
    branches: [ main, develop, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./nak_controller
          pip install pytest pytest-cov mypy ruff black bandit
      - name: Lint & format check
        run: |
          ruff check nak_controller
          black --check nak_controller
      - name: Types
        run: |
          mypy --strict nak_controller
      - name: Security (Bandit)
        run: |
          bandit -r nak_controller -x nak_controller/tests
      - name: Tests + Coverage
        run: |
          pytest -q --cov=nak_controller --cov-report=xml:coverage.xml nak_controller/tests
      - name: Upload coverage & junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
