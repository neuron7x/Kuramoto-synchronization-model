name: nak-ci

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'nak_controller/**'
      - '.github/workflows/nak-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'nak_controller/**'
      - '.github/workflows/nak-ci.yml'

concurrency:
  group: nak-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAK_SEED: "1337"
      PYTHONHASHSEED: "0"
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check for hidden Unicode markers
        shell: bash
        run: |
          set -o pipefail
          if git ls-files -z | xargs -0 grep --binary-files=without-match -nP '[\x{200E}\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]'; then
            echo "Hidden Unicode control characters detected" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./nak_controller
          pip install pytest pytest-cov mypy ruff black bandit
      - name: Validate NaK configuration
        run: |
          python - <<'PY' > yaml-validation.log
          from pathlib import Path
          import yaml
          from nak_controller.core.config import NakConfig

          raw = yaml.safe_load(Path("nak_controller/conf/nak.yaml").read_text(encoding="utf-8"))
          NakConfig(**raw["nak"])
          print("nak_controller/conf/nak.yaml: OK")
          PY
      - name: Lint & format check
        run: |
          ruff check nak_controller
          black --check nak_controller
      - name: Types
        run: |
          mypy --strict nak_controller
      - name: Security (Bandit)
        run: |
          bandit -r nak_controller -x nak_controller/tests
      - name: Tests + Coverage
        run: |
          pytest -q --cov=nak_controller --cov-report=xml:coverage.xml --junitxml=junit.xml nak_controller/tests
      - name: Upload coverage & junit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
            yaml-validation.log
