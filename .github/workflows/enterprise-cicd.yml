name: CI/CD - Enterprise Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: false
        default: staging
        type: choice
        options:
          - staging
          - production
      rollout_strategy:
        description: "Rollout strategy for production releases"
        required: false
        default: canary
        type: choice
        options:
          - canary
          - blue-green
          - direct

concurrency:
  group: enterprise-cicd-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: ${{ github.workspace }}

env:
  PYTHON_VERSION: "3.11"
  UV_CACHE_DIR: ~/.cache/uv
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

permissions:
  contents: read
  id-token: write
  packages: write
  pull-requests: write

jobs:
  quality-gate:
    name: "Quality Gate · Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'pyproject.toml') }}

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: lint-pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Create virtual environment
        run: uv venv

      - name: Install quality tooling
        run: |
          uv pip install -c constraints/security.txt -r requirements.txt
          uv pip install -c constraints/security.txt -r requirements-dev.txt
          uv pip install pre-commit detect-secrets bandit

      - name: Run ruff
        run: .venv/bin/ruff check .

      - name: Run black
        run: .venv/bin/black --check .

      - name: Run mypy
        run: .venv/bin/mypy

      - name: Run slotscheck
        run: .venv/bin/python -m slotscheck --module core --module backtest --module execution

      - name: Run detect-secrets baseline verification
        run: |
          set -euo pipefail
          scan_output="$(mktemp)"
          .venv/bin/detect-secrets scan core backtest execution src application >"$scan_output"
          python - <<'PY' "$scan_output"
          import json
          import sys

          path = sys.argv[1]
          data = json.loads(open(path, encoding="utf-8").read())
          results = data.get("results", {})
          violations = sum(len(entries) for entries in results.values())
          if violations:
              message = [
                  "Potential secrets detected in privileged modules:",
                  json.dumps(results, indent=2, sort_keys=True),
              ]
              raise SystemExit("\n".join(message))
          PY

      - name: Run bandit
        run: .venv/bin/bandit -r core backtest execution src

  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'pyproject.toml') }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -c constraints/security.txt -r requirements.txt
          uv pip install -c constraints/security.txt -r requirements-dev.txt

      - name: Prepare report directories
        run: mkdir -p reports

      - name: Run fast unit tests
        run: |
          .venv/bin/python -m pytest tests/unit tests/core tests/execution \
            -m "not slow and not heavy_math and not nightly" \
            --junitxml=reports/unit-tests.xml \
            --cov=core --cov=backtest --cov=execution \
            --cov-report=xml --cov-report=term-missing --cov-branch

      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: |
            reports/unit-tests.xml
            coverage.xml
            .coverage
          if-no-files-found: error

  integration-tests:
    name: "Integration & E2E Tests"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'pyproject.toml') }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -c constraints/security.txt -r requirements.txt
          uv pip install -c constraints/security.txt -r requirements-dev.txt

      - name: Prepare report directories
        run: |
          mkdir -p reports

      - name: Run integration tests
        run: |
          .venv/bin/python -m pytest tests/integration tests/e2e \
            --junitxml=reports/integration-tests.xml \
            --html=reports/integration-report.html --self-contained-html \
            --cov=core --cov=execution --cov-report=xml:integration-coverage.xml \
            --cov-branch

      - name: Run property-based and security smoke tests
        run: |
          .venv/bin/python -m pytest tests/property tests/security \
            --junitxml=reports/property-security-tests.xml \
            --html=reports/property-security-report.html --self-contained-html

      - name: Upload integration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests
          path: |
            reports
            integration-coverage.xml
          if-no-files-found: error

  load-test:
    name: "Load Test · k6"
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 load test
        uses: grafana/k6-action@v0.2.0
        with:
          filename: deploy/loadtests/hpa-k6.js
          flags: --vus 50 --duration 5m

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: ./k6-summary.json
          if-no-files-found: warn

  build-container:
    name: "Build & Publish Container"
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name != 'pull_request'
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      IMAGE_TAG: ci-${{ github.sha }}
    outputs:
      image_ref: ${{ steps.image-metadata.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ github.ref_name }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Record image metadata
        id: image-metadata
        run: |
          image_ref="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "image_ref=$image_ref" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign container image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ${{ steps.image-metadata.outputs.image_ref }}

  vulnerability-scan:
    name: "Container Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: build-container
    if: needs.build-container.result == 'success'
    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ needs.build-container.outputs.image_ref }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: 15m
          ignore-unfixed: true

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ needs.build-container.outputs.image_ref }}
          format: 'sarif'
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: error

  infrastructure-plan:
    name: "Infrastructure Plan"
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    outputs:
      environment: ${{ steps.resolve-env.outputs.environment }}
      plan_path: ${{ steps.plan.outputs.plan_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: resolve-env
        run: |
          env_name="${TARGET_ENVIRONMENT:-staging}"
          if [ ! -f "infra/terraform/eks/environments/${env_name}.tfvars" ]; then
            echo "::error::Unknown terraform environment '${env_name}'."
            exit 1
          fi
          echo "environment=$env_name" >>"$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init (backend disabled)
        run: terraform -chdir=infra/terraform/eks init -backend=false -input=false

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/eks fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/eks validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          env_name="${{ steps.resolve-env.outputs.environment }}"
          terraform -chdir=infra/terraform/eks plan \
            -var-file="environments/${env_name}.tfvars" \
            -out="tfplan-${env_name}.binary" \
            -no-color -input=false
          terraform -chdir=infra/terraform/eks show -json "tfplan-${env_name}.binary" >"tfplan-${env_name}.json"
          echo "plan_path=infra/terraform/eks/tfplan-${env_name}.json" >>"$GITHUB_OUTPUT"

      - name: Upload terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/eks/tfplan-${{ steps.resolve-env.outputs.environment }}.json
          if-no-files-found: error

  check-deployment-secrets:
    name: "Check Deployment Readiness"
    runs-on: ubuntu-latest
    needs:
      - build-container
      - vulnerability-scan
      - infrastructure-plan
    if: github.event_name != 'pull_request'
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
      cluster_name: ${{ steps.check.outputs.cluster_name }}
      role: ${{ steps.check.outputs.role }}
    steps:
      - name: Check deployment credentials
        id: check
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.infrastructure-plan.outputs.environment }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_STAGING_ROLE_ARN: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          AWS_PRODUCTION_ROLE_ARN: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
          AWS_STAGING_CLUSTER_NAME: ${{ secrets.AWS_STAGING_CLUSTER_NAME }}
          AWS_PRODUCTION_CLUSTER_NAME: ${{ secrets.AWS_PRODUCTION_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          env_name="${DEPLOY_ENVIRONMENT:-staging}"
          if [ "$env_name" = "production" ]; then
            role="${AWS_PRODUCTION_ROLE_ARN:-}"
            cluster="${AWS_PRODUCTION_CLUSTER_NAME:-}"
          else
            role="${AWS_STAGING_ROLE_ARN:-}"
            cluster="${AWS_STAGING_CLUSTER_NAME:-}"
          fi
          if [ -z "${AWS_REGION:-}" ] || [ -z "$role" ] || [ -z "$cluster" ]; then
            echo "⚠️  AWS deployment credentials are incomplete; skipping deployment." >&2
            echo "This is expected for repositories without AWS infrastructure configured."
            echo "can_deploy=false" >>"$GITHUB_OUTPUT"
            echo "cluster_name=" >>"$GITHUB_OUTPUT"
            echo "role=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ Deployment credentials are configured for ${env_name}"
          echo "role=$role" >>"$GITHUB_OUTPUT"
          echo "cluster_name=$cluster" >>"$GITHUB_OUTPUT"
          echo "can_deploy=true" >>"$GITHUB_OUTPUT"

  deploy-canary:
    name: "Canary Deployment"
    runs-on: ubuntu-latest
    needs:
      - build-container
      - infrastructure-plan
      - check-deployment-secrets
    if: needs.check-deployment-secrets.outputs.can_deploy == 'true'
    environment:
      name: ${{ needs.infrastructure-plan.outputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.infrastructure-plan.outputs.environment }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      IMAGE_REF: ${{ needs.build-container.outputs.image_ref }}
    outputs:
      deploy_enabled: ${{ steps.resolve.outputs.deploy_enabled }}
      cluster_name: ${{ steps.resolve.outputs.cluster_name }}
      role: ${{ steps.resolve.outputs.role }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment credentials
        id: resolve
        run: |
          set -euo pipefail
          # These values are already validated by check-deployment-secrets job
          echo "role=${{ needs.check-deployment-secrets.outputs.role }}" >>"$GITHUB_OUTPUT"
          echo "cluster_name=${{ needs.check-deployment-secrets.outputs.cluster_name }}" >>"$GITHUB_OUTPUT"
          echo "deploy_enabled=true" >>"$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.resolve.outputs.deploy_enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.resolve.outputs.role }}
          role-session-name: TradePulseCanary${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        if: steps.resolve.outputs.deploy_enabled == 'true'
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.resolve.outputs.cluster_name }}" \
            --region "${AWS_REGION}" \
            --alias tradepulse-${DEPLOY_ENVIRONMENT}

      - name: Install kubectl
        if: steps.resolve.outputs.deploy_enabled == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.2

      - name: Install kustomize
        if: steps.resolve.outputs.deploy_enabled == 'true'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.3'

      - name: Render manifests with canary image
        if: steps.resolve.outputs.deploy_enabled == 'true'
        id: render
        env:
          TARGET_ENV: ${{ needs.infrastructure-plan.outputs.environment }}
          IMAGE_REF: ${{ needs.build-container.outputs.image_ref }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -R deploy/kustomize/overlays/${TARGET_ENV} "$temp_dir/overlay"
          pushd "$temp_dir/overlay" >/dev/null
          kustomize edit set image ghcr.io/neuron7x/tradepulse=${IMAGE_REF}
          popd >/dev/null
          kustomize build "$temp_dir/overlay" > "$temp_dir/manifest.yaml"
          python -m pip install --quiet pyyaml
          python <<'PY' "$temp_dir/manifest.yaml" "${IMAGE_REF}"
          import copy
          import sys
          from pathlib import Path

          import yaml

          manifest_path = Path(sys.argv[1])
          documents = list(yaml.safe_load_all(manifest_path.read_text()))
          output_documents = []

          for document in documents:
              if not isinstance(document, dict):
                  continue
              output_documents.append(document)
              if document.get("kind") == "Deployment" and document.get("metadata", {}).get("name") == "tradepulse-api":
                  canary = copy.deepcopy(document)
                  metadata = canary.setdefault("metadata", {})
                  metadata["name"] = f"{metadata.get('name')}-canary"
                  metadata.setdefault("labels", {})
                  metadata["labels"]["app.kubernetes.io/track"] = "canary"
                  metadata["labels"]["app.kubernetes.io/instance"] = "canary"
                  annotations = metadata.setdefault("annotations", {})
                  annotations["tradepulse.io/canary"] = "true"
                  spec = canary.setdefault("spec", {})
                  spec["replicas"] = 1
                  selector = spec.setdefault("selector", {}).setdefault("matchLabels", {})
                  selector["app.kubernetes.io/track"] = "canary"
                  selector["app.kubernetes.io/instance"] = "canary"
                  template = spec.setdefault("template", {})
                  template_metadata = template.setdefault("metadata", {})
                  template_labels = template_metadata.setdefault("labels", {})
                  template_labels["app.kubernetes.io/track"] = "canary"
                  template_labels["app.kubernetes.io/instance"] = "canary"
                  container_specs = template.setdefault("spec", {}).setdefault("containers", [])
                  for container in container_specs:
                      if container.get("name") == "tradepulse-api":
                          container["image"] = sys.argv[2]
                          container.setdefault("env", []).append({
                              "name": "FEATURE_FLAG_ROLLOUT",
                              "value": "canary"
                          })
                  output_documents.append(canary)

          manifest_path.write_text("---\n".join(yaml.safe_dump(doc, sort_keys=False) for doc in output_documents), encoding="utf-8")
          PY
          echo "manifest=$temp_dir/manifest.yaml" >>"$GITHUB_OUTPUT"

      - name: Apply canary manifest
        if: steps.resolve.outputs.deploy_enabled == 'true'
        run: |
          kubectl apply -f "${{ steps.render.outputs.manifest }}"

      - name: Wait for canary rollout
        if: steps.resolve.outputs.deploy_enabled == 'true'
        run: |
          kubectl rollout status deployment/tradepulse-api-canary --timeout=5m

      - name: Seed feature flag overrides
        if: steps.resolve.outputs.deploy_enabled == 'true'
        env:
          LAUNCHDARKLY_ACCESS_TOKEN: ${{ secrets.LAUNCHDARKLY_ACCESS_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ needs.infrastructure-plan.outputs.environment }}
        run: |
          set -euo pipefail
          if [ -z "${LAUNCHDARKLY_ACCESS_TOKEN:-}" ]; then
            echo "LaunchDarkly token not configured; skipping feature flag rollout." >&2
            exit 0
          fi
          curl -fsSL -X PATCH \
            -H "Authorization: ${LAUNCHDARKLY_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://app.launchdarkly.com/api/v2/flags/tradepulse/live-routing" \
            -d '{"environments": {"'"${DEPLOY_ENVIRONMENT}"'": {"on": true, "targets": [{"values": ["canary"], "variation": "canary"}]}}}' || {
              echo "Feature flag update failed; continuing with caution." >&2
            }

      - name: Capture deployment diff
        if: steps.resolve.outputs.deploy_enabled == 'true'
        run: |
          kubectl diff -f "${{ steps.render.outputs.manifest }}" || true

  progressive-rollout:
    name: "Progressive Rollout"
    runs-on: ubuntu-latest
    needs:
      - deploy-canary
      - infrastructure-plan
    if: needs.deploy-canary.outputs.deploy_enabled == 'true'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEPLOY_ENVIRONMENT: ${{ needs.infrastructure-plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.deploy-canary.outputs.role }}
          role-session-name: TradePulseRollout${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Configure kubeconfig
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        run: |
          if [ -z "${AWS_REGION:-}" ] || [ -z "${{ needs.deploy-canary.outputs.cluster_name }}" ]; then
            echo "Cluster metadata unavailable; skipping progressive rollout." >&2
            exit 0
          fi
          aws eks update-kubeconfig \
            --name "${{ needs.deploy-canary.outputs.cluster_name }}" \
            --region "${AWS_REGION}" \
            --alias tradepulse-${DEPLOY_ENVIRONMENT}

      - name: Install kubectl
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.2

      - name: Gradually increase traffic
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        run: |
          set -euo pipefail
          kubectl annotate deployment/tradepulse-api-canary \
            traffic.shift=25 --overwrite || true
          sleep 60
          kubectl annotate deployment/tradepulse-api-canary \
            traffic.shift=50 --overwrite || true
          sleep 60
          kubectl annotate deployment/tradepulse-api-canary \
            traffic.shift=100 --overwrite || true
          kubectl patch deployment/tradepulse-api -p '{"spec": {"replicas": 4}}' --type merge
          kubectl rollout status deployment/tradepulse-api --timeout=10m

      - name: Decommission canary replica set
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        run: |
          kubectl delete deployment/tradepulse-api-canary --ignore-not-found

  rollback:
    name: "Automated Rollback"
    runs-on: ubuntu-latest
    needs:
      - deploy-canary
      - progressive-rollout
      - infrastructure-plan
    if: failure() && needs.deploy-canary.outputs.deploy_enabled == 'true'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEPLOY_ENVIRONMENT: ${{ needs.infrastructure-plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.deploy-canary.outputs.role }}
          role-session-name: TradePulseRollback${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Configure kubeconfig
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        run: |
          if [ -z "${AWS_REGION:-}" ] || [ -z "${{ needs.deploy-canary.outputs.cluster_name }}" ]; then
            echo "Cluster metadata unavailable; unable to rollback automatically." >&2
            exit 0
          fi
          aws eks update-kubeconfig \
            --name "${{ needs.deploy-canary.outputs.cluster_name }}" \
            --region "${AWS_REGION}" \
            --alias tradepulse-${DEPLOY_ENVIRONMENT}

      - name: Roll back deployment
        if: ${{ needs.deploy-canary.outputs.role != '' }}
        run: |
          kubectl rollout undo deployment/tradepulse-api || true
          kubectl delete deployment/tradepulse-api-canary --ignore-not-found

  audit-log:
    name: "Audit & Reporting"
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - unit-tests
      - integration-tests
      - load-test
      - build-container
      - vulnerability-scan
      - infrastructure-plan
      - deploy-canary
      - progressive-rollout
    if: always()
    steps:
      - name: Generate audit report
        run: |
          mkdir -p audit
          cat <<'REPORT' > audit/summary.md
          # TradePulse CI/CD Audit Summary

          - Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: ${{ github.sha }}
          - Trigger: ${{ github.event_name }}
          - Environment: ${{ needs.infrastructure-plan.outputs.environment }}
          - Quality gate: ${{ needs.quality-gate.result }}
          - Unit tests: ${{ needs.unit-tests.result }}
          - Integration tests: ${{ needs.integration-tests.result }}
          - Load test: ${{ needs.load-test.result || 'skipped' }}
          - Container build: ${{ needs.build-container.result || 'skipped' }}
          - Vulnerability scan: ${{ needs.vulnerability-scan.result || 'skipped' }}
          - Deployment: ${{ needs.deploy-canary.result || 'skipped' }}
          - Progressive rollout: ${{ needs.progressive-rollout.result || 'skipped' }}

          REPORT

      - name: Upload audit summary
        uses: actions/upload-artifact@v4
        with:
          name: audit-summary
          path: audit/summary.md
          if-no-files-found: error

  notifications:
    name: "Notifications"
    runs-on: ubuntu-latest
    needs:
      - audit-log
      - rollback
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "TradePulse CI/CD run for <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}> completed with status: ${{ job.status }}"
            }

      - name: Append to job summary
        run: |
          printf "\n### CI/CD notifications\n" >>"$GITHUB_STEP_SUMMARY"
          printf "* Slack notification attempted: %s\n" "${{ secrets.SLACK_WEBHOOK_URL != '' && 'yes' || 'no' }}" >>"$GITHUB_STEP_SUMMARY"
