name: Lab Grade Tests

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lab-grade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C
      PYTHONWARNINGS: error
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            constraints/security.txt

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Ensure build tools are up to date
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then pip install -c constraints/security.txt -r requirements.lock; fi
          if [ -f requirements-dev.lock ]; then pip install -c constraints/security.txt -r requirements-dev.lock; fi

      - name: Byte-compile sources
        run: python -m compileall .

      - name: Run lab-grade test suite
        run: pytest -q tests/contracts tests/config tests/security tests/regression tests/property
