name: Deploy TradePulse Environments

on:
  push:
    branches:
      - staging
      - production
    paths:
      - '.github/workflows/deploy-environments.yml'
      - 'deploy/**'
      - 'infra/terraform/eks/**'
      - 'core/**'
      - 'application/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action to perform"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      environment:
        description: "Environment to target (staging|production)"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      target_revision:
        description: "Optional deployment revision (tag/sha) used when rolling back"
        required: false

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  validate-infrastructure:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy'
    name: Validate infrastructure definitions
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Prepare Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/eks/**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init (backend disabled)
        run: |
          cd infra/terraform/eks
          terraform init -backend=false -input=false

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/eks fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/eks validate -no-color

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: '5.4.3'

      - name: Verify kustomize installation
        run: kustomize version

      - name: Validate staging manifest build
        run: kustomize build deploy/kustomize/overlays/staging >/tmp/staging.yaml

      - name: Validate production manifest build
        run: kustomize build deploy/kustomize/overlays/production >/tmp/production.yaml

  pre-deploy-smoke:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy'
    name: Run smoke tests before deployment
    runs-on: ubuntu-latest
    needs:
      - validate-infrastructure
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            constraints/security.txt
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -c constraints/security.txt -r sbom/combined-requirements.txt
          python -m pip install -c constraints/security.txt -r requirements-dev.lock
      - name: Run smoke tests
        run: |
          python -m pytest tests/smoke -m smoke -q

  check-staging-secrets:
    if: github.repository == 'neuron7x/TradePulse' && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && github.event.inputs.environment == 'staging'))
    name: Check staging deployment readiness
    runs-on: ubuntu-latest
    needs:
      - validate-infrastructure
      - pre-deploy-smoke
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Check if staging secrets are available
        id: check
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_STAGING_ROLE_ARN: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          AWS_STAGING_CLUSTER_NAME: ${{ secrets.AWS_STAGING_CLUSTER_NAME }}
        run: |
          if [ -n "${AWS_REGION:-}" ] && [ -n "${AWS_STAGING_ROLE_ARN:-}" ] && [ -n "${AWS_STAGING_CLUSTER_NAME:-}" ]; then
            echo "can_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Staging deployment credentials are configured"
          else
            echo "can_deploy=false" >> $GITHUB_OUTPUT
            echo "⚠️  Staging deployment credentials not configured - skipping deployment"
            echo "This is expected for PRs and repositories without AWS infrastructure configured."
          fi

  deploy-staging:
    if: needs.check-staging-secrets.outputs.can_deploy == 'true'
    name: Deploy staging
    runs-on: ubuntu-latest
    needs:
      - check-staging-secrets
    environment:
      name: staging
    outputs:
      deploy_enabled: ${{ steps.configure_kube.outputs.deploy_enabled }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_STAGING_ROLE_ARN: ${{ secrets.AWS_STAGING_ROLE_ARN }}
      AWS_STAGING_CLUSTER_NAME: ${{ secrets.AWS_STAGING_CLUSTER_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configure AWS credentials
        id: configure_aws
        if: env.AWS_STAGING_ROLE_ARN != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_STAGING_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-Staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        id: configure_kube
        run: |
          set -euo pipefail
          if [ -z "${AWS_REGION:-}" ] || [ -z "${AWS_STAGING_ROLE_ARN:-}" ] || [ -z "${AWS_STAGING_CLUSTER_NAME:-}" ]; then
            echo "AWS OIDC credentials for staging are not configured; skipping deployment" >&2
            echo "deploy_enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ '${{ steps.configure_aws.outcome }}' != 'success' ]; then
            echo "Unable to obtain AWS credentials for staging; skipping deployment" >&2
            echo "deploy_enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          aws eks update-kubeconfig \
            --name "$AWS_STAGING_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias tradepulse-staging
          echo "deploy_enabled=true" >>"$GITHUB_OUTPUT"

      - name: Install kubectl
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.29.2

      - name: Install kustomize
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: '5.4.3'

      - name: Verify kustomize installation
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        run: kustomize version

      - name: Install PyYAML for manifest templating
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        run: python -m pip install --user --upgrade -c constraints/security.txt pyyaml

      - name: Build rendered manifests
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        id: build_manifests
        run: |
          set -euo pipefail
          manifest="$(mktemp)"
          kustomize build deploy/kustomize/overlays/staging >"$manifest"
          echo "path=$manifest" >>"$GITHUB_OUTPUT"

      - name: Diff manifest against cluster
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        run: |
          set -euo pipefail
          if kubectl diff -k deploy/kustomize/overlays/staging; then
            exit 0
          fi
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Deploy canary workload
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        env:
          MANIFEST_PATH: ${{ steps.build_manifests.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${MANIFEST_PATH:-}" ]; then
            echo "Rendered manifest path is unavailable" >&2
            exit 1
          fi
          canary_manifest="$(mktemp)"
          python <<'PY' "$MANIFEST_PATH" "$canary_manifest"
          import copy
          import sys
          from pathlib import Path

          import yaml

          source_path = Path(sys.argv[1])
          dest_path = Path(sys.argv[2])

          documents = list(yaml.safe_load_all(source_path.read_text()))
          output_docs = []

          for doc in documents:
              if not isinstance(doc, dict):
                  continue
              if doc.get("kind") != "Deployment" or doc.get("metadata", {}).get("name") != "tradepulse-api":
                  continue
              canary = copy.deepcopy(doc)
              metadata = canary.setdefault("metadata", {})
              metadata["name"] = f"{metadata.get('name')}-canary"
              metadata.setdefault("labels", {})
              metadata["labels"]["app.kubernetes.io/instance"] = "canary"
              metadata.setdefault("annotations", {})
              metadata["annotations"]["tradepulse.io/canary"] = "true"

              spec = canary.setdefault("spec", {})
              spec["replicas"] = 1
              selector = spec.setdefault("selector", {}).setdefault("matchLabels", {})
              selector["app.kubernetes.io/instance"] = "canary"
              selector["app.kubernetes.io/track"] = "canary"

              template = spec.setdefault("template", {})
              template_metadata = template.setdefault("metadata", {})
              template_labels = template_metadata.setdefault("labels", {})
              template_labels["app.kubernetes.io/instance"] = "canary"
              template_labels["app.kubernetes.io/track"] = "canary"

              output_docs.append(canary)

          if not output_docs:
              raise SystemExit("Failed to generate canary deployment from manifest")

          dest_path.write_text("\n---\n".join(yaml.safe_dump(doc) for doc in output_docs))
          PY
          kubectl apply -n tradepulse-staging -f "$canary_manifest" --server-side --force-conflicts

      - name: Wait for canary rollout
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        run: kubectl rollout status deployment/tradepulse-api-canary -n tradepulse-staging --timeout=5m

      - name: Validate canary health and metrics
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        run: |
          set -euo pipefail
          if ! kubectl run tradepulse-api-canary-check \
            -n tradepulse-staging \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --attach \
            --rm \
            --command -- /bin/sh -c "set -euo pipefail; curl -fsS http://tradepulse-api.tradepulse-staging.svc.cluster.local/health > /tmp/health; curl -fsS http://tradepulse-api.tradepulse-staging.svc.cluster.local:8001/metrics > /tmp/metrics; [ -s /tmp/health ] && [ -s /tmp/metrics ]"; then
            kubectl logs deployment/tradepulse-api-canary -n tradepulse-staging || true
            kubectl delete deployment/tradepulse-api-canary -n tradepulse-staging --wait=true --ignore-not-found
            exit 1
          fi

      - name: Apply manifests
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        run: kubectl apply -k deploy/kustomize/overlays/staging --server-side --force-conflicts

      - name: Wait for rollout
        if: steps.configure_kube.outputs.deploy_enabled == 'true'
        run: kubectl rollout status deployment/tradepulse-api -n tradepulse-staging --timeout=5m

      - name: Remove canary deployment
        if: always() && steps.configure_kube.outputs.deploy_enabled == 'true'
        run: kubectl delete deployment/tradepulse-api-canary -n tradepulse-staging --ignore-not-found

      - name: Roll back staging deployment on failure
        if: failure() && steps.configure_kube.outputs.deploy_enabled == 'true'
        run: |
          set -euo pipefail
          echo "Attempting to roll back tradepulse-api deployment in staging" >&2
          kubectl rollout undo deployment/tradepulse-api -n tradepulse-staging
          kubectl rollout status deployment/tradepulse-api -n tradepulse-staging --timeout=5m

  check-production-secrets:
    if: github.repository == 'neuron7x/TradePulse' && ((github.event_name == 'push' && github.ref == 'refs/heads/production') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && github.event.inputs.environment == 'production'))
    name: Check production deployment readiness
    runs-on: ubuntu-latest
    needs:
      - validate-infrastructure
      - pre-deploy-smoke
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Check if production secrets are available
        id: check
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_PRODUCTION_ROLE_ARN: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
          AWS_PRODUCTION_CLUSTER_NAME: ${{ secrets.AWS_PRODUCTION_CLUSTER_NAME }}
        run: |
          if [ -n "${AWS_REGION:-}" ] && [ -n "${AWS_PRODUCTION_ROLE_ARN:-}" ] && [ -n "${AWS_PRODUCTION_CLUSTER_NAME:-}" ]; then
            echo "can_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Production deployment credentials are configured"
          else
            echo "can_deploy=false" >> $GITHUB_OUTPUT
            echo "⚠️  Production deployment credentials not configured - skipping deployment"
            echo "This is expected for PRs and repositories without AWS infrastructure configured."
          fi

  deploy-production:
    if: needs.check-production-secrets.outputs.can_deploy == 'true'
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - check-production-secrets
    environment:
      name: production
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_PRODUCTION_ROLE_ARN: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
      AWS_PRODUCTION_CLUSTER_NAME: ${{ secrets.AWS_PRODUCTION_CLUSTER_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_PRODUCTION_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-Production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.29.2

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: '5.4.3'

      - name: Verify kustomize installation
        run: kustomize version

      - name: Install PyYAML for manifest templating
        run: python -m pip install --user --upgrade -c constraints/security.txt pyyaml

      - name: Build rendered manifests
        id: build_manifests
        run: |
          set -euo pipefail
          manifest="$(mktemp)"
          kustomize build deploy/kustomize/overlays/production >"$manifest"
          echo "path=$manifest" >>"$GITHUB_OUTPUT"

      - name: Configure kubeconfig
        id: configure_kube
        run: |
          set -euo pipefail
          if [ -z "${AWS_REGION:-}" ] || [ -z "${AWS_PRODUCTION_ROLE_ARN:-}" ] || [ -z "${AWS_PRODUCTION_CLUSTER_NAME:-}" ]; then
            echo "AWS OIDC credentials for production are not fully configured" >&2
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          aws eks update-kubeconfig \
            --name "$AWS_PRODUCTION_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias tradepulse-production

      - name: Diff manifest against cluster
        run: |
          set -euo pipefail
          if kubectl diff -k deploy/kustomize/overlays/production; then
            exit 0
          fi
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Deploy canary workload
        env:
          MANIFEST_PATH: ${{ steps.build_manifests.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${MANIFEST_PATH:-}" ]; then
            echo "Rendered manifest path is unavailable" >&2
            exit 1
          fi
          canary_manifest="$(mktemp)"
          python <<'PY' "$MANIFEST_PATH" "$canary_manifest"
          import copy
          import sys
          from pathlib import Path

          import yaml

          source_path = Path(sys.argv[1])
          dest_path = Path(sys.argv[2])

          documents = list(yaml.safe_load_all(source_path.read_text()))
          output_docs = []

          for doc in documents:
              if not isinstance(doc, dict):
                  continue
              if doc.get("kind") != "Deployment" or doc.get("metadata", {}).get("name") != "tradepulse-api":
                  continue
              canary = copy.deepcopy(doc)
              metadata = canary.setdefault("metadata", {})
              metadata["name"] = f"{metadata.get('name')}-canary"
              metadata.setdefault("labels", {})
              metadata["labels"]["app.kubernetes.io/instance"] = "canary"
              metadata.setdefault("annotations", {})
              metadata["annotations"]["tradepulse.io/canary"] = "true"

              spec = canary.setdefault("spec", {})
              spec["replicas"] = 1
              selector = spec.setdefault("selector", {}).setdefault("matchLabels", {})
              selector["app.kubernetes.io/instance"] = "canary"
              selector["app.kubernetes.io/track"] = "canary"

              template = spec.setdefault("template", {})
              template_metadata = template.setdefault("metadata", {})
              template_labels = template_metadata.setdefault("labels", {})
              template_labels["app.kubernetes.io/instance"] = "canary"
              template_labels["app.kubernetes.io/track"] = "canary"

              output_docs.append(canary)

          if not output_docs:
              raise SystemExit("Failed to generate canary deployment from manifest")

          dest_path.write_text("\n---\n".join(yaml.safe_dump(doc) for doc in output_docs))
          PY
          kubectl apply -n tradepulse-production -f "$canary_manifest" --server-side --force-conflicts

      - name: Wait for canary rollout
        run: kubectl rollout status deployment/tradepulse-api-canary -n tradepulse-production --timeout=10m

      - name: Validate canary health and metrics
        run: |
          set -euo pipefail
          if ! kubectl run tradepulse-api-canary-check \
            -n tradepulse-production \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --attach \
            --rm \
            --command -- /bin/sh -c "set -euo pipefail; curl -fsS http://tradepulse-api.tradepulse-production.svc.cluster.local/health > /tmp/health; curl -fsS http://tradepulse-api.tradepulse-production.svc.cluster.local:8001/metrics > /tmp/metrics; [ -s /tmp/health ] && [ -s /tmp/metrics ]"; then
            kubectl logs deployment/tradepulse-api-canary -n tradepulse-production || true
            kubectl delete deployment/tradepulse-api-canary -n tradepulse-production --wait=true --ignore-not-found
            exit 1
          fi

      - name: Apply manifests
        run: kubectl apply -k deploy/kustomize/overlays/production --server-side --force-conflicts

      - name: Wait for rollout
        run: kubectl rollout status deployment/tradepulse-api -n tradepulse-production --timeout=10m

      - name: Remove canary deployment
        if: always()
        run: kubectl delete deployment/tradepulse-api-canary -n tradepulse-production --ignore-not-found

      - name: Roll back production deployment on failure
        if: failure()
        run: |
          set -euo pipefail
          echo "Attempting to roll back tradepulse-api deployment in production" >&2
          kubectl rollout undo deployment/tradepulse-api -n tradepulse-production
          kubectl rollout status deployment/tradepulse-api -n tradepulse-production --timeout=10m

  check-rollback-secrets:
    if: github.repository == 'neuron7x/TradePulse' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    name: Check rollback deployment readiness
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Check if rollback secrets are available
        id: check
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_STAGING_ROLE_ARN: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          AWS_PRODUCTION_ROLE_ARN: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
          AWS_STAGING_CLUSTER_NAME: ${{ secrets.AWS_STAGING_CLUSTER_NAME }}
          AWS_PRODUCTION_CLUSTER_NAME: ${{ secrets.AWS_PRODUCTION_CLUSTER_NAME }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          if [ "${ENVIRONMENT}" = "production" ]; then
            ROLE_ARN="${AWS_PRODUCTION_ROLE_ARN:-}"
            CLUSTER_NAME="${AWS_PRODUCTION_CLUSTER_NAME:-}"
          else
            ROLE_ARN="${AWS_STAGING_ROLE_ARN:-}"
            CLUSTER_NAME="${AWS_STAGING_CLUSTER_NAME:-}"
          fi

          if [ -n "${AWS_REGION:-}" ] && [ -n "${ROLE_ARN}" ] && [ -n "${CLUSTER_NAME}" ]; then
            echo "can_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Rollback deployment credentials are configured for ${ENVIRONMENT}"
          else
            echo "can_deploy=false" >> $GITHUB_OUTPUT
            echo "⚠️  Rollback deployment credentials not configured for ${ENVIRONMENT} - skipping rollback"
            echo "This is expected for repositories without AWS infrastructure configured."
          fi

  rollback-environment:
    if: needs.check-rollback-secrets.outputs.can_deploy == 'true'
    name: Roll back deployment
    runs-on: ubuntu-latest
    needs:
      - check-rollback-secrets
    environment:
      name: ${{ github.event.inputs.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Resolve environment configuration
        id: select_env
        run: |
          set -euo pipefail
          env_name="${{ github.event.inputs.environment }}"
          case "$env_name" in
            staging)
              if [ -z "${{ secrets.AWS_STAGING_ROLE_ARN }}" ] || [ -z "${{ secrets.AWS_STAGING_CLUSTER_NAME }}" ]; then
                echo "Staging AWS deployment credentials are not configured" >&2
                exit 1
              fi
              echo "role=${{ secrets.AWS_STAGING_ROLE_ARN }}" >>"$GITHUB_OUTPUT"
              echo "cluster=${{ secrets.AWS_STAGING_CLUSTER_NAME }}" >>"$GITHUB_OUTPUT"
              echo "namespace=tradepulse-staging" >>"$GITHUB_OUTPUT"
              echo "kustomize_path=deploy/kustomize/overlays/staging" >>"$GITHUB_OUTPUT"
              echo "timeout=5m" >>"$GITHUB_OUTPUT"
              ;;
            production)
              if [ -z "${{ secrets.AWS_PRODUCTION_ROLE_ARN }}" ] || [ -z "${{ secrets.AWS_PRODUCTION_CLUSTER_NAME }}" ]; then
                echo "Production AWS deployment credentials are not configured" >&2
                exit 1
              fi
              echo "role=${{ secrets.AWS_PRODUCTION_ROLE_ARN }}" >>"$GITHUB_OUTPUT"
              echo "cluster=${{ secrets.AWS_PRODUCTION_CLUSTER_NAME }}" >>"$GITHUB_OUTPUT"
              echo "namespace=tradepulse-production" >>"$GITHUB_OUTPUT"
              echo "kustomize_path=deploy/kustomize/overlays/production" >>"$GITHUB_OUTPUT"
              echo "timeout=10m" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: $env_name" >&2
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.select_env.outputs.role }}
          role-session-name: GitHubActions-Rollback-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.29.2

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          aws eks update-kubeconfig \
            --name "${{ steps.select_env.outputs.cluster }}" \
            --region "$AWS_REGION" \
            --alias "tradepulse-${{ github.event.inputs.environment }}"

      - name: Decide rollback strategy
        id: rollback_strategy
        run: |
          if [ -n "${{ github.event.inputs.target_revision }}" ]; then
            echo "mode=redeploy" >>"$GITHUB_OUTPUT"
          else
            echo "mode=undo" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout repository at target revision
        if: steps.rollback_strategy.outputs.mode == 'redeploy'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.inputs.target_revision }}

      - name: Install kustomize
        if: steps.rollback_strategy.outputs.mode == 'redeploy'
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: '5.4.3'

      - name: Redeploy manifests from target revision
        if: steps.rollback_strategy.outputs.mode == 'redeploy'
        run: |
          set -euo pipefail
          kubectl apply -k "${{ steps.select_env.outputs.kustomize_path }}" --server-side --force-conflicts
          kubectl rollout status deployment/tradepulse-api -n "${{ steps.select_env.outputs.namespace }}" --timeout="${{ steps.select_env.outputs.timeout }}"

      - name: Roll back deployment to previous revision
        if: steps.rollback_strategy.outputs.mode == 'undo'
        run: |
          set -euo pipefail
          kubectl rollout undo deployment/tradepulse-api -n "${{ steps.select_env.outputs.namespace }}"
          kubectl rollout status deployment/tradepulse-api -n "${{ steps.select_env.outputs.namespace }}" --timeout="${{ steps.select_env.outputs.timeout }}"
