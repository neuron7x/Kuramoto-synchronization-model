name: SBOM Generation & Vulnerability Tracking

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-sbom:
    name: Generate Multi-Ecosystem SBOM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install SBOM generation tools
        run: |
          # Install Syft for comprehensive SBOM generation
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          
          # Install Grype for vulnerability scanning
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          
          # Install CycloneDX tools
          pip install cyclonedx-bom cyclonedx-python-lib

      - name: Generate Python SBOM (CycloneDX)
        id: python_sbom
        continue-on-error: true
        run: |
          echo "Generating Python dependency SBOM..."
          
          # Generate from requirements.txt (lightweight, no installation)
          if [ -f requirements.txt ]; then
            cyclonedx-py requirements requirements.txt \
              --output-format json \
              --output-file sbom-python.json || {
              echo "⚠️  Python SBOM generation from requirements.txt failed"
            }
          fi
          
          echo "✓ Python SBOM generation completed (or skipped)"

      - name: Generate comprehensive SBOM with Syft
        id: syft_sbom
        run: |
          echo "Generating comprehensive multi-ecosystem SBOM..."
          
          # Generate SBOM with Syft (handles all ecosystems)
          syft packages dir:. \
            --output spdx-json=sbom-spdx.json \
            --output cyclonedx-json=sbom-cyclonedx.json \
            --quiet || {
            echo "⚠️  Syft SBOM generation encountered issues, trying with minimal scope..."
            # Fallback: generate from specific directories
            syft packages dir:./core \
              --output spdx-json=sbom-spdx.json \
              --output cyclonedx-json=sbom-cyclonedx.json \
              --quiet || {
              echo "❌ SBOM generation failed"
              exit 1
            }
          }
          
          echo "✓ Generated SPDX and CycloneDX SBOMs"

      - name: Scan SBOM for vulnerabilities with Grype
        id: grype_scan
        continue-on-error: true
        run: |
          if [ ! -f sbom-cyclonedx.json ]; then
            echo "⚠️  SBOM file not found, skipping vulnerability scan"
            exit 0
          fi
          
          echo "Scanning SBOM for known vulnerabilities..."
          grype sbom:sbom-cyclonedx.json \
            --output json \
            --file grype-sbom-report.json || {
            echo "⚠️  Grype scan encountered issues"
          }
          
          # Generate human-readable report if JSON exists
          if [ -f grype-sbom-report.json ]; then
            grype sbom:sbom-cyclonedx.json \
              --output table \
              --file grype-sbom-report.txt || true
          fi

      - name: Download baseline vulnerability report (if exists)
        id: download_baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: sbom-generation.yml
          branch: main
          name: vulnerability-baseline
          path: baseline/
          if_no_artifact_found: warn
      
      - name: Analyze vulnerability scan results
        id: vuln_analysis
        run: |
          if [ -f grype-sbom-report.json ]; then
            # Count vulnerabilities by severity
            CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-sbom-report.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-sbom-report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-sbom-report.json 2>/dev/null || echo "0")
            LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-sbom-report.json 2>/dev/null || echo "0")
            
            echo "current_critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "current_high=$HIGH" >> $GITHUB_OUTPUT
            echo "current_medium=$MEDIUM" >> $GITHUB_OUTPUT
            echo "current_low=$LOW" >> $GITHUB_OUTPUT
            
            echo "Current Vulnerability Summary:"
            echo "  Critical: $CRITICAL"
            echo "  High: $HIGH"
            echo "  Medium: $MEDIUM"
            echo "  Low: $LOW"
            
            # Compare with baseline if it exists
            if [ -f "baseline/grype-sbom-report.json" ]; then
              echo ""
              echo "Comparing with baseline..."
              
              BASELINE_CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' baseline/grype-sbom-report.json 2>/dev/null || echo "0")
              BASELINE_HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' baseline/grype-sbom-report.json 2>/dev/null || echo "0")
              
              echo "baseline_critical=$BASELINE_CRITICAL" >> $GITHUB_OUTPUT
              echo "baseline_high=$BASELINE_HIGH" >> $GITHUB_OUTPUT
              echo "has_baseline=true" >> $GITHUB_OUTPUT
              
              echo "Baseline Vulnerability Summary:"
              echo "  Critical: $BASELINE_CRITICAL"
              echo "  High: $BASELINE_HIGH"
              
              # Extract NEW Critical/High vulnerabilities (not in baseline)
              NEW_CRITICAL=$(comm -13 \
                <(jq -r '.matches[] | select(.vulnerability.severity == "Critical") | .vulnerability.id' baseline/grype-sbom-report.json 2>/dev/null | sort | uniq) \
                <(jq -r '.matches[] | select(.vulnerability.severity == "Critical") | .vulnerability.id' grype-sbom-report.json 2>/dev/null | sort | uniq) \
                | wc -l)
              
              NEW_HIGH=$(comm -13 \
                <(jq -r '.matches[] | select(.vulnerability.severity == "High") | .vulnerability.id' baseline/grype-sbom-report.json 2>/dev/null | sort | uniq) \
                <(jq -r '.matches[] | select(.vulnerability.severity == "High") | .vulnerability.id' grype-sbom-report.json 2>/dev/null | sort | uniq) \
                | wc -l)
              
              echo "new_critical=$NEW_CRITICAL" >> $GITHUB_OUTPUT
              echo "new_high=$NEW_HIGH" >> $GITHUB_OUTPUT
              
              echo ""
              echo "New Vulnerabilities vs Baseline:"
              echo "  New Critical: $NEW_CRITICAL"
              echo "  New High: $NEW_HIGH"
              
              if [ "$NEW_CRITICAL" -gt 0 ] || [ "$NEW_HIGH" -gt 0 ]; then
                echo ""
                echo "❌ NEW Critical/High vulnerabilities detected!"
                echo "should_fail=true" >> $GITHUB_OUTPUT
              else
                echo ""
                echo "✅ No new Critical/High vulnerabilities vs baseline"
                echo "should_fail=false" >> $GITHUB_OUTPUT
              fi
            else
              echo ""
              echo "No baseline found. This is the initial scan."
              echo "All vulnerabilities will be considered baseline."
              echo "has_baseline=false" >> $GITHUB_OUTPUT
              echo "should_fail=false" >> $GITHUB_OUTPUT
              
              if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
                echo ""
                echo "⚠️  Found $CRITICAL critical and $HIGH high vulnerabilities"
                echo "These will be tracked in VULNERABILITY_BACKLOG.md"
              fi
            fi
          else
            echo "⚠️  Vulnerability report not found"
            echo "current_critical=0" >> $GITHUB_OUTPUT
            echo "current_high=0" >> $GITHUB_OUTPUT
            echo "current_medium=0" >> $GITHUB_OUTPUT
            echo "current_low=0" >> $GITHUB_OUTPUT
            echo "has_baseline=false" >> $GITHUB_OUTPUT
            echo "should_fail=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate VEX (Vulnerability Exploitability eXchange) document
        run: |
          cat > vex.json <<EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "version": 1,
            "metadata": {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "component": {
                "type": "application",
                "name": "TradePulse",
                "version": "${{ github.sha }}"
              }
            },
            "vulnerabilities": []
          }
          EOF
          
          echo "✓ Generated VEX document"

      - name: Sign SBOM with Sigstore
        id: sign_sbom
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Install cosign
          curl -sSL https://github.com/sigstore/cosign/releases/download/v2.2.2/cosign-linux-amd64 -o cosign
          chmod +x cosign
          sudo mv cosign /usr/local/bin/
          
          # Sign SBOMs using keyless signing (if they exist)
          if [ -f sbom-cyclonedx.json ]; then
            cosign sign-blob --yes sbom-cyclonedx.json \
              --output-signature sbom-cyclonedx.json.sig \
              --output-certificate sbom-cyclonedx.json.cert || {
              echo "⚠️  Failed to sign CycloneDX SBOM"
            }
          fi
          
          if [ -f sbom-spdx.json ]; then
            cosign sign-blob --yes sbom-spdx.json \
              --output-signature sbom-spdx.json.sig \
              --output-certificate sbom-spdx.json.cert || {
              echo "⚠️  Failed to sign SPDX SBOM"
            }
          fi
          
          echo "✓ SBOM signing completed"

      - name: Attest SBOM
        id: attest_sbom
        continue-on-error: true
        if: hashFiles('sbom-cyclonedx.json') != ''
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'sbom-cyclonedx.json'
          sbom-path: 'sbom-cyclonedx.json'

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-*.json
            sbom-*.json.sig
            sbom-*.json.cert
            grype-sbom-report.*
            vex.json
          if-no-files-found: ignore
      
      - name: Update vulnerability baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-baseline
          path: grype-sbom-report.json
          retention-days: 90

      - name: Post SBOM summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const currentCritical = '${{ steps.vuln_analysis.outputs.current_critical }}' || '0';
            const currentHigh = '${{ steps.vuln_analysis.outputs.current_high }}' || '0';
            const currentMedium = '${{ steps.vuln_analysis.outputs.current_medium }}' || '0';
            const currentLow = '${{ steps.vuln_analysis.outputs.current_low }}' || '0';
            
            const hasBaseline = '${{ steps.vuln_analysis.outputs.has_baseline }}' === 'true';
            const baselineCritical = '${{ steps.vuln_analysis.outputs.baseline_critical }}' || '0';
            const baselineHigh = '${{ steps.vuln_analysis.outputs.baseline_high }}' || '0';
            const newCritical = '${{ steps.vuln_analysis.outputs.new_critical }}' || '0';
            const newHigh = '${{ steps.vuln_analysis.outputs.new_high }}' || '0';
            const shouldFail = '${{ steps.vuln_analysis.outputs.should_fail }}' === 'true';
            
            const totalVulns = parseInt(currentCritical) + parseInt(currentHigh) + parseInt(currentMedium) + parseInt(currentLow);
            const emoji = shouldFail ? '❌' : (parseInt(currentCritical) > 0 || parseInt(currentHigh) > 0 ? '⚠️' : '✅');
            
            let body = [
              `## ${emoji} SBOM & Vulnerability Analysis`,
              '',
              '### Current Vulnerabilities',
              '',
              '| Severity | Count |',
              '|----------|-------|',
              `| 🔴 Critical | ${currentCritical} |`,
              `| 🟠 High | ${currentHigh} |`,
              `| 🟡 Medium | ${currentMedium} |`,
              `| 🟢 Low | ${currentLow} |`,
              `| **Total** | **${totalVulns}** |`,
              '',
            ];
            
            if (hasBaseline) {
              body.push('### Baseline Comparison');
              body.push('');
              body.push('| Metric | Value |');
              body.push('|--------|-------|');
              body.push(`| Baseline Critical | ${baselineCritical} |`);
              body.push(`| Baseline High | ${baselineHigh} |`);
              body.push(`| **New Critical** | **${newCritical}** ${parseInt(newCritical) > 0 ? '❌' : '✅'} |`);
              body.push(`| **New High** | **${newHigh}** ${parseInt(newHigh) > 0 ? '❌' : '✅'} |`);
              body.push('');
              
              if (shouldFail) {
                body.push('❌ **BLOCKED:** New Critical/High vulnerabilities detected!');
                body.push('');
                body.push('**Action Required:**');
                body.push('- Review the new vulnerabilities in the SBOM report');
                body.push('- Update dependencies to patched versions');
                body.push('- Or document as accepted risk in VULNERABILITY_BACKLOG.md');
              } else {
                body.push('✅ **No new Critical/High vulnerabilities vs baseline**');
                body.push('');
                body.push('Existing vulnerabilities are tracked in [VULNERABILITY_BACKLOG.md](../../VULNERABILITY_BACKLOG.md)');
              }
            } else {
              body.push('### Initial Baseline');
              body.push('');
              body.push('**This is the first scan - establishing baseline**');
              body.push('');
              if (parseInt(currentCritical) > 0 || parseInt(currentHigh) > 0) {
                body.push(`⚠️ Found ${currentCritical} Critical and ${currentHigh} High vulnerabilities`);
                body.push('');
                body.push('These will be tracked as baseline in [VULNERABILITY_BACKLOG.md](../../VULNERABILITY_BACKLOG.md)');
              } else {
                body.push('✅ No Critical or High vulnerabilities in initial scan');
              }
            }
            
            body.push('',
              '### SBOM Artifacts Generated',
              '- ✅ CycloneDX SBOM (JSON)',
              '- ✅ SPDX SBOM (JSON)',
              '- ✅ VEX Document',
              '- ✅ Sigstore Signatures',
              '- ✅ Vulnerability Report',
              '',
              '### Supply Chain Security',
              '- **Artifact Signing:** Sigstore (keyless)',
              '- **Attestation:** GitHub Attestations API',
              '- **Standards:** SPDX 2.3, CycloneDX 1.5',
              '',
              '---',
              `*Last updated: ${new Date().toISOString()}*`);
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('SBOM & Vulnerability Analysis')
            );
            
            const bodyText = body.join('\n');
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: bodyText
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: bodyText
              });
            }

      - name: Fail on new Critical/High vulnerabilities
        if: steps.vuln_analysis.outputs.should_fail == 'true'
        run: |
          echo "❌ SBOM VULNERABILITY CHECK FAILED"
          echo ""
          echo "New Critical or High vulnerabilities detected vs baseline!"
          echo ""
          echo "New Critical: ${{ steps.vuln_analysis.outputs.new_critical }}"
          echo "New High: ${{ steps.vuln_analysis.outputs.new_high }}"
          echo ""
          echo "Action required:"
          echo "  1. Review the vulnerability details in the SBOM artifacts"
          echo "  2. Update dependencies to patched versions, OR"
          echo "  3. Document accepted risk in VULNERABILITY_BACKLOG.md with security team approval"
          echo ""
          echo "See VULNERABILITY_BACKLOG.md for vulnerability management policy"
          exit 1
