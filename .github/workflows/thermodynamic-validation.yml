name: Thermodynamic Validation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'tacl/**'
      - '.github/workflows/thermodynamic-validation.yml'
      - 'ci/**'
      - 'configs/**'
      - 'docs/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  validate-energy:
    name: validate-energy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run energy validation smoke
        run: python -m tacl.validate --run ci

      - name: Upload energy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: energy-validation-report
          path: |
            .ci_artifacts/energy_validation.json
            .ci_artifacts/energy_validation.md
