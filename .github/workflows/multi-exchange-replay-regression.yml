name: Multi-Exchange Replay Regression

permissions:
  contents: read
  issues: write

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'tests/fixtures/recordings/**'
      - 'tests/performance/**'
      - 'backtest/**'
      - 'execution/**'
      - 'core/data/**'
  push:
    branches:
      - main
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: multi-exchange-replay-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-regression-tests:
    name: Multi-Exchange Replay Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r sbom/combined-requirements.txt
          pip install -c constraints/security.txt -r requirements-dev.lock

      - name: Create artifacts directory
        run: mkdir -p .ci_artifacts/multi-exchange-replay

      - name: Run multi-exchange replay regression tests
        id: regression_tests
        continue-on-error: true
        run: |
          python -m pytest \
            tests/performance/test_multi_exchange_replay_regression.py \
            --tb=short \
            -v \
            --junitxml=.ci_artifacts/multi-exchange-replay/junit.xml
        env:
          PYTEST_ARTIFACTS_DIR: .ci_artifacts/multi-exchange-replay

      - name: Generate performance artifacts
        if: always()
        run: |
          # Artifacts are generated by the test itself
          # Just verify they exist
          if [ -d ".ci_artifacts/multi-exchange-replay" ]; then
            echo "Performance artifacts generated:"
            ls -lh .ci_artifacts/multi-exchange-replay/
          fi

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multi-exchange-replay-reports
          path: |
            .ci_artifacts/multi-exchange-replay/*.json
            .ci_artifacts/multi-exchange-replay/*.md
            .ci_artifacts/multi-exchange-replay/*.png
            .ci_artifacts/multi-exchange-replay/*.xml
          retention-days: 30

      - name: Add performance summary to step summary
        if: always()
        run: |
          if [ -f ".ci_artifacts/multi-exchange-replay/performance_summary.md" ]; then
            cat .ci_artifacts/multi-exchange-replay/performance_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Multi-Exchange Replay Regression Results" >> $GITHUB_STEP_SUMMARY
            echo "Tests completed. Check artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for performance regressions
        if: always()
        id: check_regressions
        run: |
          if [ -f ".ci_artifacts/multi-exchange-replay/performance_report.json" ]; then
            # Parse JSON to check for failures
            failed=$(python -c "import json; data=json.load(open('.ci_artifacts/multi-exchange-replay/performance_report.json')); print(data.get('summary', {}).get('failed', 0))")
            echo "failed_count=$failed" >> $GITHUB_OUTPUT

            if [ "$failed" -gt "0" ]; then
              echo "⚠️ Performance regressions detected: $failed test(s) failed" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ All performance budgets met" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # Generate baseline for comparison (only on main branch)
  generate-baseline:
    name: Generate Performance Baseline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r sbom/combined-requirements.txt
          pip install -c constraints/security.txt -r requirements-dev.lock

      - name: Create baseline directory
        run: mkdir -p .ci_artifacts/baseline

      - name: Generate baseline performance data
        run: |
          python -m pytest \
            tests/performance/test_multi_exchange_replay_regression.py::test_all_recordings_regression_suite \
            -v
        env:
          PYTEST_ARTIFACTS_DIR: .ci_artifacts/baseline

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-baseline-${{ github.sha }}
          path: .ci_artifacts/baseline/*.json
          retention-days: 90

  # Historical trend analysis (nightly only)
  historical-analysis:
    name: Historical Performance Trend Analysis
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r sbom/combined-requirements.txt
          pip install -c constraints/security.txt -r requirements-dev.lock

      - name: Download historical baselines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: performance-baseline-*
          path: .ci_artifacts/historical

      - name: Generate trend analysis
        run: |
          mkdir -p .ci_artifacts/trends
          # Run extended regression suite with historical comparison
          python -m pytest \
            tests/performance/test_multi_exchange_replay_regression.py::test_extended_regression_suite_with_historical_comparison \
            -v \
            -m nightly
        env:
          PYTEST_ARTIFACTS_DIR: .ci_artifacts/trends

      - name: Upload trend analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-trends-${{ github.run_id }}
          path: .ci_artifacts/trends/
          retention-days: 90
