name: Mutation Testing - Quality Gate

on:
  # Only run on push to main/develop or when explicitly requested
  push:
    branches: [main, develop]
    paths:
      - 'core/**'
      - 'backtest/**'
      - 'execution/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    name: Mutation Testing (90% kill rate required)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mutation-${{ runner.os }}-py3.11-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'constraints/security.txt') }}
          restore-keys: |
            pip-mutation-${{ runner.os }}-py3.11-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -c constraints/security.txt -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -c constraints/security.txt -r requirements-dev.txt; fi

      - name: Run mutation testing
        id: mutmut
        run: |
          echo "Running mutation testing on core, backtest, execution modules..."
          # Run mutation testing, allow it to fail gracefully
          mutmut run --paths-to-mutate=core,backtest,execution --tests-dir=tests || {
            echo "Mutation testing encountered errors, continuing..."
            exit 0
          }
        continue-on-error: true

      - name: Generate mutation report
        run: |
          mutmut results || echo "No mutation results available"
          mutmut html || echo "Could not generate HTML report"

      - name: Check if mutations were run
        id: check_mutations
        run: |
          if [ -f .mutmut-cache ]; then
            echo "mutations_exist=true" >> $GITHUB_OUTPUT
          else
            echo "mutations_exist=false" >> $GITHUB_OUTPUT
            echo "No mutations were executed - skipping enforcement"
          fi

      - name: Enforce mutation kill rate (90%)
        if: steps.check_mutations.outputs.mutations_exist == 'true'
        id: mutation_gate
        run: |
          python -m tools.mutation.kill_rate_guard \
            --threshold=0.9 \
            --summary=mutation_summary.json || {
            echo "Mutation kill rate check failed or no mutations found"
            exit 1
          }
        continue-on-error: false

      - name: Upload mutation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-results
          path: |
            mutation_summary.json
            html/
            .mutmut-cache
          retention-days: 14
          if-no-files-found: warn

      - name: Comment mutation results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            let summaryData = {};
            let summaryText = "⚠️ Mutation testing was skipped or no mutations were generated";

            try {
              if (fs.existsSync('mutation_summary.json')) {
                summaryData = JSON.parse(fs.readFileSync('mutation_summary.json', 'utf8'));
                const killRate = (summaryData.kill_rate * 100).toFixed(2);
                const threshold = (summaryData.threshold * 100).toFixed(0);
                const passed = summaryData.kill_rate >= summaryData.threshold;
                const emoji = passed ? '✅' : '❌';

                summaryText = [
                  `## ${emoji} Mutation Testing Results`,
                  '',
                  `**Kill Rate:** ${killRate}% (threshold: ${threshold}%)`,
                  `**Status:** ${passed ? 'PASSED' : 'FAILED'}`,
                  '',
                  '### Statistics:',
                  `- Total mutants: ${summaryData.total_mutants}`,
                  `- Counted mutants: ${summaryData.counted_mutants}`,
                  `- Killed mutants: ${summaryData.killed_mutants}`,
                  '',
                  '### Status Breakdown:',
                  '```json',
                  JSON.stringify(summaryData.status_counts, null, 2),
                  '```',
                  '',
                  passed ? '✅ Mutation testing passed!' : '❌ Mutation kill rate is below the required threshold. Please improve test coverage.'
                ].join('\n');
              } else {
                summaryText = [
                  '## ℹ️ Mutation Testing Skipped',
                  '',
                  'Mutation testing was not executed for this PR. This can happen when:',
                  '- No code changes were made to testable modules',
                  '- The mutation testing tool encountered configuration issues',
                  '- No tests are available to run mutations against',
                  '',
                  'The full mutation test suite will run during the CI pipeline.'
                ].join('\n');
              }
            } catch (error) {
              console.log('Could not read mutation summary:', error);
              summaryText = [
                '## ⚠️ Mutation Testing Error',
                '',
                'An error occurred while processing mutation test results.',
                'Please check the workflow logs for details.'
              ].join('\n');
            }

            const body = summaryText;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Mutation Testing Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }

      - name: Fail workflow if mutation testing failed
        if: steps.check_mutations.outputs.mutations_exist == 'true' && steps.mutation_gate.outcome == 'failure'
        run: |
          echo "❌ Mutation testing failed. Kill rate is below 90%."
          exit 1

      - name: Skip mutation testing gracefully
        if: steps.check_mutations.outputs.mutations_exist != 'true'
        run: |
          echo "ℹ️ Mutation testing was skipped - no mutations were generated."
          echo "This is acceptable for PRs that don't modify testable code."
          exit 0
