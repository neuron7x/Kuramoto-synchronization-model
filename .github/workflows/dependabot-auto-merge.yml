name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  checks: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    # Only run for Dependabot PRs from the same repository (not forks)
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Rebase Dependabot PR onto base branch
        uses: peter-evans/rebase@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          head: ${{ github.event.pull_request.head.ref }}
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for required checks to succeed
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr checks "$PR_URL" --watch --interval 30 --required || {
            echo "checks_failed=true" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "checks_failed=false" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Comment on check failure
        if: steps.checks.outputs.checks_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "❌ **Automated merge cancelled**: One or more required checks failed. Please review the failures and address them manually."
      - name: Enable auto-merge for safe updates
        if: steps.checks.outputs.checks_failed != 'true' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          gh pr comment "$PR_URL" --body "✅ **Auto-merge enabled**: This PR will be automatically merged once all required checks pass."
      - name: Comment when manual review is required
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch' && steps.metadata.outputs.update-type != 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "⚠️ Automated merge is disabled for this Dependabot PR because it is a major update. Please review and merge manually after ensuring all required checks pass."
