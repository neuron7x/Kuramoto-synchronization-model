name: Performance Gate

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.txt'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches:
      - main
  schedule:
    # Run nightly at 3 AM UTC for trend tracking
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: performance-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-components:
    name: Component Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-perf-gate-${{ hashFiles('requirements*.txt', 'requirements*.lock') }}
      
      - name: Create virtual environment
        run: uv venv --python 3.11
      
      - name: Install dependencies
        run: |
          uv pip install -c constraints/security.txt -r requirements.txt
          uv pip install -c constraints/security.txt -r requirements-dev.txt
          uv pip install -e .
      
      - name: Run component benchmarks
        id: benchmarks
        run: |
          .venv/bin/python scripts/performance/benchmark_components.py \
            --config configs/perf_budgets.yaml \
            --output reports/performance/benchmark_results.json
        continue-on-error: true
      
      - name: Generate flamegraphs
        id: flamegraphs
        if: always()
        run: |
          .venv/bin/python scripts/performance/generate_flamegraphs.py \
            --output-dir reports/performance/flamegraphs \
            --duration 5
        continue-on-error: true
      
      - name: Get git metadata
        id: git_meta
        run: |
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
      
      - name: Update performance history
        if: always() && steps.benchmarks.outcome == 'success'
        run: |
          .venv/bin/python scripts/performance/track_historical_trends.py \
            --history-file reports/performance/history.json \
            update \
            --benchmark-results reports/performance/benchmark_results.json \
            --commit-sha "${{ steps.git_meta.outputs.commit_sha }}" \
            --branch "${{ steps.git_meta.outputs.branch }}"
        continue-on-error: true
      
      - name: Generate trend report
        if: always()
        run: |
          .venv/bin/python scripts/performance/track_historical_trends.py \
            --history-file reports/performance/history.json \
            report \
            --output reports/performance/trend_report.md \
            --lookback 20
        continue-on-error: true
      
      - name: Generate performance report
        if: always()
        run: |
          .venv/bin/python scripts/performance/generate_performance_report.py \
            --benchmark-results reports/performance/benchmark_results.json \
            --output reports/performance/performance_report.md \
            --trend-report reports/performance/trend_report.md \
            --flamegraph-dir reports/performance/flamegraphs \
            --artifacts-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        continue-on-error: true
      
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-gate-results
          path: |
            reports/performance/*.json
            reports/performance/*.md
            reports/performance/flamegraphs/*.svg
          retention-days: 30
      
      - name: Comment PR with performance report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/performance/performance_report.md';
            
            if (!fs.existsSync(reportPath)) {
              console.log('Performance report not found, skipping comment');
              return;
            }
            
            const report = fs.readFileSync(reportPath, 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Performance Benchmark Report')
            );
            
            const commentBody = `${report}\n\n<!-- performance-gate-comment -->`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
      
      - name: Publish summary to job summary
        if: always()
        run: |
          if [ -f reports/performance/performance_report.md ]; then
            cat reports/performance/performance_report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Performance report not generated" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Check performance gate
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/python scripts/performance/benchmark_components.py \
            --config configs/perf_budgets.yaml \
            --output reports/performance/gate_check.json \
            --fail-on-violation
