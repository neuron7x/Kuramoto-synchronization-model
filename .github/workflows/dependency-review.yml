name: Dependency Review
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: lockfiles
        with:
          filters: |
            dependency_changes:
              - '**/poetry.lock'
              - '**/Pipfile.lock'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/Cargo.lock'
              - '**/go.sum'
              - '**/requirements*.txt'
              - '**/constraints*.txt'
              - '**/pyproject.toml'
      - name: Enforce dependency impact note in PR body
        if: steps.lockfiles.outputs.dependency_changes == 'true'
        run: |
          python - <<'PY'
          import json, re, sys
          event = json.load(open('${{ github.event_path }}'))
          body = ((event.get('pull_request') or {}).get('body') or '').lower()
          required = [
              r'dependency\s+impact',
              r'lockfile\s+rationale',
              r'why\s+dependency\s+change',
              r'supply[- ]chain\s+risk',
          ]
          if not any(re.search(p, body) for p in required):
              print('Dependency/lockfile files changed. Add a PR note section: "Dependency impact" or "Lockfile rationale".')
              sys.exit(1)
          PY

  dependency-review-merge-group:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependency audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pip-audit
          mapfile -t REQ_FILES < <(find . -maxdepth 4 -type f \( -name 'requirements*.txt' -o -name 'constraints*.txt' \) | sort)
          if [ ${#REQ_FILES[@]} -gt 0 ]; then
            for f in "${REQ_FILES[@]}"; do
              echo "Auditing Python dependencies: $f"
              pip-audit -r "$f"
            done
          else
            echo "No requirements/constraints files found for pip-audit"
          fi
      - name: Node dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t LOCKS < <(find . -maxdepth 4 -type f -name 'package-lock.json' | sort)
          if [ ${#LOCKS[@]} -eq 0 ]; then
            echo "No package-lock.json files found; skipping npm audit"
            exit 0
          fi
          for lock in "${LOCKS[@]}"; do
            d=$(dirname "$lock")
            if [ -f "$d/package.json" ]; then
              echo "Auditing Node dependencies in $d"
              (cd "$d" && npm audit --audit-level=high --omit=dev --package-lock-only)
            fi
          done

  final:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: [dependency-review-pr, dependency-review-merge-group]
    if: always()
    steps:
      - run: |
          for result in "${{ needs.dependency-review-pr.result }}" "${{ needs.dependency-review-merge-group.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Dependency review gate failed: $result"
              exit 1
            fi
          done
