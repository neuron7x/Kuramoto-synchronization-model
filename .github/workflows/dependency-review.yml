name: Dependency Review & License Compliance

permissions:
  contents: read
  pull-requests: write
  security-events: write
  issues: write

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'requirements*.txt'
      - 'requirements*.lock'
      - 'package*.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'go.mod'
      - 'go.sum'
      - 'pyproject.toml'
      - 'poetry.lock'

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0-only, AGPL-3.0, SSPL-1.0
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, MPL-2.0, LGPL-3.0-or-later
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true
          warn-only: false

  license-compliance:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install license scanning tools
        run: |
          pip install pip-licenses licensecheck

      - name: Scan Python dependencies for licenses
        id: python_licenses
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          
          # Generate license report (always generate, don't fail on errors)
          pip-licenses --format=json --output-file=python-licenses.json || echo "[]" > python-licenses.json
          pip-licenses --format=markdown --output-file=python-licenses.md || echo "# License Report\n\nError generating report" > python-licenses.md
          
          # Define allowed and denied licenses
          ALLOWED_LICENSES="MIT|Apache-2.0|Apache Software License|BSD|BSD-2-Clause|BSD-3-Clause|ISC|MPL-2.0|Mozilla Public License 2.0 (MPL 2.0)|LGPL-3.0-or-later|GNU Lesser General Public License v3 or later (LGPLv3+)|LGPLv3+"
          DENIED_LICENSES="GPL-3.0-only|GNU General Public License v3 \(GPLv3\)|AGPL-3.0|GNU Affero General Public License v3|SSPL-1.0|Server Side Public License"
          
          # Check for denied licenses (exact match, excluding LGPL variants)
          # Use a more precise regex that doesn't match LGPL when looking for GPL
          DENIED=$(pip-licenses --format=json 2>/dev/null | jq -r --arg denied "$DENIED_LICENSES" '.[] | select(.License | test($denied)) | select(.License | test("LGPL") | not) | "\(.Name) (\(.License))"' || echo "")
          
          # Check for review-required licenses (not in allowed or denied lists)
          REVIEW_REQUIRED=$(pip-licenses --format=json 2>/dev/null | jq -r --arg allowed "$ALLOWED_LICENSES" --arg denied "$DENIED_LICENSES" '.[] | select(.License | test($allowed) | not) | select(.License | test($denied) | not) | "\(.Name) (\(.License))"' || echo "")
          
          if [ -n "$DENIED" ]; then
            echo "problematic=true" >> $GITHUB_OUTPUT
            echo "licenses<<EOF" >> $GITHUB_OUTPUT
            echo "$DENIED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "❌ Found denied licenses:"
            echo "$DENIED"
          else
            echo "problematic=false" >> $GITHUB_OUTPUT
            echo "✅ No denied licenses found"
          fi
          
          if [ -n "$REVIEW_REQUIRED" ]; then
            echo "review_required=true" >> $GITHUB_OUTPUT
            echo "review_licenses<<EOF" >> $GITHUB_OUTPUT
            echo "$REVIEW_REQUIRED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "⚠️  Found licenses requiring review:"
            echo "$REVIEW_REQUIRED"
          else
            echo "review_required=false" >> $GITHUB_OUTPUT
          fi

      - name: Scan for dependency confusion vulnerabilities
        id: confusion_scan
        run: |
          # Check if any internal package names could conflict with public PyPI
          # This helps prevent dependency confusion attacks
          
          INTERNAL_PACKAGES="tradepulse,neurotrade_pro,hydrobrain_v2"
          
          echo "Checking for dependency confusion risks..."
          
          CONFUSION_RISK=false
          for pkg in $(echo $INTERNAL_PACKAGES | tr ',' '\n'); do
            # Check if package exists on PyPI
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$pkg/json")
            if [ "$STATUS" = "200" ]; then
              echo "⚠️  WARNING: Internal package '$pkg' exists on public PyPI"
              CONFUSION_RISK=true
            else
              echo "✓ Internal package '$pkg' not found on public PyPI"
            fi
          done
          
          if [ "$CONFUSION_RISK" = "true" ]; then
            echo "confusion_risk=true" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ DEPENDENCY CONFUSION RISK DETECTED"
            echo "Some internal package names exist on public PyPI."
            echo "Ensure you're using --index-url or --extra-index-url correctly."
          else
            echo "confusion_risk=false" >> $GITHUB_OUTPUT
            echo "✅ No dependency confusion risk detected"
          fi

      - name: Check for known malicious packages
        run: |
          # Use pip-audit to check for known malicious packages
          pip install pip-audit
          
          pip-audit --desc --format json -o malicious-packages-report.json || {
            echo "⚠️  pip-audit scan completed with warnings"
          }
          
          # Filter for malicious packages specifically
          if [ -f malicious-packages-report.json ]; then
            MALICIOUS=$(jq '[.dependencies[] // empty | select(.vulns[] | .aliases[]? // empty | test("MAL|MALWARE"))] | length' malicious-packages-report.json 2>/dev/null || echo "0")
            
            if [ "$MALICIOUS" -gt 0 ]; then
              echo "❌ Found $MALICIOUS potentially malicious packages"
              jq -r '.dependencies[] // empty | select(.vulns[] | .aliases[]? // empty | test("MAL|MALWARE")) | "  - \(.name) \(.version)"' malicious-packages-report.json
              exit 1
            else
              echo "✅ No known malicious packages detected"
            fi
          fi

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            python-licenses.*
            malicious-packages-report.json
          if-no-files-found: warn

      - name: Post license compliance summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const problematic = '${{ steps.python_licenses.outputs.problematic }}' === 'true';
            const reviewRequired = '${{ steps.python_licenses.outputs.review_required }}' === 'true';
            const confusionRisk = '${{ steps.confusion_scan.outputs.confusion_risk }}' === 'true';
            const problematicLicenses = `${{ steps.python_licenses.outputs.licenses }}` || 'None';
            const reviewLicenses = `${{ steps.python_licenses.outputs.review_licenses }}` || '';
            
            const emoji = !problematic && !confusionRisk ? (reviewRequired ? '⚠️' : '✅') : '❌';
            
            let licenseTable = '| Package | License | Status |\n|---------|---------|--------|\n';
            
            try {
              const licenseData = JSON.parse(fs.readFileSync('python-licenses.json', 'utf8'));
              const allowedLicenses = ['MIT', 'Apache', 'BSD', 'ISC', 'MPL-2.0', 'LGPL'];
              const deniedLicenses = ['GPL-3.0-only', 'GPLv3', 'AGPL', 'SSPL'];
              
              licenseData.slice(0, 15).forEach(pkg => {
                let status = '✅';
                let label = 'Allowed';
                
                // Check if denied (but not LGPL when GPL is mentioned)
                const isDenied = deniedLicenses.some(d => pkg.License.includes(d)) && !pkg.License.includes('LGPL');
                const isAllowed = allowedLicenses.some(a => pkg.License.includes(a));
                
                if (isDenied) {
                  status = '❌';
                  label = 'Denied';
                } else if (!isAllowed) {
                  status = '⚠️';
                  label = 'Review';
                }
                
                licenseTable += `| ${pkg.Name} | ${pkg.License} | ${status} ${label} |\n`;
              });
            } catch (error) {
              licenseTable += '*License data not available*\n';
            }
            
            const body = [
              `## ${emoji} License Compliance & Dependency Security`,
              '',
              '### License Compliance Status',
              problematic 
                ? `❌ **DENIED licenses detected:**\n\`\`\`\n${problematicLicenses}\n\`\`\`` 
                : '✅ **No denied licenses found**',
              '',
              reviewRequired 
                ? `⚠️ **Licenses requiring review:**\n\`\`\`\n${reviewLicenses}\n\`\`\`\n*These require manual approval but won't block the PR.*`
                : '',
              '',
              '### Dependency Security',
              confusionRisk 
                ? '❌ **Dependency confusion risk detected** - internal package names found on public PyPI' 
                : '✅ **No dependency confusion risk**',
              '',
              '### Top Dependencies',
              licenseTable,
              '',
              '### Allowed Licenses',
              '- ✅ MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause',
              '- ✅ ISC, MPL-2.0',
              '- ✅ LGPL-3.0-or-later (weak copyleft, library usage allowed)',
              '',
              '### Denied Licenses',
              '- ❌ GPL-3.0-only (strong copyleft)',
              '- ❌ AGPL-3.0 (network copyleft)',
              '- ❌ SSPL-1.0 (service restrictions)',
              '',
              '### Policy Reference',
              '📖 See [License Policy](../../docs/compliance/license-policy.md) for details',
              '',
              '### Recommendations',
              problematic ? '- **Action Required:** Replace packages with denied licenses' : '',
              reviewRequired ? '- **Review Needed:** Some licenses require manual approval' : '',
              confusionRisk ? '- Use `--index-url` to prioritize internal package registry' : '',
              confusionRisk ? '- Consider renaming internal packages to avoid conflicts' : '',
              '',
              '---',
              `*Last updated: ${new Date().toISOString()}*`
            ].filter(line => line !== '').join('\n');
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('License Compliance & Dependency Security')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }

      - name: Warn on review-required licenses
        if: steps.python_licenses.outputs.review_required == 'true'
        run: |
          echo "⚠️  WARNING: Some licenses require manual review"
          echo ""
          echo "The following packages have licenses that need review:"
          echo "${{ steps.python_licenses.outputs.review_licenses }}"
          echo ""
          echo "This is a WARNING only and will not block the PR."
          echo "Please review these licenses and update the policy if needed."
      
      - name: Fail on denied licenses or security issues
        if: steps.python_licenses.outputs.problematic == 'true' || steps.confusion_scan.outputs.confusion_risk == 'true'
        run: |
          echo "❌ License compliance or dependency security issues detected"
          echo ""
          echo "Please address the following:"
          if [ '${{ steps.python_licenses.outputs.problematic }}' = 'true' ]; then
            echo "  - CRITICAL: Replace packages with DENIED licenses"
            echo "${{ steps.python_licenses.outputs.licenses }}"
          fi
          if [ '${{ steps.confusion_scan.outputs.confusion_risk }}' = 'true' ]; then
            echo "  - Address dependency confusion risks"
          fi
          echo ""
          echo "See docs/compliance/license-policy.md for policy details"
          exit 1
