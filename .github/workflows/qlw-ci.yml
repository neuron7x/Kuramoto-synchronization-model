name: TradePulse-QLW CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/tradepulse_qlw/**'
      - 'tests/qlw/**'
      - 'configs/**'
      - 'charts/qlw/**'
      - 'Dockerfile.qlw'
      - '.github/workflows/qlw-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/tradepulse_qlw/**'
      - 'tests/qlw/**'
      - 'configs/**'
      - 'charts/qlw/**'
      - 'Dockerfile.qlw'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Lint with ruff
        run: ruff check src/tradepulse_qlw/
      
      - name: Type check with mypy
        run: mypy src/tradepulse_qlw/ --ignore-missing-imports
      
      - name: Run tests
        run: |
          cd tests/qlw
          pytest . -v --cov=../../src/tradepulse_qlw --cov-report=xml:../../coverage.xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: qlw
          name: tradepulse-qlw-coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tradepulse-qlw
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qlw
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      
      - name: Lint Helm chart
        run: helm lint charts/qlw
      
      - name: Template Helm chart
        run: helm template qlw charts/qlw --debug
