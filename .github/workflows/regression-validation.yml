name: Regression Validation Suite

# Critical regression testing workflow to confirm no breaking changes
# Runs on every push to main and on PRs targeting main
# Principal System Architect: Comprehensive regression safety net

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-path-validation:
    name: Critical Path Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - name: "Core Execution Engine"
            path: "tests/unit/core/execution"
            markers: "L1"
          - name: "Market Feed Integration"
            path: "tests/integration/markets"
            markers: "L3"
          - name: "Backtest Engine"
            path: "tests/unit/backtest"
            markers: "L1"
          - name: "Risk Management"
            path: "tests/unit/core/risk"
            markers: "L1"
          - name: "Order Management"
            path: "tests/integration/execution"
            markers: "L3"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r requirements.txt -r requirements-dev.txt

      - name: Run critical path tests - ${{ matrix.test-suite.name }}
        id: critical_tests
        run: |
          echo "Running critical tests: ${{ matrix.test-suite.name }}"
          
          # Run tests with strict failure on any error
          pytest ${{ matrix.test-suite.path }} \
            -m "${{ matrix.test-suite.markers }}" \
            --tb=short \
            --strict-markers \
            --maxfail=3 \
            -v \
            --junitxml=test-results-${{ matrix.test-suite.name }}.xml \
            || {
              echo "REGRESSION DETECTED in ${{ matrix.test-suite.name }}"
              exit 1
            }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results-${{ matrix.test-suite.name }}
          path: test-results-*.xml

  coverage-regression-check:
    name: Coverage Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: critical-path-validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r requirements.txt -r requirements-dev.txt

      - name: Run coverage on critical modules
        run: |
          echo "Generating coverage report for critical paths..."
          pytest tests/ \
            --cov=core \
            --cov=backtest \
            --cov=execution \
            --cov-report=term-missing \
            --cov-report=json:coverage-report.json \
            --cov-report=html:coverage-html \
            --cov-config=pyproject.toml

      - name: Analyze coverage by module
        id: coverage_analysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          # Load coverage report
          coverage_file = Path('coverage-report.json')
          if not coverage_file.exists():
              print("⚠️ Coverage report not found")
              exit(0)
          
          data = json.loads(coverage_file.read_text())
          
          # Critical modules to track
          critical_modules = [
              'core/execution',
              'core/risk',
              'backtest/engine',
              'execution/order_manager',
          ]
          
          print("\n📊 Coverage Report by Critical Module:\n")
          print(f"{'Module':<40} {'Coverage':>10}")
          print("=" * 52)
          
          low_coverage_modules = []
          
          for module_pattern in critical_modules:
              module_files = [f for f in data['files'].keys() if module_pattern in f]
              if module_files:
                  total_statements = sum(data['files'][f]['summary']['num_statements'] for f in module_files)
                  covered_statements = sum(data['files'][f]['summary']['covered_lines'] for f in module_files)
                  
                  if total_statements > 0:
                      coverage_pct = (covered_statements / total_statements) * 100
                      status = "✅" if coverage_pct >= 95 else "⚠️" if coverage_pct >= 90 else "❌"
                      print(f"{status} {module_pattern:<35} {coverage_pct:>8.1f}%")
                      
                      if coverage_pct < 95:
                          low_coverage_modules.append({
                              'module': module_pattern,
                              'coverage': coverage_pct
                          })
          
          # Overall coverage
          overall_pct = data['totals']['percent_covered']
          print("\n" + "=" * 52)
          print(f"{'OVERALL COVERAGE':<40} {overall_pct:>8.1f}%")
          
          # Write output for GitHub Actions
          with open('coverage-summary.md', 'w') as f:
              f.write("## 📊 Coverage Analysis\n\n")
              f.write(f"**Overall Coverage:** {overall_pct:.1f}%\n\n")
              
              if low_coverage_modules:
                  f.write("### ⚠️ Modules Below 95% Coverage\n\n")
                  for mod in low_coverage_modules:
                      f.write(f"- `{mod['module']}`: {mod['coverage']:.1f}%\n")
              else:
                  f.write("### ✅ All critical modules have >95% coverage\n")
          
          # Fail if overall coverage is below threshold
          if overall_pct < 98:
              print(f"\n❌ COVERAGE REGRESSION: {overall_pct:.1f}% < 98%")
              exit(1)
          else:
              print(f"\n✅ Coverage threshold met: {overall_pct:.1f}% >= 98%")
          PY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-regression
          path: |
            coverage-report.json
            coverage-html/
            coverage-summary.md

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const summaryPath = 'coverage-summary.md';
              if (!fs.existsSync(summaryPath)) {
                console.log('Coverage summary not found');
                return;
              }
              
              const summary = fs.readFileSync(summaryPath, 'utf8');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            } catch (error) {
              console.log('Failed to post coverage comment:', error);
            }

  security-regression-scan:
    name: Security Regression Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit semgrep

      - name: Run Bandit security scan
        id: bandit
        continue-on-error: true
        run: |
          bandit -r core/ backtest/ execution/ application/ \
            -f json -o bandit-regression-report.json || true
          
          # Count high and critical issues
          HIGH_ISSUES=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-regression-report.json 2>/dev/null || echo "0")
          CRITICAL_ISSUES=$(jq '[.results[] | select(.issue_severity == "CRITICAL")] | length' bandit-regression-report.json 2>/dev/null || echo "0")
          
          echo "high_issues=$HIGH_ISSUES" >> $GITHUB_OUTPUT
          echo "critical_issues=$CRITICAL_ISSUES" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL_ISSUES" -gt 0 ]; then
            echo "❌ Found $CRITICAL_ISSUES critical security issues"
            exit 1
          fi
          
          echo "✅ No critical security issues found"

      - name: Run pip-audit for dependency vulnerabilities
        id: pip_audit
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          pip-audit --desc --format json -o pip-audit-report.json || {
            echo "⚠️ pip-audit found vulnerabilities"
          }
          
          # Check for high/critical CVEs
          if [ -f pip-audit-report.json ]; then
            VULNS=$(jq '[.dependencies[] // empty | select(.vulns)] | length' pip-audit-report.json 2>/dev/null || echo "0")
            echo "vulnerabilities=$VULNS" >> $GITHUB_OUTPUT
            
            if [ "$VULNS" -gt 0 ]; then
              echo "⚠️ Found $VULNS vulnerable dependencies"
              jq -r '.dependencies[] // empty | select(.vulns) | "\(.name) \(.version): \(.vulns | length) vulnerabilities"' pip-audit-report.json
            fi
          fi

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-reports
          path: |
            bandit-regression-report.json
            pip-audit-report.json

  regression-summary:
    name: Regression Validation Summary
    runs-on: ubuntu-latest
    needs: [critical-path-validation, coverage-regression-check, security-regression-scan]
    if: always()
    
    steps:
      - name: Generate regression summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            
            // Check all job statuses
            const jobs = [
              'critical-path-validation',
              'coverage-regression-check', 
              'security-regression-scan'
            ];
            
            let allPassed = true;
            let summary = '## 🔍 Regression Validation Results\n\n';
            
            for (const job of jobs) {
              const status = '${{ needs[job].result }}';
              const icon = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
              summary += `${icon} ${job}: ${status}\n`;
              
              if (status !== 'success') {
                allPassed = false;
              }
            }
            
            summary += '\n';
            
            if (allPassed) {
              summary += '### ✅ All regression checks passed!\n';
              summary += 'No breaking changes detected. Safe to merge.\n';
            } else {
              summary += '### ❌ Regression detected!\n';
              summary += 'Breaking changes or quality degradation found. Review required.\n';
              core.setFailed('Regression validation failed');
            }
            
            console.log(summary);
            
            // Post summary as PR comment if this is a PR
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: summary
              });
            }
