name: Merge Guard - Block on Quality Gate Failure

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  merge-guard:
    runs-on: ubuntu-latest
    name: Merge Guard Quality Check
    
    steps:
      - name: Check if infrastructure-only change
        id: check_infra
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number,
            });
            
            // Check if ALL changed files are in .github/workflows or docs/compliance or tests/
            const allInfraOrDocs = files.every(f => 
              f.filename.startsWith('.github/workflows/') || 
              f.filename.startsWith('docs/compliance/') ||
              f.filename.startsWith('tests/') ||
              f.filename.match(/^(COMPLIANCE|VULNERABILITY_BACKLOG|CI_GATES_COMPLETION_SUMMARY|SECURITY_FIXES)\.md$/)
            );
            
            console.log('Infrastructure/docs-only PR:', allInfraOrDocs);
            core.setOutput('is_infra_only', allInfraOrDocs);
            
            if (allInfraOrDocs) {
              console.log('⚠️ This is an infrastructure/documentation PR - skipping quality gate checks');
              console.log('Note: This PR modifies CI/CD workflows themselves');
            }
            
            return allInfraOrDocs;
      - name: Skip quality checks for infrastructure PRs
        if: steps.check_infra.outputs.is_infra_only == 'true'
        run: |
          echo "✅ Infrastructure/Documentation PR detected"
          echo "Skipping quality gate checks (workflow/docs changes only)"
          echo "This PR modifies CI/CD infrastructure itself"
          exit 0

      - name: Check PR labels
        if: steps.check_infra.outputs.is_infra_only != 'true'
        id: check_labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const labelNames = labels.map(l => l.name);
            const hasQualityGateFailed = labelNames.includes('quality-gate-failed');
            const hasMissingCoverage = labelNames.includes('missing-coverage');
            const hasHighRisk = labelNames.includes('risk: high');
            
            console.log('Labels:', labelNames);
            console.log('Quality gate failed:', hasQualityGateFailed);
            console.log('Missing coverage:', hasMissingCoverage);
            console.log('High risk:', hasHighRisk);
            
            core.setOutput('quality_gate_failed', hasQualityGateFailed);
            core.setOutput('missing_coverage', hasMissingCoverage);
            core.setOutput('high_risk', hasHighRisk);
            
            return {
              blocked: hasQualityGateFailed,
              warning: hasMissingCoverage || hasHighRisk,
            };

      - name: Check workflow status
        if: steps.check_infra.outputs.is_infra_only != 'true'
        id: check_workflows
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            
            // Get all check runs for this commit
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref,
            });
            
            const requiredChecks = [
              'Aggregate coverage & enforce guardrail',
              'Mutation Testing Gate (90% kill rate)',
            ];
            
            const checkStatus = {};
            let allPassed = true;
            let anyFailed = false;
            
            for (const checkName of requiredChecks) {
              const check = checkRuns.check_runs.find(c => c.name === checkName);
              if (check) {
                checkStatus[checkName] = check.conclusion;
                if (check.conclusion !== 'success') {
                  allPassed = false;
                }
                if (check.conclusion === 'failure') {
                  anyFailed = true;
                }
              } else {
                checkStatus[checkName] = 'pending';
                allPassed = false;
              }
            }
            
            console.log('Check status:', checkStatus);
            core.setOutput('all_passed', allPassed);
            core.setOutput('any_failed', anyFailed);
            
            return checkStatus;

      - name: Manage missing-coverage label
        if: steps.check_infra.outputs.is_infra_only != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            // Get current labels
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const labelNames = labels.map(l => l.name);
            const hasMissingCoverageLabel = labelNames.includes('missing-coverage');
            const isCritical = labelNames.some(l => ['security', 'hotfix', 'critical'].includes(l.toLowerCase()));
            
            // Check if PR has files without tests
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number,
            });
            
            // Check for new Python files in core/backtest/execution
            const newCodeFiles = files.filter(f => 
              f.status === 'added' && 
              f.filename.match(/\.(py)$/) &&
              f.filename.match(/^(core|backtest|execution)\//)
            );
            
            // Check for corresponding test files
            let hasUncoveredFiles = false;
            for (const file of newCodeFiles) {
              const testPath = file.filename.replace(/^(core|backtest|execution)\//, 'tests/unit/$1/').replace('.py', '_test.py');
              const testExists = files.some(f => f.filename === testPath);
              if (!testExists) {
                console.log(`New file without test: ${file.filename}`);
                hasUncoveredFiles = true;
              }
            }
            
            // Decide on label action
            if (hasUncoveredFiles && !hasMissingCoverageLabel) {
              console.log('Adding missing-coverage label');
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: ['missing-coverage']
              });
            } else if (!hasUncoveredFiles && hasMissingCoverageLabel) {
              console.log('Removing missing-coverage label');
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pull_number,
                name: 'missing-coverage'
              }).catch(err => console.log('Label might not exist:', err.message));
            }
            
            core.setOutput('has_uncovered_files', hasUncoveredFiles);
            core.setOutput('is_critical', isCritical);
      
      - name: Block merge if quality gates failed
        if: steps.check_infra.outputs.is_infra_only != 'true' && (steps.check_labels.outputs.quality_gate_failed == 'true' || steps.check_workflows.outputs.any_failed == 'true')
        run: |
          echo "❌ Merge blocked: Quality gates have not been met."
          echo ""
          echo "Note: Quality gates now use ratchet policies:"
          echo "  - Coverage: Must not decrease by more than 0.5% from baseline"
          echo "  - Mutation: Must not decrease from baseline"
          echo "  - Changed files: Must have ≥80% coverage"
          echo "  - All tests must pass"
          echo ""
          echo "See workflow logs for detailed ratchet calculations."
          echo "Please fix the failing checks and push again."
          exit 1

      - name: Post merge guard status
        if: always() && steps.check_infra.outputs.is_infra_only != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const qualityGateFailed = '${{ steps.check_labels.outputs.quality_gate_failed }}' === 'true';
            const anyWorkflowFailed = '${{ steps.check_workflows.outputs.any_failed }}' === 'true';
            const allPassed = '${{ steps.check_workflows.outputs.all_passed }}' === 'true';
            const highRisk = '${{ steps.check_labels.outputs.high_risk }}' === 'true';
            const hasMissingCoverage = '${{ steps.check_labels.outputs.missing_coverage }}' === 'true';
            
            let statusEmoji = '⚠️';
            let statusText = 'PENDING';
            let message = 'Waiting for quality checks to complete...';
            
            if (qualityGateFailed || anyWorkflowFailed) {
              statusEmoji = '❌';
              statusText = 'BLOCKED';
              message = 'Merge is **BLOCKED** due to failing quality gates. Please fix the issues and push again.';
            } else if (allPassed && !highRisk && !hasMissingCoverage) {
              statusEmoji = '✅';
              statusText = 'APPROVED';
              message = 'All quality gates passed! This PR is **ready to merge**.';
            } else if (allPassed && (highRisk || hasMissingCoverage)) {
              statusEmoji = '⚠️';
              statusText = 'APPROVED WITH NOTES';
              message = 'Quality gates passed, but please review the notes below.';
            }
            
            const bodyLines = [
              `## ${statusEmoji} Merge Guard Status: ${statusText}`,
              '',
              message,
              '',
              '### Quality Gate Policy (Ratchet)',
              '',
              '✅ **Coverage:** No regression >0.5% from baseline',
              '✅ **Mutation:** No regression from baseline',
              '✅ **Changed Files:** ≥80% coverage',
              '✅ **All Tests:** Must pass',
              '',
              '### Status',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Coverage Ratchet | ${allPassed ? '✅' : '⏳'} |`,
              `| Mutation Ratchet | ${allPassed ? '✅' : '⏳'} |`,
              `| All Tests | ${!anyWorkflowFailed ? '✅' : '❌'} |`,
            ];
            
            if (hasMissingCoverage) {
              bodyLines.push('');
              bodyLines.push('### ⚠️ Notes');
              bodyLines.push('- Some new files lack test coverage');
              bodyLines.push('- This will not block merge for critical/security/hotfix PRs');
              bodyLines.push('- Please add tests in a follow-up PR');
            }
            
            if (highRisk) {
              bodyLines.push('');
              bodyLines.push('### ⚠️ High Risk');
              bodyLines.push('- This is a high-risk change');
              bodyLines.push('- Senior review recommended before merging');
            }
            
            bodyLines.push('');
            bodyLines.push('---');
            bodyLines.push('*Ratchet policy: No regression allowed. Baseline updated on merge to main/develop.*');
            bodyLines.push('*This check is automatically updated when commits are pushed.*');
            
            const body = bodyLines.join('\n');
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Merge Guard Status')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }
