name: Security Scan

permissions:
  contents: read
  security-events: write

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect_docker_changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            docker:
              - '**/Dockerfile'
              - '**/*.Dockerfile'
              - 'docker-compose.yml'

  bandit:
    name: Bandit security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: '3.11'
          cache-prefix: venv-security
      - name: Run Bandit security linter
        run: |
          .venv/bin/bandit -r tradepulse/ -c pyproject.toml -ll

  semgrep:
    name: Semgrep Scan (Python/TS/Rust/Go)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Run Semgrep
        run: |
          semgrep ci --config=auto --sarif --output semgrep-results.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@45c373516f557556c15d420e3f5e0aa3d64366bc # v3
        with:
          sarif_file: semgrep-results.sarif

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@45c373516f557556c15d420e3f5e0aa3d64366bc # v3
        with:
          languages: python, javascript, go
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@45c373516f557556c15d420e3f5e0aa3d64366bc # v3

  trufflehog:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Run TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@8f5fa9b84b6f4f1f514e9f3d64695d6a8a57b35d # v3
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: detect_docker_changes
    if: needs.detect_docker_changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@a1b9f4d6c8bcbcb3a946259e38a1c0fd2d7ff3d4 # v0.30.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@45c373516f557556c15d420e3f5e0aa3d64366bc # v3
        with:
          sarif_file: trivy-results.sarif
