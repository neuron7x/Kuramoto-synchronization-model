name: PR Security Checks

permissions:
  contents: read
  security-events: write
  pull-requests: write

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-security-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-test-suite:
    name: Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints/security.txt -r requirements.txt
          pip install -c constraints/security.txt -r requirements-dev.txt

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run security-specific tests
        id: security_tests
        run: |
          python -m pytest tests/security/ \
            -v \
            --junitxml=reports/security/junit.xml \
            --html=reports/security/report.html --self-contained-html \
            --cov=core --cov=application \
            --cov-report=xml:reports/security/coverage.xml \
            --cov-report=html:reports/security/coverage_html \
            --tb=short

      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-reports
          path: |
            reports/security/junit.xml
            reports/security/report.html
            reports/security/coverage.xml
            reports/security/coverage_html
          if-no-files-found: warn

  sast-bandit:
    name: SAST - Bandit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        id: bandit
        continue-on-error: true
        run: |
          mkdir -p reports/security
          bandit -r core/ application/ backtest/ execution/ \
            -f json -o reports/security/bandit-full.json || true
          bandit -r core/ application/ backtest/ execution/ \
            -ll -f txt | tee reports/security/bandit-summary.txt

      - name: Check Bandit results
        run: |
          if [ -f reports/security/bandit-full.json ]; then
            # Check for high severity issues
            HIGH_ISSUES=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' reports/security/bandit-full.json)
            MEDIUM_ISSUES=$(jq '[.results[] | select(.issue_severity == "MEDIUM")] | length' reports/security/bandit-full.json)
            
            echo "High severity issues: $HIGH_ISSUES"
            echo "Medium severity issues: $MEDIUM_ISSUES"
            
            if [ "$HIGH_ISSUES" -gt 0 ]; then
              echo "❌ Found $HIGH_ISSUES high severity security issues"
              jq -r '.results[] | select(.issue_severity == "HIGH") | "[\(.issue_severity)] \(.issue_text) at \(.filename):\(.line_number)"' reports/security/bandit-full.json
              exit 1
            fi
          fi

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: reports/security/bandit-*.json
          if-no-files-found: warn

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --json

  dependency-scan-pr:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r requirements.txt -r requirements-dev.txt
          pip install safety pip-audit

      - name: Run Safety check
        continue-on-error: true
        run: |
          mkdir -p reports/security
          safety check --json > reports/security/safety-report.json || true
          safety check || true

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit --desc -o reports/security/pip-audit-report.json --format json || true
          pip-audit --desc || true

      - name: Check for critical vulnerabilities
        run: |
          if [ -f reports/security/pip-audit-report.json ]; then
            # Filter out known acceptable vulnerabilities
            CRITICAL_VULNS=$(jq -r '
              [.dependencies[] // empty |
               select(.vulns != null and (.vulns | length) > 0) |
               .vulns[] |
               select(.id != "GHSA-4xh5-x5gv-qwph")
              ] | length
            ' reports/security/pip-audit-report.json)
            
            if [ "$CRITICAL_VULNS" -gt 0 ]; then
              echo "❌ Found $CRITICAL_VULNS critical vulnerabilities"
              jq -r '
                .dependencies[] // empty |
                select(.vulns != null and (.vulns | length) > 0) |
                .vulns[] |
                select(.id != "GHSA-4xh5-x5gv-qwph") |
                "- [\(.id)] \(.description[:100])"
              ' reports/security/pip-audit-report.json
              exit 1
            fi
          fi

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-reports
          path: reports/security/*-report.json
          if-no-files-found: warn

  codeql-pr:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  semgrep-pr:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            --severity ERROR \
            --severity WARNING
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-test-suite, sast-bandit, secret-scanning, dependency-scan-pr, codeql-pr, semgrep-pr]
    if: always()

    steps:
      - name: Check job results
        id: check_results
        run: |
          echo "security_tests=${{ needs.security-test-suite.result }}" >> $GITHUB_OUTPUT
          echo "bandit=${{ needs.sast-bandit.result }}" >> $GITHUB_OUTPUT
          echo "secrets=${{ needs.secret-scanning.result }}" >> $GITHUB_OUTPUT
          echo "dependencies=${{ needs.dependency-scan-pr.result }}" >> $GITHUB_OUTPUT
          echo "codeql=${{ needs.codeql-pr.result }}" >> $GITHUB_OUTPUT
          echo "semgrep=${{ needs.semgrep-pr.result }}" >> $GITHUB_OUTPUT

      - name: Post security summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const results = {
              'Security Tests': '${{ steps.check_results.outputs.security_tests }}',
              'Bandit SAST': '${{ steps.check_results.outputs.bandit }}',
              'Secret Scanning': '${{ steps.check_results.outputs.secrets }}',
              'Dependency Scan': '${{ steps.check_results.outputs.dependencies }}',
              'CodeQL': '${{ steps.check_results.outputs.codeql }}',
              'Semgrep': '${{ steps.check_results.outputs.semgrep }}',
            };
            
            const statusEmoji = (status) => {
              if (status === 'success') return '✅';
              if (status === 'failure') return '❌';
              if (status === 'skipped') return '⏭️';
              return '⏳';
            };
            
            const allPassed = Object.values(results).every(r => r === 'success' || r === 'skipped');
            const anyFailed = Object.values(results).some(r => r === 'failure');
            
            const lines = [
              `## ${allPassed ? '✅' : '⚠️'} Security Checks Summary`,
              '',
              '### Scan Results',
              '',
              '| Check | Status |',
              '|-------|--------|',
            ];
            
            for (const [name, status] of Object.entries(results)) {
              lines.push(`| ${name} | ${statusEmoji(status)} ${status} |`);
            }
            
            lines.push('');
            
            if (allPassed) {
              lines.push('✅ **All security checks passed!**');
            } else if (anyFailed) {
              lines.push('❌ **Some security checks failed. Please review and fix the issues.**');
            } else {
              lines.push('⏳ **Security checks are in progress...**');
            }
            
            lines.push('');
            lines.push('### Security Testing Coverage');
            lines.push('- ✅ Input validation (SQL injection, XSS, command injection)');
            lines.push('- ✅ Cryptography (secure random, hashing, encryption)');
            lines.push('- ✅ Authentication & session management');
            lines.push('- ✅ Rate limiting & DoS protection');
            lines.push('- ✅ Secret scanning (Gitleaks, TruffleHog)');
            lines.push('- ✅ SAST analysis (Bandit, Semgrep, CodeQL)');
            lines.push('- ✅ Dependency vulnerabilities (Safety, pip-audit)');
            lines.push('');
            lines.push('---');
            lines.push(`*Last updated: ${new Date().toISOString()}*`);
            
            const body = lines.join('\n');
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Security Checks Summary')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }
