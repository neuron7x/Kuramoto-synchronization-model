name: Requirements Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-requirements:
    name: Ensure requirement locks are current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools>=7.4.1"

      - name: Rebuild production requirements lockfile
        run: |
          pip-compile \
            --no-annotate \
            --resolver=backtracking \
            --output-file=requirements.lock \
            --strip-extras \
            --constraint constraints/security.txt \
            requirements.txt

      - name: Rebuild development requirements lockfile
        run: |
          pip-compile \
            --no-annotate \
            --resolver=backtracking \
            --output-file=requirements-dev.lock \
            --strip-extras \
            --constraint constraints/security.txt \
            requirements-dev.txt

      - name: Confirm lockfiles are up to date
        run: git diff --exit-code -- requirements.lock requirements-dev.lock
