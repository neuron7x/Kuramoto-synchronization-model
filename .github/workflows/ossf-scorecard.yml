name: OSSF Scorecard - Supply Chain Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scorecard:
    name: Run OSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install OSSF Scorecard
        run: |
          # Install a specific version of scorecard for reproducibility
          go install github.com/ossf/scorecard/v4/cmd/scorecard@v4.13.1

      - name: Run OSSF Scorecard
        # This step produces a JSON result at ./scorecard-results/scorecard.json
        run: |
          mkdir -p scorecard-results
          # Run scorecard and write JSON output
          # Setting GITHUB_AUTH_TOKEN for better rate limits (optional, uses default GitHub token)
          export GITHUB_AUTH_TOKEN=${{ github.token }}
          if scorecard --repo="https://github.com/${{ github.repository }}" --format=json > scorecard-results/scorecard.json; then
            echo "✅ Scorecard analysis completed successfully"
            cat scorecard-results/scorecard.json | head -50
          else
            echo "❌ ERROR: Scorecard analysis failed"
            exit 1
          fi

      - name: Upload OSSF Scorecard Results
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ossf-scorecard-results
          path: scorecard-results/scorecard.json
          retention-days: 7

  report:
    name: Process Scorecard Results
    needs: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Minimal permission required
    steps:
      - name: Download OSSF Scorecard Results
        uses: actions/download-artifact@v3
        with:
          name: ossf-scorecard-results
          path: ./scorecard-results

      - name: Show results
        run: |
          echo "Contents of scorecard-results:"
          ls -la scorecard-results || true
          if [ -f scorecard-results/scorecard.json ]; then
            echo "Scorecard JSON contents:" && cat scorecard-results/scorecard.json
          else
            echo "ERROR: scorecard-results/scorecard.json not found" && exit 1
          fi

# Notes
# - Artifacts are scoped to a workflow run. Ensure upload and download steps are in the same run or use a different approach.
# - The artifact name is case-sensitive; both upload and download use name: ossf-scorecard-results.
# - If you already use an ossf/scorecard-action in your repo, replace the "Run OSSF Scorecard" step with the action but keep the upload step unchanged.
