name: OSSF Scorecard - Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scorecard:
    name: Run OSSF Scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install and run scorecard
        run: |
          set -e
          mkdir -p scorecard-results
          # Try to use the scorecard action/cli; install python scorecard package as fallback
          if ! command -v scorecard >/dev/null 2>&1; then
            python -m pip install --upgrade pip
            pip install scorecard
          fi
          # Run scorecard against this repository and write JSON output
          scorecard --repo="https://github.com/${{ github.repository }}" --output=json > scorecard-results/scorecard.json || true

      - name: Show generated file
        run: |
          ls -la scorecard-results || true
          if [ -f scorecard-results/scorecard.json ]; then
            echo "scorecard found" && head -n 50 scorecard-results/scorecard.json || true
          else
            echo "WARNING: scorecard-results/scorecard.json not found" && true
          fi

      - name: Upload OSSF Scorecard Results
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ossf-scorecard-results
          path: scorecard-results/scorecard.json
          retention-days: 7

  report:
    name: Process Scorecard Results
    needs: scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Download OSSF Scorecard Results
        uses: actions/download-artifact@v3
        with:
          name: ossf-scorecard-results
          path: ./scorecard-results

      - name: Verify and display results
        run: |
          echo "Contents of scorecard-results:"
          ls -la scorecard-results || true
          if [ -f scorecard-results/scorecard.json ]; then
            echo "Scorecard JSON contents:" && cat scorecard-results/scorecard.json
          else
            echo "ERROR: scorecard-results/scorecard.json not found" && exit 1
          fi
