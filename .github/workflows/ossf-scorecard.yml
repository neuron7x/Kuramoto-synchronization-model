name: OSSF Scorecard - Supply Chain Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scorecard:
    name: Run OSSF Scorecard
    runs-on: ubuntu-latest
    outputs:
      scorecard-path: ${{ steps.upload.outputs.artifact-path || 'scorecard-results/scorecard.json' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (for any scorecard wrapper scripts)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run OSSF Scorecard
        # Use the official scorecard-action if available; fallback to CLI via container
        # This step must produce a JSON result at ./scorecard-results/scorecard.json
        run: |
          mkdir -p scorecard-results
          # Try to run the scorecard-action CLI directly (if you prefer the action replace this run with the action call)
          # Install scorecard if not present and run it against the repository
          if ! command -v scorecard >/dev/null 2>&1; then
            python -m pip install --upgrade pip
            pip install scorecard
          fi
          # Run scorecard and write JSON output
          scorecard --repo="https://github.com/${{ github.repository }}" --output=json > scorecard-results/scorecard.json || true

      - name: Upload OSSF Scorecard Results
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ossf-scorecard-results
          path: scorecard-results/scorecard.json
          retention-days: 7

  report:
    name: Process Scorecard Results
    needs: scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Download OSSF Scorecard Results
        uses: actions/download-artifact@v3
        with:
          name: ossf-scorecard-results
          path: ./scorecard-results

      - name: Show results
        run: |
          echo "Contents of scorecard-results:"
          ls -la scorecard-results || true
          if [ -f scorecard-results/scorecard.json ]; then
            echo "Scorecard JSON contents:" && cat scorecard-results/scorecard.json
          else
            echo "ERROR: scorecard-results/scorecard.json not found" && exit 1
          fi

# Notes
# - Artifacts are scoped to a workflow run. Ensure upload and download steps are in the same run or use a different approach.
# - The artifact name is case-sensitive; both upload and download use name: ossf-scorecard-results.
# - If you already use an ossf/scorecard-action in your repo, replace the "Run OSSF Scorecard" step with the action but keep the upload step unchanged.
