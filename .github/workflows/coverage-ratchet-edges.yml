# SPDX-License-Identifier: MIT
name: Coverage Ratchet Edge Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/coverage/**"
      - "configs/quality/**"
      - "tests/tools/test_coverage_intelligence_ratchet_edges.py"
      - ".github/workflows/coverage-ratchet-edges.yml"
  push:
    branches: [main]
    paths:
      - "tools/coverage/**"
      - "configs/quality/**"
      - "tests/tools/test_coverage_intelligence_ratchet_edges.py"
      - ".github/workflows/coverage-ratchet-edges.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ratchet-edge-falsifiers:
    name: Coverage ratchet edge falsifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: pip install numpy scipy pandas networkx pyyaml jsonschema pytest
      - name: Run ratchet edge falsifiers
        run: python -m pytest tests/tools/test_coverage_intelligence_ratchet_edges.py -q -p no:cacheprovider
