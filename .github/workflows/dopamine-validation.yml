name: Dopamine Config Validation

permissions:
  contents: read

on:
  push:
    paths:
      - 'config/dopamine.yaml'
      - 'config/profiles/*.yaml'
      - 'schemas/dopamine.schema.json'
      - 'src/tradepulse/core/neuro/dopamine/**'
      - 'tests/core/neuro/dopamine/**'
      - 'tools/validate_dopamine_config.py'
      - 'tools/migrate_dopamine_config.py'
  pull_request:
    paths:
      - 'config/dopamine.yaml'
      - 'config/profiles/*.yaml'
      - 'schemas/dopamine.schema.json'
      - 'src/tradepulse/core/neuro/dopamine/**'
      - 'tests/core/neuro/dopamine/**'

concurrency:
  group: dopamine-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    name: Validate Config Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema

      - name: Validate all dopamine configs
        run: |
          python tools/validate_dopamine_config.py --all

  test-dopamine:
    name: Test Dopamine Module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov hypothesis

      - name: Run dopamine tests
        run: |
          pytest tests/core/neuro/dopamine/ -v

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run benchmark (informational only)
        run: |
          python benchmarks/dopamine_step_bench.py --iterations 5000 || echo "⚠️ Benchmark completed (target: 15k steps/s)"

      - name: Benchmark summary
        if: always()
        run: |
          echo "✅ Benchmark job completed"
          echo "Note: Performance target is 15k steps/s. Current results are informational."

  migration-test:
    name: Test Config Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Test migration tool
        run: |
          # Test migration from v2.2 to v1.0 (if old config exists)
          if [ -f config/dopamine.yaml ]; then
            python tools/migrate_dopamine_config.py config/dopamine.yaml --dry-run
            echo "✅ Migration tool works"
          fi
