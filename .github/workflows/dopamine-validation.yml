name: Dopamine Config Validation

on:
  push:
    paths:
      - 'config/dopamine.yaml'
      - 'config/profiles/*.yaml'
      - 'schemas/dopamine.schema.json'
      - 'src/tradepulse/core/neuro/dopamine/**'
      - 'tests/core/neuro/dopamine/**'
      - 'tools/validate_dopamine_config.py'
      - 'tools/migrate_dopamine_config.py'
  pull_request:
    paths:
      - 'config/dopamine.yaml'
      - 'config/profiles/*.yaml'
      - 'schemas/dopamine.schema.json'
      - 'src/tradepulse/core/neuro/dopamine/**'
      - 'tests/core/neuro/dopamine/**'

jobs:
  validate-schema:
    name: Validate Config Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema
      
      - name: Validate all dopamine configs
        run: |
          python tools/validate_dopamine_config.py --all

  test-dopamine:
    name: Test Dopamine Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov hypothesis
      
      - name: Run dopamine tests
        run: |
          pytest tests/core/neuro/dopamine/ -v --cov=tradepulse.core.neuro.dopamine --cov-report=term --cov-report=xml
      
      - name: Check coverage threshold
        run: |
          # Extract coverage percentage
          coverage=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('coverage.xml').getroot().attrib['line-rate'])")
          coverage_pct=$(python -c "print(int(float('$coverage') * 100))")
          echo "Coverage: ${coverage_pct}%"
          
          # Check against 80% threshold (stepping stone to 95%)
          if [ $coverage_pct -lt 80 ]; then
            echo "❌ Coverage ${coverage_pct}% is below 80% threshold"
            exit 1
          else
            echo "✅ Coverage ${coverage_pct}% meets threshold"
          fi

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Run benchmark
        run: |
          python benchmarks/dopamine_step_bench.py --iterations 10000 || true
      
      - name: Comment performance results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // In a real implementation, we'd capture and parse benchmark output
            // For now, just note that benchmark ran
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚡ Dopamine performance benchmark completed. Check workflow logs for details.'
            });

  migration-test:
    name: Test Config Migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Test migration tool
        run: |
          # Test migration from v2.2 to v1.0 (if old config exists)
          if [ -f config/dopamine.yaml ]; then
            python tools/migrate_dopamine_config.py config/dopamine.yaml --dry-run
            echo "✅ Migration tool works"
          fi
