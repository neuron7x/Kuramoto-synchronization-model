name: data-governance-validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  data-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install numpy scipy pandas pydantic pydantic-settings pandera PyYAML

      - name: Install full production dependencies (no-deps for safety)
        run: |
          python -m pip install -r requirements.txt --no-deps
          python -m pip install -r requirements.txt

      - name: Validate dataset metadata and fingerprints
        run: |
          python scripts/validate_datasets.py --write-fingerprints artifacts/data-fingerprints
          python scripts/validate_dataset_schema.py

      - name: Run data governance tests
        run: |
          pytest tests/data/test_dataset_metadata_validation.py \
                tests/data/test_data_fingerprinting.py \
                tests/data/test_dataset_schema_validation.py

      - name: Upload data fingerprints
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-fingerprints
          path: artifacts/data-fingerprints/
          if-no-files-found: warn

      - name: Upload data transformation traces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-traces
          path: artifacts/data-traces/
          if-no-files-found: warn
