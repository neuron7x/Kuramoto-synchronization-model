# SPDX-License-Identifier: MIT
#
# Truth-Gate Mutation Harness (keystone) — proves the gates are enforced.
#
# Injects a named lie into each truth gate's source and asserts the gate's guard
# test fails (mutant killed). A surviving mutant = a decorative gate; a stale
# anchor = a mutation that no longer bites. Fail-closed on either. Also runs the
# harness self-test (hermetic toy gate) so the keystone itself is not decorative.
name: Truth-Gate Mutation Harness

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/governance/mutate_truth_gates.py'
      - 'tests/governance/test_truth_gate_mutation.py'
      - 'tools/governance/check_pr_lane_collision.py'
      - 'tools/physics/check_physics_reliability.py'
      - 'tools/security/check_dependency_manifest_consistency.py'
      - 'tools/release/check_physics_release_scorecard.py'
      - '.github/workflows/truth-gate-mutation.yml'
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: truth-gate-mutation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  truth-gate-mutation:
    name: truth-gate-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies for killing tests
        run: python -m pip install --upgrade pytest pyyaml jsonschema packaging

      - name: Mutation run (fail-closed on survivor or stale anchor)
        run: python tools/governance/mutate_truth_gates.py

      - name: Harness self-test
        run: PYTHONPATH=. python -m pytest tests/governance/test_truth_gate_mutation.py -q --noconftest -p no:cacheprovider
