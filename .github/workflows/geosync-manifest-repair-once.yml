# One-shot, branch-scoped maintenance of independently verified manifests.
# This workflow runs only when THIS file is added/edited on the repair branch.
# It cannot run on main or be triggered by its own bot push.
name: GeoSync Controlled Manifest Repair
on:
  push:
    branches:
      - chore/main-gate-debt-paydown-20261027
    paths:
      - .github/workflows/geosync-manifest-repair-once.yml
permissions:
  contents: write
concurrency:
  group: geosync-manifest-repair
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'neuron7x/Kuramoto-synchronization-model'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering SHA with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Canonical formatting and non-expanding secrets baseline normalization
        shell: bash
        run: | # pragma: allowlist secret; this block executes the scanner, no plaintext token
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.3.1 detect-secrets==1.5.0
          python -m black scripts/ci/check_links.py
          cp .github/detect-secrets.baseline /tmp/detect-secrets.before
          mapfile -t scanned < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD | while IFS= read -r f; do [[ -f "$f" ]] && printf '%s\n' "$f"; done)
          exclude=$(python - <<'PY'
          from pathlib import Path
          import re
          body = Path('.github/workflows/pr-gate.yml').read_text(encoding='utf-8')
          m = re.search(r"--exclude-files '([^']+)'", body)
          if not m:
              raise SystemExit('Could not find secret scanning exclusion contract')
          print(m.group(1))
          PY
          )
          set +e
          detect-secrets-hook --baseline .github/detect-secrets.baseline --exclude-files "$exclude" "${scanned[@]}"
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 3 ]]; then echo "Secret scan found unreviewed evidence"; exit "$rc"; fi
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/detect-secrets.before').read_text())
          after = json.loads(Path('.github/detect-secrets.baseline').read_text())
          for key in ('version', 'plugins_used', 'filters_used'):
              assert before[key] == after[key], f'baseline policy changed: {key}'
          def detections(b):
              return {path: sorted(json.dumps({key: val for key, val in row.items() if key != 'line_number'}, sort_keys=True) for row in records) for path, records in b['results'].items()}
          assert detections(before) == detections(after), 'Unknown secret or changed baseline entry; manual review required'
          print('No baseline entries added, removed, or reclassified; line normalization only')
          PY
          detect-secrets-hook --baseline .github/detect-secrets.baseline --exclude-files "$exclude" "${scanned[@]}"
      - name: Regenerate only declared deterministic manifests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "" || test "$(git branch --show-current)" = "chore/main-gate-debt-paydown-20261027"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci/check_artifact_freshness.py --write
          python scripts/ci/generate_manifest.py --allow-dirty
          python scripts/ci/check_root_manifest.py
          python -m json.tool artifacts/manifest.json >/dev/null
          python - <<'PY'
          import subprocess
          allowed = {"MANIFEST.sha256", "artifacts/manifest.json", ".github/detect-secrets.baseline", "scripts/ci/check_links.py"}
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert changed <= allowed, f"Unexpected generator output: {changed - allowed}"
          print("Controlled regeneration diff:", sorted(changed))
          PY
      - name: Commit exact manifest outputs to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- MANIFEST.sha256 artifacts/manifest.json .github/detect-secrets.baseline scripts/ci/check_links.py
          if git diff --cached --quiet; then
            echo "Both manifests already current; no commit needed."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): canonically format, normalize secrets baseline, refresh manifests"
          git push origin HEAD:refs/heads/chore/main-gate-debt-paydown-20261027
