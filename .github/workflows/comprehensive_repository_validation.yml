name: Comprehensive Repository Validation

on:
  push:
    branches: [main, develop, copilot/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'

# Restrict permissions to minimum required
permissions:
  contents: read

jobs:
  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # Job-specific permissions
    permissions:
      contents: read        # Read repository contents
      actions: read         # Read artifacts
      pull-requests: write  # Comment on PRs
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history for git checks
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip==24.3.1 setuptools==75.6.0 wheel==0.45.0
      
      - name: Install project dependencies
        run: |
          # Install with security constraints and hash verification
          pip install --require-hashes --no-deps -c constraints/security.txt -r requirements.txt || \
            pip install -c constraints/security.txt -r requirements.txt
          pip install --require-hashes --no-deps -c constraints/security.txt -r requirements-dev.txt || \
            pip install -c constraints/security.txt -r requirements-dev.txt
      
      - name: Verify httpx installation
        run: |
          python -c "import httpx; print(f'httpx version: {httpx.__version__}')"
      
      - name: Run comprehensive validation
        id: validation
        run: |
          python scripts/comprehensive_repository_validation.py \
            --output reports/REPOSITORY_VALIDATION_REPORT.md \
            --json-output reports/repository_validation.json
        continue-on-error: false
      
      - name: Upload validation reports
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        if: always()
        with:
          name: validation-reports
          path: |
            reports/REPOSITORY_VALIDATION_REPORT.md
            reports/repository_validation.json
          retention-days: 30
      
      - name: Display validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Validation Summary"
            if [ -f reports/repository_validation.json ]; then
              python3 -c 'import json; d=json.load(open("reports/repository_validation.json")); s=d["summary"]; print(f"**Health Score:** {s[\"health_score\"]}/100\n**Total Checks:** {s[\"total_checks\"]}\n**Passed:** ✅ {s[\"passed\"]}\n**Failed:** ❌ {s[\"failed\"]}\n**Warnings:** ⚠️ {s[\"warnings\"]}\n**Success Rate:** {s[\"success_rate\"]:.1f}%")'
            fi
          } >> $GITHUB_STEP_SUMMARY
      
      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('reports/repository_validation.json')) {
              const data = JSON.parse(fs.readFileSync('reports/repository_validation.json', 'utf8'));
              const summary = data.summary;
              
              const stars = '⭐'.repeat(Math.floor(summary.health_score / 20));
              const body = '## 🔍 Repository Validation Results\n\n' +
              '**Health Score:** ' + summary.health_score + '/100 ' + stars + '\n\n' +
              '| Metric | Value |\n' +
              '|--------|-------|\n' +
              '| Total Checks | ' + summary.total_checks + ' |\n' +
              '| Passed | ✅ ' + summary.passed + ' |\n' +
              '| Failed | ❌ ' + summary.failed + ' |\n' +
              '| Warnings | ⚠️ ' + summary.warnings + ' |\n' +
              '| Success Rate | ' + summary.success_rate.toFixed(1) + '% |\n\n' +
              '<details>\n<summary>📊 View detailed breakdown</summary>\n\n' +
              fs.readFileSync('reports/REPOSITORY_VALIDATION_REPORT.md', 'utf8').substring(0, 20000) +
              '\n\n</details>\n\n' +
              '🔗 [Full validation report available in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n' +
              '_Note: Report truncated to 20,000 characters for PR comment. Download artifacts for full report._';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }


