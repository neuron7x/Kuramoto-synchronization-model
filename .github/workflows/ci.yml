name: CI - Test Coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    name: Test Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            if [ -f constraints/security.txt ]; then
              pip install -c constraints/security.txt -r requirements.txt
            else
              pip install -r requirements.txt
            fi
          fi
          if [ -f requirements-dev.txt ]; then
            if [ -f constraints/security.txt ]; then
              pip install -c constraints/security.txt -r requirements-dev.txt
            else
              pip install -r requirements-dev.txt
            fi
          fi
          pip install "pytest-cov>=4,<5"
          # Ensure src-layout imports work even if package isn't installed
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Discover coverage targets (repo-aware)
        id: cov
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          targets = []
          # Prefer src/tradepulse if present, otherwise discover packages under src/
          src = Path("src")
          if (src/"tradepulse").is_dir():
            targets.append("tradepulse")
          elif src.is_dir():
            for p in src.iterdir():
              if p.is_dir() and (p/"__init__.py").exists():
                targets.append(p.name)

          # Also include any top-level packages you actually have (backtest/core/execution)
          for name in ("backtest", "core", "execution"):
            if Path(name).is_dir():
              targets.append(name)

          # de-dup stable order
          seen = set()
          out = []
          for t in targets:
            if t not in seen:
              out.append(t); seen.add(t)

          print("COV_TARGETS=" + json.dumps(out))
          PY
          echo "targets=$(python -c \"import os, json; print(json.loads(os.environ.get('COV_TARGETS','[]')))\")" >/dev/null || true

      - name: Run pytest with coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          # read targets printed in previous step by re-discovering (keeps it simple & deterministic)
          from pathlib import Path
          targets = []
          src = Path("src")
          if (src/"tradepulse").is_dir():
            targets.append("tradepulse")
          elif src.is_dir():
            for p in src.iterdir():
              if p.is_dir() and (p/"__init__.py").exists():
                targets.append(p.name)
          for name in ("backtest","core","execution"):
            if Path(name).is_dir():
              targets.append(name)
          # build pytest args
          args = ["pytest", "--cov-report=xml", "--cov-report=term-missing", "--cov-fail-under=90"]
          for t in dict.fromkeys(targets):
            args.append(f"--cov={t}")
          print("PYTEST_CMD:", " ".join(args))
          os.execvp(args[0], args)
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload to Codecov (skip forks safely)
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          # Use token only if present; do not reference secrets in `if:` (parsing stability)
          token: ${{ secrets.CODECOV_TOKEN }}

  yaml-validation:
    name: Workflow YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Validate ci.yml (no bidi/unicode + valid YAML)
        run: |
          set -euo pipefail
          # Check for bidirectional unicode characters
          if grep -P '[\u202A-\u202E\u2066-\u2069\u200E\u200F]' .github/workflows/ci.yml; then
            echo "ERROR: Bidirectional Unicode characters found in ci.yml"
            exit 1
          fi
          # Validate YAML syntax
          python -c "import sys; import yaml; yaml.safe_load(open('.github/workflows/ci.yml','r',encoding='utf-8')); print('ci.yml is valid YAML')"
