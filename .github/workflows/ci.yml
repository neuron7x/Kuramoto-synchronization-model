name: ci
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
  id-token: write
jobs:
  lint_build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pipx tooling
        run: pipx install pre-commit safety pip-audit
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pre-commit checks
        run: pre-commit run --all-files
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt
          safety scan --file requirements.txt --full-report
      - name: Run unit tests with coverage
        run: pytest -q --maxfail=1 --disable-warnings --cov=. --cov-report=xml
      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: warn
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            ui/dashboard/package-lock.json
      - name: Install web dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix ui/dashboard
      - name: Lint and test Next.js frontend
        run: |
          npm run lint --prefix apps/web
          npm run test --prefix apps/web -- --coverage
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: warn
      - name: Lint and test dashboard utilities
        run: |
          npm run lint --prefix ui/dashboard
          npm test --prefix ui/dashboard
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m
      - name: Run Go unit tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn
  integration:
    needs: lint_build_test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env: { POSTGRES_PASSWORD: pass, POSTGRES_DB: test }
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pytest tests/integration -q
  security_container:
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:ci .
      - uses: anchore/sbom-action@v0
      - uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: app:ci
          exit-code: '1'
