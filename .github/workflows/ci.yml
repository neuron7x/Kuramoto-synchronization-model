name: CI - Test Coverage

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail

on:
  pull_request:
    branches:
      # Run coverage checks when product code or tests change.
      - '**'
    paths:
      - '**/*.py'
      - 'core/**'
      - 'backtest/**'
      - 'execution/**'
      - 'application/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - 'configs/quality/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'core/**'
      - 'backtest/**'
      - 'execution/**'
      - 'application/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - 'configs/quality/**'
      - '.github/workflows/ci.yml'

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Test Coverage — shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    env:
      COVERAGE_FILE: .coverage.${{ matrix.shard }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-path: requirements-dev.lock

      - name: Synchronize dependencies
        run: uv pip sync requirements-dev.lock

      - name: Run tests with coverage (shard ${{ matrix.shard }})
        run: |
          uv run pytest \
            --cov=core \
            --cov=backtest \
            --cov=execution \
            --cov-config=configs/quality/critical_surface.coveragerc \
            --cov-report=term-missing \
            --splits ${{ strategy.job-total }} \
            --group ${{ matrix.shard }}

      - name: Generate shard coverage report
        run: uv run coverage xml -i -o coverage-${{ matrix.shard }}.xml

      - name: Upload shard coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: |
            .coverage.${{ matrix.shard }}
            coverage-${{ matrix.shard }}.xml

  coverage-aggregate:
    runs-on: ubuntu-latest
    needs: test-coverage
    name: Aggregate coverage & enforce guardrail

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-path: requirements-dev.lock

      - name: Synchronize dependencies
        run: uv pip sync requirements-dev.lock

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: .

      - name: Combine coverage data
        run: |
          uv run coverage combine
          uv run coverage xml -i -o coverage.xml

      - name: Enforce reliability coverage guardrail
        run: |
          uv run python -m tools.coverage.guardrail \
            --config configs/quality/critical_surface.toml \
            --coverage coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: py311
          name: coverage-py311
          fail_ci_if_error: true
