name: CI - Test Coverage

permissions:
  contents: read

on:
  pull_request:
    branches:
      # Run coverage checks for every PR regardless of target branch.
      - '**'
  push:
    branches: [main]

concurrency:
  group: ci-coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Test Coverage — shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    env:
      COVERAGE_FILE: .coverage.${{ matrix.shard }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -c constraints/security.txt -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -c constraints/security.txt -r requirements-dev.txt; fi

      - name: Run tests with coverage (shard ${{ matrix.shard }})
        run: |
          pytest tests/ \
            --cov=core \
            --cov=backtest \
            --cov=execution \
            --cov-config=configs/quality/critical_surface.coveragerc \
            --cov-report=term-missing \
            --splits ${{ strategy.job-total }} \
            --group ${{ matrix.shard }}

      - name: Generate shard coverage report
        run: python -m coverage xml -i -o coverage-${{ matrix.shard }}.xml

      - name: Upload shard coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: |
            .coverage.${{ matrix.shard }}
            coverage-${{ matrix.shard }}.xml

  coverage-aggregate:
    runs-on: ubuntu-latest
    needs: test-coverage
    name: Aggregate coverage & enforce guardrail

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Install coverage tooling
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt coverage

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: .

      - name: Combine coverage data
        run: |
          python -m coverage combine
          python -m coverage xml -i -o coverage.xml

      - name: Enforce global coverage threshold (98%)
        run: python -m coverage report --fail-under=98

      - name: Generate HTML coverage report
        run: python -m coverage html -i -d coverage_html

      - name: Enforce reliability coverage guardrail
        run: |
          python -m tools.coverage.guardrail \
            --config configs/quality/critical_surface.toml \
            --coverage coverage.xml

      - name: Upload aggregated coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: |
            coverage.xml
            coverage_html
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: py311
          name: coverage-py311
          fail_ci_if_error: true

  mutation-testing-gate:
    runs-on: ubuntu-latest
    needs: coverage-aggregate
    name: Mutation Testing Gate (90% kill rate)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -c constraints/security.txt -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -c constraints/security.txt -r requirements-dev.txt; fi

      - name: Run mutation testing
        run: |
          echo "Running mutation testing on critical modules..."
          mutmut run --paths-to-mutate=core,backtest,execution --tests-dir=tests || true

      - name: Generate mutation report
        run: |
          mutmut results || true

      - name: Enforce mutation kill rate (≥90%)
        run: |
          python -m tools.mutation.kill_rate_guard \
            --threshold=0.9 \
            --summary=mutation_summary.json

      - name: Upload mutation test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-results
          path: |
            mutation_summary.json
            .mutmut-cache
          if-no-files-found: warn

  publish-containers:
    if: github.event_name == 'push'
    needs: [coverage-aggregate, mutation-testing-gate]
    runs-on: ubuntu-latest
    name: Publish container images
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ toLower(github.repository) }}
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_REPOSITORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image targets
        id: image-targets
        shell: bash
        run: |
          set -euo pipefail
          targets=("${GHCR_IMAGE}")
          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            targets+=("docker.io/${DOCKERHUB_IMAGE}")
          fi
          {
            echo "list<<EOF"
            printf '%s\n' "${targets[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-targets.outputs.list }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
