name: E2E Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.lock ]; then pip install -c constraints/security.txt -r requirements-dev.lock; fi
          pip install -c constraints/security.txt -r requirements-dev.txt
      - name: Run integration tests (marked integration)
        env:
          CI: true
        run: |
          pytest tests/integration/test_e2e_replay_live_sim.py -m integration --maxfail=1 -q
