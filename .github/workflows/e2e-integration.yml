name: E2E Integration Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/e2e/**'
      - 'tests/integration/**'
      - 'core/**'
      - 'backtest/**'
      - 'execution/**'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Cache Python packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-e2e-${{ runner.os }}-py3.11-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'constraints/security.txt') }}
          restore-keys: |
            pip-e2e-${{ runner.os }}-py3.11-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r sbom/combined-requirements.txt
          if [ -f requirements-dev.lock ]; then pip install -c constraints/security.txt -r requirements-dev.lock; fi
      - name: Run integration tests (marked integration)
        env:
          CI: true
        run: |
          pytest tests/integration/test_e2e_replay_live_sim.py -m integration --maxfail=1 -q
