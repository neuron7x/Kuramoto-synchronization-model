name: Coverage Calibration Isolated Sandbox

# Runs calibration-loop tests and synthetic plan generation in a temp copy of the repository.
on:
  pull_request:
    paths:
      - "tools/coverage/coverage_calibration_loop.py"
      - "tests/tools/test_coverage_calibration_loop*.py"
      - "configs/quality/coverage_targets.toml"
      - ".github/workflows/coverage-calibration-isolated.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/coverage-calibration-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-calibration-isolated-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  isolated-calibration-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      ISOLATION_MODE: "coverage-calibration-sandbox"
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      - name: Copy repository into isolated temp workspace
        run: |
          ISO_ROOT="$RUNNER_TEMP/geosync-calibration-isolation"
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          src = Path(os.environ["GITHUB_WORKSPACE"])
          dst = Path(os.environ["RUNNER_TEMP"]) / "geosync-calibration-isolation"
          if dst.exists():
              shutil.rmtree(dst)
          ignore = shutil.ignore_patterns(".git", ".venv", "__pycache__", ".pytest_cache", "htmlcov")
          shutil.copytree(src, dst, ignore=ignore)
          print(dst)
          PY
          test -d "$ISO_ROOT/tools/coverage"
          echo "ISO_ROOT=$ISO_ROOT" >> "$GITHUB_ENV"

      - name: Run calibration loop tests inside isolated workspace
        working-directory: ${{ env.ISO_ROOT }}
        run: |
          python -m pytest tests/tools/test_coverage_calibration_loop*.py -q -p no:cacheprovider

      - name: Generate synthetic calibration plan inside isolated workspace
        working-directory: ${{ env.ISO_ROOT }}
        run: |
          mkdir -p "$RUNNER_TEMP/isolated-evidence" "$RUNNER_TEMP/isolated-plan"
          cat > "$RUNNER_TEMP/isolated-evidence/coverage_summary.json" <<'JSON'
          {
            "schema_version": "1.0",
            "verdict": "MACHINE_ASSISTED_SYNTHETIC_ISOLATION",
            "evidence_valid": true,
            "release_line_coverage": 91.25,
            "risk_weighted_score": 88.5,
            "diff_coverage": {"applicable": true, "rate": 92.0},
            "surfaces": {
              "execution": {"line_rate": 82.0, "branch_rate": 76.0, "statements": 640},
              "risk": {"line_rate": 84.0, "branch_rate": 79.0, "statements": 520},
              "api": {"line_rate": 71.0, "branch_rate": 66.0, "statements": 430},
              "unknown_surface_noise": {"line_rate": 1.0, "branch_rate": 1.0, "statements": 999}
            }
          }
          JSON
          python -m tools.coverage.coverage_calibration_loop \
            --summary "$RUNNER_TEMP/isolated-evidence/coverage_summary.json" \
            --targets configs/quality/coverage_targets.toml \
            --out "$RUNNER_TEMP/isolated-plan" \
            --stage mid_term \
            --limit 5
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "isolated-plan" / "calibration_plan.json").read_text())
          assert plan["evidence_valid"] is True
          assert plan["top_actions"], "synthetic isolation must produce ranked actions"
          assert all(action["name"] != "unknown_surface_noise" for action in plan["top_actions"])
          print(json.dumps({"verdict": plan["verdict"], "top_action": plan["top_actions"][0]["name"]}, indent=2))
          PY

      - name: Upload isolated calibration plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: isolated-calibration-plan
          path: |
            ${{ runner.temp }}/isolated-plan/calibration_plan.json
            ${{ runner.temp }}/isolated-plan/calibration_plan.md
          if-no-files-found: error
          retention-days: 7
