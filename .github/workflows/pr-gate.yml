name: PR Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency Review
        uses: actions/dependency-review-action@v4.1.3

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug workspace
        run: ls -la
      - name: Build Docker image
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::notice::Dockerfile not found. Skipping docker build."
            exit 0
          fi

          if grep -qE '^[[:space:]]*FROM .* AS scan' Dockerfile; then
            echo "Found Docker target 'scan'."
            docker build --target scan -t tradepulse-scan .
          else
            echo "::notice::Target 'scan' not found. Building default target."
            docker build -t tradepulse-scan .
          fi

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Ruff
        run: ruff check . --extend-ignore W291,W293

  schema-contracts:
    name: schema-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate schema contracts
        run: |
          if [ ! -d schemas/events ]; then
            echo "::notice::Schema registry not found. Skipping validation."
            exit 0
          fi
          python tools/schema/validate_compatibility.py --registry schemas/events

  security-sast:
    name: security-sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Semgrep token
        id: semgrep-token
        run: |
          if [ -z "${SEMGREP_APP_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SEMGREP_APP_TOKEN missing. Skipping Semgrep."
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Semgrep scan
        if: steps.semgrep-token.outputs.skip != 'true'
        continue-on-error: true
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          generateSarif: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload Semgrep SARIF
        if: steps.semgrep-token.outputs.skip != 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for baseline
        run: git fetch --no-tags --prune --depth=1 origin main
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.67.0
        with:
          path: .
          base: origin/main
          head: HEAD
          extra_args: --since-commit origin/main

  l0-static-gates:
    name: l0-static-gates
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - docker-build
      - python-lint
      - schema-contracts
      - security-sast
      - secret-scan
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Validate PR title
        run: |
          title="${{ github.event.pull_request.title }}"
          if [ -z "$title" ]; then
            echo "::error::PR title is empty."
            exit 1
          fi

  pr-verdict:
    name: pr-verdict
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - docker-build
      - python-lint
      - schema-contracts
      - security-sast
      - secret-scan
      - l0-static-gates
    if: ${{ always() }}
    steps:
      - name: Summarize failures
        if: ${{ failure() }}
        run: |
          {
            echo "### PR Gate Summary"
            echo ""
            echo "One or more PR gate checks failed upstream."
            echo "Review the workflow run for details."
          } >> "$GITHUB_STEP_SUMMARY"
