# SPDX-License-Identifier: LicenseRef-TradePulse-Proprietary
# ==============================================================================
# TradePulse PR Gate v2.1
# ==============================================================================
# Every PR to main/develop/release must pass ALL gates.
# Design: ≤15 min critical path, smart path filtering, per-job least privilege.
#
# Jobs (17):
#   detect-changes → l0-static-gates
#                  → python-lint → fast-unit-tests (×3) → coverage-gate
#                                                       → smoke-and-cert
#                                → architecture-guard
#                  → security-sast
#                  → dependency-gate
#                  → schema-contracts
#                  → docker-build (conditional)
#                  → helm-lint (conditional)
#                  → web-frontend (conditional)
#                  → rust-gate (conditional)
#                  → go-gate (conditional)
#                  → perf-regression (conditional)
#                  → pr-verdict (aggregates ALL)
# ==============================================================================

name: "PR Gate"

on:
  pull_request:
    branches: [main, develop, "release/**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ==============================================================================
# JOB 1: PATH DETECTION
# ==============================================================================
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python:        ${{ steps.filter.outputs.python }}
      web:           ${{ steps.filter.outputs.web }}
      rust:          ${{ steps.filter.outputs.rust }}
      go:            ${{ steps.filter.outputs.go }}
      helm:          ${{ steps.filter.outputs.helm }}
      docker:        ${{ steps.filter.outputs.docker }}
      proto:         ${{ steps.filter.outputs.proto }}
      schemas:       ${{ steps.filter.outputs.schemas }}
      configs:       ${{ steps.filter.outputs.configs }}
      deps:          ${{ steps.filter.outputs.deps }}
      central_files: ${{ steps.filter.outputs.central_files }}
      any_code:      ${{ steps.filter.outputs.any_code }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            python:
              - '**/*.py'
              - 'requirements*.txt'
              - 'requirements*.lock'
              - 'constraints/**'
              - 'pyproject.toml'
            web:
              - 'apps/web/**'
            rust:
              - 'rust/**'
            go:
              - 'go/**'
            helm:
              - 'deploy/helm/**'
            docker:
              - 'Dockerfile'
              - 'requirements-scan.lock'
              - '.dockerignore'
            proto:
              - '**/*.proto'
              - 'buf.yaml'
              - 'buf.gen.yaml'
            schemas:
              - 'schemas/**'
            configs:
              - 'configs/**'
            deps:
              - 'requirements*.txt'
              - 'requirements*.lock'
              - 'constraints/**'
              - 'pyproject.toml'
            central_files:
              - 'CODEOWNERS'
              - '.github/workflows/**'
              - 'constraints/security.txt'
              - 'requirements.lock'
              - 'requirements-dev.lock'
              - 'pyproject.toml'
              - 'Makefile'
              - 'Dockerfile'
              - 'configs/security/**'
              - 'configs/quality/**'
            any_code:
              - '**/*.py'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.rs'
              - '**/*.go'
              - '**/*.proto'
              - 'Dockerfile'
              - 'deploy/**'

  # ============================================================================
  # JOB 2: L0 — STATIC GATES (no deps install, no runtime)
  # ============================================================================
  l0-static-gates:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      # --- L0.1: PR title must be Conventional Commits ---
      - name: "L0.1 — PR title (Conventional Commits)"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/ci/validate_pr_title.sh "$PR_TITLE"

      # --- L0.2: Changelog fragment required for non-docs PRs ---
      - name: "L0.2 — Changelog fragment (towncrier)"
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          VALID_TYPES="feature bugfix performance maintenance docs tests ci build security chore"
          FOUND=0
          for TYPE in $VALID_TYPES; do
            if [ -f "newsfragments/${PR_NUM}.${TYPE}.md" ]; then
              FOUND=1
              echo "Found: newsfragments/${PR_NUM}.${TYPE}.md"
              break
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            CHANGED=$(git diff --name-only "origin/main...HEAD" 2>/dev/null || git diff --name-only "HEAD~1")
            NON_DOC=$(echo "$CHANGED" | grep -cvE '\.md$|^docs/' || true)
            if [ "$NON_DOC" -gt 0 ]; then
              echo "::error::Missing changelog fragment: newsfragments/${PR_NUM}.<type>.md"
              echo "  Valid types: $VALID_TYPES"
              exit 1
            fi
            echo "Docs-only PR — fragment not required"
          fi

      # --- L0.3: Central files flag (warning, not blocking) ---
      - name: "L0.3 — Central files warning"
        if: needs.detect-changes.outputs.central_files == 'true'
        run: |
          echo "::warning::PR modifies central infrastructure files — requires senior review"
          python3 scripts/ci/check_central_files_touched.py || true

  # ============================================================================
  # JOB 3: PYTHON LINT + TYPE CHECK
  # ============================================================================
  python-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: "3.11"
          cache-prefix: pr-lint

      - name: "LINT.1 — Ruff"
        run: .venv/bin/ruff check . --output-format=github

      - name: "LINT.2 — Black"
        run: .venv/bin/black --check --diff .

      - name: "LINT.3 — Mypy"
        run: .venv/bin/mypy

      - name: "LINT.4 — Namespace policy"
        run: .venv/bin/python scripts/check_namespace_policy.py

      - name: "LINT.5 — Config single-source guard"
        run: .venv/bin/python scripts/check_config_single_source.py

  # ============================================================================
  # JOB 4: FAST UNIT TESTS (3 shards, parallel)
  # ============================================================================
  fast-unit-tests:
    needs: [detect-changes, python-lint]
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: "Unit Tests — shard ${{ matrix.shard }}/3"
    env:
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: "3.11"
          cache-prefix: pr-test

      - name: "Sync localization assets"
        run: .venv/bin/python scripts/localization/sync_translations.py

      - name: "Run shard ${{ matrix.shard }}/3"
        run: |
          .venv/bin/python -m pytest tests/ \
            -m "not slow and not heavy_math and not nightly and not flaky" \
            --cov=core --cov=backtest --cov=execution \
            --cov-branch \
            --cov-config=configs/quality/critical_surface.coveragerc \
            --cov-report=xml:coverage-${{ matrix.shard }}.xml \
            --cov-report=term-missing \
            --junitxml=reports/junit-shard-${{ matrix.shard }}.xml \
            --splits 3 --group ${{ matrix.shard }} \
            --reruns 2 --reruns-delay 1 \
            --only-rerun "AssertionError|TimeoutError|ConnectionError" \
            -q

      - name: "Upload shard artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-test-shard-${{ matrix.shard }}
          path: |
            .coverage.${{ matrix.shard }}
            coverage-${{ matrix.shard }}.xml
            reports/junit-shard-${{ matrix.shard }}.xml
          retention-days: 7

  # ============================================================================
  # JOB 5: COVERAGE GATE
  # ============================================================================
  coverage-gate:
    needs: fast-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      line_rate:   ${{ steps.enforce.outputs.line_rate }}
      branch_rate: ${{ steps.enforce.outputs.branch_rate }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: "3.11"
      - run: pip install coverage toml

      - name: "Download all shard coverage"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pr-test-shard-*
          merge-multiple: true

      - name: "Combine & enforce"
        id: enforce
        run: |
          # Combine shard coverage
          python -m coverage combine .coverage.* || true
          python -m coverage xml -i -o coverage-combined.xml

          # === Gate 1: Regression guard (baseline: 71.0% line, 65.0% branch) ===
          python -m tools.coverage.drop_guard \
            --baseline configs/quality/coverage_baseline.json \
            --coverage coverage-combined.xml

          # === Gate 2: Critical surface per-file thresholds ===
          # (13 files: kuramoto 70%, security 75%, oms 75%, compliance 75%,
          #  circuit_breaker 75%, tls 75%, etc.)
          python -m tools.coverage.guardrail \
            --config configs/quality/critical_surface.toml \
            --coverage coverage-combined.xml

          # === Extract rates for verdict summary ===
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse("coverage-combined.xml").getroot()
          lr = float(root.get("line-rate", 0)) * 100
          br = float(root.get("branch-rate", 0)) * 100
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"line_rate={lr:.1f}\nbranch_rate={br:.1f}\n")
          print(f"Coverage: {lr:.1f}% line / {br:.1f}% branch")
          PY

      - name: "Upload combined coverage"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-coverage-combined
          path: coverage-combined.xml
          retention-days: 14

  # ============================================================================
  # JOB 6: SECURITY — SAST + SECRETS + DAST + SEMGREP
  # ============================================================================
  security-sast:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: "3.11"
          cache-prefix: pr-security

      # --- SEC.1: Bandit SAST via existing tool (fail on MEDIUM+) ---
      - name: "SEC.1 — Bandit SAST"
        run: |
          .venv/bin/python -m tools.security.sast \
            --fail-on-severity MEDIUM \
            --output reports/security/bandit.json \
            --summary reports/security/sast_summary.json

      # --- SEC.2: Detect-secrets (credential leak prevention) ---
      - name: "SEC.2 — Secret detection"
        run: |
          pip install detect-secrets 2>/dev/null
          detect-secrets scan \
            --baseline .secrets.baseline \
            core backtest execution application analytics tradepulse \
            --json > /tmp/secrets-scan.json 2>/dev/null || true
          python3 - <<'PY'
          import json, sys, pathlib
          data = json.loads(pathlib.Path("/tmp/secrets-scan.json").read_text())
          results = data.get("results", {})
          total = sum(len(v) for v in results.values())
          if total:
              print(f"::error::{total} potential secret(s) detected")
              for f, findings in results.items():
                  for finding in findings:
                      print(f"  {f}:{finding.get('line_number','?')} — {finding.get('type','unknown')}")
              sys.exit(1)
          print("OK: 0 secrets detected")
          PY

      # --- SEC.3: DAST probes (ASGI in-process, no server required) ---
      - name: "SEC.3 — DAST probes"
        run: |
          .venv/bin/python -m tools.security.dast_probe \
            --report reports/security/dast_report.json

      # --- SEC.4: Semgrep (CRITICAL GAP: currently NOT on PRs) ---
      - name: "SEC.4 — Semgrep"
        uses: docker://semgrep/semgrep:latest
        with:
          args: >-
            semgrep scan
            --config auto
            --config p/python
            --config p/security-audit
            --sarif --output semgrep-results.sarif
            --severity ERROR --severity WARNING
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: "SEC.4b — Enforce critical Semgrep findings"
        if: always()
        run: |
          if [ -f semgrep-results.sarif ]; then
            CRITICAL=$(python3 -c "
          import json
          d=json.load(open('semgrep-results.sarif'))
          runs=d.get('runs',[])
          errs=sum(1 for r in runs for res in r.get('results',[]) if res.get('level')=='error')
          print(errs)
          " 2>/dev/null || echo 0)
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Semgrep: $CRITICAL critical finding(s) — PR blocked"
              exit 1
            fi
            echo "OK: Semgrep passed (0 critical)"
          else
            echo "::warning::Semgrep SARIF not produced — check token/network"
          fi

      # --- Audit trail: upload ALL security artifacts ---
      - name: "Upload security reports"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-security-reports
          path: |
            reports/security/
            semgrep-results.sarif
          retention-days: 30

  # ============================================================================
  # JOB 7: DEPENDENCY REVIEW + LICENSE + SBOM
  # ============================================================================
  dependency-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      # --- DEP.1: GitHub native dependency review ---
      - name: "DEP.1 — Dependency vulnerability review"
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: always

      # --- DEP.2: Install for license + SBOM audit ---
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: "3.11"
      - name: "Install locked deps"
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt -r requirements.lock
          pip install pip-licenses pyyaml cyclonedx-bom

      # --- DEP.3: License compliance with exception expiry check ---
      - name: "DEP.3 — License compliance"
        run: |
          pip-licenses --format=json --output-file=/tmp/licenses.json
          python3 - <<'PY'
          import json, yaml, sys
          from datetime import date

          policy = yaml.safe_load(open("configs/security/license_policy.yaml"))
          forbidden = set(policy.get("forbidden", []))
          restricted = set(policy.get("restricted", []))
          aliases = policy.get("aliases", {})
          exceptions = {e["package"]: e for e in policy.get("exceptions", [])}
          licenses = json.load(open("/tmp/licenses.json"))

          violations = []
          warnings = []
          today = date.today()

          for pkg in licenses:
              name = pkg.get("Name", "")
              lic = pkg.get("License", "UNKNOWN")
              lic = aliases.get(lic, lic)

              # Check exception (with expiry validation)
              if name.lower() in exceptions:
                  exc = exceptions[name.lower()]
                  expiry = date.fromisoformat(exc.get("expires", "2099-12-31"))
                  if today > expiry:
                      violations.append(f"{name}: exception expired {expiry} — license {lic}")
                  continue

              if lic in forbidden:
                  violations.append(f"{name}=={pkg.get('Version','?')}: FORBIDDEN license {lic}")
              elif lic in restricted:
                  warnings.append(f"{name}=={pkg.get('Version','?')}: RESTRICTED license {lic}")

          for w in warnings:
              print(f"::warning::{w}")
          if violations:
              for v in violations:
                  print(f"::error::{v}")
              sys.exit(1)
          print(f"OK: {len(licenses)} packages — all licenses compliant")
          PY

      # --- DEP.4: Dependency drift detection ---
      - name: "DEP.4 — Dependency drift"
        run: |
          python scripts/security/check_dependency_drift.py \
            --output /tmp/dependency-drift.json

      # --- DEP.5: SBOM generation + diff against baseline ---
      - name: "DEP.5 — SBOM (CycloneDX)"
        run: |
          cyclonedx-py environment \
            --output-format json \
            --outfile /tmp/sbom-pr.json \
            2>/dev/null || echo "::warning::SBOM generation had non-fatal issues"

          # Diff against existing baseline
          python3 - <<'PY'
          import json, sys, pathlib
          baseline_path = pathlib.Path("sbom/cyclonedx-sbom.json")
          pr_path = pathlib.Path("/tmp/sbom-pr.json")

          if not baseline_path.exists() or not pr_path.exists():
              print("SBOM diff: baseline or PR SBOM missing — skipping diff")
              sys.exit(0)

          try:
              baseline = json.loads(baseline_path.read_text())
              pr = json.loads(pr_path.read_text())

              def extract_components(sbom):
                  return {
                      f"{c.get('name','')}@{c.get('version','')}"
                      for c in sbom.get("components", [])
                  }

              base_set = extract_components(baseline)
              pr_set = extract_components(pr)
              added = pr_set - base_set
              removed = base_set - pr_set

              if added:
                  print(f"SBOM: {len(added)} new component(s):")
                  for a in sorted(added)[:20]:
                      print(f"  + {a}")
              if removed:
                  print(f"SBOM: {len(removed)} removed component(s):")
                  for r in sorted(removed)[:20]:
                      print(f"  - {r}")
              if not added and not removed:
                  print("SBOM: no component changes")
          except Exception as e:
              print(f"::warning::SBOM diff failed: {e}")
          PY

      # --- Audit trail ---
      - name: "Upload dependency audit"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-dependency-audit
          path: |
            /tmp/licenses.json
            /tmp/dependency-drift.json
            /tmp/sbom-pr.json
          retention-days: 30

  # ============================================================================
  # JOB 8: SCHEMA & CONTRACT VALIDATION
  # ============================================================================
  schema-contracts:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.schemas == 'true' ||
      needs.detect-changes.outputs.proto == 'true' ||
      needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: "3.11"
          cache-prefix: pr-schema

      # --- SCHEMA.1: Avro/event schema backward compatibility ---
      - name: "SCHEMA.1 — Event schema compatibility"
        run: |
          if [ -d "schemas/events" ]; then
            .venv/bin/python -m tools.schema.validate_compatibility \
              --registry schemas/events
          else
            echo "::warning::schemas/events missing; skipping compatibility check"
          fi

      # --- SCHEMA.2: Dopamine config vs JSON Schema ---
      - name: "SCHEMA.2 — Dopamine config validation"
        run: |
          .venv/bin/python3 - <<'PY'
          import json, yaml, jsonschema
          schema = json.load(open("schemas/dopamine.schema.json"))
          config = yaml.safe_load(open("configs/dopamine.yaml"))
          jsonschema.validate(config, schema)
          print("OK: dopamine config validates against schema")
          PY

      # --- SCHEMA.3: Protobuf lint + breaking change detection (buf v2) ---
      - name: "SCHEMA.3 — Protobuf (buf)"
        if: needs.detect-changes.outputs.proto == 'true'
        run: |
          if command -v buf &>/dev/null; then
            buf lint
            buf breaking --against '.git#branch=main'
            echo "OK: protobuf lint + breaking check passed"
          else
            echo "::warning::buf CLI not installed — protobuf check skipped"
          fi

  # ============================================================================
  # JOB 9: ARCHITECTURE + FORMAL VERIFICATION
  # ============================================================================
  architecture-guard:
    needs: [detect-changes, python-lint]
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: "3.11"
          cache-prefix: pr-arch

      # --- ARCH.1: Dependency cycle detection ---
      - name: "ARCH.1 — Cycle detection"
        run: |
          .venv/bin/python3 -c "
          from tools.architecture.scanner import scan_repository
          report = scan_repository()
          if report.cycles:
              print('Circular dependencies detected:')
              for c in report.cycles:
                  print(f'  {\" -> \".join(c)}')
              raise SystemExit(1)
          print(f'OK: {len(report.modules)} modules, 0 cycles')
          "

      # --- ARCH.2: Import boundary enforcement (layered architecture) ---
      - name: "ARCH.2 — Import boundaries"
        run: |
          .venv/bin/python3 - <<'PY'
          import ast, sys
          from pathlib import Path

          FORBIDDEN = {
              "execution": {"backtest", "analytics", "ui", "apps"},
              "core":      {"application", "apps", "ui", "admin"},
              "tradepulse": {"src"},
              "backtest":  {"application", "ui", "apps"},
          }

          violations = []
          for pkg, banned in FORBIDDEN.items():
              pkg_path = Path(pkg)
              if not pkg_path.exists():
                  continue
              for py_file in pkg_path.rglob("*.py"):
                  try:
                      tree = ast.parse(py_file.read_text(encoding="utf-8"))
                  except SyntaxError:
                      continue
                  for node in ast.walk(tree):
                      targets = []
                      if isinstance(node, ast.ImportFrom) and node.module:
                          targets.append(node.module)
                      elif isinstance(node, ast.Import):
                          targets.extend(a.name for a in node.names)
                      for mod in targets:
                          root_pkg = mod.split(".")[0]
                          if root_pkg in banned:
                              violations.append(f"{py_file}:{node.lineno} imports {mod}")

          if violations:
              for v in violations:
                  print(f"::error::{v}")
              print(f"\n{len(violations)} import boundary violation(s)")
              sys.exit(1)
          print("OK: all import boundaries respected")
          PY

      # --- ARCH.3: Z3 formal proofs (TACL thermodynamic invariants) ---
      # Runs 4 test files: proof_invariant, cryptographic_proofs,
      # inductive_proof_engine, protocol_verification
      - name: "ARCH.3 — Formal verification (Z3)"
        run: |
          .venv/bin/python -m pytest tests/formal/ \
            -v --tb=short --no-header \
            2>&1
          RESULT=$?
          if [ $RESULT -ne 0 ]; then
            echo "::warning::Some formal proofs failed or were skipped (Z3 optional)"
          fi
          # Non-blocking: Z3 is optional dependency
          exit 0

      # --- ARCH.4: Test quality scoring ---
      - name: "ARCH.4 — Test quality"
        run: |
          .venv/bin/python -m tools.testing.quality_validator \
            --test-dir=tests \
            --report=reports/test-quality.json \
            --threshold=70.0

      - name: "Upload architecture reports"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-architecture-reports
          path: reports/test-quality.json
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # JOB 10: DOCKER BUILD + CONTAINER SCAN
  # ============================================================================
  docker-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: "Build scan stage"
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v5
        with:
          context: .
          target: scan
          push: false
          load: true
          tags: tradepulse:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Trivy scan (CRITICAL + HIGH)"
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output /tmp/trivy-report.txt \
            tradepulse:pr-${{ github.event.pull_request.number }}

      - name: "Upload Trivy report"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-trivy-report
          path: /tmp/trivy-report.txt
          if-no-files-found: warn
          retention-days: 30

  # ============================================================================
  # JOB 11: HELM LINT
  # ============================================================================
  helm-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: "Install Helm"
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: "HELM.1 — Lint"
        run: helm lint deploy/helm/tradepulse/

      - name: "HELM.2 — Template dry-run"
        run: |
          helm dependency build deploy/helm/tradepulse/ 2>/dev/null || true
          helm template tradepulse deploy/helm/tradepulse/ \
            --values deploy/helm/tradepulse/values.yaml \
            > /tmp/rendered-manifests.yaml
          echo "OK: Helm templates render cleanly"

  # ============================================================================
  # JOB 12: WEB FRONTEND
  # ============================================================================
  web-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: "Install"
        working-directory: apps/web
        run: npm ci

      - name: "WEB.1 — Prettier"
        working-directory: apps/web
        run: npm run format:check

      - name: "WEB.2 — ESLint"
        working-directory: apps/web
        run: npm run lint

      - name: "WEB.3 — TypeScript"
        working-directory: apps/web
        run: npm run typecheck

      - name: "WEB.4 — Jest"
        working-directory: apps/web
        run: npm run test -- --ci --coverage

      - name: "WEB.5 — Security audit"
        working-directory: apps/web
        run: npm run security:audit-scripts

      - name: "WEB.6 — Build"
        working-directory: apps/web
        run: npm run build

  # ============================================================================
  # JOB 13: RUST
  # ============================================================================
  rust-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: "Rust toolchain"
        run: |
          rustup update stable
          rustup component add clippy rustfmt

      - name: "Cargo cache"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/tradepulse-accel/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/tradepulse-accel/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: "RUST.1 — fmt"
        working-directory: rust/tradepulse-accel
        run: cargo fmt --check

      - name: "RUST.2 — clippy"
        working-directory: rust/tradepulse-accel
        run: cargo clippy --all-targets -- -D warnings

      - name: "RUST.3 — test"
        working-directory: rust/tradepulse-accel
        run: cargo test

  # ============================================================================
  # JOB 14: GO (VPIN service)
  # ============================================================================
  go-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.22"
          cache: false  # No go.sum in repo — manual caching not possible

      - name: "GO.1 — vet"
        working-directory: go/services/vpin
        run: go vet ./...

      - name: "GO.2 — test (race detector)"
        working-directory: go/services/vpin
        run: go test -v -race -count=1 ./...

  # ============================================================================
  # JOB 15: SMOKE + SEROTONIN CERTIFICATION
  # ============================================================================
  smoke-and-cert:
    needs: [detect-changes, fast-unit-tests]
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: "3.11"
          cache-prefix: pr-smoke

      - name: "SMOKE.1 — Golden path"
        run: |
          .venv/bin/python -m pytest tests/smoke/ \
            -m "smoke and not slow" \
            --junitxml=reports/smoke.xml -q

      - name: "SMOKE.2 — Serotonin certification"
        run: |
          .venv/bin/python scripts/serotonin_certify.py \
            --dataset data/sample_crypto_ohlcv.csv \
            --seed 123 \
            --out artifacts/serotonin-cert \
            --fast

      - name: "SMOKE.3 — Examples validation"
        env:
          PYTHONPATH: .
        run: |
          .venv/bin/python examples/quick_start.py --seed 7 --num-points 400
          .venv/bin/python examples/neuro_trade_pulse_backtest.py
          .venv/bin/python examples/integrated_risk_management_example.py

      - name: "SMOKE.4 — ECS regulator coverage"
        run: |
          .venv/bin/python -m pytest core/neuro/tests/test_ecs_regulator.py \
            --cov=core.neuro.ecs_regulator \
            --cov-report=term-missing -q

      - name: "Upload smoke artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-smoke-artifacts
          path: |
            reports/smoke.xml
            artifacts/serotonin-cert/
          retention-days: 7

  # ============================================================================
  # JOB 16: PERFORMANCE REGRESSION (conditional)
  # Triggers: label "perf-check" OR changes to configs/
  # ============================================================================
  perf-regression:
    needs: [detect-changes, fast-unit-tests]
    if: >-
      needs.detect-changes.outputs.python == 'true' &&
      (
        contains(github.event.pull_request.labels.*.name, 'perf-check') ||
        needs.detect-changes.outputs.configs == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-tradepulse
        with:
          python-version: "3.11"
          cache-prefix: pr-perf

      - name: "PERF.1 — Benchmarks"
        run: |
          .venv/bin/python -m pytest tests/performance/ \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-save=pr-${{ github.event.pull_request.number }} \
            --benchmark-columns=mean,stddev,median,rounds \
            --benchmark-name=short \
            -q || true

      # Budget enforcement: order_router ≤110ms, link_activator ≤85ms,
      # thermo_validator ≤60ms (from configs/perf_budgets.yaml)
      - name: "PERF.2 — Budget enforcement"
        run: |
          .venv/bin/python -m tools.performance.validate_budgets \
            --config configs/perf_budgets.yaml \
            --fail-on-breach 2>/dev/null || {
              echo "::warning::Performance budget validation skipped (no benchmark data)"
            }

      - name: "Upload perf artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-perf-artifacts
          path: |
            .benchmarks/
          retention-days: 14

  # ============================================================================
  # JOB 17: FINAL VERDICT — Stop-the-Line
  # This is THE single required status check in branch protection.
  # ============================================================================
  pr-verdict:
    name: "PR Verdict"
    if: always()
    needs:
      - l0-static-gates
      - python-lint
      - fast-unit-tests
      - coverage-gate
      - security-sast
      - dependency-gate
      - schema-contracts
      - architecture-guard
      - docker-build
      - helm-lint
      - web-frontend
      - rust-gate
      - go-gate
      - smoke-and-cert
      - perf-regression
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: "Evaluate all gates"
        id: evaluate
        env:
          COV_LINE: ${{ needs.coverage-gate.outputs.line_rate }}
          COV_BRANCH: ${{ needs.coverage-gate.outputs.branch_rate }}
        run: |
          declare -A RESULTS=(
            ["L0 Static"]="${{ needs.l0-static-gates.result }}"
            ["Python Lint"]="${{ needs.python-lint.result }}"
            ["Unit Tests"]="${{ needs.fast-unit-tests.result }}"
            ["Coverage"]="${{ needs.coverage-gate.result }}"
            ["Security SAST"]="${{ needs.security-sast.result }}"
            ["Dependencies"]="${{ needs.dependency-gate.result }}"
            ["Schema"]="${{ needs.schema-contracts.result }}"
            ["Architecture"]="${{ needs.architecture-guard.result }}"
            ["Docker"]="${{ needs.docker-build.result }}"
            ["Helm"]="${{ needs.helm-lint.result }}"
            ["Web Frontend"]="${{ needs.web-frontend.result }}"
            ["Rust"]="${{ needs.rust-gate.result }}"
            ["Go"]="${{ needs.go-gate.result }}"
            ["Smoke/Cert"]="${{ needs.smoke-and-cert.result }}"
            ["Performance"]="${{ needs.perf-regression.result }}"
          )

          FAILED=0
          PASSED=0
          SKIPPED=0

          {
            echo "## PR Gate — Final Verdict"
            echo ""
            echo "| Gate | Result |"
            echo "|------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for gate in "${!RESULTS[@]}"; do
            result="${RESULTS[$gate]}"
            case "$result" in
              success)
                echo "| $gate | ✅ pass |" >> "$GITHUB_STEP_SUMMARY"
                ((PASSED++))
                ;;
              skipped)
                echo "| $gate | ⏭️ skip |" >> "$GITHUB_STEP_SUMMARY"
                ((SKIPPED++))
                ;;
              *)
                echo "| $gate | ❌ $result |" >> "$GITHUB_STEP_SUMMARY"
                ((FAILED++))
                ;;
            esac
          done

          {
            echo ""
            echo "**Coverage**: ${COV_LINE:-n/a}% line / ${COV_BRANCH:-n/a}% branch"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then
            echo "**❌ BLOCKED** — $FAILED failed, $PASSED passed, $SKIPPED skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PR BLOCKED: $FAILED gate(s) failed"
            exit 1
          fi

          echo "**✅ ALL GATES PASSED** — $PASSED passed, $SKIPPED skipped" >> "$GITHUB_STEP_SUMMARY"

      # --- Post summary as PR comment ---
      - name: "Find existing verdict comment"
        if: always()
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: "PR Gate — Final Verdict"

      - name: "Post/update verdict comment"
        if: always()
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## PR Gate — Final Verdict

            **Status**: ${{ steps.evaluate.outcome == 'success' && '✅ ALL GATES PASSED' || '❌ BLOCKED' }}
            **Coverage**: ${{ needs.coverage-gate.outputs.line_rate || 'n/a' }}% line / ${{ needs.coverage-gate.outputs.branch_rate || 'n/a' }}% branch

            See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
