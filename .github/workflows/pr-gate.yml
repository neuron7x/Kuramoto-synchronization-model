name: pr-gate

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_MIN: "70"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      web_changed: ${{ steps.filter.outputs.web }}
      crypto_changed: ${{ steps.filter.outputs.crypto }}
      security_changed: ${{ steps.filter.outputs.security }}
      runtime_changed: ${{ steps.filter.outputs.runtime }}
      workflows_changed: ${{ steps.filter.outputs.workflows }}
      unit_targets: ${{ steps.paths.outputs.unit_targets }}
      crypto_targets: ${{ steps.paths.outputs.crypto_targets }}
      replay_targets: ${{ steps.paths.outputs.replay_targets }}
      security_py_targets: ${{ steps.paths.outputs.security_py_targets }}
      security_semgrep_targets: ${{ steps.paths.outputs.security_semgrep_targets }}
      coverage_tests: ${{ steps.paths.outputs.coverage_tests }}
      coverage_sources: ${{ steps.paths.outputs.coverage_sources }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'ui/**'
            crypto:
              - 'execution/**'
              - 'tests/contracts/**'
              - 'tests/execution/**'
              - 'tests/adapters/**'
            security:
              - 'application/security/**'
              - 'tests/security/**'
            runtime:
              - 'application/runtime/**'
            workflows:
              - '.github/workflows/**'
      - name: Collect existing targets
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          collect() {
            local out=()
            for p in "$@"; do
              if [ -d "$p" ] || [ -f "$p" ]; then
                out+=("$p")
              fi
            done
            printf '%s' "${out[*]}"
          }
          echo "unit_targets=$(collect tests/unit tests/api tests/runtime tests/execution)" >> "$GITHUB_OUTPUT"
          echo "crypto_targets=$(collect tests/contracts tests/execution tests/adapters)" >> "$GITHUB_OUTPUT"
          echo "replay_targets=$(collect tests/regression)" >> "$GITHUB_OUTPUT"
          echo "security_py_targets=$(collect execution application/security application/runtime application/api core src)" >> "$GITHUB_OUTPUT"
          echo "security_semgrep_targets=$(collect execution application/security application/runtime application/api core src .github/workflows)" >> "$GITHUB_OUTPUT"
          echo "coverage_tests=$(collect tests/unit tests/security tests/execution)" >> "$GITHUB_OUTPUT"
          echo "coverage_sources=$(collect execution application/security application/runtime application/api)" >> "$GITHUB_OUTPUT"
      - name: Validate workflow yamls
        if: steps.filter.outputs.workflows == 'true'
        run: |
          python -m pip install --quiet yamllint pyyaml
          yamllint .github/workflows
      - name: Enforce workflow hardening
        if: steps.filter.outputs.workflows == 'true'
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          import yaml

          allowed_write = {"actions", "attestations", "contents", "id-token", "packages", "pull-requests", "security-events"}
          action_pat = re.compile(r"^[^/\s]+/[^@\s]+@([0-9a-f]{40}|v\d+)$")
          violations = []
          for wf in Path('.github/workflows').glob('*.yml'):
              data = yaml.safe_load(wf.read_text()) or {}
              for scope, perms in [('workflow', data.get('permissions')), *[(f"job:{n}", j.get('permissions')) for n,j in (data.get('jobs') or {}).items()]]:
                  if perms == 'write-all':
                      violations.append(f"{wf} {scope}: write-all is forbidden")
                  if isinstance(perms, dict):
                      for k, v in perms.items():
                          if v == 'write' and k not in allowed_write:
                              violations.append(f"{wf} {scope}: unexpected write permission '{k}'")
              for job_name, job in (data.get('jobs') or {}).items():
                  for step in (job or {}).get('steps', []):
                      uses = step.get('uses')
                      if not uses:
                          continue
                      if uses.startswith('actions/') or uses.startswith('github/'):
                          continue
                      m = action_pat.match(uses)
                      if not m:
                          violations.append(f"{wf} job:{job_name}: invalid action pin '{uses}'")
                      elif not re.fullmatch(r"[0-9a-f]{40}", m.group(1)):
                          violations.append(f"{wf} job:{job_name}: third-party action must use full SHA '{uses}'")
          if violations:
              print('\n'.join(violations))
              sys.exit(1)
          PY

  lint-type-python:
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - run: ruff check .
      - run: black --check .
      - name: Run mypy on existing targets
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          for p in src application execution core; do
            [ -d "$p" ] && targets+=("$p")
          done
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No mypy targets found; skipping."
            exit 0
          fi
          mypy "${targets[@]}"

  web-lint:
    runs-on: ubuntu-latest
    needs: meta
    if: needs.meta.outputs.web_changed == 'true' && hashFiles('apps/web/package.json') != ''
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npx prettier --check .
      - run: npm run lint
      - name: Run typecheck script if present
        shell: bash
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.typecheck?0:1)"; then
            npm run typecheck
          elif [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No typecheck script/tsconfig; skipping typecheck."
          fi
      - name: Run tests if script exists
        shell: bash
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
            npm test -- --ci --passWithNoTests
          else
            echo "No npm test script; skipping web tests."
          fi

  unit-fast:
    uses: ./.github/workflows/_reusable-python-test.yml
    needs: meta
    with:
      test_paths: ${{ needs.meta.outputs.unit_targets }}

  crypto-contracts:
    uses: ./.github/workflows/_reusable-crypto-validation.yml
    needs: meta
    if: needs.meta.outputs.crypto_changed == 'true'
    with:
      test_paths: ${{ needs.meta.outputs.crypto_targets }}

  replay-regression-fast:
    runs-on: ubuntu-latest
    needs: meta
    if: (needs.meta.outputs.crypto_changed == 'true' || needs.meta.outputs.runtime_changed == 'true') && needs.meta.outputs.replay_targets != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - run: pytest ${{ needs.meta.outputs.replay_targets }} -m "not slow" -q

  security-fast:
    runs-on: ubuntu-latest
    needs: meta
    if: needs.meta.outputs.crypto_changed == 'true' || needs.meta.outputs.security_changed == 'true' || needs.meta.outputs.workflows_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install bandit semgrep detect-secrets
      - name: Run security scanners on existing targets
        shell: bash
        run: |
          set -euo pipefail
          py_targets="${{ needs.meta.outputs.security_py_targets }}"
          semgrep_targets="${{ needs.meta.outputs.security_semgrep_targets }}"
          if [ -n "$py_targets" ]; then
            bandit -r $py_targets -q
            detect-secrets scan $py_targets > secrets.json
          else
            echo "No Python security targets found; creating empty secret-scan baseline."
            cat > secrets.json <<'JSON'
            {"results": {}}
            JSON
          fi
          if [ -n "$semgrep_targets" ]; then
            semgrep scan --config p/security-audit --error $semgrep_targets
          else
            echo "No Semgrep targets found; skipping semgrep."
          fi
          python - <<'PY'
          import json,sys
          data=json.load(open('secrets.json'))
          findings=sum(len(v) for v in data.get('results',{}).values())
          if findings:
              print(f"detect-secrets found {findings} potential secrets")
              sys.exit(1)
          PY

  coverage-gate:
    runs-on: ubuntu-latest
    needs: [meta, unit-fast]
    if: needs.meta.outputs.coverage_tests != '' && needs.meta.outputs.coverage_sources != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - name: Run coverage on critical surfaces
        shell: bash
        run: |
          set -euo pipefail
          cov_args=()
          for src in ${{ needs.meta.outputs.coverage_sources }}; do
            cov_args+=("--cov=$src")
          done
          pytest "${cov_args[@]}" --cov-report=xml ${{ needs.meta.outputs.coverage_tests }}
      - name: Enforce minimum coverage
        run: |
          python - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          min_cov=float(os.environ['COVERAGE_MIN'])
          root=ET.parse('coverage.xml').getroot()
          rate=float(root.attrib.get('line-rate',0))*100
          print(f"Coverage={rate:.2f}% threshold={min_cov:.2f}%")
          if rate < min_cov:
              sys.exit(1)
          PY

  final:
    name: final
    runs-on: ubuntu-latest
    needs:
      - meta
      - lint-type-python
      - unit-fast
      - coverage-gate
      - replay-regression-fast
      - security-fast
      - crypto-contracts
      - web-lint
    if: always()
    steps:
      - name: Final gate
        run: |
          for result in \
            "${{ needs.meta.result }}" \
            "${{ needs.lint-type-python.result }}" \
            "${{ needs.unit-fast.result }}" \
            "${{ needs.coverage-gate.result }}" \
            "${{ needs.replay-regression-fast.result }}" \
            "${{ needs.security-fast.result }}" \
            "${{ needs.crypto-contracts.result }}" \
            "${{ needs.web-lint.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Gate failed: $result"
              exit 1
            fi
          done
