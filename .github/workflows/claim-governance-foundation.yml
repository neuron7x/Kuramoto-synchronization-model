name: Claim Governance Foundation

on:
  pull_request:
    paths:
      - "docs/RESEARCH_THESIS.md"
      - "claims/ontology.json"
      - "scripts/ci/verify_claims.py"
      - "tests/ci/test_verify_claims.py"
      - ".github/workflows/claim-governance-foundation.yml"

permissions:
  contents: read

jobs:
  governance-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify seed
        run: python scripts/ci/verify_claims.py
      - name: Run tests
        run: pytest -q tests/ci/test_verify_claims.py
