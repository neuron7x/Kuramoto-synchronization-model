name: Performance Load Tests

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'loadtests/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    name: Locust (HTTP + gRPC)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-load-${{ hashFiles('requirements*.txt', 'requirements*.lock') }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -c constraints/security.txt -r requirements.txt
          uv pip install -c constraints/security.txt -r requirements-dev.txt
          uv pip install locust==2.23.1

      - name: Start FastAPI service
        run: |
          .venv/bin/uvicorn loadtests.service_app:app --host 127.0.0.1 --port 8000 --log-level warning > fastapi.log 2>&1 &
          echo $! > fastapi.pid

      - name: Start gRPC service
        run: |
          .venv/bin/python loadtests/run_grpc_service.py > grpc.log 2>&1 &
          echo $! > grpc.pid

      - name: Wait for services
        run: |
          MAX_ATTEMPTS=180   # 3 minutes — безкомпромісний запас часу
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::debug::wait-for attempt=$attempt" >&2

            # HTTP liveness/readiness
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              # gRPC readiness check with clear failure diagnostics
              if .venv/bin/python - <<'PY'
          import sys, grpc, traceback
          from loadtests.proto import trading_pb2, trading_pb2_grpc
          
          channel = grpc.insecure_channel("127.0.0.1:50051")
          try:
              stub = trading_pb2_grpc.TradingServiceStub(channel)
              stub.GetPositions(trading_pb2.Empty(), timeout=3.0)
              sys.exit(0)
          except Exception:
              traceback.print_exc()
              sys.exit(2)
          finally:
              channel.close()
          PY
              then
                echo "Services ready" >&2
                exit 0
              fi
            fi

            sleep 1
          done

          echo "Services failed to become ready" >&2

          echo "=== FASTAPI LOG (last 200 lines) ===" >&2
          tail -n 200 fastapi.log 2>/dev/null || true

          echo "=== gRPC LOG (last 200 lines) ===" >&2
          tail -n 200 grpc.log 2>/dev/null || true

          echo "=== PROCESS LISTENING ON PORTS ===" >&2
          ss -tlnp | grep -E '127.0.0.1:8000|127.0.0.1:50051' || true

          echo "=== LSOF ON PORTS ===" >&2
          lsof -iTCP -sTCP:LISTEN -P -n | grep -E '8000|50051' || true

          exit 1

      - name: Run load tests
        env:
          LOADTEST_GRPC_ADDRESS: 127.0.0.1:50051
        run: |
          mkdir -p reports/loadtest
          .venv/bin/locust -f loadtests/locustfile.py --headless --host http://127.0.0.1:8000 \
            --users 240 --spawn-rate 120 --run-time 2m --stop-timeout 15 \
            --csv=reports/loadtest/locust --loglevel INFO

      - name: Validate load test thresholds
        run: .venv/bin/python loadtests/validate_results.py reports/loadtest/locust_stats.csv

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: |
            reports/loadtest
            fastapi.log
            grpc.log

      - name: Stop services
        if: always()
        run: |
          if [ -f fastapi.pid ]; then kill $(cat fastapi.pid) || true; fi
          if [ -f grpc.pid ]; then kill $(cat grpc.pid) || true; fi
