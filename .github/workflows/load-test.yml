name: Performance Load Tests

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'loadtests/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    name: Locust (HTTP + gRPC)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-load-${{ hashFiles('requirements*.txt', 'requirements*.lock') }}

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -c constraints/security.txt -r requirements.txt
          uv pip install -c constraints/security.txt -r requirements-dev.txt
          uv pip install locust==2.23.1

      - name: Start FastAPI service
        run: |
          echo "Starting FastAPI service on port 8000..."
          .venv/bin/uvicorn loadtests.service_app:app --host 127.0.0.1 --port 8000 --log-level info > fastapi.log 2>&1 &
          echo $! > fastapi.pid
          echo "FastAPI service started with PID $(cat fastapi.pid)"
          sleep 2

      - name: Start gRPC service
        run: |
          echo "Starting gRPC service on port 50051..."
          .venv/bin/python loadtests/run_grpc_service.py > grpc.log 2>&1 &
          echo $! > grpc.pid
          echo "gRPC service started with PID $(cat grpc.pid)"
          sleep 2

      - name: Wait for services
        run: |
          echo "Waiting for FastAPI service on http://127.0.0.1:8000..."
          fastapi_ready=false
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "✓ FastAPI service is ready (attempt $attempt)"
              fastapi_ready=true
              break
            fi
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "  Still waiting for FastAPI... (attempt $attempt/60)"
            fi
            sleep 1
          done
          
          if [ "$fastapi_ready" = false ]; then
            echo "✗ FastAPI service failed to start after 60 seconds" >&2
            echo "Checking if FastAPI process is running:"
            ps aux | grep uvicorn || true
            echo "Checking port 8000:"
            netstat -tuln | grep 8000 || ss -tuln | grep 8000 || true
            exit 1
          fi
          
          echo "Waiting for gRPC service on 127.0.0.1:50051..."
          grpc_ready=false
          for attempt in $(seq 1 60); do
            if .venv/bin/python - <<-'PY'
          	import sys
          	import grpc
          	from loadtests.proto import trading_pb2, trading_pb2_grpc
          	
          	channel = grpc.insecure_channel("127.0.0.1:50051")
          	try:
          	    stub = trading_pb2_grpc.TradingServiceStub(channel)
          	    stub.GetPositions(trading_pb2.Empty(), timeout=2.0)
          	    sys.exit(0)
          	except Exception as e:
          	    sys.exit(1)
          	finally:
          	    channel.close()
          	PY
            then
              echo "✓ gRPC service is ready (attempt $attempt)"
              grpc_ready=true
              break
            fi
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "  Still waiting for gRPC... (attempt $attempt/60)"
            fi
            sleep 1
          done
          
          if [ "$grpc_ready" = false ]; then
            echo "✗ gRPC service failed to start after 60 seconds" >&2
            echo "Checking if gRPC process is running:"
            ps aux | grep run_grpc_service || true
            echo "Checking port 50051:"
            netstat -tuln | grep 50051 || ss -tuln | grep 50051 || true
            exit 1
          fi
          
          echo "✓ All services are ready!"

      - name: Run load tests
        env:
          LOADTEST_GRPC_ADDRESS: 127.0.0.1:50051
        run: |
          mkdir -p reports/loadtest
          .venv/bin/locust -f loadtests/locustfile.py --headless --host http://127.0.0.1:8000 \
            --users 240 --spawn-rate 120 --run-time 2m --stop-timeout 15 \
            --csv=reports/loadtest/locust --loglevel INFO

      - name: Validate load test thresholds
        run: .venv/bin/python loadtests/validate_results.py reports/loadtest/locust_stats.csv

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: reports/loadtest

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            fastapi.log
            grpc.log
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          echo "Stopping services..."
          if [ -f fastapi.pid ]; then 
            echo "Stopping FastAPI (PID $(cat fastapi.pid))..."
            kill $(cat fastapi.pid) || true
          fi
          if [ -f grpc.pid ]; then 
            echo "Stopping gRPC (PID $(cat grpc.pid))..."
            kill $(cat grpc.pid) || true
          fi
          echo "Services stopped"
