name: PR Release Gate - Quality & Risk Assessment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    name: Quality Assessment & Risk Labeling
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
            constraints/security.txt

      - name: Cache Python packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-pr-gate-${{ runner.os }}-py3.12-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'constraints/security.txt') }}
          restore-keys: |
            pip-pr-gate-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then pip install -c constraints/security.txt -r requirements.lock; fi
          if [ -f requirements-dev.lock ]; then pip install -c constraints/security.txt -r requirements-dev.lock; fi

      - name: Fetch base branch for diff analysis
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      # Wait for tests workflow to complete instead of re-running tests
      - name: Wait for tests workflow
        id: wait_tests
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            // Check if tests workflow has run or is running
            const checkRuns = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: context.payload.pull_request.head.sha,
              check_name: 'Tests (Python 3.11)'
            });

            if (checkRuns.data.total_count === 0) {
              console.log('Tests workflow has not run yet, skipping coverage check');
              return { coverage: 'N/A', status: 'pending' };
            }

            const testCheck = checkRuns.data.check_runs[0];
            console.log(`Tests workflow status: ${testCheck.status}, conclusion: ${testCheck.conclusion}`);

            return {
              coverage: 'N/A',  // Will be retrieved from tests workflow artifacts
              status: testCheck.conclusion || 'pending'
            };

      - name: Extract coverage metrics from tests workflow
        id: coverage_metrics
        run: |
          # Coverage is already checked in tests.yml, just note that here
          echo "coverage=N/A" >> $GITHUB_OUTPUT
          echo "Coverage verification happens in tests.yml workflow"

      - name: Assess risk level
        id: risk_assessment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            // Calculate risk score based on PR characteristics
            // Coverage and mutation testing are verified in tests.yml and ci.yml
            let riskScore = 0;
            let riskFactors = [];

            // Changed files risk
            const files = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number,
            });

            const criticalFiles = files.data.filter(f =>
              f.filename.includes('core/') ||
              f.filename.includes('execution/') ||
              f.filename.includes('security')
            );

            if (criticalFiles.length > 0) {
              riskScore += Math.min(criticalFiles.length * 5, 20);
              riskFactors.push(`${criticalFiles.length} critical files modified`);
            }

            // Large PR risk
            const totalChanges = files.data.reduce((sum, f) => sum + f.changes, 0);
            if (totalChanges > 500) {
              riskScore += 10;
              riskFactors.push(`Large PR: ${totalChanges} lines changed`);
            }

            // Determine risk level
            let riskLevel = 'low';
            let riskLabel = 'risk: low';
            let riskEmoji = '🟢';

            if (riskScore >= 50) {
              riskLevel = 'high';
              riskLabel = 'risk: high';
              riskEmoji = '🔴';
            } else if (riskScore >= 25) {
              riskLevel = 'medium';
              riskLabel = 'risk: medium';
              riskEmoji = '🟡';
            }

            console.log(`Risk Assessment: ${riskLevel} (score: ${riskScore})`);
            core.setOutput('risk_level', riskLevel);
            core.setOutput('risk_score', riskScore);
            core.setOutput('risk_label', riskLabel);
            core.setOutput('risk_emoji', riskEmoji);
            core.setOutput('risk_factors', JSON.stringify(riskFactors));

            return { riskLevel, riskScore, riskFactors };

      - name: Apply risk label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const newLabel = '${{ steps.risk_assessment.outputs.risk_label }}';

            // Define all risk labels
            const riskLabels = ['risk: low', 'risk: medium', 'risk: high'];
            const labelDefinitions = [
              { name: 'risk: low', color: '0e8a16', description: 'Low risk change - standard review process' },
              { name: 'risk: medium', color: 'fbca04', description: 'Medium risk - requires careful review' },
              { name: 'risk: high', color: 'd93f0b', description: 'High risk - requires senior review and extensive testing' },
              { name: 'quality-gate-failed', color: 'b60205', description: 'Quality gates not met - blocking merge' },
              { name: 'needs-mutation-testing', color: 'd93f0b', description: 'Mutation testing required' },
            ];

            // Ensure labels exist
            for (const labelDef of labelDefinitions) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelDef.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...labelDef });
                }
              }
            }

            // Get current labels
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: pull_number,
            });

            const currentLabelNames = currentLabels.map(l => l.name);

            // Remove old risk labels
            for (const oldLabel of riskLabels) {
              if (oldLabel !== newLabel && currentLabelNames.includes(oldLabel)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name: oldLabel,
                });
              }
            }

            // Add new risk label if not already present
            if (!currentLabelNames.includes(newLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [newLabel],
              });
            }

            // Quality gate labels are managed by tests.yml workflow
            // This workflow only manages risk labels

      - name: Post comprehensive quality report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const riskEmoji = '${{ steps.risk_assessment.outputs.risk_emoji }}';
            const riskLevel = '${{ steps.risk_assessment.outputs.risk_level }}';
            const riskScore = '${{ steps.risk_assessment.outputs.risk_score }}';
            const riskFactors = JSON.parse('${{ steps.risk_assessment.outputs.risk_factors }}');

            const riskFactorsText = riskFactors.length > 0 ?
              '**Risk Factors:**\n' + riskFactors.map(f => `- ${f}`).join('\n') :
              'No significant risk factors identified';

            const body = [
              `## ${riskEmoji} Release Gate - Risk Assessment`,
              '',
              '### Risk Assessment',
              `**Risk Level:** ${riskLevel.toUpperCase()} (Score: ${riskScore})`,
              '',
              riskFactorsText,
              '',
              '---',
              '',
              '### Quality Metrics',
              '',
              '✅ Coverage and mutation testing are verified in the **Tests** workflow.',
              '✅ Security scanning is performed in separate security workflows.',
              '',
              '<details>',
              '<summary>📋 Release Gate Requirements</summary>',
              '',
              '- ✅ Code coverage ≥ 98% (verified in Tests workflow)',
              '- ✅ Mutation kill rate ≥ 90% (verified in CI workflow)',
              '- ✅ All tests passing',
              '- ✅ No critical security vulnerabilities',
              '- ✅ Code review approved',
              '',
              '</details>',
              '',
              '---',
              `*Last updated: ${new Date().toISOString()}*`,
              '*This workflow assesses PR risk based on size and scope.*',
              '*Quality gates are enforced by other workflows to avoid duplication.*'
            ].join('\n');

            // Find and update or create comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Release Gate Assessment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }

      # Quality gates are enforced by tests.yml and ci.yml workflows
      # This workflow only provides risk assessment
