name: SLO Gate and Auto-Rollback

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Canary Deployment"]
    types:
      - completed

env:
  # SLO Thresholds
  ERROR_BUDGET: "0.001"  # 99.9% uptime
  LATENCY_P99_MS: "500"
  ERROR_RATE_THRESHOLD: "0.01"  # 1%
  MIN_CANARY_DURATION_MIN: "15"

jobs:
  evaluate-slo:
    name: Evaluate Canary SLO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      slo_passed: ${{ steps.evaluate.outputs.slo_passed }}
      metrics_summary: ${{ steps.evaluate.outputs.metrics_summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests prometheus-api-client

      - name: Query Prometheus metrics
        id: metrics
        run: |
          python - <<'PYTHON'
          import os
          import json
          import requests
          from datetime import datetime, timedelta

          # Configuration
          PROMETHEUS_URL = os.getenv('PROMETHEUS_URL')
          if not PROMETHEUS_URL:
              print("ERROR: PROMETHEUS_URL environment variable not set")
              print("Please configure PROMETHEUS_URL secret in repository settings")
              exit(1)

          CANARY_SERVICE = os.getenv('CANARY_SERVICE', 'tradepulse-sandbox-canary')

          # Time range: last 15 minutes
          end_time = datetime.now()
          start_time = end_time - timedelta(minutes=15)

          def query_prometheus(query):
              """Query Prometheus API"""
              try:
                  response = requests.get(
                      f"{PROMETHEUS_URL}/api/v1/query",
                      params={'query': query, 'time': end_time.isoformat()}
                  )
                  response.raise_for_status()
                  data = response.json()
                  if data['status'] == 'success' and data['data']['result']:
                      return float(data['data']['result'][0]['value'][1])
                  return None
              except Exception as e:
                  print(f"Error querying Prometheus: {e}")
                  return None

          # Query metrics
          metrics = {}

          # Error rate
          error_rate_query = f'rate(http_requests_total{{service="{CANARY_SERVICE}",status=~"5.."}}[5m]) / rate(http_requests_total{{service="{CANARY_SERVICE}"}}[5m])'
          metrics['error_rate'] = query_prometheus(error_rate_query) or 0.0

          # P99 latency
          latency_query = f'histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{{service="{CANARY_SERVICE}"}}[5m]))'
          metrics['p99_latency_seconds'] = query_prometheus(latency_query) or 0.0
          metrics['p99_latency_ms'] = metrics['p99_latency_seconds'] * 1000

          # Availability
          availability_query = f'avg_over_time(up{{service="{CANARY_SERVICE}"}}[15m])'
          metrics['availability'] = query_prometheus(availability_query) or 0.0

          # Request rate
          request_rate_query = f'rate(http_requests_total{{service="{CANARY_SERVICE}"}}[5m])'
          metrics['request_rate'] = query_prometheus(request_rate_query) or 0.0

          # Save metrics
          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
              f.write(f"error_rate={metrics['error_rate']}\n")
              f.write(f"p99_latency_ms={metrics['p99_latency_ms']}\n")
              f.write(f"availability={metrics['availability']}\n")
              f.write(f"request_rate={metrics['request_rate']}\n")

          print(json.dumps(metrics, indent=2))
          PYTHON
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}

      - name: Evaluate SLO
        id: evaluate
        run: |
          ERROR_RATE="${{ steps.metrics.outputs.error_rate }}"
          P99_LATENCY="${{ steps.metrics.outputs.p99_latency_ms }}"
          AVAILABILITY="${{ steps.metrics.outputs.availability }}"

          echo "📊 Canary Metrics:"
          echo "  Error Rate: ${ERROR_RATE}"
          echo "  P99 Latency: ${P99_LATENCY}ms"
          echo "  Availability: ${AVAILABILITY}"

          SLO_PASSED=true
          VIOLATIONS=""

          # Check error rate
          if (( $(echo "$ERROR_RATE > $ERROR_RATE_THRESHOLD" | bc -l) )); then
            SLO_PASSED=false
            VIOLATIONS="${VIOLATIONS}- Error rate ${ERROR_RATE} exceeds threshold ${ERROR_RATE_THRESHOLD}\n"
          fi

          # Check P99 latency
          if (( $(echo "$P99_LATENCY > $LATENCY_P99_MS" | bc -l) )); then
            SLO_PASSED=false
            VIOLATIONS="${VIOLATIONS}- P99 latency ${P99_LATENCY}ms exceeds threshold ${LATENCY_P99_MS}ms\n"
          fi

          # Check availability (must be above 1 - ERROR_BUDGET)
          MIN_AVAILABILITY=$(echo "1 - $ERROR_BUDGET" | bc -l)
          if (( $(echo "$AVAILABILITY < $MIN_AVAILABILITY" | bc -l) )); then
            SLO_PASSED=false
            VIOLATIONS="${VIOLATIONS}- Availability ${AVAILABILITY} below threshold ${MIN_AVAILABILITY}\n"
          fi

          echo "slo_passed=$SLO_PASSED" >> $GITHUB_OUTPUT

          if [ "$SLO_PASSED" = "false" ]; then
            echo "❌ SLO Violations Detected:"
            echo -e "$VIOLATIONS"
            echo "metrics_summary=SLO violations detected" >> $GITHUB_OUTPUT
          else
            echo "✅ All SLOs passed"
            echo "metrics_summary=All SLOs passed" >> $GITHUB_OUTPUT
          fi

      - name: Create SLO report
        if: always()
        run: |
          cat > /tmp/slo-report.md << EOF
          # Canary SLO Evaluation Report

          **Status**: ${{ steps.evaluate.outputs.slo_passed == 'true' && '✅ PASSED' || '❌ FAILED' }}
          **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Metrics
          - Error Rate: ${{ steps.metrics.outputs.error_rate }}
          - P99 Latency: ${{ steps.metrics.outputs.p99_latency_ms }}ms
          - Availability: ${{ steps.metrics.outputs.availability }}
          - Request Rate: ${{ steps.metrics.outputs.request_rate }} req/s

          ## Thresholds
          - Max Error Rate: ${ERROR_RATE_THRESHOLD}
          - Max P99 Latency: ${LATENCY_P99_MS}ms
          - Min Availability: $(echo "1 - $ERROR_BUDGET" | bc -l)
          EOF

      - name: Upload SLO report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: slo-report
          path: /tmp/slo-report.md

  rollback:
    name: Auto-Rollback on SLO Violation
    needs: evaluate-slo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    if: ${{ needs.evaluate-slo.outputs.slo_passed == 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Execute rollback
        run: |
          echo "⚠️  SLO violation detected. Initiating rollback..."

          # Get the previous stable deployment
          NAMESPACE="tradepulse"
          DEPLOYMENT="tradepulse-sandbox"

          # Rollback to previous revision
          kubectl rollout undo deployment/${DEPLOYMENT} -n ${NAMESPACE}

          # Wait for rollback to complete
          kubectl rollout status deployment/${DEPLOYMENT} -n ${NAMESPACE} --timeout=5m

          echo "✅ Rollback completed successfully"

      - name: Scale down canary
        run: |
          NAMESPACE="tradepulse"
          CANARY_DEPLOYMENT="tradepulse-sandbox-canary"

          # Scale canary to 0
          kubectl scale deployment/${CANARY_DEPLOYMENT} -n ${NAMESPACE} --replicas=0

          echo "✅ Canary scaled down"

      - name: Notify on rollback
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 **Auto-Rollback Executed**\n\nCanary deployment violated SLO thresholds and was automatically rolled back.\n\n**Metrics**: ${{ needs.evaluate-slo.outputs.metrics_summary }}\n\nPlease investigate the issues before attempting another deployment.`
            })

      - name: Fail workflow
        run: |
          echo "❌ Deployment failed due to SLO violations"
          exit 1

  promote:
    name: Promote Canary to Production
    needs: evaluate-slo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    if: ${{ needs.evaluate-slo.outputs.slo_passed == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Promote canary
        run: |
          echo "✅ SLO checks passed. Promoting canary to production..."

          NAMESPACE="tradepulse"
          DEPLOYMENT="tradepulse-sandbox"
          CANARY_DEPLOYMENT="tradepulse-sandbox-canary"

          # Get canary image
          CANARY_IMAGE=$(kubectl get deployment ${CANARY_DEPLOYMENT} -n ${NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].image}')

          # Update production deployment with canary image
          kubectl set image deployment/${DEPLOYMENT} sandbox=${CANARY_IMAGE} -n ${NAMESPACE}

          # Wait for rollout
          kubectl rollout status deployment/${DEPLOYMENT} -n ${NAMESPACE} --timeout=10m

          echo "✅ Production deployment updated successfully"

      - name: Scale down canary
        run: |
          NAMESPACE="tradepulse"
          CANARY_DEPLOYMENT="tradepulse-sandbox-canary"

          # Scale canary to 0 after successful promotion
          kubectl scale deployment/${CANARY_DEPLOYMENT} -n ${NAMESPACE} --replicas=0

          echo "✅ Canary scaled down"

      - name: Notify on promotion
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Canary Promoted to Production**\n\nAll SLO checks passed. Canary has been promoted to production.\n\n**Metrics**: ${{ needs.evaluate-slo.outputs.metrics_summary }}`
            })
