name: CI — Pin Terraform version

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: terraform-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  terraform-validate:
    name: Terraform validation tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: infra/terraform/tests/go.mod
          cache: true
          cache-dependency-path: infra/terraform/tests/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Verify Terraform version
        run: terraform version

      - name: Download Go modules for terraform tests
        working-directory: infra/terraform/tests
        run: go mod download

      - name: Run Terraform-related Go tests
        working-directory: infra/terraform/tests
        env:
          CI: true
        run: |
          go test -v .
