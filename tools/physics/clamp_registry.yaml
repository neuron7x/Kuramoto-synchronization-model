  - core/physics/gravitational_coupling.py:135
  - core/physics/lyapunov_spectrum.py:292
  - core/physics/relativity.py:44
- name: epsilon_add
  reason: A small positive epsilon is added to a denominator, log argument, or comparison tolerance to
    avoid division-by-zero / log(0) / strict-inequality flapping.
  physical_meaning: Numerical regulariser on a strictly-positive denominator or on an invariant-boundary
    tolerance (R<=1, |alpha|<=pi); not a physical quantity itself.
  failure_mode: Hides a genuinely-zero denominator (degenerate/empty input) by returning a huge-but-finite
    number. Surfaced because epsilon is < 1e-3 and the upstream quantity (norm, range, scale) is checked
    for emptiness; invariant-tolerance epsilons sit on documented physical bounds.
  test_ref: tests/tools/test_numerical_policy.py::test_epsilon_add_clamps_are_registered
  metadata_field: epsilon magnitude (documented < 1e-3) next to guarded quantity
