- name: cap_minimum
  reason: An upper bound (np.minimum / cap) saturates a quantity at a physical or numerical ceiling.
  physical_meaning: 'Caps a quantity that is unbounded above in raw form but bounded in the model: relativistic
    v^2/c^2 < 1, force ceiling, expanding window length.'
  failure_mode: Hides super-ceiling inputs (e.g. v>=c, runaway force). Surfaced because the cap value
    is an explicit named constant (0.9999, f_max, window) so an at-ceiling output is recognisable, not
    a silent NaN.
  test_ref: tests/tools/test_numerical_policy.py::test_cap_clamps_are_registered
  metadata_field: capped value vs named ceiling constant
  sites:
