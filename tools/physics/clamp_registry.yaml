# Numerical-policy clamp registry — every clamp-shaped op in the scoped
# physics tree is bound here by shape with a declared reason / physical
# meaning / failure mode. sites are regenerated from the live scan
# (path:line); the scanner fail-closes on any unregistered or stale site.
clamps:
- name: abs_sign_loss
  reason: A signed correlation/coupling is collapsed to its magnitude via abs() before being used as an
    (undirected) adjacency weight or distance.
  physical_meaning: 'Edge strength of a coupling/correlation graph: only |corr| carries the geometric
    weight; sign encodes lead/lag or anti-phase, which the undirected model does not represent.'
  failure_mode: 'Hides regime where two assets are strongly ANTI-correlated (corr~-1): magnitude looks
    identical to strong positive coupling. Surfaced because each adjacency builder retains the signed
    corr matrix and the documented contract states sign is intentionally discarded for the undirected
    graph; a directional model must NOT reuse these sites.'
  test_ref: tests/tools/test_numerical_policy.py::test_abs_sign_loss_clamps_are_registered
  metadata_field: adjacency.weight (|corr|); signed corr retained upstream for directional models
  sites:
  - core/kuramoto/delay_estimator.py:136
  - core/kuramoto/ricci_flow_engine.py:588
