- name: symmetrise
  reason: 0.5 * (A + A.T) forces a matrix to be exactly symmetric.
  physical_meaning: 'Coupling/adjacency/Laplacian matrix of an UNDIRECTED graph: physics requires A_ij
    == A_ji (Newton third law / undirected edges).'
  failure_mode: Hides a genuinely ASYMMETRIC coupling (a directional/causal upstream fault) by averaging
    it away. Surfaced because the symmetrisation is explicit and the ricci/lyapunov engines separately
    validate symmetry (allclose(A, A.T)) and raise on it; the average is the documented projection onto
    the undirected model, not a silent fix of bad data.
  test_ref: tests/tools/test_numerical_policy.py::test_symmetrise_clamps_are_registered
  metadata_field: 0.5*(A+A.T); symmetry separately asserted by engine validators
