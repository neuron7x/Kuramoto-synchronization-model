- name: nan_repair
  reason: np.nan_to_num replaces NaN/+-inf with finite values (typically 0.0).
  physical_meaning: Sanitises a correlation/weight/volume array that can contain NaN from empty windows
    or constant series before it enters a graph computation.
  failure_mode: Hides an all-NaN / degenerate-input regime by turning it into a zero (empty) graph that
    looks healthy. Surfaced because the repaired array is one whose emptiness collapses downstream to
    a documented zero-signal (R=0, empty adjacency), and the repair targets are correlation/weight matrices
    whose NaN-origin is degeneracy, not silent error.
  test_ref: tests/tools/test_numerical_policy.py::test_nan_repair_clamps_are_registered
  metadata_field: nan/posinf/neginf -> 0.0 on correlation/weight/volume arrays
