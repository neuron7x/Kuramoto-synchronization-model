- name: floor_builtin
  reason: A builtin max(x, lo) floors a scalar at zero or a tiny positive epsilon.
  physical_meaning: 'Non-negativity / strict-positivity floor on a physically non-negative scalar: variance,
    mass, temperature, score, eigenvalue, denominator, window index.'
  failure_mode: Hides a NEGATIVE value of a quantity that must be non-negative (a sign/data fault), or
    a zero denominator. Surfaced because the floored quantity has a documented non-negativity invariant
    (e.g. INV-HPC2) and floors-to-epsilon sit only on denominators that are independently emptiness-checked.
  test_ref: tests/tools/test_numerical_policy.py::test_floor_builtin_clamps_are_registered
