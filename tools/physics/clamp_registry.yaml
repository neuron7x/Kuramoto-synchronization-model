- name: saturate_clip
  reason: np.clip / jnp.clip saturates a quantity into a closed bounded interval.
  physical_meaning: 'Enforces a mathematically-bounded domain: order parameter R=|mean(exp(i theta))|
    in [0,1], cosine in [-1,1], probability in [eps,1], lazy-walk alpha in [0,1], step-size/damping in
    [0,1], coupling in [0,K_max].'
  failure_mode: Hides an out-of-domain input (R>1, |cos|>1, K>K_max) that would otherwise be a fault.
    Surfaced because the clip bounds are the documented invariant interval (INV-K1, INV-RC1, INV-RC-FLOW)
    literally present at the site; a value AT the bound after clipping is the only observable, and the
    bound is a named theorem limit not an arbitrary cutoff.
  test_ref: tests/tools/test_numerical_policy.py::test_saturate_clip_clamps_are_registered
  metadata_field: clip interval = documented invariant bound (INV-K1/INV-RC1/...)
